[project]
name = "belsim"
version = "0.1.0"
description = "Belgium economic and public-finance simulator"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["belsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/daliscia/belsim"
Issues = "https://github.com/daliscia/belsim/issues"

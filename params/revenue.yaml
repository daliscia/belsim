  source: "2026 entry: annual tax on credit institutions raised from 0.15205 / 0.20204 % to 0.19286 / 0.25626 % (programme law of 30 May 2026; KPMG, secondary), budgeted +150 mn in 2026 (Expose general 2026, Chamber DOC 56 1278/001, official) on 1,644 mn of bank and financial-sector levies in 2024 -> 1.09. Status: law. Non-tax revenue 2026-2031 (relative to the observed 2025 level, which the baseline reproduces): Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau D.1 (official, fetched 26.11.2026) - property income 0.887 % of GDP in 2025 -> 0.830 % in 2031 (three property-income lines, same factor); current transfers and subsidies received 0.867 % -> 0.602 % (flat to falling in euros: 5,567 mn in 2025, 4,687 mn in 2031; both current-transfer lines); capital transfers received 0.231 % of GDP in 2026 (last Recovery and Resilience Facility payments) then 0.08-0.07 %, taken as levels over the observed 2025 share of 0.164 % (both capital-transfer lines). ASSUMPTION - 2031 shares held afterwards. Employer contributions, private sector, from 2026: exemption of basic contributions above the very-high-wage ceiling (ssc.employer_cap_wage), budget cost 75 mn a year (press, RTBF; secondary) on 39.8 bn - the model's wage deciles do not reach the ceiling, so the cost is entered here -> 0.9981. Employee contributions from 2028: higher social work bonus from 1 January 2028 (programme law of 30 May 2026; the new ceilings were not found, so the payslip calculator is unchanged) at the cost shown by the Federal Planning Bureau, outlook of June 2026, Tableau B.4 (official, fetched 26.11.2026) - work bonus 1,845 mn in 2027, 2,286 / 2,444 / 2,487 / 2,534 mn in 2028-2031 against 1,886 / 1,928 / 1,978 / 2,035 mn at the growth of the bonus in the model: 400 / 516 / 509 / 499 mn on the line -> 0.9858 / 0.9823 / 0.9831 / 0.9839 (the Court of Audit, DOC 56 1279/003, had 147 mn for the social bonus before the programme law)."

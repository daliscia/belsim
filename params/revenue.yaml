  values: {2024: [18592.02, 21070.96, 37344.00, 40997.26, 60181.95], 2028: [19000.0, 21070.96, 41630.0]}

ssc.special_rates:
  description: Special social security contribution - rate in each band of the annual scale
  unit: rate
  source: "Law of 30 March 1994 art. 108 (Chamber DOC 56 1243/001, official): 5 % / 1.3 % / 4.009 % / 1.2996 %; from income 2028 4.75 % / 1.3 % (law of 15 July 2026 art. 86)."
  values: {2024: [0.05, 0.013, 0.04009, 0.012996], 2028: [0.0475, 0.013]}

ssc.special_joint_thresholds:
  description: Special social security contribution - income limits of the scale for households with a joint assessment (spouses and legal cohabitants), applied to their joint taxable income; the last limit is where the maximum is reached. Empty from income 2028 - the contribution is then due per person on the scale of ssc.special_thresholds.
  unit: EUR
  source: "Law of 30 March 1994 art. 108 par. 1, third subparagraph, text in force until assessment year 2028 as reproduced in Chamber DOC 56 1243/001 (coordinated text, official, read 26.11.2026): 5 % between 18,592.02 and 21,070.96; 123.95 + 1.3 % up to 60,181.95; 632.39 up to 74,688.00; 632.39 + 1.3629 % up to 81,944.00; 731.28 above. Law of 15 July 2026 art. 86 (from AY 2029 = income 2028): subparagraph repealed, income taken per spouse. Status: law."
  values: {2024: [18592.02, 21070.96, 60181.95, 74688.0, 81944.0], 2028: []}

ssc.special_joint_rates:
  description: Special social security contribution - rate in each band of the scale for households with a joint assessment (ssc.special_joint_thresholds)
  unit: rate
  source: "Law of 30 March 1994 art. 108 par. 1, third subparagraph (Chamber DOC 56 1243/001, official): 5 % / 1.3 % / 0 / 1.3629 %; repealed from income 2028 (law of 15 July 2026 art. 86)."
  values: {2024: [0.05, 0.013, 0.0, 0.013629], 2028: []}

ssc.special_max:
  description: Maximum annual special social security contribution (per household until income 2027, per person from 2028)
  unit: EUR
  source: "Law of 30 March 1994 art. 108: 731.28 (Chamber DOC 56 1243/001, official; = 12 x 60.94 monthly NSSO withholding, socialsecurity.be instructions). From income 2028: 365.64 per person (law of 15 July 2026 art. 86). Old value 243.76 was wrong: 60.94 is the monthly, not the quarterly, maximum."
  values: {2024: 731.28, 2028: 365.64}

ssc.employer_rate:
  description: Basic employer contribution rate, private sector (incl. wage moderation), after the tax shift
  unit: rate
  source: "NSSO administrative instructions 2024/2: 19.88 % basic + 5.12 % wage moderation = 25 % (socialsecurity.be/employer/instructions/dmfa/fr/2024-2/instructions/socialsecuritycontributions/contributions.html, official, read 25.11.2026)"
  values: {2024: 0.25}

ssc.employer_other_rate:
  description: Other employer contributions on gross wages (1.60-1.69 % contribution of employers with 10+ workers, closure funds, temporary unemployment, asbestos fund, second-pillar levy, blue-collar holiday pay etc.), average
  unit: rate
  source: "ASSUMPTION for the average; the level is calibrated on D.611. Official range for white-collar workers, Q1 2024: global rate 25.29 % (<10 workers), 26.98 % (10-19), 27.04 % (20+) (FEB table quoted by SPW Recherche, recherche.wallonie.be/DGF_Coefficient-charges-patronales_2024), i.e. 0.3-2.0 % on top of the basic rate, before blue-collar and second-pillar contributions."
  values: {2024: 0.027}

ssc.structural_reduction_slope:
  description: Structural reduction of employer contributions (category 1), low-wage component - reduction per euro of wage below the threshold S0
  unit: rate
  source: "NSSO administrative instructions, 'La reduction structurelle' (socialsecurity.be/employer/instructions/dmfa/fr/<edition>/instructions/deductions/structuralreduction_targetgroupreductions/structuralreduction.html, editions 2024-1 to 2026-3, official, read 25.11.2026): R = 0.1400 x (S0 - S) + gamma x (S2 - S), F = 0; alpha = 0.1400 throughout 2024-2026"
  values: {2024: 0.14}

ssc.structural_reduction_threshold:

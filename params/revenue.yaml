# Government revenue parameters (owner: belsim.fiscal.revenue).
#
# Legislation of income year 2024 (tax year 2025) unless dated otherwise. Amount thresholds are
# uprated with the health index (Belgian tax brackets and social thresholds are indexed), rates
# are not. A dated entry of an uprated parameter is an amount in euros of ITS year and is indexed
# from there. Values marked "ASSUMPTION" were NOT verified on an official or authoritative
# source: either a modelling share, or a legislated figure that could not be checked.
# Legislated values were checked on the web on 25 November 2026; "official" = government or
# parliament page, "secondary" = Big-4 / payroll provider / publisher table.
# Monthly or quarterly social amounts that are indexed during the year are entered as the
# time-weighted average of the legal amounts in force in the year (the model's indices are
# annual averages).
# The level of every revenue line is calibrated in code on the 2024 accounts
# (data/base/revenue_lines.csv), so structural shares below only affect how a line reacts
# to a change, never its 2024 level.
#
# Reforms of the federal government formed in 2025 ("Arizona") are in the baseline when they are
# law: programme law of 18 July 2025 (MB 29.07.2025), law of 18 December 2025 (MB 30.12.2025),
# law of 6 April 2026 on capital gains (MB 21.04.2026), programme law of 30 May 2026
# (MB 01.06.2026), law of 15 July 2026 reforming personal income tax (MB 29.07.2026). The text of
# the 15 July 2026 law was read as tabled (Chamber DOC 56 1243/001, 17.12.2025); payroll-provider
# summaries of the published law confirm its main lines, final amounts may differ marginally.

# ============================================================== personal income tax (pit.)
pit.bracket_thresholds:
  description: Upper limits of the first three personal income tax brackets (net taxable income)
  unit: EUR
  source: "Income year 2024 (AY 2025): 15,820 / 27,920 / 48,320 - Wolters Kluwer 'Fiscale grensbedragen aj. 2025' and practicali.be/blog/geindexeerde-bedragen-aj-2025 (secondary, read 25.11.2026). Official later values for information (fin.belgium.be/en/private-individuals/tax-return/income/tax-rates): income 2025 16,320 / 28,800 / 49,840; income 2026 16,720 / 29,510 / 51,070 - i.e. fiscal indexation of +3.2 % and +2.4 %, one year behind the health index used here. No reform of the brackets."
  uprate: health_index
  wage_link: true
  values: {2024: [15820, 27920, 48320]}

pit.indexation_lag_base:
  description: Legal indexation of the personal income tax amounts - consumer price index of the year before the base year relative to the base year. The law indexes the amounts of income year t on the average consumer prices of year t-1 (Income Tax Code art. 178), whereas the parameters are uprated with the health index of year t; the revenue module applies the ratio (0 = switch the correction off).
  unit: ratio
  source: "Official amounts of income 2025 over income 2024 (fin.belgium.be/en/private-individuals/tax-return/income/tax-rates, read 25.11.2026): 16,320 / 15,820 = 1.0316, 28,800 / 27,920 = 1.0315, 49,840 / 48,320 = 1.0315 -> 1 / 1.0315. Check on income 2026: the rule gives 15,820 x 1.0315 x 1.025 (consumer prices 2025) = 16,726 against 16,720 official. ASSUMPTION that the index is the national consumer price index (the two observed years fit it better than the health index)."
  values: {2024: 0.96946}

pit.bracket_rates:
  description: Marginal personal income tax rates of the four brackets
  unit: rate
  source: "Income Tax Code 1992 art. 130: 25 / 40 / 45 / 50 %; confirmed for income 2025 and 2026 on fin.belgium.be/en/private-individuals/tax-return/income/tax-rates (official, read 25.11.2026)"
  values: {2024: [0.25, 0.40, 0.45, 0.50]}

pit.basic_allowance:
  description: Tax-free allowance (belastingvrije som / quotite exemptee), relieved at the bottom-bracket rates. For pensions and replacement income see pit.allowance_neutralised_replacement.
  unit: EUR
  source: "2024: 10,570 (secondary: Wolters Kluwer / Practicali AY 2025 tables). 2026: 11,550, official (fin.belgium.be tax-rates page, income 2026). Reform - law of 15 July 2026 (MB 29.07.2026), art. 131 CIR: base amount 4,785 -> 4,945 (income 2026) -> 4,990 (2027) -> 5,070 (2028) -> 5,840 (2029) -> 6,230 (2030); the explanatory memorandum (Chamber DOC 56 1243/001 p. 5) sets the indexed targets 14,450 for AY 2030 and 15,600 for AY 2031, the King adjusting the base amount to reach them. 2027 and 2028 entries = pre-reform allowance (11,176 in 2026, indexed with the health index of the Federal Planning Bureau outlook of June 2026: +3.1 % in 2027, +2.2 % in 2028 -> 11,522 and 11,776) x the legal ratio of base amounts (4,990 / 4,785 and 5,070 / 4,785); an earlier version used 1.94 % a year, which put the 2027 step at half the official costing once the model's own index ran faster (ASSUMPTION for the indexation of 2027-2028 only: the model indexes with the health index of the year, the law with that of the year before). Status: law."
  uprate: health_index
  wage_link: true
  values: {2024: 10570, 2026: 11550, 2027: 12016, 2028: 12477, 2029: 14450, 2030: 15600}

pit.allowance_special_scale:
  description: Switch (1 or 0) - the tax on the tax-free allowance (basic amount and supplements) is computed with the special scale of pit.allowance_scale_thresholds and pit.allowance_second_band_rate (1) or with the ordinary brackets (0).
  unit: flag
  source: "Income Tax Code 1992 art. 134 par. 2 al. 2 (special rate, in force for income 2024). Law of 15 July 2026, art. 10 (Chamber DOC 56 1243/001 p. 7 and art. 10, official, read 26.11.2026): 'A partir de l'exercice d'imposition 2030, l'impot afferent a la quotite du revenu exemptee d'impot sera a nouveau calcule au meme taux que celui pour l'impot de base. Le taux special de l'article 134, par. 2, alinea 2, CIR 92 est abroge' -> 0 from income 2029. Status: law."
  values: {2024: 1, 2029: 0}

pit.allowance_scale_thresholds:
  description: Special scale for the tax on the tax-free allowance - upper limits of its first three bands (the allowance and its supplements for children are valued at the bottom rate, 25 %, up to the first limit, at pit.allowance_second_band_rate, 30 %, up to the second, then at the second bracket rate, 40 %, up to the third and at 45 % above).
  unit: EUR
  source: "Income Tax Code 1992 art. 134, income year 2024 (AY 2025): 25 % up to 11,120, 30 % up to 15,820, 40 % up to 26,360, 45 % up to 48,320 - Wolters Kluwer, 'Recapitulatif des principaux plafonds fiscaux, exercice d'imposition 2025' (J. Wellens, 22.12.2023; secondary, read 26.11.2026; base amounts 5,705 / 8,120 / 13,530 also in Chamber DOC 56 1243/001, coordinated text, official)."
  uprate: health_index
  wage_link: true
  values: {2024: [11120, 15820, 26360]}

pit.allowance_second_band_rate:
  description: Special scale for the tax on the tax-free allowance - rate of its second band (between the first two limits of pit.allowance_scale_thresholds). The other bands use the rates of the ordinary brackets (25 %, then 40 % and 45 %).
  unit: rate
  source: "Income Tax Code 1992 art. 134 par. 2 al. 2: 25 / 30 / 40 / 45 % (Wolters Kluwer table of AY 2025 amounts, secondary; Chamber DOC 56 1243/001 coordinated text, official; read 26.11.2026)."
  values: {2024: 0.30}

pit.allowance_neutralised_replacement:
  description: Part of the tax-free allowance that does not benefit pensions, unemployment and sickness benefits. The 2026-2030 increases of the allowance are neutralised for these incomes by cutting their tax reductions by the same advantage, which is modelled as a lower allowance for them.
  unit: EUR
  source: "Law of 15 July 2026, art. 147 CIR as amended; Chamber DOC 56 1243/001 p. 5: 'les montants des reductions d'impot de base pour pensions et revenus de remplacement sont a chaque fois diminues d'un montant egal a l'avantage qui est obtenu de la majoration de la quotite du revenu exemptee d'impot' (official, read 25.11.2026). Amounts = pit.basic_allowance less the pre-reform allowance (11,176 in 2026, then indexed with the health index of the Federal Planning Bureau outlook of June 2026: 11,522 / 11,776 / 11,988 / 12,204 for 2027-2030), so that pensions and replacement incomes keep exactly the indexed pre-reform allowance. Status: law."
  uprate: health_index
  wage_link: true
  values: {2024: 0, 2026: 374, 2027: 494, 2028: 701, 2029: 2462, 2030: 3396}

pit.allowance_neutralised_population_share:
  description: Share of the neutralisation of the higher tax-free allowance (pit.allowance_neutralised_replacement) that binds in the population of tax units drawing pensions or benefits. Below 1 because many of them also have earned income in the year (part-year unemployment or sickness, pensioners who work) and the cut in their tax reduction is pro rata of the replacement income - they keep part of the increase. Aggregate revenue only; the calculator for a single payslip neutralises in full.
  unit: share
  source: "ASSUMPTION for the share, set on an official costing: FPS Finance (Aurora microsimulation on the returns of tax year 2023) puts the increase of the allowance at -531.0 / -714.7 / -1,057.7 / -3,484.0 / -4,988.4 mn for 2026-2030, all levels (Court of Audit, commentary on the 2026 budget, Chamber DOC 56 1279/003, annex 1, official, fetched 26.11.2026); with full neutralisation for every recipient of a pension or benefit the model gave 0.88 of it in every year (467 / 622 / 887 / 3,113 / 4,378), i.e. about 0.6 mn full-benefit taxpayers short. Rule: Income Tax Code art. 147-154 (the reduction for replacement income, and so its cut, is limited to the share of that income in net income)."
  values: {2024: 1.0, 2026: 0.78}

pit.reform_other_measures_cost:
  description: Net cost of the measures of the 2026 personal income tax reform that the tax calculator does not hold (copyright income regime, overtime, deduction for entrepreneurs, lower tax on pensions, prepayment surcharge, directors' pay and the 20 % rule, less the correction factor for municipalities), all levels of government, in EUR mn at the 2024 level of GDP (it grows with GDP). 0 = without these measures. LEVER.
  unit: EUR mn (2024 GDP scale)
  source: "Court of Audit, commentary on the 2026 budget (Chamber DOC 56 1279/003, annex 1 'Reforme de l'impot des personnes physiques 2026-2030', FPS Finance estimates, official, fetched 26.11.2026), EUR mn 2026-2030: copyright -142.13 a year; overtime -100.84; prepayment surcharge -12.42; directors' pay +19.17; 20 % rule +28.87 / +32.39 / +33.92 / +33.92 / +33.92; lower tax on pensions -26.50 from 2027; deduction for entrepreneurs -89.75 in 2027-2028, -114.40 from 2029; correction factor for municipalities +42.17 in 2029, +174.07 in 2030 -> net -207.4 / -320.1 / -318.6 / -301.0 / -169.1, divided by the nominal GDP index of the Federal Planning Bureau outlook of June 2026 (1.0694 / 1.1082 / 1.1457 / 1.1827 / 1.2196). The measures of the same table that the calculator holds (allowance, fiscal work bonus, special contribution, children, single parents, unemployment and pension reductions, marital quotient) are not in this amount. ASSUMPTION - the 2030 amount holds as a share of GDP afterwards. Status: law of 15 July 2026."
  values: {2024: 0.0, 2026: 193.9, 2027: 288.8, 2028: 278.0, 2029: 254.5, 2030: 138.7}

pit.expense_deduction_rate:
  description: Flat-rate professional expense deduction of employees, share of gross wage net of social contributions
  unit: rate
  source: "Income Tax Code 1992 art. 51: 30 % (secondary: Wolters Kluwer / Practicali AY 2025 tables, read 25.11.2026)"
  values: {2024: 0.30}

pit.expense_deduction_max:
  description: Ceiling of the flat-rate professional expense deduction of employees
  unit: EUR
  source: "Income year 2024 (AY 2025): 5,750 - Wolters Kluwer 'Fiscale grensbedragen aj. 2025', practicali.be (secondary, read 25.11.2026)"
  uprate: health_index
  wage_link: true
  values: {2024: 5750}

pit.workbonus_tax_reduction_rate:
  description: Fiscal work bonus - tax reduction as a share of the social work bonus actually granted, for part A (low wages) and part B (very low wages). The annual ceiling of the reduction (1,380 EUR for income 2024) is not modelled.
  unit: rate
  source: "2024: 33.14 % of part A and 52.54 % of part B (Chamber DOC 56 1243/001 title 16, official; Securex). Law of 15 July 2026 title 16: part B 63 % for AY 2027-2028 (income 2026-2027) and 72 % from AY 2029; part A 35 % from AY 2029 (income 2028). Status: law."
  values:
    2024: {a: 0.3314, b: 0.5254}
    2026: {a: 0.3314, b: 0.63}
    2028: {a: 0.35, b: 0.72}

pit.reduction_replacement:
  description: Tax reduction for replacement income (basic + additional amount), by kind (pensions, unemployment benefits, sickness and invalidity benefits). The separate phase-out of the additional amount is not modelled.
  unit: EUR
  source: "Income Tax Code 1992 art. 147, income year 2024 (AY 2025): pensions 2,151.72 basic + 444.78 additional = 2,596.50; unemployment 2,151.72 + 60 % of the additional amount (being phased out) = 2,418.59; sickness-invalidity 2,887.28 - practicali.be/blog/geindexeerde-bedragen-aj-2025 (secondary, read 25.11.2026); base amounts 1,148 and 236.38 confirmed in Chamber DOC 56 1243/001 art. 15 (official). Old from-memory values were 2,573 / 2,573 / 3,303."
  uprate: health_index
  wage_link: true
  values: {2024: {pension: 2596.50, unemployment: 2418.59, disability: 2887.28}}

pit.reduction_unemployment_factor:
  description: Multiplier on the tax reduction for unemployment benefits (reform path)
  unit: ratio
  source: "Law of 15 July 2026 title 4 (Chamber DOC 56 1243/001 art. 15-19, official): from AY 2027 (income 2026) the basic reduction is cut to a quarter and the additional reduction abolished -> (2,151.72 / 4) / 2,418.59 = 0.2224; abolished from AY 2030 (income 2029). The transitional full reduction for single parents with 1-2 children is not modelled. Status: law."
  values: {2024: 1.0, 2026: 0.2224, 2029: 0.0}

pit.reduction_unemployment_phaseout:
  description: Taxable income between which the tax reduction for unemployment benefits is phased out to zero [start, end]
  unit: EUR
  source: "Income year 2024: 27,900 - 34,830 (practicali.be AY 2025 table, secondary). Law of 15 July 2026 art. 18 (Chamber DOC 56 1243/001 p. 14-15, official): from AY 2027 base amounts 11,020 - 14,750, i.e. 21,290 - 28,490 at the AY 2026 coefficient, x 1.0244 for income 2026."
  uprate: health_index
  wage_link: true
  values: {2024: [27900, 34830], 2026: [21810, 29185]}

pit.reduction_phaseout_start:
  description: Taxable income above which the tax reduction for pensions and sickness benefits is phased out
  unit: EUR
  source: "Income Tax Code 1992 art. 151-152, income year 2024 (AY 2025): 27,900 - practicali.be AY 2025 table (secondary, read 25.11.2026). Old from-memory value was 27,320."
  uprate: health_index
  wage_link: true
  values: {2024: 27900}

pit.reduction_phaseout_end:
  description: Taxable income at which the phase-out of the tax reduction for pensions and sickness benefits ends
  unit: EUR
  source: "Income Tax Code 1992 art. 151-152, income year 2024 (AY 2025): 55,810 - practicali.be AY 2025 table (secondary); consistent with 57,560 for AY 2026 in Chamber DOC 56 1243/001 p. 15 (official). Old from-memory value was 54,630."
  uprate: health_index
  wage_link: true
  values: {2024: 55810}

pit.reduction_floor_share:
  description: Share of the replacement-income tax reduction kept above the phase-out end, by kind
  unit: share
  source: "One third for pensions: Chamber DOC 56 1243/001 art. 21 ('encore accordees a concurrence d'un tiers', official). Sickness-invalidity one third: ASSUMPTION - same art. 152 rule, not read. Unemployment: zero (art. 151, phased out fully; see pit.reduction_unemployment_phaseout)."
  values: {2024: {pension: 0.3333, unemployment: 0.0, disability: 0.3333}}

pit.reduction_pension_top_limits:
  description: Taxable income between which the remaining third of the pension tax reduction is withdrawn [start, end] (applies when pit.reduction_pension_top_phaseout is 1)
  unit: EUR
  source: "Law of 15 July 2026, new art. 151/2 CIR (Chamber DOC 56 1243/001 art. 21, official): base amounts 30,445 and 36,545 = 58,810 and 70,570 at the AY 2026 coefficient; here deflated to income-2024 euros with 55,810 / 57,560."
  uprate: health_index
  wage_link: true
  values: {2024: [57022, 68424]}

pit.reduction_pension_top_phaseout:
  description: Switch (0 or 1) for the withdrawal of the pension tax reduction from high incomes
  unit: share
  source: "Law of 15 July 2026, art. 151/2 CIR, applicable from AY 2027 = income 2026 (Chamber DOC 56 1243/001 art. 21). Status: law."
  values: {2024: 0.0, 2026: 1.0}

pit.autonomy_factor:
  description: Share of the federal state tax handed over to the regions (autonomiefactor / facteur d'autonomie)
  unit: share
  source: "Special Finance Act art. 5/2: definitive factor 24.957 % (practicali.be AY 2025 and AY 2027 tables, secondary, read 25.11.2026)"
  values: {2024: 0.24957}

pit.regional_surcharge:
  description: Regional surcharge (opcentiemen / centimes additionnels) on the reduced state tax, by region of residence. LEVER - one region with Change(key="WAL").
  unit: rate
  source: "33.257 % in Flanders and Wallonia, 32.591 % in Brussels, AY 2025 to AY 2027 (practicali.be, secondary, read 25.11.2026). A Brussels cut of 1 point from income 2027 is a draft only (not in the baseline)."
  values: {2024: {FLA: 0.33257, WAL: 0.33257, BRU: 0.32591}}

pit.region_tax_share:
  description: Shares of the regions of residence in the state tax (federal + regional personal income tax), used as weights for the national-average surcharges of a payslip without a region. The aggregate revenue lines do not use it (they compute each region from its own population).
  unit: share
  source: "Statbel, fiscal income statistics, income year 2024, table C (official; statbel.fgov.be/fr/themes/menages/revenus-fiscaux, read 25.11.2026): state tax Flanders 39,121 mn, Wallonia 16,408 mn, Brussels 5,373 mn of 60,902 mn (data/base/revenue_pit_statbel.csv)."
  values: {2024: {FLA: 0.6424, WAL: 0.2694, BRU: 0.0882}}

pit.municipal_surcharge:
  description: Average municipal surcharge on the total (federal + regional) personal income tax, by region. LEVER - one region with Change(key="BRU").
  unit: rate
  source: "Flanders 7.17 % (2024 and 2025; 7.22 % in 2026 - Belfius local finance study 25.06.2026 and Flemish government APB table), Wallonia 7.95 % (7.92-7.97 % in 2025; UVCW, Belfius), Brussels 6.3 % (2025; Belfius 15.10.2026) - secondary / local-government sources read 25.11.2026. Cross-check on assessed tax (Statbel fiscal income statistics, income 2024, table C, official): municipal taxes / state tax = 7.07 % in Flanders, 8.05 % in Wallonia, 6.22 % in Brussels."
  values: {2024: {FLA: 0.0717, WAL: 0.0795, BRU: 0.063}}

# ---- household rules (tax units): used by the aggregate income tax and by belsim.distribution
pit.child_allowance_supplement:
  description: Supplement to the income-tax-free allowance for 1, 2, 3 and 4 dependent children (cumulative amounts, by income year), granted to the partner with the higher taxable income. LEVER.
  unit: EUR
  source: "Income Tax Code 1992 art. 132. 2024 (AY 2025) - Wolters Kluwer table of indexed tax amounts, 22.12.2023 (secondary; https://assets.contenthub.wolterskluwer.com/api/public/content/2136072-tabel-fiscale-grensbedragen-d4b9e55b48). 2025 (AY 2026) - FPS Finance, dependent children page (official; https://fin.belgium.be/nl/particulieren/belastingaangifte/persoonlijke-situatie/personen-ten-laste/kinderen). 2026-2029 - law of 15 July 2026 reforming the personal income tax (Belgian Official Gazette 29.07.2026), read in the text adopted in committee, Chamber DOC 56 1243/009 (official; https://www.dekamer.be/FLWB/PDF/56/1243/56K1243009.pdf) - the Gazette text itself was not opened, title 3: base amounts for 1 / 2 children raised from 870 / 2 240 to 935 / 2 250 (income 2026), 1 005 / 2 260 (2027), 1 075 / 2 272.50 (2028), 1 162.50 / 2 325 (2029), three and four children unchanged, all indexed with the coefficient frozen at the AY 2026 level (new art. 178 par. 2/1). Indexed amounts 2026 and 2029 as published by Liantis (secondary; https://www.liantis.be/nl/nieuws/nieuwe-regels-bedrijfsvoorheffing-vanaf-1-november-2026-wat-de-impact-op-het-nettoloon); 2027 and 2028 = base amount x 2.2795 (the coefficient implied by the AY 2026 amounts), own calculation. Indexation resumes from income 2030. All web sources read 25.11.2026."
  uprate: health_index
  wage_link: true
  values:
    2024: [1920, 4950, 11090, 17940]
    2025: [1980, 5110, 11440, 18510]
    2026: [2130, 5130, 11440, 18510]
    2027: [2290, 5150, 11440, 18510]
    2028: [2450, 5180, 11440, 18510]
    2029: [2650, 5300, 11440, 18510]

pit.child_allowance_extra_per_child:
  description: Supplement to the tax-free allowance for each dependent child beyond the fourth (by income year). LEVER.
  unit: EUR
  source: "ITC 1992 art. 132. 2024 - Wolters Kluwer table of indexed tax amounts, 22.12.2023 (secondary; https://assets.contenthub.wolterskluwer.com/api/public/content/2136072-tabel-fiscale-grensbedragen-d4b9e55b48). 2025 - FPS Finance, dependent children page (official; https://fin.belgium.be/nl/particulieren/belastingaangifte/persoonlijke-situatie/personen-ten-laste/kinderen). Frozen at the AY 2026 amount for income 2026-2029 by the law of 15 July 2026 reforming the personal income tax (Belgian Official Gazette 29.07.2026), read in the text adopted in committee, Chamber DOC 56 1243/009 (official; https://www.dekamer.be/FLWB/PDF/56/1243/56K1243009.pdf) - the Gazette text itself was not opened; indexation resumes from income 2030."
  uprate: health_index
  wage_link: true
  values: {2024: 6850, 2025: 7070, 2026: 7070, 2027: 7070, 2028: 7070, 2029: 7070}

pit.single_parent_allowance:
  description: Extra tax-free allowance of a single person with dependent children (by income year). LEVER.
  unit: EUR
  source: "ITC 1992 art. 133. 2024 - Wolters Kluwer table of indexed tax amounts, 22.12.2023 (secondary; https://assets.contenthub.wolterskluwer.com/api/public/content/2136072-tabel-fiscale-grensbedragen-d4b9e55b48). 2025 - FPS Finance, dependent children page (official; https://fin.belgium.be/nl/particulieren/belastingaangifte/persoonlijke-situatie/personen-ten-laste/kinderen). Frozen at the AY 2026 amount for income 2026-2029 by the law of 15 July 2026 reforming the personal income tax (Belgian Official Gazette 29.07.2026), read in the text adopted in committee, Chamber DOC 56 1243/009 (official; https://www.dekamer.be/FLWB/PDF/56/1243/56K1243009.pdf) - the Gazette text itself was not opened (from income 2029 it is refused when another adult who is not a close relative lives in the household - not relevant for the stylised single parents)."
  uprate: health_index
  wage_link: true
  values: {2024: 1920, 2025: 1980, 2026: 1980, 2027: 1980, 2028: 1980, 2029: 1980}

pit.child_credit_max_per_child:
  description: Maximum refundable tax credit per dependent child for the part of the child supplements that cannot be used against tax (unused supplement x bottom-bracket rate). LEVER.
  unit: EUR
  source: "ITC 1992 art. 134. 550 EUR for income 2024 - Wolters Kluwer table of indexed tax amounts, 22.12.2023 (secondary; https://assets.contenthub.wolterskluwer.com/api/public/content/2136072-tabel-fiscale-grensbedragen-d4b9e55b48); same amount for AY 2026 on the FPS Finance children page (official). Frozen in nominal terms from AY 2026 by the law of 18 December 2025 according to BDO (secondary; https://www.bdo.be/nl-be/microsites/belastinghervorming/interactief-overzicht-fiscale-sociale-maatregelen-2d7bfd773e91786835ead2f04ecb3c8a) - ASSUMPTION that the freeze has no end date."
  values:
    2024: 550

pit.marital_quotient_rate:
  description: Marital quotient - share of the couple's joint net professional income up to which income is attributed to the partner with little or no own income. LEVER.
  unit: share
  source: "Income Tax Code 1992 art. 87-88: 30 %, unchanged by the 2026 reform (which cuts the maximum amount, see pit.marital_quotient_max)."
  values:
    2024: 0.30

pit.marital_quotient_max:
  description: Maximum amount attributed to the partner under the marital quotient, by income year - 'work' for couples in general, 'pension' for couples where both partners have reached 66 (67 from AY 2031). LEVER.
  unit: EUR
  source: "2024 (AY 2025): 13 050 - Wolters Kluwer table of indexed tax amounts, 22.12.2023 (secondary; https://assets.contenthub.wolterskluwer.com/api/public/content/2136072-tabel-fiscale-grensbedragen-d4b9e55b48), and the same amount in the FPS Finance explanatory notes to the AY 2025 return (official; https://fin.belgium.be/sites/default/files/media/documents/explications-partie-1-rw-2025.pdf). 2025 (AY 2026): 13 460 - FPS Finance (official; https://fin.belgium.be/nl/particulieren/belastingaangifte/persoonlijke-situatie/huwelijk-samenwonen). From income 2026 - law of 15 July 2026 reforming the personal income tax (Belgian Official Gazette 29.07.2026), read in the text adopted in committee, Chamber DOC 56 1243/009 (official; https://www.dekamer.be/FLWB/PDF/56/1243/56K1243009.pdf) - the Gazette text itself was not opened, title 5 (art. 27-34): base amount 6 700 cut to 5 860 (income 2026), 5 030 (2027), 4 190 (2028), 3 350 (2029 onwards) in general; for couples of pensionable age 6 365 in income 2026, then 335 less each year down to 335 in income 2044 and no quotient from income 2045. Amounts = base x 2.0096 rounded to 10 EUR (coefficient frozen at the AY 2026 level, new art. 178 par. 3; reproduces 11 780 and 12 790 published by Liantis for income 2026). ASSUMPTION - the frozen coefficient is read as having no end date, so the amounts are not indexed after 2029; if indexation resumes the quotient is worth more than modelled."
  values:
    2024: {work: 13050, pension: 13050}
    2025: {work: 13460, pension: 13460}
    2026: {work: 11780, pension: 12790}
    2027: {work: 10110, pension: 12120}
    2028: {work: 8420, pension: 11440}
    2029: {work: 6730, pension: 10770}
    2030: {work: 6730, pension: 10100}
    2031: {work: 6730, pension: 9430}
    2032: {work: 6730, pension: 8750}
    2033: {work: 6730, pension: 8080}
    2034: {work: 6730, pension: 7410}
    2035: {work: 6730, pension: 6730}
    2036: {work: 6730, pension: 6060}
    2037: {work: 6730, pension: 5390}
    2038: {work: 6730, pension: 4710}
    2039: {work: 6730, pension: 4040}
    2040: {work: 6730, pension: 3370}
    2041: {work: 6730, pension: 2690}
    2042: {work: 6730, pension: 2020}
    2043: {work: 6730, pension: 1350}

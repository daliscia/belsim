rev.fpb_alignment_enabled:
  description: Switch (1 or 0) for rev.fpb_alignment - 0 removes every alignment of the revenue baseline on the Planning Bureau's outlook and leaves the model's own projection (legislation, tax bases and the observed 2025 accounts carried forward). LEVER.
  unit: flag
  source: "Modelling choice. Without the alignment general-government revenue is -0.05 / 0.01 / 0.02 / 0.15 / 0.20 / 0.26 point of GDP higher in 2026-2031 and the deficit as much lower (5.8 % of GDP in 2031 instead of 6.05 %; Planning Bureau 6.4 %)."
  values: {2024: 1}

rev.fpb_alignment:
  description: Alignment to the Planning Bureau's no-policy-change outlook of June 2026, cause not identified - multiplier on the revenue lines of a category of the Bureau's accounts, by year. The observed 2025 accounts are the starting point and are not overridden - from 2026 only the change of each category since 2025, in points of GDP, is the Bureau's. Categories - household direct taxes and indirect taxes, each for the federal government with social security (_federal), the regions and communities (_regions) and local government (_local); corporate tax; capital_taxes (inheritance and gift tax); contributions (effective social contributions). 1 = no alignment. The 2031 values hold afterwards. Switch off with rev.fpb_alignment_enabled.
  unit: ratio by category
  source: "ALIGNMENT, not legislation and not an estimate: alignment to the Planning Bureau's no-policy-change outlook of June 2026, cause not identified. Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableaux D.1, D.2, D.3, D.5 and D.6 (official, fetched 26.11.2026; data/base/revenue_fpb_outlook.csv). Rule - for each category and each year 2026-2031, model ratio to GDP less its observed 2025 ratio = the Bureau's ratio less the Bureau's own 2025 ratio (a line goes with the subsector that receives most of it). The level of the observed 2025 accounts (October 2026 vintage) therefore stays - against the Bureau's June estimate of 2025, counted from 2024, indirect taxes are 0.12 point of GDP higher (mostly VAT, +5.2 % in 2025), household taxes 0.09 lower (federal income tax and other household taxes), capital taxes 0.03 and corporate tax 0.01 higher, contributions 0.01 lower; general-government revenue ends 0.07 to 0.16 point above the Bureau's in 2026-2031 (it was 0.02 to 0.09 when the alignment was counted from 2024 and took the 2025 difference out). No part of those differences was identified as a one-off, so all of it persists (a temporary part would be entered in rev.outturn_persistence). VAT - the one documented timing effect of 2025 goes the other way - the new VAT chain (faster refunds, law of 12 March 2023) lowered cash receipts by an estimated 585 mn in 2025 (Court of Audit, commentary on the 2026 budget, Chamber DOC 56 1279/003) and the budget neutralises it in accrual terms (correction of 1,170 mn, Expose general 2026, DOC 56 1278/001); nothing indicates that the 2025 accounts overstate VAT. Corporate tax and income tax - the temporary factors the Bureau names for 2025 (slower advance payments, pace of assessments) are in its own 2025 and reverse inside its path. What the multipliers stand for, as far as known - household taxes, the Bureau books the cost of the higher allowance on the federal tax in the year (payroll withholding) and on the regional and municipal surcharges when assessed, one to two years later (Court of Audit, DOC 56 1279/003, note 59), the model in the income year at all three levels, hence federal 0.97-0.98 and regions and local 1.03-1.04 from 2029; indirect taxes of the regions grow faster in the model from 2027 (0.95); corporate - the Bureau's tax per euro of net operating surplus drifts down 2 % in 2029-2031; contributions - within 0.4 %; capital taxes - one-off federal receipts in 2026 (1.13). Computed by `uv run python -m belsim.fiscal.revenue.align` on the baseline of 26.11.2026 - when the baseline tax bases change, run it again (tests/test_revenue_align.py fails when the stored values have drifted)."
  values:
    2024: {households_federal: 1.0, households_regions: 1.0, households_local: 1.0, indirect_federal: 1.0, indirect_regions: 1.0, indirect_local: 1.0, corporate: 1.0, capital_taxes: 1.0, contributions: 1.0}
    2026: {households_federal: 1.0021, households_regions: 1.0047, households_local: 1.0015, indirect_federal: 0.9988, indirect_regions: 1.0076, indirect_local: 0.9929, corporate: 1.0002, capital_taxes: 1.1332, contributions: 0.9957}
    2027: {households_federal: 0.9947, households_regions: 1.0059, households_local: 0.9956, indirect_federal: 1.0088, indirect_regions: 0.9549, indirect_local: 0.9942, corporate: 1.0009, capital_taxes: 1.0305, contributions: 0.9992}
    2028: {households_federal: 0.9909, households_regions: 1.0162, households_local: 1.0007, indirect_federal: 1.0075, indirect_regions: 0.9523, indirect_local: 0.9912, corporate: 1.0041, capital_taxes: 1.0126, contributions: 1.0011}
    2029: {households_federal: 0.9719, households_regions: 1.0445, households_local: 1.0305, indirect_federal: 1.0105, indirect_regions: 0.9537, indirect_local: 0.9871, corporate: 0.998, capital_taxes: 0.9978, contributions: 0.9985}
    2030: {households_federal: 0.9738, households_regions: 1.0378, households_local: 1.037, indirect_federal: 1.0132, indirect_regions: 0.9519, indirect_local: 0.9799, corporate: 0.9881, capital_taxes: 0.9952, contributions: 0.9968}
    2031: {households_federal: 0.9764, households_regions: 1.03, households_local: 1.0414, indirect_federal: 1.0131, indirect_regions: 0.9482, indirect_local: 0.9735, corporate: 0.9773, capital_taxes: 0.9918, contributions: 0.996}
# ============================================================== regional attribution and levers
rev.regional_factor:
  description: >-
    Discretionary multiplier by region on the regional and local part of a revenue line without
    an explicit regional rate (vehicle taxes, regional energy levies, gambling taxes,
    environmental taxes, local taxes). 1.0 = current policy. A measure for one region is
    Change(key="<line>.<REGION>"), e.g. key="vehicle_taxes.WAL". The federal and social-security
    part of a mixed line is not affected (use rev.line_factor for the whole line).
  unit: ratio
  source: "Neutral = 1. Regional competences: road and registration taxes on vehicles, gambling and betting taxes, green-certificate and network levies, water / waste / manure taxes (Special Finance Act art. 3-4); municipal and provincial taxes."
  values:
    2024:
      vehicle_taxes: {FLA: 1.0, WAL: 1.0, BRU: 1.0}
      energy_green_levies: {FLA: 1.0, WAL: 1.0, BRU: 1.0}
      gambling_lottery: {FLA: 1.0, WAL: 1.0, BRU: 1.0}
      environmental_taxes: {FLA: 1.0, WAL: 1.0, BRU: 1.0}
      other_taxes_production: {FLA: 1.0, WAL: 1.0, BRU: 1.0}
      other_taxes_income_wealth: {FLA: 1.0, WAL: 1.0, BRU: 1.0}

rev.regional_allocation:
  description: >-
    Key used to attribute a national revenue line to the regions when the model has no regional
    base for it - consumption (disposable income of the residents, from the population of tax
    units), population, or vehicles (adults x rev.vehicle_tax_relative). Income tax and social
    contributions are attributed by residence of the taxpayer and property taxes with the
    regional bases and rates; they are not listed here.
  unit: key
  source: "ASSUMPTION - allocation keys. VAT and excise by consumption, itself taken proportional to disposable income by region of residence (no regional household-budget data in the model; ignores cross-border and commuter spending). Regional energy levies and gambling by consumption; environmental and local taxes by population."
  values:
    2024:
      vat: consumption
      excise_fuel: consumption
      excise_tobacco: consumption
      excise_alcohol: consumption
      excise_energy: consumption
      excise_beverages_packaging: consumption
      energy_green_levies: consumption
      gambling_lottery: consumption
      vehicle_taxes: vehicles
      environmental_taxes: population
      other_taxes_production: population
      other_taxes_income_wealth: population

rev.vehicle_tax_relative:
  description: Vehicle taxes (annual road tax, registration tax, kilometre charge) per adult resident, by region, relative to Flanders. Sets the regional split of the line; its level is calibrated.
  unit: ratio
  source: "ASSUMPTION - order of magnitude from regional budgets recalled from memory (Flanders about 1.5 bn EUR, Wallonia about 0.75 bn, Brussels about 0.25 bn of road and registration taxes): fewer cars per adult in Brussels, similar yield per adult in Wallonia and Flanders."
  values: {2024: {FLA: 1.0, WAL: 0.95, BRU: 0.6}}

  values: {2024: 0.40, 2025: 0.15, 2026: 0.16}

ssc.structural_reduction_low_threshold:
  description: Annual gross wage (4 x quarterly S2) below which the very-low-wage structural reduction applies
  unit: EUR
  source: "NSSO administrative instructions, 'La reduction structurelle' (see ssc.structural_reduction_slope): S2 = 6,502.69 (Q1 2024), 6,807.18 (Q2), 6,943.32 (Q3-Q4) -> annual sum 27,196.51; 8,400.00 in Q2 2025 and 9,360.00 from Q3 2025 (2025 entry = 4 x 9,360, regime in force from 1 July 2025); then indexation only (9,547.20 from Q1 2026, 9,738.14 from Q3 2026)."
  uprate: health_index
  wage_link: true
  values: {2024: 27196.51, 2025: 37440.0}

ssc.fte_floor_wage:
  description: Annual full-time minimum wage used to read low annual earnings as part-time work - the structural reduction of employer contributions is assessed by law on the full-time-equivalent reference wage and scaled by the fraction worked, so earnings below this amount get that fraction of the reduction of a full-time minimum wage (12 x the minimum monthly income, indexed). 0 = reduction computed on annual earnings as they are (the bottom two earnings deciles then pay almost no employer contributions). The labour-demand response to contribution cuts is tuned with this rule on.
  unit: EUR
  source: "12 x the guaranteed average minimum monthly income, 2024 average 2,048 EUR (see dist.min_wage_monthly: 1,994.18 / 2,029.88 / 2,070.48 during 2024, secondary). Rule: NSSO administrative instructions, 'La reduction structurelle' - R is computed with the reference quarterly wage S (wage brought to full-time, complete quarter) and multiplied by the performance fraction (official, see ssc.structural_reduction_slope). ASSUMPTION that everybody earning less than the full-time minimum wage over the year works part-time or part of the year at that wage."
  uprate: health_index
  wage_link: true
  values: {2024: 24576.0}

ssc.employer_cap_wage:
  description: Annual gross wage (4 x the quarterly ceiling) above which basic employer contributions are no longer due (partial exemption for very high wages)
  unit: EUR
  source: "Programme law of 18 July 2025 (MB 29.07.2025) and royal decree of 6 October 2025; NSSO administrative instructions 'Exoneration partielle pour les tres hauts salaires' (socialsecurity.be/employer/instructions/dmfa/fr/latest/instructions/deductions/otheremployersreductions/partial_exemption_very_high_salaries.html, official, read 25.11.2026): quarterly ceiling 85,000 from Q3 2025; 86,700 from 1.1.2026; 88,434 from 1.7.2026 (2026 entry = sum of the four quarters). Not applicable in 2024 (see ssc.employer_cap_exempt_share). Budget cost 75 mn in 2026 (press, RTBF) - the model's wage deciles do not reach the ceiling, so the aggregate cost is not captured."
  uprate: health_index
  wage_link: true
  values: {2024: 340000.0, 2025: 340000.0, 2026: 350268.0}

ssc.employer_cap_exempt_share:
  description: Share of the basic employer contribution exempted on the part of the wage above ssc.employer_cap_wage (0 = no ceiling)
  unit: share
  source: "Programme law of 18 July 2025: exemption of basic employer contributions and wage moderation above the ceiling from the third quarter of 2025 (NSSO instructions, see ssc.employer_cap_wage) -> half a year in 2025, full from 2026. Status: law."
  values: {2024: 0.0, 2025: 0.5, 2026: 1.0}

ssc.employer_rate_public:
  description: Average actual employer contribution rate on general-government wages (contractual staff at private-like rates, statutory staff at reduced rates, local pension-fund contributions)
  unit: rate
  source: "Eurostat gov_10a_main + NBB national tax list 2024: D.611 paid by general government (11,228) / D.11 paid by general government (52,188)"
  values: {2024: 0.215}

ssc.self_employed_rate:

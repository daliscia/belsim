# ============================================================== corporate income tax (cit.)
cit.rate:
  description: Standard corporate income tax rate
  unit: rate
  source: "Income Tax Code 1992 art. 215: 25 % (PwC Worldwide Tax Summaries, Belgium - taxes on corporate income, reviewed 10.09.2026, secondary; the FPS Finance rate page was unreachable)"
  values: {2024: 0.25}

cit.base_share_path:
  description: Taxable corporate profits in the baseline, as a share of GDP relative to 2024 (index by year). The model's profit proxy has no depreciation dynamics; over the years of this path the baseline tax base follows it, afterwards the ratio to the proxy is held. A scenario moves the base through the proxy.
  unit: index by year
  source: "Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau C.3 (net operating surplus of companies: 89,848 / 93,566 / 96,828 / 97,039 / 97,994 / 100,711 / 103,051 / 105,388 mn in 2024-2031) over Tableau A.2 (GDP at current prices), official, fetched 26.11.2026: 14.5 % of GDP in 2024, 13.5 % in 2031 - 'l'assiette evolue moins vite que le PIB en raison de la dynamique des amortissements deductibles'."
  values:
    2024: {2024: 1.0, 2025: 1.0061, 2026: 1.0077, 2027: 0.9746, 2028: 0.9520, 2029: 0.9478, 2030: 0.9404, 2031: 0.9341}

cit.sme_rate:
  description: Reduced corporate income tax rate on the first 100,000 EUR of profit of small companies
  unit: rate
  source: "Income Tax Code 1992 art. 215: 20 % on the first 100,000 EUR for small companies (art. 1:24 CSA) paying a minimum director remuneration (45,000 EUR; 50,000 indexed from AY 2027, law of 15 July 2026) - PwC Worldwide Tax Summaries reviewed 10.09.2026, KPMG (secondary)"
  values: {2024: 0.20}

cit.sme_base_share:
  description: Share of the taxable base taxed at the reduced SME rate
  unit: share
  source: "Derived from the federal inventory of tax expenditures 2024 (Chamber DOC 56 1279/002, official): cost of the reduced rate 582.14 mn (AY 2024) / 5 points = 11.6 bn of base, against a base of about 108 bn (2024 receipts 27.0 bn / 25 %). ASSUMPTION for the total base. Old judgemental value was 0.08."
  values: {2024: 0.107}

cit.innovation_deduction_rate:
  description: Innovation income deduction - share of qualifying net innovation income exempt from corporate tax
  unit: rate
  source: "Income Tax Code 1992 art. 205/1: 85 % (PwC Worldwide Tax Summaries, Belgium - tax credits and incentives, secondary, read 25.11.2026)"
  values: {2024: 0.85}

cit.innovation_income_share:
  description: Qualifying innovation income as a share of profits before deductions
  unit: share
  source: "Derived from the federal inventory of tax expenditures 2024 (Chamber DOC 56 1279/002, official): cost of the innovation income deduction 1,208.06 mn (AY 2024) / (25 % x 85 %) = 5.7 bn, against profits before these deductions of about 117 bn. ASSUMPTION for the total base."
  values: {2024: 0.049}

cit.investment_deduction_base_share:
  description: Share of profits before deductions removed by the investment deduction
  unit: share
  source: "Derived from the federal inventory of tax expenditures 2024 (Chamber DOC 56 1279/002, official): investment deduction 649.09 mn + 'green' investments 305.31 mn (AY 2024) / 25 % = 3.8 bn, against profits before these deductions of about 117 bn. ASSUMPTION for the total base and for a constant share after the 2025 reform of the deduction (basic 10 %, thematic 40 / 30 %, technology 13.5 %: finances.belgium.be/fr/entreprises/impot_des_societes/avantages_fiscaux/deduction_pour_investissement). Old judgemental value was 0.015."
  values: {2024: 0.033}

cit.minimum_tax_rate:
  description: Minimum effective tax rate of large multinational groups (OECD Pillar Two, in force since 2024)
  unit: rate
  source: "Law of 19 December 2023 (MB 28.12.2023), groups with at least 750 mn EUR turnover: 15 % (finances.belgium.be/fr/entreprises/international/pillar-2, official, read 25.11.2026)"
  values: {2024: 0.15}

cit.minimum_tax_base_share:
  description: Share of taxable profits earned by in-scope groups taxed below the minimum rate
  unit: share
  source: "ASSUMPTION - order of magnitude consistent with a top-up yield of a few hundred million EUR"
  values: {2024: 0.03}

cit.minimum_tax_low_etr:
  description: Average effective rate of the low-taxed profits subject to the minimum-tax top-up
  unit: rate
  source: "ASSUMPTION - order of magnitude"
  values: {2024: 0.10}

# ============================================================== VAT (vat.)
vat.rate_standard:
  description: Standard VAT rate
  unit: rate
  source: "VAT Code / Royal Decree no. 20: 21 % (finances.belgium.be/fr/entreprises/tva/assujettissement-tva/taux-et-calcul/taux-tva, official, read 25.11.2026). The November 2025 budget agreement kept it at 21 %; a 22 % rate floated for the 2027 budget was dropped (press, 15.10.2026)."
  values: {2024: 0.21}

vat.rate_intermediate:
  description: Intermediate VAT rate (restaurant meals, social housing, margarine, coal; hotels and campsites from March 2026)
  unit: rate
  source: "VAT Code / Royal Decree no. 20: 12 % (finances.belgium.be taux-tva page; Memento fiscal 2025 chapter VAT, official, read 25.11.2026)"
  values: {2024: 0.12}

vat.rate_reduced:
  description: Reduced VAT rate (food, medicines, books, renovation of old dwellings, household gas and electricity, passenger transport; hotels until February 2026)
  unit: rate
  source: "VAT Code / Royal Decree no. 20: 6 % (finances.belgium.be taux-tva page; Memento fiscal 2025 chapter VAT, official, read 25.11.2026)"
  values: {2024: 0.06}

vat.mix:
  description: >-
    Share of each tax base taxed at the [standard, intermediate, reduced, zero or exempt] rate
    (shares of the value before VAT). Keys are the consumption categories plus three
    non-household bases (new housing investment, government purchases, inputs of VAT-exempt
    sectors). To move a category to another rate, change its row.
  unit: share
  source: "Government rows: public investment (government_investment) bears VAT at close to the standard rate - works and equipment; 5 % own-account production without VAT is an ASSUMPTION - which gives the 0.085 % of GDP of VAT lost on an investment cut of 0.5 % of GDP in the Planning Bureau's HERMES variant (654 mn of indirect taxes at 2024 scale); the mix of current purchases (government) is then what leaves the 2024 VAT on all government purchases unchanged (it was one mix of 75 / 0 / 15 / 10 for both). Household rows: derived - household consumption by COICOP 2018 class (Eurostat nama_10_cp18, Belgium 2024) x the legal rate of each class (Royal Decree no. 20; exemptions of art. 44 VAT Code), built by belsim.data.fetch_revenue_vat into data/base/revenue_vat_structure.csv (the within-class splits of mixed classes are ASSUMPTIONS listed there). Households: 87 bn at 21 %, 5.9 bn at 12 %, 66 bn at 6 %. Restaurants row set on official figures: federal inventory of tax expenditures 2023 (Chamber DOC 56 1279/002, table BTW - TVA, official, read 26.11.2026) - horeca at 6 % 1,199 mn forgone = 8.0 bn taxable, at 12 % 508 mn = 5.6 bn; takeaway meals 6.0 bn (budget costing 362 mn) and hotels 2.6 bn (158 mn). Non-household rows: ASSUMPTION anchored on the same inventory - construction at 6 % 3,261 mn forgone = 21.7 bn taxable in 2023 (renovation of dwellings older than 10 years, demolition-reconstruction, social housing, schools), necessities at 6 % 10,589 mn = 70.6 bn for all buyers against 58 bn for households (medicines, food and water bought by government, hospitals, care homes); housing investment (gross fixed capital formation in dwellings, 32.9 bn in 2024 with taxes) follows the Planning Bureau's DC2024 costing of a 12 % rate on new housing (fiche MR 802, dc2024.be, official, read 26.11.2026): 'the average VAT rate on residential investment implies that 21 % is paid on about two thirds of it, a reduced rate on the remaining third', and 9 points on that two thirds are worth 1,354 mn in 2024, i.e. 15.0 bn on which 21 % is actually paid and 7.5 bn at a reduced rate. In the model's terms (shares of the value before VAT, the compliance gap of vat.compliance_gap applying to the standard-rated part): 60 % at 21 % (17.3 bn due, 14.8 bn paid), 26 % at 6 or 12 %, and 14 % outside VAT - ASSUMPTION for that remainder, the costs of ownership transfer counted in investment (registration duties on dwellings, about 4 bn). It was 36.5 / 1.5 / 50 / 12 %, a judgement that put half of housing investment at 6 % and costed the fiche at half its value; 2024 VAT is unchanged (calibrated), the calibration factor moves from 1.000 to 0.99. Cross-check: revenue forgone through the reduced rates = 14.4 bn in 2024, about 16 % of the notional ideal revenue, between the European Commission's rate gap (13.1 %, VAT gap report 2025, year 2023) and the inventory (15.8 bn, 18 %). The previous judgemental mix had 75 bn at 6 % and 12 bn at 12 %; now 91 bn and 6.3 bn. Dated change (verified): hotel and campsite accommodation 6 -> 12 % from 1 March 2026 (royal decree approved 13.02.2026; KPMG TaxNewsFlash and BDO news alert, secondary; official yield 158 mn a year, the row change gives about the same) - 2026 entry = 10 months. Pesticides 12 -> 21 % from the same date (too small to enter). The increases for takeaway meals, sport and culture decided in November 2025 were withdrawn on 13.02.2026 and are NOT in the baseline."
  values:
    2024: &vatmix
      food: [0.009, 0.009, 0.982, 0.0]
      alcohol: [1.0, 0.0, 0.0, 0.0]
      tobacco: [1.0, 0.0, 0.0, 0.0]
      fuel: [1.0, 0.0, 0.0, 0.0]
      energy_home: [0.16, 0.01, 0.83, 0.0]
      housing: [0.0, 0.0, 0.0, 1.0]
      restaurants: [0.235, 0.31, 0.455, 0.0]
      renovation: [0.40, 0.0, 0.60, 0.0]
      other_goods: [0.793, 0.0, 0.147, 0.06]
      other_services: [0.271, 0.0, 0.091, 0.638]
      housing_investment: [0.60, 0.015, 0.245, 0.14]
      government: [0.628, 0.0, 0.242, 0.130]
      government_investment: [0.95, 0.0, 0.0, 0.05]
      exempt_sectors: [0.90, 0.0, 0.08, 0.02]
    2026:
      <<: *vatmix
      restaurants: [0.235, 0.41, 0.355, 0.0]
    2027:
      <<: *vatmix
      restaurants: [0.235, 0.43, 0.335, 0.0]

vat.gov_purchases_share:
  description: Purchases of general government bearing non-deductible VAT (intermediate consumption + investment) as a share of government final consumption. Fallback only - used when the expenditure lines are not available; otherwise the base is built from them (vat.gov_intermediate_share).
  unit: share
  source: "Eurostat gov_10a_main 2024: (P.2 26,243 + P.51g 19,365) / P.3 147,436"
  values: {2024: 0.31}

vat.gov_intermediate_share:
  description: Share of intermediate consumption (and defence investment) in the expenditure lines that mix wages and purchases (administration, education, defence, police, transport ...). With public investment it makes the base of the non-deductible VAT paid by government itself.
  unit: share
  source: "Derived: Eurostat gov_10a_main 2024, intermediate consumption P.2 26,243 mn + investment P.51g 19,365 mn = 45,608 mn, less the public-investment line (17,783 mn), over the 117,523 mn of the model's expenditure lines with a P.2 component -> 0.238 (same 2024 base as before, so 2024 VAT is unchanged)."
  values: {2024: 0.238}

vat.gov_marginal_purchases_share:
  description: Share of a CHANGE in those expenditure lines against the baseline that is purchases of goods and services (the rest is wages). 1 = a consumption cut falls on purchases, as in the Planning Bureau's variants; vat.gov_intermediate_share = pro rata of wages and purchases. LEVER.
  unit: share
  source: "ASSUMPTION, anchored: in the HERMES variant 'public consumption -0.5 % of GDP' (purchases of goods and services) indirect taxes fall by 459 mn in year t, about 15 % of the cut - Federal Planning Bureau, Working Paper 4 DC2024 (data/reference/validation.yaml, hermes_public_consumption_cut); with the model's rates on government purchases (16 % less the compliance gap) that needs the whole cut to be purchases."
  values: {2024: 1.0}

vat.exempt_sector_input_share_gdp:
  description: Purchases bearing non-deductible VAT outside households, housing investment and government - inputs and investment of VAT-exempt activities (finance, health, education, renting, non-profit institutions) and non-deductible costs of other businesses - as a share of GDP
  unit: share
  source: "Derived as a residual (ASSUMPTION for the attribution): the VAT total tax liability of 2024 is the receipts over one minus the European Commission's compliance gap (37,832 / 0.877 = 43.1 bn); household consumption (COICOP x legal rates), housing investment and government purchases explain 33.6 bn of it; the remaining 9.5 bn is non-deductible VAT on the inputs and investment of exempt activities (finance, insurance, health, education, renting, non-profit institutions, small businesses under the exemption scheme) and of other businesses (half of company-car costs, restaurant and reception costs) = a base of 54 bn, 8.8 % of GDP. Old order-of-magnitude value was 0.035 (with a standard-rate share of household services of 45 % instead of 27 %)."
  values: {2024: 0.088}

vat.compliance_gap:
  description: VAT compliance gap on supplies at the standard rate - share of the VAT due at 21 % that is not collected (fraud, insolvency, errors). LEVER for anti-fraud measures.
  unit: share
  source: "European Commission, VAT gap in the EU, 2025 report (published 11.12.2025): Belgium 12.3 % of the VAT total tax liability in 2023, 5,230 mn EUR (taxation-customs.ec.europa.eu/taxation/vat/fight-against-vat-fraud/vat-gap_en, official, read 25.11.2026); latest year available, used for 2024. ASSUMPTION for the attribution: the whole gap is put on the standard-rated liability (85 % of the total in the model -> 12.3 % / 0.85), because the amounts declared at 6 % and 12 % (federal inventory of tax expenditures: 100 bn at 6 % in 2023) are not below what national-accounts consumption gives at those rates (see vat.compliance_gap_reduced). With a uniform gap the model put a point of standard rate at 1.7 bn and understated every reduced-rate costing by a sixth."
  values: {2024: 0.145}

vat.compliance_gap_reduced:
  description: VAT compliance gap on supplies at the reduced and intermediate rates (6 % and 12 %) - share of the VAT due at those rates that is not collected.
  unit: share
  source: "ASSUMPTION - zero: the taxable amounts declared at 6 % and 12 % in VAT returns (federal inventory of tax expenditures 2023, Chamber DOC 56 1279/002: 100 bn at 6 %, 6.3 bn at 12 %) are at least as large as the reduced-rate bases derived from national-accounts consumption and investment (91 bn and 6.3 bn in the model), and official costings of reduced-rate changes (food, takeaway meals, hotels, culture) are consistent with the full base. Under-declaration in restaurants and renovation work is therefore not visible in the aggregate."
  values: {2024: 0.0}

# ============================================================== excise and similar (excise.)
# Duties are per physical unit. They are converted into ad-valorem equivalents with the pre-tax
# unit price. The law fixes duties in nominal terms: they are held at their legislated nominal
# level until 2031 (dated entries; the Planning Bureau's outlook of June 2026 notes that excise
# receipts "se tassent" because ad-quantum duties do not follow inflation). ASSUMPTION after 2031:
# `uprate: cpi`, i.e. duties are raised with inflation (projection convention; without it excise
# revenue would erode to a fraction of GDP by 2070). Taxed volumes follow `excise.volume_growth`.
# The 2025 level of every excise line is the observed outturn (data/base/revenue_outturn.csv), so
# the unverified 2025 restructuring of the tobacco duty is in the level of the line.
# Level against the budget documents: the excise lines follow the national accounts (ESA, national
# tax list): 11,416 mn in 2024 against 11,130 mn of federal cash receipts "accises et divers"
# (Expose general 2026). The ESA lines also hold what the excise administration does not collect
# for the federal budget - the regional share of the energy levies (0.29 x 550 mn), the federal
# contribution on electricity and gas, animal-health and packaging levies - and are shifted from
# cash to the month of the transaction. Dynamics: in 2025 cash receipts rose 0.8 % with duties
# frozen except tobacco, whose legal sales fell (2,737 mn in 2023, 2,555 mn in 2024: FPS Finance
# figures in the press); the model has no cross-border or illicit-trade response in the baseline,
# so its tobacco line keeps growing with consumption.
excise.fuel_duty:
  description: Excise duty on motor fuel, average of petrol and diesel
  unit: EUR/litre
  source: "FPS Finance, Memento fiscal 2025 (situation 31.12.2024), chapter excise: unleaded petrol 95 600.1587 and road diesel 600.1586 EUR per 1,000 litres (eservices.minfin.fgov.be Fisconetplus, official, read 25.11.2026). Unchanged in 2025 (Energia/Petrolfed key figures 2025) and still 0.6002 in September 2026 (secondary) - hence the 2025 and 2026 entries; increases 'from 2027' were announced without rates and are not in the baseline. Nominal to 2031 (no legislated change), inflation uprating after 2031 is a projection convention (ASSUMPTION). The refund for professional diesel (193.50 EUR per 1,000 l) is in the calibrated level."
  uprate: cpi
  values: {2024: 0.60016, 2025: 0.60016, 2026: 0.60016, 2027: 0.60016, 2028: 0.60016, 2029: 0.60016, 2030: 0.60016, 2031: 0.60016}

excise.fuel_pretax_price:
  description: Average pump price of motor fuel before excise and VAT
  unit: EUR/litre
  source: "2025-2031 entries = the 2024 value x the consumer price index of the baseline (Federal Planning Bureau outlook of June 2026: +2.5 / 3.4 / 2.9 / 2.3 / 1.8 / 1.7 / 1.7 %), entered as dated values so that a scenario that moves consumer prices does not change the ratio of a nominal duty to this price; uprated with consumer prices after 2031. Derived from Statbel average maximum prices 2024 (bestat.statbel.fgov.be, official): petrol 95 E10 1.7158 and diesel B7 1.7913 EUR per litre incl. VAT -> 0.818 and 0.880 before excise and VAT; weighted about one third petrol, two thirds diesel (excise receipts 2024: petrol 2.15 bn, diesel 4.00 bn - Energia key figures citing FPS Finance). Old from-memory value was 0.80."
  uprate: cpi
  values: {2024: 0.86, 2025: 0.8815, 2026: 0.9115, 2027: 0.9379, 2028: 0.9595, 2029: 0.9767, 2030: 0.9934, 2031: 1.0102}

excise.tobacco_duty:
  description: Excise duty on tobacco (specific + ad valorem), per pack of 20 cigarettes
  unit: EUR/pack
  source: "FPS Finance, Memento fiscal 2025, chapter excise (official, read 25.11.2026): cigarettes since 1.1.2024 - ad valorem 34.04 % of the retail price + 178.00 EUR per 1,000 (specific 6.8914 + special 171.1086). On the weighted average price of 9.35 EUR per 20 (Tax Foundation 'Cigarette taxes in Europe' from European Commission data, secondary) = 3.56 + 3.18 = 6.74. 2025-2026 rates not verified (press: ad valorem lowered to 31.50 % with a higher specific duty from 1.1.2025; Tax Foundation shows 7.30 EUR on an average price of 11.14 at 1.1.2026) - the dated entries keep the 2024 duty and the 2025 outturn of the line carries the change (no increase was decided for 2026: press, October 2026). Nominal to 2031, inflation uprating after 2031 is a projection convention (ASSUMPTION). Old from-memory value was 6.4."
  uprate: cpi
  values: {2024: 6.74, 2025: 6.74, 2026: 6.74, 2027: 6.74, 2028: 6.74, 2029: 6.74, 2030: 6.74, 2031: 6.74}

excise.tobacco_pretax_price:
  description: Price of a pack of 20 cigarettes before excise and VAT
  unit: EUR/pack
  source: "2025-2031 entries = the 2024 value x the consumer price index of the baseline (Federal Planning Bureau outlook of June 2026: +2.5 / 3.4 / 2.9 / 2.3 / 1.8 / 1.7 / 1.7 %), entered as dated values so that a scenario that moves consumer prices does not change the ratio of a nominal duty to this price; uprated with consumer prices after 2031. Derived: weighted average price 9.35 EUR (see excise.tobacco_duty, secondary) / 1.21 less excise 6.74. Old value 1.86 assumed a 10 EUR pack and a lower duty."
  uprate: cpi
  values: {2024: 0.99, 2025: 1.0147, 2026: 1.0493, 2027: 1.0797, 2028: 1.1045, 2029: 1.1244, 2030: 1.1435, 2031: 1.1629}

excise.alcohol_duty:
  description: Excise duty on alcoholic drinks, average per litre of pure alcohol across beer, wine and spirits
  unit: EUR/litre pure alcohol
  source: "FPS Finance, Memento fiscal 2025, chapter excise (official, read 25.11.2026): spirits 2,992.7928 EUR per hl of pure alcohol; still wine 74.9086 EUR per hl (sparkling 256.3223); beer 2.0043 EUR per hl and degree Plato. Per litre of pure alcohol: spirits 29.9, wine (12.5 %) 6.0, beer (5 %, 12 degrees Plato) 4.8; ASSUMPTION for the weights (beer 45 %, wine 38 %, spirits 17 % of alcohol consumed) -> 9.5. Cross-check: 2024 receipts 740 mn / about 90 mn litres of pure alcohol = 8.2. Rates unchanged in 2025 and 2026 (spirits still 2,992.79 EUR per hl of pure alcohol in Chamber DOC 56 0525/001; no change in the budget laws of 2025 and 2026) - hence the 2025 and 2026 entries; nominal to 2031 (no legislated change), inflation uprating after 2031 is a projection convention (ASSUMPTION). Old judgemental value was 11.0."
  uprate: cpi
  values: {2024: 9.5, 2025: 9.5, 2026: 9.5, 2027: 9.5, 2028: 9.5, 2029: 9.5, 2030: 9.5, 2031: 9.5}

excise.alcohol_pretax_price:
  description: Average price of alcoholic drinks before excise and VAT, per litre of pure alcohol
  unit: EUR/litre pure alcohol
  source: "2025-2031 entries = the 2024 value x the consumer price index of the baseline (Federal Planning Bureau outlook of June 2026: +2.5 / 3.4 / 2.9 / 2.3 / 1.8 / 1.7 / 1.7 %), entered as dated values so that a scenario that moves consumer prices does not change the ratio of a nominal duty to this price; uprated with consumer prices after 2031. ASSUMPTION - order of magnitude"
  uprate: cpi
  values: {2024: 45.0, 2025: 46.12, 2026: 47.69, 2027: 49.08, 2028: 50.21, 2029: 51.11, 2030: 51.98, 2031: 52.86}

excise.energy_duty:
  description: Federal excise on household gas and electricity, average per MWh of home energy
  unit: EUR/MWh
  source: "FPS Finance, Memento fiscal 2025, chapter excise (official, read 25.11.2026): households, end 2024 - natural gas 9.2278 EUR/MWh (0-12 MWh), electricity 49.4061 EUR/MWh (0-20 MWh). ASSUMPTION for the weights (17 MWh gas and 3.5 MWh electricity per household, the reference household of the FPS) -> 16.1. Note: the national tax list records most of the special excise on gas and electricity with mineral oils (line excise_fuel), so this duty drives a smaller line than its level suggests. Rates unchanged in 2025 and until 1 August 2026 (gas 9.23 and electricity 49.41 EUR/MWh are the starting points of the reform, see excise.energy_shift_factor) - hence the 2025 and 2026 entries; nominal to 2031 (no legislated change), inflation uprating after 2031 is a projection convention (ASSUMPTION). Old order-of-magnitude value was 8.0."
  uprate: cpi
  values: {2024: 16.1, 2025: 16.1, 2026: 16.1, 2027: 16.1, 2028: 16.1, 2029: 16.1, 2030: 16.1, 2031: 16.1}

excise.energy_shift_factor:
  description: Multiplier on excise.energy_duty for the legislated shift of excise from electricity to gas (weighted household rate relative to unchanged 2024 rates)
  unit: ratio
  source: "Programme law of 30 May 2026, in force 1 August 2026 (press: Belga 28.07.2026 citing FPS Finance; trajectory from Test-Achats and one accountancy blog, secondary): gas 9.23 -> 10.31 (1.8.2026) -> 11.39 (2027) -> 12.47 (2028) EUR/MWh; electricity 49.41 -> 46 -> 43 -> 40 -> 38 (2029). Weighted 17 / 3.5 MWh: 16.09 -> 16.40 -> 16.79 -> 17.17 -> 16.83; 2026 = 5 months. Official yield in 2029 (gas +365 mn, heating oil +28 mn, electricity -170 mn, incl. business use) is larger than what this household-weighted factor gives. Status: law."
  values: {2024: 1.0, 2026: 1.008, 2027: 1.043, 2028: 1.067, 2029: 1.046}

excise.energy_green_levy:
  description: Regional green-certificate and energy-fund levies passed on in energy bills, average per MWh
  unit: EUR/MWh
  source: "2025-2031 entries = the 2024 value x the consumer price index of the baseline (Federal Planning Bureau outlook of June 2026: +2.5 / 3.4 / 2.9 / 2.3 / 1.8 / 1.7 / 1.7 %), entered as dated values so that a scenario that moves consumer prices does not change the ratio of a nominal duty to this price; uprated with consumer prices after 2031. ASSUMPTION - order of magnitude; inflation uprating is a projection convention"
  uprate: cpi
  values: {2024: 10.0, 2025: 10.25, 2026: 10.598, 2027: 10.906, 2028: 11.157, 2029: 11.358, 2030: 11.551, 2031: 11.747}

excise.energy_pretax_price:
  description: Average household price of electricity, gas and heating oil before levies and VAT
  unit: EUR/MWh
  source: "2025-2031 entries = the 2024 value x the consumer price index of the baseline (Federal Planning Bureau outlook of June 2026: +2.5 / 3.4 / 2.9 / 2.3 / 1.8 / 1.7 / 1.7 %), entered as dated values so that a scenario that moves consumer prices does not change the ratio of a nominal duty to this price; uprated with consumer prices after 2031. ASSUMPTION - order of magnitude for the 2024 mix of gas (about 70) and electricity (about 250)"
  uprate: cpi
  values: {2024: 110.0, 2025: 112.75, 2026: 116.58, 2027: 119.96, 2028: 122.72, 2029: 124.93, 2030: 127.06, 2031: 129.22}

excise.volume_growth:
  description: Annual growth of the taxed volumes of motor fuel, tobacco and alcohol in the baseline (the model's real consumption of the category is replaced by this trend; a scenario still moves volumes through its effect on consumption). LEVER for the pace of electrification or of the decline of smoking.
  unit: rate per year
  source: "Fuel: Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau 1 - CO2 emissions of road transport 24.1 Mt in 2024 -> 21.6 Mt in 2031 = -1.6 % a year (official, fetched 26.11.2026; https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf); heating fuels ('autres secteurs') -1.4 % a year. Tobacco: Court of Audit commentary on the 2026 budget - tobacco excise -20.7 mn (-0.8 %) in 2026 at unchanged duties (official, in data/reference/validation.yaml); industry and retail-panel sources report far larger falls of legal sales in 2025 (-23 % cigarettes in the first half, NielsenIQ in the press) together with a shift to cross-border and illicit purchases, but ESA receipts still rose 4.3 % in 2025 after the rate change. Alcohol: receipts +0.6 % in 2025 at unchanged duties (Eurostat / NBB national tax list). ASSUMPTION - the 2026-2031 pace continues afterwards; tobacco -1 % and alcohol 0 % a year are rounded judgement values on that evidence."
  values:
    2024: {fuel: 0.0, tobacco: 0.0, alcohol: 0.0}
    2025: {fuel: -0.016, tobacco: -0.01, alcohol: 0.0}

rev.ets2_price:
  description: Price of an emission allowance of the second EU emissions trading system (ETS2 - road fuel and heating fuels), whose auction receipts are government revenue from 2028 (added to the line of emission permits and environmental taxes). 0 = no ETS2.
  unit: EUR per tonne CO2
  source: "2028: 46 EUR/t, the assumption of the Federal Planning Bureau outlook of June 2026 (footnote 2: mean of the 33 EUR of the Commission guidance and the 59 EUR intervention price of the market stability reserve; official, fetched 26.11.2026). The outlook books the receipts with the interregional unit (no agreement on their sharing) and no spending against them. ASSUMPTION for 2029-2031 (61 / 68 / 70): derived from the jump of the indirect taxes of the communities and regions in the same outlook (Tableau D.3: 9,214 mn in 2027, 11,309 / 12,176 / 12,686 / 12,970 in 2028-2031) less an underlying growth of 2.7 % a year, over the covered emissions; constant in real terms afterwards."
  uprate: cpi
  values: {2024: 0.0, 2028: 46.0, 2029: 61.0, 2030: 68.0, 2031: 70.0}

rev.ets2_emissions:
  description: Emissions covered by ETS2 at their 2024 level (road transport and heating of buildings). In the projection they follow the taxed volume of motor fuel (excise.volume_growth).
  unit: Mt CO2
  source: "Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau 1 / F.2: road transport 24.1 Mt + other sectors (buildings) 19.8 Mt in 2024 (official, fetched 26.11.2026); the same table gives 40.9 Mt in 2028, the model 41.2."
  values: {2024: 43.9}

excise.beverage_packaging_rate:
  description: Excise on non-alcoholic beverages and coffee plus the packaging levy, ad-valorem equivalent on food and drink consumption
  unit: rate
  source: "ASSUMPTION - order of magnitude (2024 receipts of the line 546 mn on food and non-alcoholic drink consumption). Statutory rates for reference (Memento fiscal 2025, official): sweetened soft drinks 11.9233 EUR/hl, packaging levy 9.86 EUR/hl non-reusable, 1.41 reusable."
  values: {2024: 0.01}

# ============================================================== capital and wealth (cap.)
cap.withholding_rate:
  description: Withholding tax rate on interest and dividends (roerende voorheffing / precompte mobilier)
  unit: rate
  source: "Income Tax Code 1992 art. 269: 30 % (Court of Audit, comments on the 2026 budget, Chamber DOC 56 1279/003, official; Test-Achats 2026 tax ceilings, secondary; read 25.11.2026)"
  values: {2024: 0.30}

cap.withholding_reduced_rate:
  description: Reduced withholding tax rate (VVPRbis dividends of small companies, liquidation reserves, regulated savings deposits above the exemption)
  unit: rate
  source: "15 % in 2024 (savings deposits above the exemption; VVPRbis). Programme law of 30 May 2026 (MB 01.06.2026): VVPRbis 15 -> 18 % for dividends from 1 July 2026, liquidation-reserve distributions brought to a total of 18 % (KPMG, Degand & Partners, secondary; Court of Audit DOC 56 1279/003; budgeted yield +90 mn in 2026). 2026 entry = half a year. Savings deposits stay at 15 % (a small part of this base). Status: law."
  values: {2024: 0.15, 2026: 0.165, 2027: 0.18}

cap.income_share_reduced:
  description: Share of household interest and dividend income taxed at the reduced rate
  unit: share
  source: "ASSUMPTION, anchored: withholding tax on VVPRbis dividends and liquidation reserves was 760.4 mn in 2024 (Court of Audit, Chamber DOC 56 1279/003, official), 11.4 % of the 2024 receipts of the line (6,656 mn); with 20 % of income exempt this needs a reduced-rate share of 0.16. Old order-of-magnitude value was 0.10."
  values: {2024: 0.16}

cap.income_share_exempt:
  description: Share of household interest and dividend income exempt from withholding tax (savings-deposit interest below 1,020 EUR, first 833 EUR of dividends, pension and insurance wrappers)
  unit: share
  source: "ASSUMPTION - order of magnitude. The exemptions themselves: savings-deposit interest 1,020 EUR and dividends 833 EUR in 2025 and 2026, frozen until 2030 (Test-Achats, Wikifin/FSMA, secondary, read 25.11.2026); the 2024 amounts were not read."
  values: {2024: 0.20}

cap.securities_account_tax_rate:
  description: Annual tax on securities accounts above 1 million EUR
  unit: rate
  source: "Law of 17 February 2021: 0.15 %. Programme law of 30 May 2026 (MB 01.06.2026): 0.30 % for reference periods ending on or after 1 June 2026, i.e. the period closing 30 September 2026; threshold unchanged (FPS Finance finance.belgium.be/en/E-services/divtax, official; KPMG, secondary; read 25.11.2026). Official yield +414 mn in 2026 and +462 mn in a full year (Expose general 2026, Chamber DOC 56 1278/001), against 462 mn of receipts in 2024. Status: law."
  values: {2024: 0.0015, 2026: 0.0030}

cap.tob_rate:
  description: Stock-exchange tax (TOB / beurstaks), average rate on taxed transactions
  unit: rate
  source: "ASSUMPTION for the average. Legal rates verified: 0.12 % (bonds, max 1,300 EUR), 0.35 % (shares, max 1,600), 1.32 % (accumulating funds, max 4,000), unchanged since 2018 (circular 2026/C/42 of 18.03.2026 as summarised by Forum for the Future, secondary, read 25.11.2026). A 'modernisation' of the tax is announced only (not in the baseline)."
  values: {2024: 0.0035}

cap.gains_tax_rate:
  description: Tax on capital gains on financial assets realised by households (solidarity contribution), on gains accrued from 1 January 2026
  unit: rate
  source: "Law of 6 April 2026 (MB 21.04.2026), bill Chamber DOC 56 1244/001: 10 % on gains realised from 1 January 2026; annual exemption of 10,000 EUR (indexed; unused part carried forward 1,000 a year up to 15,000); substantial interests (20 % or more) exempt up to 1 mn then 1.25 / 2.5 / 5 / 10 %; internal gains 33 %; value at 31.12.2025 as reference (FPS Finance fin.belgium.be/nl/particulieren/belastingaangifte/inkomsten/meerwaardebelasting, official; KPMG, RSM, secondary; read 25.11.2026). Status: law."
  values: {2024: 0.0, 2026: 0.10}

cap.gains_taxable_gains:
  description: Taxable realised capital gains on financial assets above the exemption, at 2024 scale (grows with household financial wealth). Gains accrued before 2026 are exempt, so the base builds up gradually.
  unit: EUR mn
  source: "Set on the official yield: Expose general of the 2026 budget (Chamber DOC 56 1278/001, 28.01.2026) - 236 mn withheld in 2026 of which the FPS expects 116 mn to be refunded (120 mn net), cruising speed after five years, about 600 mn from 2032; the Court of Audit (DOC 56 1279/003) finds the 2026 estimate unreliable. ASSUMPTION for the path in between (linear) and for wealth growth of about 3.5 % a year in the conversion to 2024 scale. The government's earlier path (250 / 300 / 400 / 500 mn for 2026-2029, press February 2025) is superseded. Highly uncertain."
  values: {2024: 0, 2026: 1100, 2027: 1800, 2028: 2400, 2029: 3000, 2030: 3600, 2031: 4100, 2032: 4600}

# ============================================================== property and inheritance (prop.)
prop.region_base_share:
  description: Regional shares of the property and inheritance tax bases (value of transactions, estates, rental values)
  unit: share
  source: "ASSUMPTION - judgemental, close to regional shares in household income. Cross-check on receipts (mixed years, official regional sources): registration duties Flanders about 2,690 mn (2025), Wallonia 1,255 mn (2024 budget), Brussels 559 mn (2024) -> 60 / 28 / 12 %; inheritance Flanders about 1,820 mn, Wallonia 798 mn."
  values: {2024: {FLA: 0.62, WAL: 0.26, BRU: 0.12}}

prop.registration_rate:
  description: Standard registration duty on real-estate purchases, by region
  unit: rate
  source: "Flanders 12 % since 1.1.2022 (vlaanderen.be, 'Algemeen tarief in het verkooprecht', official); Wallonia 12.5 % (wallonie.be, official); Brussels 12.5 % (Brussels Fiscality fiche 'Droits de vente 2026', official) - read 25.11.2026"
  values: {2024: {FLA: 0.12, WAL: 0.125, BRU: 0.125}}

prop.registration_rate_sole_home:
  description: Registration duty on the purchase of a sole own home, by region (allowance schemes are shown as an effective rate)
  unit: rate
  source: "Flanders: 3 % for deeds from 1.1.2022, 2 % from 1.1.2025 (vlaanderen.be, 'Verlaagd tarief ... enige eigen woning', official); back to 3 % for sale agreements from 1.1.2027 - Flemish 2027 budget agreement, Vlabel position SP 26021, decree not yet voted (status: formally agreed). Wallonia: 3 % for deeds from 1.1.2025, allowance and cheque habitat abolished - decree of 5 December 2024, MB 13.12.2024 (wallex.wallonie.be, official). Brussels: 12.5 % with an allowance on the first 200,000 EUR for prices up to 600,000 (Brussels Fiscality, official); no enacted reform. ASSUMPTION for the effective rates of the allowance schemes (Wallonia 2024: 0.11; Brussels: 0.08). Read 25.11.2026."
  values:
    2024: {FLA: 0.03, WAL: 0.11, BRU: 0.08}
    2025: {FLA: 0.02, WAL: 0.03, BRU: 0.08}
    2027: {FLA: 0.03, WAL: 0.03, BRU: 0.08}

prop.sole_home_share:
  description: Share of the value of real-estate transactions bought as sole own home
  unit: share
  source: "ASSUMPTION - order of magnitude"
  values: {2024: 0.45}

prop.inheritance_rate:
  description: Average effective inheritance and gift tax rate on the flow of inheritances and gifts, by region
  unit: rate
  source: "ASSUMPTION for the effective rates. Statutory scales verified (read 25.11.2026): Flanders direct line 3 / 9 / 27 % (50k / 250k), others 25-55 % (vlaanderen.be, official; no rate change in 2026, only a higher partner allowance and a 'single' reduction, cost not found - not entered); Wallonia direct line 3-30 %, others up to 80 % (notaire.be); Brussels direct line 3-30 %, others up to 80 % (notaire.be). Dated change: Walloon decree of 5 December 2024 (MB 13.12.2024, wallex.wallonie.be) roughly halves inheritance rates for deaths from 1 January 2028 (direct line 3-15 %, others max 40 %) and lowers gift tax; announced cost about 400 mn on about 950 mn of receipts -> effective rate 0.08 -> 0.046. Status: law - but on 12.10.2026 the Walloon government announced it will replace the halving by a 75,000 EUR exemption per direct-line heir at about half the cost (not voted; would correspond to about 0.063)."
  values:
    2024: {FLA: 0.06, WAL: 0.08, BRU: 0.08}
    2028: {FLA: 0.06, WAL: 0.046, BRU: 0.08}

prop.property_tax_rate:
  description: Regional base rate of the recurrent property tax on indexed cadastral income
  unit: rate
  source: "Flanders 3.97 % (vlaanderen.be, 'Berekening van de onroerende voorheffing', official); Wallonia 1.25 % (UVCW / Belfius local finance studies); Brussels 1.25 % (Brussels Fiscality fiche 'Precompte immobilier 2026', official) - read 25.11.2026. Indexation coefficient of cadastral income: 2.1763 (2024), 2.2446 (2025), 2.3000 (2026)."
  values: {2024: {FLA: 0.0397, WAL: 0.0125, BRU: 0.0125}}

prop.property_tax_local_multiplier:
  description: Provincial + municipal surcharges on the property tax, as a multiple of the regional levy (opcentiemen / 100)
  unit: ratio
  source: "Brussels: municipal average 3,281 centimes in 2024, 3,339 in 2025, 3,599 in 2026, + agglomeration 989 (Brussels Fiscality fiche 'Precompte immobilier 2026', official) -> 42.7 / 43.3 / 45.9. Wallonia: municipal average 2,584-2,599 in 2025 (UVCW, Belfius; 2,622 in 2026) + provincial about 1,500 (ASSUMPTION, not found) -> 41.0. Flanders: municipal average 916 in 2026 (Belfius study 25.06.2026); 2024 municipal average and provincial average (about 220) not found - ASSUMPTION 10.9. Read 25.11.2026. Old Brussels value was 40.0."
  values:
    2024: {FLA: 10.9, WAL: 41.0, BRU: 42.7}
    2025: {FLA: 10.9, WAL: 41.0, BRU: 43.3}
    2026: {FLA: 10.9, WAL: 41.0, BRU: 45.9}

# ============================================================== other revenue (rev.)
rev.insurance_premium_tax_rate:
  description: Annual tax on insurance contracts (standard rate), plus the social-security supplements on car, fire and hospital insurance through calibration
  unit: rate
  source: "Code of miscellaneous duties and taxes art. 175: 9.25 %. Programme law of 30 May 2026: 9.60 % for premiums due from 1 July 2026, other rates (1.10 / 1.40 / 2 / 4.40 %) unchanged (FPS Finance finance.belgium.be/en/E-services/divtax, official, read 25.11.2026; budgeted +51 mn in 2026, Expose general 2026). 2026 entry = half a year. Status: law."
  values: {2024: 0.0925, 2026: 0.09425, 2027: 0.096}

rev.dividends:
  description: Dividends received by government, by holding, at 2024 scale (grow with nominal GDP). Set a holding to 0 to simulate its sale.
  unit: EUR mn
  source: "ASSUMPTION - split of the 2024 total (Eurostat gov_10a_main D.42 = 1,991 EUR mn, of which federal 1,186) by holding, from memory of company announcements; the total is calibrated on the accounts"
  values:
    2024:
      belfius: 440
      bnp_paribas: 300
      proximus: 200
      bpost: 15
      national_bank: 0
      other_federal: 230
      regions_and_local: 806

rev.outturn_persistence:
  description: Share of the gap between the observed 2025 outturn of a line and the model that persists in later years in the model's own projection (lines not listed - 1, the 2025 level becomes the new base; 0 = the gap was a one-off or a matter of timing). While rev.fpb_alignment is on, the categories it covers follow the Planning Bureau's change from the observed 2025 level in 2026-2031 whatever is entered here.
  unit: share by line
  source: "Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), section 4.4.1.1 (official, fetched 26.11.2026). Personal income tax: the 2025 split between the federal tax and the regional and municipal surcharges comes from the slower pace of assessments in 2024 and its acceleration in 2025, partly reversed in 2026 ('roles moins negatifs ... en contrecoup'). In the outlook's subsector accounts (Tableaux D.3 and D.5) the 2025 level of the surcharges stays - household taxes of the regions 2.32 % of GDP in 2024, 2.46 % in 2025, 2.47-2.52 % in 2026-2029; local 0.75 / 0.78 / 0.77-0.78 % - so 2024 was the low year: regional surcharges 1 (observed +872 mn against the model), municipal 0.8 (+279 mn); the federal tax keeps the counterpart of both, 1,151 of its -1,643 mn -> 0.7, the rest is the temporary part (the three were 0 before, which sent 0.17 point of GDP back from the regions and municipalities to the federal government from 2026). Corporate tax: advance payments were exceptionally high in 2024 (higher penalties for insufficient prepayments) and slowed in 2025; in the outlook corporate tax per euro of net operating surplus is 93.4 % of its 2024 level in 2025, 96.6 % in 2026, 99.3 % in 2027 and 100 % in 2028 (Tableaux C.3 and D.1) -> 0.5, 0.1, 0. ASSUMPTION for every other line: the 2025 level persists."
  values:
    2024: {pit_federal: 0.7, pit_regional: 1.0, pit_local: 0.8, cit: 0.5}
    2027: {pit_federal: 0.7, pit_regional: 1.0, pit_local: 0.8, cit: 0.1}
    2028: {pit_federal: 0.7, pit_regional: 1.0, pit_local: 0.8, cit: 0.0}


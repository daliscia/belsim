pit.single_parent_eligible_share:
  description: Share of the individually taxed persons with dependent children who receive the single-parent supplement to the tax-free allowance (population of tax units only; a single-parent payslip always gets it). Below 1 from income 2029, when the supplement is refused if another adult who is not a close relative lives in the household.
  unit: share
  source: "Law of 15 July 2026 (see pit.single_parent_allowance): restriction from income 2029. ASSUMPTION for the share: 218 thousand one-adult households with children (Eurostat EU-LFS 2024, data/base/distribution_households.csv) against 619 thousand individual returns with dependants (Statbel fiscal income statistics 2024, table B.5) -> about 0.35; the others are mostly unmarried couples."
  values: {2024: 1.0, 2029: 0.35}

pit.sole_income_pension_share:
  description: Share of the joint returns with a single income (the couples for whom the marital quotient matters most) that are pensioner couples; the others are working-age couples. Shapes the population of tax units behind the aggregate income tax.
  unit: share
  source: "ASSUMPTION, anchored: of about 637,000 couples with a marital quotient, 277,000 are not pensioners (Ligue des familles and press on the 2026 reform, January 2026, secondary) -> 57 % pensioners. Number of joint returns with one income: 283,875 (Statbel fiscal income statistics 2024, table B.3, official)."
  values: {2024: 0.57}

pit.bracket_base_factor:
  description: Alternative tax base, off by default - multiplier on the taxable income that falls in each bracket of the income-tax schedule (25 / 40 / 45 / 50 %), in the population of tax units behind the aggregate income tax. All 1 = the distribution of the 2024 tax returns. Set to [1, 1, 0.88, 0.88] for the smaller upper-bracket bases implied by the Planning Bureau's 2024 costings (one factor for the two upper brackets, so that moving the limit between them is costed on the same footing); the receipts are unchanged in the year it is switched on (the tax the smaller base does not explain is carried as an amount that grows with GDP and does not react to the schedule), so a change of rates or brackets is costed on the smaller base - compare a measure between two runs that both carry the change. LEVER (sensitivity).
  unit: ratio by bracket
  source: "Default 1 - Statbel fiscal income statistics, income 2024 (official): 124 / 67 / 50 / 34 bn taxed at 25 / 40 / 45 / 50 %. Alternative, inferred - Federal Planning Bureau, DC2024 fiches (dc2024.be, official, read 26.11.2026; EXPEDITION model on 2017 tax returns uprated to 2024, no table by bracket published): 40 % rate to 30 % -6,545 mn (VB 102), 45 % rate to 40 % -2,312 mn (VB 103, Open Vld 101), 50 % threshold from 48,320 to 61,000 EUR -552 mn (VB 104). With the model's own ratio of cost to bracket income these imply about 67 bn in the 40 % bracket (as in the returns), 44 bn in the 45 % bracket (50 bn in the returns) and 10.3 bn between 48,320 and 61,000 EUR (12.2 bn). ASSUMPTION - the factor inferred for the first part of the top bracket is applied to all of it. The 2024 returns are the more credible base for 2024: they are the observed incomes of that year, and on them the schedule reproduces the 2024 receipts (calibration factor of the federal tax 1.00), while the smaller bases leave 4.6 bn of state tax, 7 %, unexplained; incomes uprated uniformly from 2017 miss the incomes that moved above the price-indexed thresholds since. The 10-18 % by which the model exceeds the upper-bracket costings is read as that difference of base, not as an error of either."
  values: {2024: [1.0, 1.0, 1.0, 1.0]}

pit.tax_unit_type_follows_income:
  description: Switch (1 or 0) - the kind of tax unit of a taxpayer (taxed alone, partner in a two-income couple, sole income of a couple) follows his or her place in the income distribution, as in the tax returns; 0 gives every income group the same mix. Read once, in the base year - it shapes the population of tax units behind the aggregate income tax, not the law.
  unit: flag
  source: "Statbel fiscal income statistics, income 2024, tables B.1-B.3 (official; data/base/revenue_pit_distribution.csv): distribution of net taxable income by type of return - a joint return with one income averages 45,400 EUR against 27,600 EUR for an individual return and 37,600 EUR per partner of a two-income joint return. In the model the taxpayers taxed alone then average 27,200 EUR, the sole incomes of joint returns 38,900 EUR and partners of two-income couples 35,600 EUR. Effect on costings - abolishing the marital quotient under the rules of income 2025 yields 342 mn at 2024 prices (322 mn with the same mix in every income group) against 491 mn in the Planning Bureau's DC2024 costing (fiche DeFI 104); the rest depends on how income is split inside two-income couples, which is not published (pit.two_income_lower_share)."
  values: {2024: 1}

pit.two_income_lower_share:
  description: Share of the joint taxable income of a two-income couple held by the partner with the lower income - five equally likely values. Used once, in the base year, to turn the distribution of tax returns into a distribution of persons (the brackets apply to each partner); it mostly decides how much income of couples reaches the top bracket.
  unit: share
  source: "ASSUMPTION - the fiscal statistics publish joint returns, not the split between partners. Mean 0.36, anchored on the gap in annual earnings between women and men (about 20 % in annual gross wages, part-time included - Institute for the Equality of Women and Men / Statbel wage-gap reports, from memory), which gives the lower earner a little under 40 % on average, with wide dispersion."
  values: {2024: [0.18, 0.30, 0.38, 0.45, 0.49]}

pit.company_car_benefit:
  description: Average taxable benefit in kind of a company car (voordeel van alle aard / avantage de toute nature)
  unit: EUR
  source: "ASSUMPTION for the average (taken slightly above the legal minimum). Legal minimum verified: 1,600 EUR for income 2024, 1,650 for 2025, 1,690 for 2026 (Wolters Kluwer tables; Partena infoflash 'Montants fiscaux 2025', secondary)"
  uprate: health_index
  wage_link: true
  values: {2024: 2000}

pit.company_car_share_by_decile:
  description: Share of private-sector employees with a company car, by wage decile (lowest to highest)
  unit: share
  source: "ASSUMPTION - order of magnitude: roughly 15 % of employees overall, concentrated in the upper half of the wage distribution (FPS Mobility / Federal Planning Bureau studies, from memory)"
  values: {2024: [0.0, 0.0, 0.01, 0.03, 0.06, 0.10, 0.16, 0.24, 0.36, 0.52]}

pit.pension_decile_profile:
  description: Gross pension of each tenth of pensioners relative to the average pension (used to tax pension spending progressively)
  unit: ratio
  source: "ASSUMPTION - stylised dispersion of pensions (low employee and self-employed pensions, high civil-servant pensions)"
  values: {2024: [0.35, 0.55, 0.68, 0.78, 0.88, 0.98, 1.08, 1.22, 1.45, 2.03]}

pit.benefit_decile_profile:
  description: Unemployment or invalidity benefit of each tenth of beneficiaries relative to the average benefit
  unit: ratio
  source: "ASSUMPTION - stylised dispersion (benefits are compressed between minimum and ceiling)"
  values: {2024: [0.60, 0.72, 0.82, 0.90, 0.96, 1.02, 1.08, 1.16, 1.27, 1.47]}

pit.tax_expenditure_pension_savings:
  description: Budget cost of the federal tax reduction for pension savings and long-term savings, at 2024 scale (grows with nominal GDP)
  unit: EUR mn
  source: "Federal inventory of tax expenditures 2024 (annex to the 2026 budget, Chamber DOC 56 1279/002, 28.01.2026, official): pension savings 619.60 + federal long-term savings 306.94 in 2024. Lever: set to 0 to abolish. (The ceilings are frozen for AY 2026-2030, not modelled.) Old from-memory value was 750."
  values: {2024: 927}

pit.tax_expenditure_service_vouchers:
  description: Budget cost of the regional tax reductions for service vouchers (dienstencheques / titres-services), by region, at 2024 scale (grows with nominal GDP). LEVER - set a region to 0 to abolish.
  unit: EUR mn
  source: "Federal inventory of tax expenditures 2024 (Chamber DOC 56 1279/002, official): 218.07 in 2024, of which Flanders 175.68; Flanders abolished the reduction from 2025 (inventory shows 0). ASSUMPTION for the split of the remaining 42.4 between Wallonia (30) and Brussels (12), by population. Brussels abolition in 2026 and the Walloon abolition announced for 2027 (yield 23 mn) are not entered (amounts by region not verified)."
  values:
    2024: {FLA: 176, WAL: 30, BRU: 12}
    2025: {FLA: 0, WAL: 30, BRU: 12}

pit.tax_expenditure_mortgage:
  description: Budget cost of the regional tax relief for owner-occupied housing loans (woonbonus, cheque habitat, bonus logement), by region, at 2024 scale (grows with nominal GDP). LEVER - set a region to 0 to abolish.
  unit: EUR mn
  source: "Federal inventory of tax expenditures 2024 (Chamber DOC 56 1279/002, official): regional housing bonuses 1,802.71 in 2024; regional split of 2023 (1,846.59: Flanders 1,065.56, Wallonia 722.01, Brussels 59.02) applied to the 2024 total. The schemes are closed to new loans (Flanders 2020, Brussels 2017, Wallonia 2025), so the true cost declines over time, which is not modelled (ASSUMPTION for the constant path)."
  values: {2024: {FLA: 1040, WAL: 705, BRU: 58}}


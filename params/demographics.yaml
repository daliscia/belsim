# Demographic assumptions and policy levers (module: belsim.demographics).
# Flows are per calendar year; the value dated t applies to the flows during year t, i.e. it
# changes the population from 1 January t+1 onwards.

demo.net_migration:
  description: >-
    Net international migration (immigration minus emigration, persons per year) when the
    immigration and emigration factors are 1. Emigration follows age-specific rates; immigration
    is set so that the balance equals this number.
  unit: persons/year
  source: >-
    2024-2025 observed (Eurostat demo_gind, CNMIGRAT = net migration plus statistical adjustment);
    2026-2030 Eurostat EUROPOP2023 baseline assumption for Belgium (proj_23ndbi, NMIGRAT);
    2031, 2050 and 2070 - Federal Planning Bureau and Statbel, population projection 2025-2080, as
    printed in Study Committee on Ageing, annual report July 2026, Tableau 2
    (https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf, fetched 2026-11-26):
    34 400, 36 900 and 35 600. ASSUMPTION - linear interpolation between those three years
    (EUROPOP2023 had 36 800 in 2031 falling to 28 900 in 2070; see data/base/demographics_europop_summary.csv)
  values:
    2024: 69343
    2025: 75702
    2026: 38197
    2027: 36784
    2028: 37028
    2029: 37330
    2030: 37156
    2031: 34400

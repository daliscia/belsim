  unit: ratio
  source: "ASSUMPTION - modelling choice"
  values:
    2024: 10.0

unemp.rcc_beneficiaries:
  description: Beneficiaries of unemployment with company supplement (RCC/SWT). FALLBACK only - used when the labour module does not provide labour["rcc_beneficiaries"] (lever there - labour.rcc_stock_factor).
  unit: persons
  source: "2024 - ONEM annual report 2024 vol. 2, table 2.4.III: 10 351 (annual average; Eurostat spr_pns_ben ERLM 10 350). 2025 - ONEM annual report 2025 vol. 2: 8 502. Later years - ASSUMPTION, run-off of the stock: Royal Decree of 5 September 2025 (Official Gazette 15 September 2025) closes the scheme to people dismissed after 30 June 2025 except the medical scheme (CCT 177/178 until 30 June 2029); same path as labour.rcc_stock_factor. Fetched 2026-11-25"
  values:

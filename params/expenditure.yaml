# Parameters of the expenditure / balance / debt module (belsim.fiscal.expenditure, belsim.fiscal.balance).
#
# Levels of every expenditure line are calibrated to the 2024 accounts (Eurostat gov_10a_exp / gov_10a_main,
# see data/base/expenditure_lines_2024.csv): line_t = model_t x (actual_2024 / model_2024). Parameters below
# therefore drive the DYNAMICS and the response to reforms; benefit amounts and shares marked ASSUMPTION are
# model units whose level error is absorbed by the calibration factor.
# "ASSUMPTION" = not downloaded from an official source (order of magnitude from memory of official
# publications, or a modelling choice).

# ============================== PENSIONS ==============================
pension.scheme_spending_share_2024:
  description: Split of 2024 old-age + survivors cash pensions (excl. GRAPA) between schemes. Used by the fetch script to split the COFOG total (re-run fetch_expenditure after changing).
  unit: share
  source: "SFP annual report 2024, key figures (https://www.sfpd.fgov.be/files/3438/jaarverslag2024-kerncijfers.pdf, fetched 2026-11-25): pensions paid in 2024 - employees 40 200 mn, self-employed 5 593 mn, civil servants 22 451 mn. Shares of the COFOG/ESSPROS total excl. GRAPA (69 049 mn); the difference with the SFP total (about 800 mn - local-authority schemes managed outside the SFP, annuities) is attributed to civil servants. data/base/expenditure_lines_2024.csv was re-carved with these shares on 2026-11-25"
  values:
    2024: {employees: 0.5822, self_employed: 0.0810, civil_servants: 0.3368}

pension.scheme_mix_2024:
  description: Share of pensioners by scheme in 2024, in pension-equivalents (scheme spending / average pension of single-scheme pensioners; people with a mixed career count in each scheme pro rata). Initial stock; then evolves with the job-type mix of workers aged 55-64
  unit: share
  source: "Derived - SFP annual report 2024, key figures (https://www.sfpd.fgov.be/files/3438/jaarverslag2024-kerncijfers.pdf, fetched 2026-11-25) spending by scheme divided by pension.avg_pension_2024: 1.998 mn / 0.381 mn / 0.541 mn pension-equivalents (2 626 846 pensioners in January 2024, of whom 34% with a mixed career - PensionStat / Federal Pensions Service data file 2025, sheet Gepensioneerden (https://www.pensionstat.be/nl/kerncijfers/wettelijk-pensioen/gepensioneerden, fetched 2026-11-25))"
  values:
    2024: {employees: 0.684, self_employed: 0.131, civil_servants: 0.185}

pension.new_pension_mix_2024:
  description: Share of each scheme in the pensions starting in 2024, in pension-equivalents (monthly amount of the new rights of the scheme / average new pension of the model). Starting mix of new retirees; it then follows the job-type mix of workers aged 55-64 with the lag pension.scheme_mix_lag_years
  unit: share
  source: "Derived - PensionStat / Federal Pensions Service data file 2025, sheet NieuweRechten_uitgave (https://www.pensionstat.be/nl/kerncijfers/wettelijk-pensioen/gepensioneerden, fetched 2026-11-26): rights starting in 2024, January monthly amount x 12, retirement + survivors - employees 2 434 mn (153 777 retirement pensions of 1 142 EUR a month on average), self-employed 330 mn (40 541 of 567 EUR), civil servants 895 mn (23 782 of 2 771 EUR); divided by pension.avg_pension_2024 x pension.new_to_stock_ratio. New civil-servant rights are 4.0% of the scheme's spending against 6.3% for employees - the scheme already shrinks relative to the others"
  values:
    2024: {employees: 0.731, self_employed: 0.128, civil_servants: 0.141}

pension.new_pension_mix_drift:
  description: Annual relative drift of each scheme's weight in the mix of new pensions (pension-equivalents), on top of the job-type mix of older workers. Self-employed - the scheme matures (more people retire with a self-employed career, and with more years in it)
  unit: rate/year
  source: "ASSUMPTION - self-employed +1.5% a year over 2025-2050, none afterwards. Observed - the number of new self-employed retirement rights rose from 32 644 (rights starting in 2019) to 40 541 (2024), +4.4% a year against +2.1% for employees (PensionStat / Federal Pensions Service data file 2025, sheet NieuweRechten_uitgave, fetched 2026-11-26). Size and end year set so that the scheme follows the Study Committee on Ageing 2026 (0.9% of GDP in 2025-2031, 1.2% in 2050, 1.4% in 2070 - maturing scheme)"
  values:
    2024: {employees: 0.0, self_employed: 0.0, civil_servants: 0.0}
    2025: {employees: 0.0, self_employed: 0.015, civil_servants: 0.0}
    2051: {employees: 0.0, self_employed: 0.0, civil_servants: 0.0}

pension.scheme_mix_lag_years:
  description: Mean lag (years) with which the scheme mix of new pensions follows the job-type mix of workers aged 55-64 (share of self-employed, share of statutory staff among public employees) - pension rights are earned over the whole career and many careers are mixed
  unit: years
  source: "ASSUMPTION - 15 years, about the middle of the second half of a career"
  values:
    2024: 15

pension.career_years_per_delay_year:
  description: Career years credited per year by which people start their pension later than under the 2024 retirement pattern (higher legal age, tighter early retirement, later exits). Each credited year adds 1/45 of a full career to new pensions, up to a full career. LEVER (0 = later retirement does not raise new pensions).
  unit: years per year
  source: "ASSUMPTION - 1 (years worked or assimilated - unemployment and invalidity before the pension count as career years). Mechanism named by the Study Committee on Ageing, annual report July 2026, section 3.3.a - the benefit ratio rises by about 3% to 2035 mainly because the higher legal age lengthens the average career and so the average pension"
  values:
    2024: 1.0

pension.career_income_factor:
  description: Share of career income that counts in the pension formula, by scheme, for people retiring in the year. Self-employed - the correction coefficient that scaled down their income was abolished for career years from 2021, so the factor rises with the share of post-2020 years in the career of new retirees until the whole 45-year career is at 1 (new pensions of the scheme mature for four decades). LEVER.
  unit: factor
  source: "Self-employed - law abolishing the correction coefficient for every career year from 2021, for pensions starting from 1 January 2022 (listed in Study Committee on Ageing, annual report July 2026, annex 3.b, https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf, fetched 2026-11-26). Path DERIVED - coefficient 0.69 for earlier years (ASSUMPTION for the exact value - single coefficient 0.691542 from memory of the INASTI rules) and 1 for the share (year - 2021) / 45 of the career. Observed maturation - the average new self-employed retirement pension rose from 369 EUR a month for rights starting in 2019 to 567 EUR in 2024 (+54%, employees +19%; PensionStat data file 2025, sheet NieuweRechten_uitgave, fetched 2026-11-26). Employees and civil servants - 1"
  values:
    2024: {employees: 1.0, self_employed: 0.7107, civil_servants: 1.0}
    2025: {employees: 1.0, self_employed: 0.7176, civil_servants: 1.0}
    2026: {employees: 1.0, self_employed: 0.7244, civil_servants: 1.0}

pension.bonus_malus:
  description: Average net adjustment of NEW pensions from a bonus (+) / malus (-) not expressed per year, as a fraction. LEVER. The legislated malus/bonus is in pension.bonus_malus_per_year
  unit: fraction
  source: "ASSUMPTION - 0 in the baseline"
  values:
    2024: 0.0

pension.bonus_malus_per_year:
  description: Pension bonus/malus per year of later/earlier retirement, as a fraction of the pension (e.g. 0.05 = 5% per year). LEVER - changes the retirement incentive seen by the behaviour module and, through pension.bonus_malus_exposure_years, the average new pension.
  unit: fraction per year
  source: "Law of 30 May 2026 on the pension reform (Belgian Official Gazette 1 June 2026; https://www.sfpd.fgov.be/nl/veranderingen/pensioenhervorming, fetched 2026-11-25); https://www.sfpd.fgov.be/nl/pensioenbedrag/berekening/pensioenmalus : for pensions starting from 2027 a permanent malus per year of anticipation before the legal age of 2% (born 1961-1965), 4% (born 1966-1974), 5% (born 1975 or later), and a bonus per year worked after the legal age of 2% (born up to 1962), 4% (1963-1972), 5% (1973 or later); no malus with 35 career years of at least 156 days and 7 020 days in total. Dated by the years in which those cohorts reach the early-retirement ages (approximation - birth cohorts mapped to retirement years). Fetched 2026-11-25. The 2024 pension bonus (law of 25 April 2024) stopped accruing on 31 December 2025 (law of 18 December 2025) and is not modelled"
  values:
    2024: 0.0
    2027: 0.02
    2031: 0.04
    2040: 0.05

pension.bonus_malus_exposure_years:
  description: Average number of years by which new retirees of a scheme are exposed to the bonus/malus per year (negative = early retirement dominates), averaged over all new retirees of the scheme (a scalar is accepted and applies to the three schemes)
  unit: years
  source: "DERIVED, partly ASSUMPTION - Federal Planning Bureau report 13299 of 13 April 2026, budgetary and social evaluation of the pension reform (https://www.plan.be/sites/default/files/documents/REP_PENSION_13299_NL.pdf, fetched 2026-11-26), table 1 (Federal Pensions Service data) - share of early retirees who do not meet the 35-year effective-work condition - employees 37% of women and 14% of men, civil servants 8% / 2%, self-employed 4% / 0%; share of retirements after the legal age that meet the condition of the bonus - employees 38% / 66%, self-employed 14% / 43%, civil servants 74% / 88%. ASSUMPTION - about half of new retirees leave before the legal age, on average 2.5 years early, and about one in twenty after it - employees 0.47 x 25% x 2.5 years = 0.29 year of malus less 0.03 year of bonus; civil servants 0.06 less 0.03; self-employed nil. The malus does not apply to people who met the conditions for early retirement before 1 January 2027 (same report, section 2.1.1), so a third of the exposure in 2027, two thirds in 2028. The postponement of retirement induced by the malus is carried by the behaviour module"
  values:
    2024: {employees: -0.25, self_employed: 0.0, civil_servants: -0.03}
    2027: {employees: -0.08, self_employed: 0.0, civil_servants: -0.01}
    2028: {employees: -0.17, self_employed: 0.0, civil_servants: -0.02}
    2029: {employees: -0.25, self_employed: 0.0, civil_servants: -0.03}

pension.postponement_pension_ratio:
  description: Pension of the people who postpone (or advance) retirement in response to a financial incentive (behavioural retirement response of a scenario), relative to the average new pension. The pension spending saved per person-year of postponement is this ratio x the average new pension. No effect in the baseline.
  unit: ratio
  source: "ASSUMPTION - 0.76, set with the behaviour module on Federal Planning Bureau report 13299 (https://www.plan.be/sites/default/files/documents/REP_PENSION_13299_NL.pdf, fetched 2026-11-26), table 2 - the bonus-malus lowers pension spending by 228 / 463 / 677 / 641 / 794 mn (2024 prices) in 2027-2031, about EUR 2.8 bn per year of average postponement, against 3.7 bn when the people postponing are valued at the average new pension of the model (about 125 000 a year); table 1 of the report - the malus bears on early retirees who do not meet the 35-year effective-work condition (37% of women and 14% of men in the employees scheme), whose careers and pensions are shorter than average"
  values:
    2024: 0.76

pension.capital_bonus:
  description: Pension bonus of the law of 25 April 2024, paid as a capital at retirement - average amount per NEW retiree (all new retirees, with or without a bonus), EUR of 2024, indexed with the health index by the model. The right was built up per day worked after the earliest possible retirement date, for at most three years (EUR 3 775, 7 550 and 11 325 for the first, second and third year, or 11 325 a year with a career of 43 years or more, index of July 2023). Accrual stopped on 31 December 2025 - the baseline pays out the rights built up between 1 July 2024 and that date. LEVER - 4 600 from 2029 (3 000 in 2027, 4 000 in 2028) restores the bonus as it would have matured.
  unit: EUR
  source: "Law of 25 April 2024 on the pension reform (amounts as in Study Committee on Ageing, annual report July 2024, table 16, https://www.plan.be/sites/default/files/documents/FOR_VERG2024_13023_NL.pdf, fetched 2026-11-26); accrual stopped by the law of 18 December 2025 (https://www.sfpd.fgov.be/nl/veranderingen/pensioenhervorming). Level at maturity DERIVED from the same report, section 3.3 and table 18 - the bonus raises pension spending by 0.1 point of GDP in 2040, mostly windfall for people who would have worked on anyway - 0.1% of GDP of 2024 (EUR 620 mn) over about 135 000 new retirees a year = EUR 4 600. ASSUMPTION - time profile - first payments in 2025 (at most one year of accrual), rights built up over at most 18 months paid out as their holders retire in 2026-2029. With these values the abolition lowers pension spending by about EUR 0.25 / 0.45 / 0.6 bn in 2027 / 2028 / 2029 at 2024 prices, the bulk of the EUR 0.23 / 0.46 / 0.68 bn of Planning Bureau report 13299, table 2 (abolition of this bonus, new bonus-malus and retirement behaviour together)"
  values:
    2024: 0.0
    2025: 600.0
    2026: 1700.0
    2027: 1000.0
    2028: 500.0
    2029: 200.0
    2030: 0.0

pension.welfare_adjustment:
  description: Annual real uprating of pensions in payment on top of health-index indexation (welfare envelope), by scheme - employees and self-employed (civil-servant pensions follow the perequation parameters; a scalar is accepted and applies to both schemes). LEVER.
  unit: rate/year
  source: "Study Committee on Ageing, annual report July 2026 (https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf, fetched 2026-11-25), Tableau 2: no welfare adjustment 2025-2029 (the welfare envelope of the Generation Pact law of 23 December 2005 is not allocated during the legislature), then under unchanged legislation 0.5% a year for non-flat-rate benefits and 1% a year for flat-rate benefits and minima. DERIVED weights - share of the scheme's spending going to people with a minimum pension in 2024, PensionStat / Federal Pensions Service data file 2025, sheet MinP_jaaruitgave (fetched 2026-11-26): employees 14 694 of 38 370 mn (38%), self-employed 4 990 of 5 588 mn (89%), hence 0.69% and 0.95% a year (2024 - 0.5% for both, as before). The successor mechanism announced by the government is not agreed. NOT modelled - envelope for vulnerable groups of 25/50/75/100 mn EUR in 2026-2029"
  values:
    2024: {employees: 0.005, self_employed: 0.005}
    2025: {employees: 0.0, self_employed: 0.0}
    2030: {employees: 0.0069, self_employed: 0.0095}

pension.perequation_share:
  description: Share of the real growth of public-sector wages passed on to civil-servant pensions in payment (perequation), before the cap pension.perequation_cap. LEVER (0 = no real uprating of civil-servant pensions).
  unit: share
  source: "Perequation every two years until 2024 (https://www.sfpd.fgov.be/nl/kenniscentrum/perequatie). Law of 25 April 2024 - cost capped from 2025 (see pension.perequation_cap); Law of 30 May 2026 on the pension reform (Belgian Official Gazette 1 June 2026; https://www.sfpd.fgov.be/nl/veranderingen/pensioenhervorming, fetched 2026-11-25) - perequation abolished from 1 July 2026 and to be folded into a new welfare envelope that is not yet agreed. Convention of the Study Committee on Ageing, annual report July 2026, section 1.3.1.c (https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf, fetched 2026-11-26), followed here - no perequation at all over 2025-2029, then a return to the mechanism in force before the government agreement (perequation capped at 0.6% per two years) for want of a defined successor. Until this revision the model had 0 for ever, which is the letter of the law but made civil-servant pensions fall about twice as much as in the Planning Bureau evaluation of the reform"
  values:
    2024: 1.0
    2025: 0.0
    2030: 1.0

pension.perequation_cap:
  description: Ceiling on the yearly real uprating of civil-servant pensions in payment through perequation (null = no ceiling). LEVER.
  unit: rate/year
  source: "Law of 25 April 2024 on the pension reform - from 2025 the two-yearly perequation is limited overall to 0.6% of the spending on retirement and survivors' pensions, i.e. 0.3% a year (Study Committee on Ageing, annual report July 2026, section 1.3.1.b, https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf, fetched 2026-11-26)"
  values:
    2024:
    2025: 0.003

pension.exit_rate:
  description: Annual exit rate of the stock of pensions by scheme, in pension-equivalents (deaths weighted by the pension lost; a scalar is accepted and applies to the three schemes). Used to derive the inflow of new retirees from the change of the stock
  unit: rate/year
  source: "Derived, partly ASSUMPTION - from the identity real growth of the scheme's spending = new rights - exits + real uprating, with PensionStat / Federal Pensions Service data file 2025 (sheets Jaaruitgave and NieuweRechten_uitgave, fetched 2026-11-26): spending 2019-2025 +33% (civil servants), +49% (employees), +47% (self-employed) for a health index up about 21%; new rights of a year about 3.8-4.0% of the scheme's spending for civil servants, 6.3-7.0% for employees and 5.4-5.9% for the self-employed. The real uprating of pensions in payment over the period (perequation, welfare adjustments, higher minimum pensions) is approximated, so the three rates are judgement values inside the ranges this gives (civil servants 2.7-3.5%, employees 4-4.5%, self-employed about 4.5%), chosen so that the public-sector and employees schemes follow the Study Committee on Ageing 2026 to 2050; their average weighted by pension.scheme_mix_2024 is the 4% used before (about the mortality of pensioners). Civil-servant pensions leave the stock more slowly - their holders live longer and the pensions of the oldest are not much lower than the average"
  values:
    2024: {employees: 0.0415, self_employed: 0.045, civil_servants: 0.034}

pension.career_wage_lag_years:
  description: Mean lag (years) with which new pensions follow real wages (career average for employees/self-employed, last ten years for civil servants)
  unit: years
  source: "ASSUMPTION - modelling choice"
  values:
    2024: {employees: 20, self_employed: 20, civil_servants: 5}

pension.past_real_wage_growth:
  description: Average annual real wage growth over the decades before 2024 (initialises the lagged career-wage index)
  unit: rate/year
  source: "ASSUMPTION - approx. 0.5%/yr"
  values:
    2024: 0.005

pension.level_factor:
  description: Multiplicative factor on pension spending by scheme (all pensions in payment). LEVER for across-the-board changes.
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {employees: 1.0, self_employed: 1.0, civil_servants: 1.0, grapa: 1.0}

pension.grapa_takeup:
  description: Beneficiaries of the income guarantee for the elderly (GRAPA/IGO) as a share of the population at or above the legal pension age (65 and over in 2024; the guarantee opens at the legal age, so the rise to 66 and 67 removes a cohort each time). LEVER.
  unit: share
  source: "2024 - Eurostat spr_pns_ben 2024 (116 051 means-tested old-age beneficiaries) / population 65+ (2.357 mn). Cross-check: 116 629 IGO/GRAPA beneficiaries in January 2024 in the PensionStat data file (https://www.pensionstat.be/nl/kerncijfers/wettelijk-pensioen/igo, fetched 2026-11-25). 2025-2031 - DERIVED from the Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau D.7, line 'Garantie de revenus aux personnes agees' (https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf, fetched 2026-11-26) - 1 015 mn in 2024, then 1 025 / 1 034 / 1 065 / 1 091 / 1 107 / 1 100 / 1 151 - divided by indexation and the population at or above the legal age (new cohorts have longer careers and fewer of them need the guarantee). ASSUMPTION - 2031 share held afterwards"
  values:
    2024: 0.049
    2025: 0.0487
    2026: 0.0483
    2027: 0.0473
    2028: 0.0466
    2029: 0.0455
    2030: 0.0444
    2031: 0.0458

pension.grapa_amount:
  description: Average annual GRAPA/IGO benefit per beneficiary. LEVER.
  unit: EUR/year
  uprate: health_index
  source: "Eurostat spr_exp_pens / spr_pns_ben 2024: 1 010.6 mn / 116 051. Legal amounts for reference - basic 1 012.67 and increased (single) 1 519.01 EUR/month until April 2024, 1 032.93 / 1 549.40 from 1 May 2024 (Combat Poverty Service table citing the SFP, https://armoedebestrijding.be/wp-content/uploads/2024/04/240430_minimumuitkeringen-zonder-.pdf ; PensionStat; fetched 2026-11-25)"
  values:
    2024: 8708

# ============================== UNEMPLOYMENT ==============================
unemp.replacement_rate:
  description: Average replacement rate of unemployment benefit over the spell (65% first 3 months, 60% then degressive). LEVER.
  unit: rate
  source: "ASSUMPTION for the average. Legal scale verified (ONEM https://www.onem.be/page/comment-est-calcule-le-montant-de-votre-allocation-apres-une-occupation- , fetched 2026-11-25): 65% months 1-3, 60% months 4-12, then 60% (head of household) / 55% (single) / 40% (cohabitant) of lower ceilings, degressive to a flat rate from month 49 at the latest. From 1 March 2026 (programme law of 18 July 2025): 65% months 1-3, 60% months 4-12, flat rate months 13-24. Average benefit actually paid to benefit-receiving job-seekers in 2024: 1 429 EUR/month (ONEM annual report 2025, vol. 2)"

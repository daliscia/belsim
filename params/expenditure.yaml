  values:
    2024: 37000

unemp.min_benefit:
  description: Minimum annual unemployment benefit (average over household types). LEVER.
  unit: EUR/year
  uprate: health_index
  source: "Derived - unweighted average of the daily minima from 1 May 2024 x 312, corrected to the 2024 average: head of household 66.89, single 54.21, cohabitant 52.18 (first periods) and 28.13 (flat rate) EUR/day (ONEM annual report 2024 vol. 2, table 3.1.I, https://www.onem.be/file/cc73d96153bbd5448a56f19d925d05b1379c7f21/4fc80cb39b3e4b9c61f6a640edc63cbbc31fb137/2024-vol2-fr.pdf ; fetched 2026-11-25). The weights of the household types are an ASSUMPTION"
  values:
    2024: 15600

unemp.generosity_factor:
  description: Multiplicative factor on unemployment benefits. LEVER.
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: 1.0

unemp.wage_position:
  description: Previous wage of the unemployed relative to the private-sector wage distribution
  unit: ratio
  source: "ASSUMPTION - modelling choice"
  values:
    2024: 0.8

unemp.coverage_rate:
  description: Share of the model's unemployed (labour-force-survey concept) who receive a benefit, relative to 2024. LEVER (stricter eligibility without a change of status; a measure sets the level, so compare with the baseline path). The time limit of 12 to 24 months legislated in 2025 is modelled by the labour module (labour.unemp_benefit_max_years), which moves the excluded out of the unemployed status - it is NOT repeated here; the baseline path below covers the unemployed who search without a benefit.
  unit: share (2024 = 1)
  source: "ASSUMPTION fitted on the Planning Bureau outlook of June 2026, Tableau 11 (https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf, fetched 2026-11-26) - unemployment spending (benefits, RCC, time credit) +2.5% in 2025, -20.5% in 2026, -8.6% in 2027, -1.7% in 2028, then about +1% a year in nominal terms, while the survey unemployment rate rises from 5.7% to 6.7% - more of the unemployed have no benefit (people after the time limit who keep searching, entrants). 0.93 in 2025 and 0.75 from 2026 reproduce that path and bring the line to 0.6-0.7% of GDP in 2030 (Study Committee on Ageing 2026 - 0.6%; 0.8% before this revision). The unemployed without a benefit claim social assistance at the rate assist.unemp_spillover"
  values:
    2024: 1.0
    2025: 0.93
    2026: 0.75

unemp.temporary_rate:
  description: Temporary-unemployment benefits as a share of the private wage bill (model unit)
  unit: share
  source: "ONEM annual report 2024: temporary unemployment 593.6 mn EUR in 2024 (126 985 units, 349 126 different workers; https://www.onem.be/file/cc73d96153bbd5448a56f19d925d05b1379c7f21/0a3b9c23877b75794d24393cd1f2440a054660eb/rajv-2024-ppt-fr.pdf , fetched 2026-11-25) / private wage bill of the model in 2024 (173 084 mn)"
  values:
    2024: 0.00343

unemp.temporary_gap_sensitivity:

exp.benefit_indexation_factor:
  description: Share of the yearly health-index increase passed on to social benefits in payment (1 = full indexation, 0 in one year = index jump). LEVER.
  unit: share
  source: "Legislation - automatic indexation (1). 2026 and 2028 - programme law voted 28-29 May 2026 (budget agreement of 24 November 2025): for the second index adjustment of 2026 (1 September 2026) and the first of 2028 the 2% applies only to the first 2 000 EUR gross per month of a social benefit (https://www.sfpd.fgov.be/nl/pensioenbedrag/berekening/indexering , fetched 2026-11-25). SIZE = ASSUMPTION - about 10% of the mass of social benefits lies above 2 000 EUR/month (mostly civil-servant pensions; derived from the PensionStat averages by scheme). NOT modelled - indexation of benefits delayed to the third month after the pivot index is exceeded (from 1 July 2025); capped indexation of pensions above about 5 200 EUR/month (1 July 2025 - end 2029)"
  values:
    2024: 1.0
    2026: 0.9
    2027: 1.0
    2028: 0.9
    2029: 1.0

exp.eu_contribution_pct_gni:
  description: VAT- and GNI-based contribution to the EU budget as % of GNI. LEVER.
  unit: "% of GNI"
  source: "2024 - Eurostat gov_10a_main D76PAY (4 406.6 mn) / gov_10dd_edpt1 GNI (630 007 mn). 2025 - 2024 value x growth of the national contribution in % of GNI in European Commission, EU budget spending and revenue 2000-2025 (VAT + GNI + rebates + plastics: 4 331 mn = 0.698% of GNI in 2024, 4 709 mn = 0.723% in 2025; https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/2021-2027/spending-and-revenue_en , fetched 2026-11-25). 2026-2031 - Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026), Tableau D.2 line 'Contribution RNB et TVA a l'UE' (https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf, fetched 2026-11-26) - 5 912 / 6 853 / 7 345 / 7 593 / 5 867 / 6 089 mn, divided by the GDP of the outlook x the 2024 ratio of GNI to GDP (DERIVED) - the contribution rises to the end of the 2021-2027 framework and its payment tail and falls back in 2030. ASSUMPTION - 2031 value held afterwards (the 2028-2034 framework is not decided)"
  values:
    2024: 0.69945
    2025: 0.725
    2026: 0.876
    2027: 0.98
    2028: 1.016
    2029: 1.018
    2030: 0.762
    2031: 0.769

exp.eu_funded_pct_gdp:
  description: Expenditure financed by EU transfers (excluded from the EU net-expenditure indicator), % of GDP
  unit: "% of GDP"
  source: "Eurostat gov_10a_main 2024: (D7REC_S212 + D9REC_S212) / GDP"
  values:
    2024: 0.25868

exp.cyclical_unemployment_semi_elasticity:
  description: Semi-elasticity of unemployment benefits to the output gap, used to remove cyclical unemployment spending from the net-expenditure indicator
  unit: ratio
  source: "ASSUMPTION - Okun coefficient ~0.4 over an unemployment rate of ~5.5%"
  values:
    2024: 7.0

exp.budget_semi_elasticity:
  description: Semi-elasticity of the budget balance to the output gap (structural balance = balance - elasticity x gap)
  unit: ratio
  source: "European Commission semi-elasticity for Belgium (~0.6)"
  values:
    2024: 0.6

# ============================== REGIONAL / COMMUNITY LEVERS ==============================
# Factors keyed by region {FLA, WAL, BRU} or by Community {flemish_community, french_community}
# on spending that is a competence of the Regions / Communities. A measure for one region is a
# Change with key="WAL" (or key="french_community"). Neutral values: exactly no effect.
educ.community_cost_factor:
  description: Multiplier on the public cost per pupil (all levels) by Community. The French Community figure covers Wallonia (incl. the German-speaking Community, not modelled separately) and the French-language schools of Brussels; the Flemish Community covers Flanders and the Dutch-language schools of Brussels (split regional.brussels_dutch_share). COMMUNITY LEVER - Change(..., key="french_community").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {flemish_community: 1.0, french_community: 1.0}

educ.community_enrolment_factor:
  description: Multiplier on enrolment rates (all levels) by Community; pupils and, at an unchanged pupil-teacher ratio, teaching staff move in proportion. COMMUNITY LEVER - Change(..., key="flemish_community").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {flemish_community: 1.0, french_community: 1.0}

family.childcare_factor:
  description: Multiplier on the Communities' spending on childcare and family services (Opgroeien / Kind en Gezin, ONE) by Community; applies to the regions-and-communities share of the line. COMMUNITY LEVER - Change(..., key="french_community").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {flemish_community: 1.0, french_community: 1.0}

health.ltc_regional_factor:
  description: Multiplier on regional long-term care spending (residential elderly care, home care, care budgets; regional competence since the sixth state reform) for the residents of each region. REGIONAL LEVER - Change(..., key="FLA").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {FLA: 1.0, WAL: 1.0, BRU: 1.0}

subsidy.service_voucher_factor:
  description: Multiplier on the regional subsidy per service voucher (titres-services / dienstencheques, regional since 2015) by region; multiplies subsidy.factor[service_vouchers]. Budget shares of the regions - regional.service_voucher_shares. REGIONAL LEVER - Change(..., key="BRU").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {FLA: 1.0, WAL: 1.0, BRU: 1.0}

subsidy.target_group_factor:
  description: Multiplier on the regional target-group reductions of employer contributions and other regional wage subsidies (the regions-and-communities share of the wage-subsidy line, spread over regions by private employees residing there); multiplies subsidy.factor[wage]. Budgetary effect only (no labour-demand response is modelled for this lever). REGIONAL LEVER - Change(..., key="WAL").
  unit: factor
  source: "Policy lever, neutral = 1"
  values:
    2024: {FLA: 1.0, WAL: 1.0, BRU: 1.0}

invest.regional_extra_pct_gdp:
  description: Additional public investment of the governments of a region, in % of the GDP of that region, on top of invest.public_pct_gdp (all levels, % of national GDP). REGIONAL LEVER - Change(..., key="FLA").
  unit: "% of regional GDP"
  source: "Policy lever, neutral = 0"
  values:
    2024: {FLA: 0.0, WAL: 0.0, BRU: 0.0}

# ============================== SPENDING PATHS BY ENTITY ==============================
# Level factors (1 = unchanged policy: the drivers of the lines) on the spending of one entity in
# one ESA category - see belsim/fiscal/expenditure/model.py. They replace the former allocation
# regional.entity_consolidation_pct_gdp: the savings of each entity now lower its spending lines.
entity.staff_cost_factor:
  description: Level factor on compensation of employees (D1) of one entity relative to unchanged policy (1 = the drivers of the expenditure lines), keyed by entity - federal, social_security, flemish_community, walloon_region (incl. the German-speaking Community), french_community, brussels_region (incl. the community commissions), local. Applies to the entity's share of every line (2024 accounts; federated entities - their weight in the regions-and-communities part of the line) x the share of this category in the line; not to interest, defence, the EU contribution and social benefits. The baseline carries the adopted budgets and multi-year plans as the official outlook has them - on top of the general path of public employment and pay (labour.public_employment_growth, labour.wage_drift, labour.public_wage_link), the selective replacement of leavers and linear savings of the federal government (1.8% a year on staff 2025-2029 gives 0.913 by 2029), the Brussels hiring freeze, the partial replacement in the Walloon administration. LEVER - one entity with Change(..., key="walloon_region").
  unit: factor
  source: "DERIVED 2025-2031 from the Federal Planning Bureau, Perspectives economiques 2026-2031 (June 2026; https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf, fetched 2026-11-26): factor = 1 + (official change since 2024 of the entity's spending in this category, % of GDP, minus the change the unchanged-policy lines give) / unchanged-policy amount. Official figures - Tableaux D.2 (federal), D.6 (social security), D.5 (local) and D.3 (communities and regions together) by ESA category; the four federated entities share the D.3 path of a category in proportion to the growth of the corresponding group in their own table (Tableaux 13 to 16, EUR bn with one decimal - operating costs, other current primary spending, investment, other capital spending). Federal and social security - one factor for staff, purchases, other current transfers and investment together (the growth of defence, on its own path, cannot be split by category). Compensation of employees 2024 -> 2031, EUR mn - federal 13 810 -> 16 743, social security 2 028 -> 2 331, communities and regions 36 888 -> 43 667, local 24 616 -> 29 559. ASSUMPTION - 2031 level held afterwards"

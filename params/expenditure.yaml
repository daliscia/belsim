  description: Share of the room between need-driven growth and the growth norm that is spent when need grows less than the norm (0 = the norm is a ceiling only and unused room is not spent, 1 = the norm is the growth of the budget and the budget is spent, so that a norm above need-driven growth raises spending). Acts with health.norm_enforcement. LEVER - a proposal of the kind "a growth norm of x%" is the pair health.growth_norm = x and this parameter = 1.
  unit: share
  source: "ASSUMPTION - 0 in the baseline: the norm is a ceiling. Evidence (fetched 2026-11-26): INAMI annual reports 2010-2013 - booked spending 2.5 to 7% below the budget objective under the 4.5% norm, the unused room being returned to the social-security balance (1,093 mn in 2011) rather than spent; Federal Planning Bureau, Article 23 of September 2025 (https://www.plan.be/sites/default/files/documents/ART_023_13210_FR_2.pdf): with generous norms spending was sometimes below the means provided, the norm never played a significant role in its projections; its April 2026 PROMES projection has 2.6% real growth a year, below the 3% norm of 2029. The Bureau's costing of the 2024 election programmes did treat the proposed norms as budgets: the party's norm applied to all benefits of the 2024 budget, against the PROMES growth of 3.3% (DC2024, fiches 401 of PS, Les Engages and Groen, 402 of Open Vld)"
  values:
    2024: 0.0

health.norm_enforcement:
  description: Degree to which the growth norm caps need-driven growth (1 = spending growth never exceeds the norm, 0 = norm ignored). LEVER.
  unit: share
  source: "ASSUMPTION - modelling choice (norm treated as binding ceiling)"
  values:
    2024: 1.0

health.indexation_lag_share:
  description: Share of a deviation of the health index from the baseline (a scenario that moves consumer prices, e.g. a VAT change) that reaches health-care spending only a year later - the health-insurance budget and its fees are set before the year starts. No effect in the baseline.
  unit: share
  source: "ASSUMPTION - 1 (fees and the budget objective of year t are indexed on the index known in year t-1; law on compulsory health insurance coordinated on 14 July 1994, art. 40). Order of magnitude checked by the behaviour module against the HERMES VAT variant (benefits +1.09% in the first year against +1.34% with full indexation within the year)"
  values:
    2024: 1.0

health.income_elasticity:
  description: Elasticity of age-adjusted real health spending per capita to real GDP per capita
  unit: elasticity
  source: "ASSUMPTION - 1.0, in line with EC Ageing Report reference scenario (1.1 converging to 1)"
  values:
    2024: 1.0

health.excess_cost_growth:
  description: Annual real growth of age-adjusted health spending per capita in excess of GDP per capita (technology, Baumol). LEVER.
  unit: rate/year
  source: "ASSUMPTION - 0.9% a year over 2025-2031: need-driven real growth of about 2.6% a year as in the Planning Bureau's PROMES projection (2.6% over 2026-2031, outlook of June 2026, section 4.4.1.2) and acute care rising by about 0.5 point of GDP over 2025-2031 as in the Study Committee on Ageing report. None over 2032-2040 and 0.1% a year afterwards, so that acute care rises by 0.3 point of GDP over 2031-2050 and 0.4 point over 2050-2070 as in the Committee's report of July 2026 (the Committee's long-run model has care use rising little faster than income once ageing is accounted for; 0.3% a year before this revision gave +1.1 and +1.0 point). The legal growth norm caps actual growth in the baseline. The Planning Bureau's baseline for the 2024 election programmes was higher (3.3%), so norm costings against it come out lower here. See data/reference/validation.yaml"
  values:
    2024: 0.003
    2025: 0.009
    2032: 0.0
    2041: 0.001


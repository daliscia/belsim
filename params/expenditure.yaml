pension.avg_pension_2024:
  description: Average gross annual pension per pensioner by scheme in 2024 (model unit; the level is calibrated on actual spending)
  unit: EUR/year
  source: "PensionStat / Federal Pensions Service data file 2025, sheet Gepensioneerden (https://www.pensionstat.be/nl/kerncijfers/wettelijk-pensioen/gepensioneerden, fetched 2026-11-25): average gross monthly legal pension in January 2024 of pensioners with a single-scheme career - employees 1 677, self-employed 1 222, civil servants 3 456 EUR (x 12; all pensioners 1 997)"
  values:
    2024: {employees: 20124, self_employed: 14664, civil_servants: 41472}

pension.new_to_stock_ratio:
  description: Average pension of new retirees relative to the average pension of the stock, 2024 (longer careers of recent cohorts)
  unit: ratio
  source: "ASSUMPTION - modelling choice"
  values:
    2024: {employees: 1.08, self_employed: 1.15, civil_servants: 1.0}

pension.replacement_rate:
  description: Pension accrual / replacement rate on the (capped) career-average wage for a full career. LEVER.
  unit: rate
  source: "Legislation - employees and self-employed 60% single rate (75% household rate ignored): Wikifin/FSMA https://www.wikifin.be/nl/pensioen-en-pensioenvoorbereiding/wettelijk-pensioen/berekening-betaling-en-impact-van-je-0 ; civil servants 1/60 per year of the reference wage, relative maximum 3/4: https://www.sfpd.fgov.be/nl/pensioenbedrag/berekening/maximumpensioen (fetched 2026-11-25)"
  values:
    2024: {employees: 0.60, self_employed: 0.60, civil_servants: 0.75}

pension.wage_ceiling:
  description: Annual wage ceiling for pension accrual (civil servants - wage equivalent of the absolute maximum pension). LEVER.
  unit: EUR/year
  uprate: health_index
  source: "Employees - SFP Loonplafond table, career year 2024: 80 485.32 EUR (https://www.sfpd.fgov.be/nl/pensioenbedrag/berekening/verschillende-soorten-pensioenen/werknemers/lonen/loonplafond). Self-employed - RSVZ/INASTI income ceiling 2024: 75 977.92 EUR (https://www.rsvz.be/nl/cijfers-bedragen-en-grenzen). Civil servants - derived: absolute maximum pension (46 882.74 EUR at pivot index 138.01, about 96 900 EUR on average in 2024; https://www.sfpd.fgov.be/nl/pensioenbedrag/berekening/maximumpensioen) divided by the 75% relative maximum. Fetched 2026-11-25. NOT modelled - the absolute maximum is frozen in nominal terms from 1 July 2025 to end 2029 (programme law of 18 July 2025)"
  values:
    2024: {employees: 80485, self_employed: 75978, civil_servants: 129200}

pension.career_fraction:
  description: Average career fraction (years credited / 45) of new retirees. LEVER (e.g. tighter assimilated periods).
  unit: fraction
  source: "ASSUMPTION - modelling choice (average careers ~37-38 years incl. assimilated periods)"
  values:
    2024: {employees: 0.82, self_employed: 0.75, civil_servants: 0.85}

pension.min_pension:
  description: Guaranteed minimum pension for a full career, single rate (applied pro rata of the career fraction). LEVER.
  unit: EUR/year
  uprate: health_index
  source: "Guaranteed minimum pension, full career, single rate, employees and self-employed: 1 738.55 EUR/month from 1 January 2024, 1 773.35 from 1 May 2024, 2024 average 1 761.75 x 12 (RSVZ https://www.rsvz.be/nl/cijfers-bedragen-en-grenzen ; FPS Social Security index sheet 1 January 2024; fetched 2026-11-25). Civil servants - ASSUMPTION, same amount (2024 civil-servant minimum not found on the SFP site)"
  values:
    2024: {employees: 21141, self_employed: 21141, civil_servants: 21141}

pension.min_pension_spending_share:
  description: Share of the pension spending of each scheme that is paid at or near the guaranteed minimum and follows a change of pension.min_pension in proportion (pensions in payment and new pensions alike). A rise of the minimum by 1% raises the spending of the scheme by this share x 1%. No effect while the minimum is the indexed 2024 amount.
  unit: share of scheme spending
  source: "ASSUMPTION - calibrated on official costings of rises of the minimum pension. Federal Planning Bureau, DC2024 costing of the 2024 election programmes (https://www.dc2024.be/uploaded/downloads/VB.pdf, measure 301): minimum pension of employees and self-employed +2.96% (EUR 1,738 to 1,790 a month) costs EUR 567 mn in 2025, i.e. EUR 192 mn per 1% on about EUR 43 bn of spending of the two schemes. Split between schemes as in the Court of Audit's comments on the 2021 budget (Chamber DOC 55 1577/002, section 3.2.2, https://www.lachambre.be/FLWB/PDF/55/1577/55K1577002.pdf): cost of the 2021-2024 rise (11% in real terms) EUR 1,278 mn for employees, 446 mn for the self-employed, 95 mn for civil servants (70 / 25 / 5%). Cross-check - the last phase of that rise (2024) cost about EUR 221 mn per 1% for the three schemes (Court of Audit, DOC 55 3272/002, p. 44-45); 997,562 pensioners (41%) received a minimum pension in January 2024 (Federal Pensions Service, annual report 2024). Fetched 2026-11-26"
  values:
    2024: {employees: 0.36, self_employed: 0.89, civil_servants: 0.05}

pension.new_pension_factor:
  description: Multiplicative factor on NEW pensions by scheme (relative to the 2024 rules) for rule changes that are not carried by another parameter - reference-wage period and accrual fractions of civil servants, cap on assimilated periods and limited fictitious wage for employees. LEVER.
  unit: factor
  source: "1 until 2026. Civil servants from 2027 - Law of 30 May 2026 on the pension reform (Belgian Official Gazette 1 June 2026; https://www.sfpd.fgov.be/nl/veranderingen/pensioenhervorming, fetched 2026-11-25): for pensions starting from 2027 the reference wage is lengthened by birth cohort from the last 10 years (born 1962) by one year per birth year to the whole career (45 years, born 1997 or later), and all preferential accrual fractions become 1/60 for service from 1 January 2027. SIZE = ASSUMPTION calibrated on Federal Planning Bureau report 13299 of 13 April 2026, budgetary and social evaluation of the pension reform (https://www.plan.be/sites/default/files/documents/REP_PENSION_13299_NL.pdf, fetched 2026-11-25): replacement rate of new civil-servant pensions -15.2% in 2070 versus no reform, public-sector pensions -0.7 point of GDP in 2070; linear path to 0.85 for the cohort retiring in 2062. Employees - the cap on assimilated periods (law published 31 July 2026, effective 1 July 2027) and the limited fictitious wage for certain assimilated periods (Royal Decree of 18 January 2026, pensions starting from 2027) lower the replacement rate of new employee pensions by 1.4% and 0.5% in 2040, 1.3% and 0.6% in 2050, 0.9% and 0.9% in 2070 (same report 13299, tables 7 and 10, read 2026-11-26) - linear path to 0.981 in 2040, constant afterwards. Self-employed - not quantified (small)"
  values:

# ============================== DEFENCE ==============================
defence.target_pct_gdp:
  description: Defence spending as recorded in the government accounts (COFOG GF02, ESA - military equipment counts when it is delivered, pensions of the military are in the pension lines) as % of GDP. LEVER.
  unit: "% of GDP"
  source: "2024 - Eurostat gov_10a_exp GF02 (7 946 mn / GDP; NATO definition 1.27%). Government decisions - 2% of GDP in the NATO definition from 2025 and 2.5% from 2034 (defence budget plan of 11 April 2025; Strategic Vision of 24 June 2025; Strategic Level Report of February 2026, https://news.belgium.be/fr/node/42876/pdf ; bill on military programming 2026-2034, Chamber doc 56 1143/001); NATO estimates 2.00% for 2025 and 2026 (https://www.nato.int/content/dam/nato/webready/documents/finance/def-exp-2026-en.pdf). Status - government decision, not law. PATH 2025-2029 = ASSUMPTION on the ESA recording - the NATO effort of 2025 was largely pre-financing of equipment, booked in the accounts at delivery and until then in the debt (stock-flow adjustment 2.4% of GDP in 2025, see debt.stock_flow_adjustment_pct_gdp): general-government expenditure in 2025 was 348.8 bn (Eurostat gov_10a_main), 4 bn less than with defence at 2% of GDP, and compensation of employees, purchases and investment of general government grew by 4-5%. The Planning Bureau outlook of June 2026 (Tableau 9, https://www.plan.be/sites/default/files/documents/FOR_MIDTERM_2631_13322_FR.pdf, fetched 2026-11-26) has federal investment at 0.7% of GDP in 2024-2025, 0.9% in 2026-2027, 1.0% in 2028 and 1.1% from 2029 'according to the delivery schedule of the Strategic Visions', and federal operating costs at 3.2 / 3.3 / 3.4% of GDP in 2024 / 2025 / 2026-2029 despite savings elsewhere. Until this revision the line jumped to 2.0% in 2025. The NATO pledge of June 2025 (3.5% core by 2035) is NOT included - no national path decided. Fetched 2026-11-25"
  values:
    2024: 1.28363
    2025: 1.40
    2026: 1.70
    2027: 1.75
    2028: 1.85
    2029: 2.0
    2034: 2.5


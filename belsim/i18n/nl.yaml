param:
  "health.norm_room_spent": "Aandeel van de ruimte tussen de behoeftegedreven groei en de groeinorm dat wordt uitgegeven wanneer de behoeften trager groeien dan de norm (0 = de norm is alleen een plafond en ongebruikte ruimte wordt niet uitgegeven, 1 = de norm is de groei van het budget en het budget wordt uitgegeven, zodat een norm boven de behoeftegedreven groei de uitgaven verhoogt). Werkt samen met health.norm_enforcement. HEFBOOM - een voorstel van het type 'een groeinorm van x%' is het paar health.growth_norm = x en deze parameter = 1."
  "pension.min_pension_spending_share": "Aandeel van de pensioenuitgaven van elk stelsel dat op of dicht bij het gewaarborgd minimum wordt uitbetaald en een wijziging van pension.min_pension evenredig volgt (zowel lopende als nieuwe pensioenen). Een verhoging van het minimum met 1% verhoogt de uitgaven van het stelsel met dit aandeel x 1%. Geen effect zolang het minimum het geïndexeerde bedrag van 2024 is."
  "beh.demand.household_transfer_esa_prefixes": "ESR 2010-codes van de uitgavenlijnen die uitkeringen in geld aan huishoudens zijn (sociale uitkeringen andere dan in natura); ze maken deel uit van het inkomen van de huishoudens in het vraagblok. Lijnen die als aankopen zijn ingedeeld (uitkeringen in natura) vallen er niet onder"
  "beh.demand.household_direct_tax_esa_prefixes": "ESR 2010-codes van de ontvangstenlijnen die directe belastingen en sociale bijdragen van huishoudens zijn (belastingen op inkomen en vermogen, sociale bijdragen van huishoudens, kapitaalbelastingen); ze worden in het vraagblok van het inkomen van de huishoudens afgetrokken. Lijnen die door ondernemingen worden betaald (beh.demand.firm_tax_keywords) vallen er niet onder; toegerekende werkgeversbijdragen worden niet door huishoudens betaald"
  "demo.emigration_rate_age_profile": "Leeftijdspatroon van de internationale emigratie ten opzichte van de leeftijdsspecifieke kansen waargenomen in 2023-2024: lijst van knooppunten [leeftijd, factor], lineair ertussen (1 = waargenomen kans). Onderdeel van het referentiepad: de immigratie is het migratiesaldo (demo.net_migration) plus de emigratie die deze kansen impliceren, zodat een hogere factor op bepaalde leeftijden oudere vertrekkers vervangt door (meestal jonge) nieuwkomers zonder het migratiesaldo te wijzigen."
  "dist.pensioner_institution_share": "Aandeel van de gepensioneerden die niet in een particulier huishouden wonen (woonzorgcentra, andere instellingen). De inkomensenquête en de set huishoudens dekken alleen particuliere huishoudens; de huishoudens van gepensioneerden worden dus geschaald op de gepensioneerden van het model verminderd met dit aandeel."
  "dist.pensioner_couple_second_average_share": "Aandeel van de gepensioneerde koppels met het gemiddelde pensioen waarbij beide partners een gemiddeld pensioen ontvangen (bij de andere is het tweede pensioen een minimumpensioen)."
  "dyn.marginal_job_entrant_origins": "Herkomsten van een verschil in werkgelegenheid met het basisscenario (sleutels van dyn.marginal_wage) waarvan de jobs over de loondecielen worden gespreid vanuit het profiel van de intreders (dyn.marginal_wage_decile_profile): mensen die werken door de beperking van de werkloosheidsuitkeringen in de tijd, een lagere structurele werkloosheidsgraad (activering) of een reactie van het arbeidsaanbod. De andere herkomsten vertrekken van een vlak profiel: uitgestelde pensionering (dicht bij het gemiddelde loon), de reactie op de loonkosten (die het gedrag verschuift naar de decielen waarvan de werkgeverskost is veranderd, adjust.labour_demand_decile_shift) en de conjunctuur."
  "pit.bracket_base_factor": "Alternatieve belastbare grondslag, standaard uitgeschakeld - vermenigvuldiger van het belastbaar inkomen dat in elke schijf van het barema van de personenbelasting valt (25 / 40 / 45 / 50%), in de populatie van fiscale eenheden achter de geaggregeerde personenbelasting. Alles op 1 = de verdeling van de aangiften van 2024. Zet op [1, 1, 0.88, 0.88] voor de kleinere grondslagen van de hoogste schijven die uit de doorrekeningen van 2024 van het Planbureau volgen (één factor voor de twee hoogste schijven, zodat het verschuiven van de grens ertussen op dezelfde voet wordt doorgerekend); de ontvangsten blijven ongewijzigd in het jaar van inschakeling (de belasting die de kleinere grondslag niet verklaart, wordt meegenomen als een bedrag dat met het bbp groeit en niet op het barema reageert), zodat een wijziging van tarieven of schijven op de kleinere grondslag wordt doorgerekend - vergelijk een maatregel tussen twee simulaties die beide deze wijziging bevatten. HEFBOOM (gevoeligheid)."
  "pit.tax_unit_type_follows_income": "Schakelaar (1 of 0) - het type fiscale eenheid van een belastingplichtige (alleen belast, partner in een tweeverdienerskoppel, enig inkomen van een koppel) volgt zijn of haar plaats in de inkomensverdeling, zoals in de belastingaangiften; 0 geeft elke inkomensklasse dezelfde mix. Eén keer gelezen, in het basisjaar - het bepaalt de populatie van fiscale eenheden achter de geaggregeerde personenbelasting, niet de wet."
  "ssc.special_joint_thresholds": "Bijzondere bijdrage voor de sociale zekerheid - inkomensgrenzen van de schaal voor huishoudens met een gemeenschappelijke aanslag (echtgenoten en wettelijk samenwonenden), toegepast op hun gezamenlijk belastbaar inkomen; de laatste grens is die waar het maximum wordt bereikt. Leeg vanaf de inkomsten van 2028 - de bijdrage is dan per persoon verschuldigd volgens de schaal van ssc.special_thresholds."
  "ssc.special_joint_rates": "Bijzondere bijdrage voor de sociale zekerheid - tarief in elke schijf van de schaal voor huishoudens met een gemeenschappelijke aanslag (ssc.special_joint_thresholds)"
  beh.enabled: Hoofdschakelaar voor gedragsreacties en vraagterugkoppeling (1 = aan, 0 = statische doorrekening)
  beh.scale: Globale vermenigvuldigingsfactor op elke gedragsreactie en begrotingsmultiplicator (0,5 laag / 1 centraal / 1,5 hoog)
  beh.lambda: "Snelheid van gedeeltelijke aanpassing per kanaal (arbeidsaanbod, intensieve marge, arbeidsvraag, samenstelling van de werkgelegenheid - labour_composition -, pensionering enz.) = deel van de langetermijnreactie dat in het eerste jaar wordt bereikt (daarna wordt de resterende kloof elk jaar met hetzelfde aandeel gedicht)"
  beh.clip: Grenzen op de langetermijndoelwaarden, zodat extreme maatregelen geen onzinnige uitkomsten geven. Factoren zijn begrensd in logaritmen (0.7 = factor tussen exp(-0.7)=0.50 en exp(0.7)=2.0); emp_rate is de logwijziging van de werkgelegenheidsgraad van een cel; emp_rate_delta_abs is de absolute bovengrens voor de additieve wijziging van de werkgelegenheidsgraad van een cel; retirement in jaren
  beh.marginal_step: Relatieve stap in het bruto-inkomen waarmee het effectieve marginale belastingtarief wordt gemeten (eindige differentie)
  beh.ext.elasticity_by_decile: Participatie-elasticiteit ten opzichte van de financiële winst uit werken (nettoloon min netto-inkomen zonder werk), per loondeciel (1 = laagste)
  beh.ext.sex_multiplier: Vermenigvuldigingsfactor op de participatie-elasticiteit naar geslacht
  beh.ext.age_bands: Leeftijdsgrenzen van de groepen jongeren / middenleeftijd / ouderen voor de arbeidsaanbodreacties [begin jongeren, begin middenleeftijd, begin ouderen, einde (exclusief)]
  beh.ext.age_multiplier: Vermenigvuldigingsfactor op de participatie-elasticiteit naar leeftijdsgroep
  beh.ext.decile_tilt: 'Positie van elke groep in de loonverdeling: het gewicht van deciel d is evenredig met exp(-tilt * z_d), met z_d van -1 (laagste deciel) tot +1 (hoogste). De hellingen voor geslacht en leeftijd worden opgeteld. Positief = geconcentreerd in de lage decielen'
  beh.ext.outside_option_weights: "Mix van situaties zonder werk die wordt gebruikt voor het inkomen zonder werk van een werkende: werkloosheidsuitkering, invaliditeitsuitkering, sociale bijstand (leefloon: forfaitair, onbelast), geen vervangingsinkomen (gewichten tellen op tot 1)"
  beh.ext.min_gain_share: Ondergrens voor de financiële winst uit werken, als aandeel van het nettoloon (vermijdt de logaritme van een niet-positieve winst bij uitkeringsvallen)
  beh.eti.employee_by_decile: "Elasticiteit van de effectieve arbeidsinput van werknemers (uren, inspanning) ten opzichte van het nettoaandeel na marginale belasting (1 - marginaal tarief), per loondeciel; toegepast als een effect op de arbeidsproductiviteit. Het nettorendement van een extra uur omvat het deel van een verlies aan nettoloon dat het loonoverleg in het brutoloon teruggeeft (dyn.wage_bargaining.compensation_employee_taxes), en de reactie wijzigt de output ten belope van het aandeel van de werknemers in de privésector in het arbeidsinkomen (de output van de overheid wordt tegen kostprijs gemeten)"
  beh.eti.self_employed_by_decile: Elasticiteit van het belastbaar inkomen van zelfstandigen ten opzichte van het nettoaandeel na marginale belasting (1 - marginaal tarief), per inkomensdeciel
  beh.ld.elasticity_by_decile: "Langetermijnelasticiteit van de private werkgelegenheid ten opzichte van de reële arbeidskost (werkgeverskost bij ongewijzigd brutoloon, en het loonpeil ten opzichte van prijzen en productiviteit), per loondeciel. De decielen worden gewogen met hun aandeel in de arbeidskost; de extra banen van een wijziging die op bepaalde decielen is geconcentreerd worden bepaald door beh.ld.composition_net_share"
  beh.ret.years_per_pct_replacement: Aantal jaren vroegere effectieve pensionering per 1% stijging van de nettovervangingsratio van het pensioen (nettopensioen / nettoloon); een pensioenverlaging met 10% stelt de pensionering uit met 10x deze waarde
  beh.ret.years_per_pp_accrual: Aantal jaren latere pensionering per procentpunt extra pensioen dat per bijkomend gewerkt jaar wordt opgebouwd (loopbaanopbouw plus bonus/malus), voor een kleine prikkel; de reactie vlakt af naarmate de prikkel groter wordt (beh.ret.accrual_max_years). Enkel gebruikt als de uitgavenmodule calc.pension_accrual_incentive(p) aanlevert
  beh.cons.elasticity: Eigen prijselasticiteit op lange termijn van het verbruikte volume, per categorie (omvat het reëel-inkomenseffect voor brede categorieën)
  beh.cons.cross_border: Bijkomende elasticiteit van het in België belaste volume als gevolg van grensoverschrijdende aankopen, tanktoerisme en illegale handel (opgeteld bij de eigen prijselasticiteit)
  beh.cons.pass_through: Aandeel van een wijziging van de indirecte belastingen dat in de consumptieprijzen wordt doorgerekend, per categorie
  beh.cit.base_semi_elasticity: 'Semi-elasticiteit van de belastbare grondslag van de vennootschapsbelasting ten opzichte van het effectieve VenB-tarief: logwijziging van de grondslag per wijziging van het tarief met 1,0 (dus +1 punt tarief = -1,2% grondslag)'
  beh.cit.productivity_semi_elasticity: Logwijziging op lange termijn van de arbeidsproductiviteit per wijziging van het effectieve VenB-tarief met 1,0 (effect via investeringen / kapitaalverdieping; +10 punten VenB = -1% productiviteit)
  beh.cap.net_of_tax_elasticity: Elasticiteit van de belastbare grondslag van de kapitaalinkomens van de huishoudens ten opzichte van het nettoaandeel na belasting (1 - belastingtarief op kapitaalinkomen)
  beh.prop.transactions_semi_elasticity: Logwijziging van de waarde van de vastgoedtransacties per wijziging van het tarief van de transactiebelasting (registratierechten) met 1,0; enkel gebruikt als de ontvangstenmodule calc.property_transaction_tax_rate(p) aanlevert
  beh.demand.enabled: Schakelaar voor de vraagterugkoppeling op korte termijn van de begrotingsimpuls (1 = aan)
  beh.demand.mult_purchases: Outputmultiplicator in het eerste jaar van de overheidsaankopen (lonen, goederen en diensten, investeringen, uitkeringen in natura)
  beh.demand.mult_transfers: "Outputmultiplicator van een wijziging van het reëel beschikbaar inkomen van de huishoudens zodra ze hun bestedingen hebben aangepast (marginale consumptiequote na aftrek van het invoerlek; het effect in het eerste jaar is deze waarde x beh.demand.income_first_year_share). Het inkomen van de huishoudens wordt opgebouwd uit de eigen stromen van het model (lonen van werknemers in de privésector, inkomen van zelfstandigen, kapitaalinkomen, uitkeringen in geld, min de belastingen en bijdragen die de huishoudens betalen), gedefleerd met de consumptieprijzen van het scenario ten opzichte van die van het basisscenario, en genomen na aftrek van de wijziging van het reële bbp aan de aanbodzijde. Dezelfde multiplicator geldt voor de nominale wijziging van de andere overdrachten (subsidies, kapitaaloverdrachten, overdrachten aan het buitenland)."
  beh.demand.mult_taxes_firms: "Outputmultiplicator van de belastingen en bijdragen die door ondernemingen worden betaald, per soort: de sleutel is een tekenreeks uit de ontvangstenlijn (naam, label of groep; lijnen die overeenkomen met beh.demand.firm_tax_keywords), de waarde de multiplicator (absolute waarde). Vennootschapsbelasting: klein, het grootste deel wordt door de winsten opgevangen. Werkgeversbijdragen: geen eigen multiplicator, omdat hun effecten één voor één worden gemodelleerd: jobs, onderhandelde lonen, consumptieprijzen en dividenden wijzigen het reële inkomen van de huishoudens (beh.demand.mult_transfers), de arbeidskosten wijzigen het concurrentievermogen (dyn.wage_cost.net_export_output_elasticity) en de arbeidsvraag."
  beh.demand.firm_tax_keywords: Tekenreeksen in kleine letters die ontvangstenlijnen (naam, label of groep) aanduiden die door ondernemingen worden betaald, voor de keuze van de multiplicator
  beh.demand.purchases_pay_share: "Aandeel van de lonen in de overheidsaankopen buiten de gezondheidszorg (beh.demand.lagged_price_lines), gebruikt om ze te defleren - het loonaandeel volgt de loonindex, de rest (goederen en diensten, andere uitkeringen in natura, investeringen) de gezondheidsindex. De prijswijziging van aankopen is geen vraag; het overheidsloon per hoofd maakt deel uit van het inkomen van de huishoudens in het vraagblok"
  beh.demand.purchases_output_elasticity: Aandeel van de overheidsaankopen dat bij ongewijzigd beleid het reële bbp volgt (werkingsuitgaven andere dan lonen, investeringen en defensie vastgelegd in % van het bbp, een deel van de gezondheidszorg). De aankopen die voortvloeien uit een aanbodgedreven wijziging van het reële bbp worden niet als een budgettaire impuls geteld, net als de ontvangsten die met beh.demand.budget_semi_elasticity worden verwijderd
  beh.demand.income_first_year_share: Aandeel van het vraageffect van een wijziging van het inkomen van de huishoudens (overdrachten, belastingen op huishoudens) dat in het eerste jaar wordt bereikt; de resterende kloof wordt elk jaar met hetzelfde aandeel gedicht
  beh.demand.mult_default: Gemiddelde multiplicator die wordt gebruikt wanneer de impuls niet per ontvangsten- of uitgavenlijn kan worden uitgesplitst (terugvaloptie op basis van het primair saldo)
  beh.demand.persistence: 'Aandeel van de vraagkloof van het vorige jaar dat blijft bestaan (0,95: een permanente impuls behoudt na 4 jaar 81% van het effect in het eerste jaar en dooft daarna uit naarmate de output terugkeert naar het door het aanbod bepaalde niveau)'
  beh.demand.budget_semi_elasticity: Semi-elasticiteit van het begrotingssaldo ten opzichte van de output, gebruikt om het endogene deel (aanbodreacties die het bbp wijzigen) uit de gemeten wijziging van het saldo te halen vóór de multiplicatoren worden toegepast
  beh.pubcap.output_per_capital: 'Wijziging van de output per eenheid wijziging van de publieke kapitaalvoorraad ten opzichte van het basisscenario (beide in punten van het bbp): verbruik van vaste activa van de overheid, dat deel uitmaakt van het gemeten bbp, plus de diensten van de publieke infrastructuur aan de private productie'
  beh.pubcap.depreciation_rate: Jaarlijkse afschrijving van de kloof in de publieke kapitaalvoorraad die door een wijziging van de overheidsinvesteringen is opgebouwd
  beh.pubcap.investment_esa_prefixes: Prefixen van ESA 2010-codes die uitgavenlijnen aanduiden die uitsluitend publieke kapitaalvorming zijn (hun verschil met het basisscenario bouwt de kloof in de publieke kapitaalvoorraad op)
  beh.demand.max_gap: Grens op de absolute vraagkloof
  beh.demand.purchase_keywords: Tekenreeksen in kleine letters die uitgavenlijnen (naam, label of groep) aanduiden die overheidsaankopen zijn en geen overdrachten in geld, voor de keuze van de multiplicator
  beh.demand.purchase_esa_prefixes: Prefixen van ESA 2010-codes die aankopen aanduiden (beloning van werknemers, intermediair verbruik, investeringen, sociale overdrachten in natura)
  beh.demand.interest_keywords: Tekenreeksen in kleine letters / ESA-codes die rentelijnen aanduiden (uitgesloten uit de primaire impuls)
  core.tax_threshold_wage_link: Aandeel van de reële loongroei dat wordt doorgerekend in de grensbedragen van de inkomstenbelasting en de sociale bijdragen, bovenop hun wettelijke prijsindexering. 0 = huidige wetgeving (de grensbedragen volgen enkel de prijzen, zodat de belastingdruk toeneemt naarmate de reële lonen stijgen); 1 = de grensbedragen volgen de lonen (constante gemiddelde aanslagvoet). HEFBOOM.
  demo.net_migration: Internationaal migratiesaldo (immigratie min emigratie, personen per jaar) wanneer de immigratie- en emigratiefactoren gelijk zijn aan 1. De emigratie volgt leeftijdsspecifieke kansen; de immigratie wordt zo bepaald dat het saldo gelijk is aan dit getal.
  demo.immigration_factor: Vermenigvuldigingsfactor op de bruto internationale immigratie die zich in elk gewest vestigt (1 = referentiepad; de gewestelijke aandelen in de immigratie zijn die welke in 2023-2024 zijn waargenomen). Een scalair is toegestaan en geldt dan voor de drie gewesten. GEWESTELIJKE HEFBOOM - Change(..., key="BRU").
  demo.emigration_factor: Vermenigvuldigingsfactor op de leeftijdsspecifieke internationale emigratiekansen van de inwoners van elk gewest (1 = waargenomen kansen 2023-2024). Een scalair is toegestaan en geldt dan voor de drie gewesten. GEWESTELIJKE HEFBOOM - Change(..., key="BRU").
  demo.internal_migration_factor: Vermenigvuldigingsfactor op de migratiekansen vanuit elk gewest naar de twee andere gewesten (1 = waargenomen stromen 2023-2024). Een scalair is toegestaan en geldt dan voor de drie gewesten. GEWESTELIJKE HEFBOOM - Change(..., key="BRU").
  demo.tfr_target: Nationaal totaal vruchtbaarheidscijfer dat in demo.tfr_target_year wordt bereikt. Het vruchtbaarheidspad is het EUROPOP2023-pad, lineair geschaald (vanaf 2024) naar deze doelwaarde; bij de basiswaarde wordt het EUROPOP-pad ongewijzigd gevolgd.
  demo.tfr_target_year: Jaar waarin demo.tfr_target wordt bereikt (daarna aangehouden, ten opzichte van het referentiepad)
  demo.tfr_convergence_year: Jaar tegen wanneer de kloof tussen de waargenomen vruchtbaarheid in 2024 (TVC 1,44) en het EUROPOP2023-pad (1,54 in 2024) lineair is gedicht.
  demo.fertility_factor: Gewestelijke vermenigvuldigingsfactor op de leeftijdsspecifieke vruchtbaarheidscijfers (na het nationale TVC-pad)
  demo.mortality_improvement: Vermenigvuldigingsfactor op het jaarlijkse veranderingstempo van de leeftijdsspecifieke sterftekansen dat in EUROPOP2023 wordt verondersteld (1 = verbetering volgens EUROPOP2023, 0 = bevroren sterftekansen, 2 = dubbel zo snel)
  demo.sex_ratio_at_birth: Aantal jongens per meisje bij de geboorte
  demo.infant_death_share_birth_year: Aandeel van de overlijdens op leeftijd 0 dat in het kalenderjaar van de geboorte plaatsvindt
  dist.min_wage_monthly: Gewaarborgd gemiddeld minimummaandinkomen (GGMMI / RMMMG) van een voltijdse werknemer van 18 jaar of ouder, gemiddelde 2024. HEFBOOM.
  dist.min_wage_months: Aantal maanden loon per jaar van de werknemer met het minimumloon (het gewaarborgd minimum omvat de eindejaarspremie al; het dubbel vakantiegeld komt erbovenop)
  dist.student_job_earnings: Jaarlijks brutoloon van de gestileerde jobstudent
  dist.student_solidarity_rate: Solidariteitsbijdrage op studentenjobs binnen het jaarlijkse urencontingent, in plaats van de gewone sociale bijdragen. HEFBOOM.
  dist.benefit_reference_wage: Loonniveau (min_wage, p25, median, p75, p90) dat wordt gebruikt als vroeger loon van de gestileerde huishoudens van werklozen en langdurig zieken en als de job die ze zouden kunnen aannemen (participatiebelastingvoet)
  dist.assist_category_ratio: Leefloon van een alleenstaande en van een persoon met gezinslast, ten opzichte van de gemiddelde uitkering per rechthebbende (assist.amount)
  dist.cohabitant_benefit_ratio: "Uitkering van een rechthebbende die samenwoont met een werkende partner, de tweede volwassene is van een koppel zonder werk of de derde volwassene is (bedrag voor samenwonenden), ten opzichte van de uitkering van de andere rechthebbenden, voor de werkloosheidsuitkeringen en voor de invaliditeitsuitkeringen. Het gemiddelde over alle rechthebbenden blijft de uitgave per rechthebbende in de begroting. HEFBOOM."
  dist.one_earner_partner_benefit_share: "Grootste aandeel van de niet-werkende partners van eenverdienerskoppels dat een werkloosheids- of invaliditeitsuitkering ontvangt (de anderen hebben geen eigen inkomen). De gerechtigden die niet passen in de huishoudens zonder werk worden eerst daar geplaatst, tot dit aandeel; de rest is de derde volwassene van een huishouden van drie volwassenen."
  dist.pension_household_rate_ratio: Minimumpensioen tegen het gezinsbedrag (één pensioen voor een koppel) ten opzichte van het bedrag voor een alleenstaande
  dist.wage_level_shares: Inkomensgroepen van de werknemers in de reeks huishoudens - aandeel van de werknemers in elke groep, van de onderkant van de loonverdeling van alle werknemers (privé- en overheidssector, deeltijdwerkers inbegrepen) tot de top (onderste 20 %, 20-37,5 %, 37,5-62,5 %, 62,5-85 %, 85-97 %, top 3 %). Het inkomen van een groep is het gemiddelde ervan in de populatie van fiscale eenheden achter de geaggregeerde personenbelasting.
  dist.self_employed_level_shares: Inkomensgroepen van de zelfstandigen in de reeks huishoudens - aandeel van de zelfstandigen in elke groep van hun inkomensverdeling (onderste 25 %, 25-75 %, 75-97 %, top 3 %)
  dist.pensioner_high_share: Aandeel van de huishoudens van gepensioneerden boven het minimumpensioen (andere dan ambtenaren) dat bovenaan de pensioenverdeling wordt geplaatst (hun pensioen is het gemiddelde van hetzelfde aandeel gepensioneerden bovenaan de verdeling van de fiscale eenheden)
  dist.pensioner_low_share: Aandeel van de huishoudens van gepensioneerden (andere dan ambtenaren) dat op het minimumpensioen wordt geplaatst, alleenstaande en koppel
  dist.consumption_propensity_wave: Enquêtegolf van de consumptiequote per inkomenskwintiel (data/base/distribution_propensity.csv, Eurostat icw_sr_10 - 1,25 / 1,12 / 0,91 / 0,81 / 0,63 van het beschikbaar inkomen in 2015) waarmee de consumptie van elk huishouden wordt afgeleid
  dist.consumption_propensity_scale: Vermenigvuldigingsfactor op de consumptiequote van elk kwintiel. HEFBOOM voor gevoeligheidsanalyse.
  dist.propensity_includes_imputed_rent: Geeft aan of de consumptiequote uit de enquête de toegerekende huur van eigenaars-bewoners als consumptie meetelt (1) of niet (0). Bij 1 wordt het aandeel van de toegerekende huur in de korf van het kwintiel (huishoudbudgetonderzoek) verwijderd om de consumptie in geld te verkrijgen.
  dist.equivalence_scale: "Equivalentieschaal voor de huishoudgrootte (gewijzigde OESO-schaal die Eurostat gebruikt - eerste volwassene 1, andere personen van 14 jaar en ouder 0,5, kinderen jonger dan 14 jaar 0,3). De kinderen van een huishouden van de set zijn gemiddelde kinderen - het aandeel van de min-18-jarigen van 14 tot 17 jaar in de bevolking van het jaar telt voor 0,5."
  dist.poverty_line_share: Armoederisicogrens als aandeel van het mediaan equivalent beschikbaar inkomen
  dist.marginal_step: Verhoging van het bruto-inkomen waarmee de marginale effectieve belastingtarieven worden gemeten
  dyn.marginal_productivity: 'Output per werkende, ten opzichte van het gemiddelde van het jobtype, van de jobs die een scenario toevoegt aan of wegneemt uit het basisscenario, naar oorsprong van de wijziging. unemp_exclusion = personen die werken als gevolg van de beperking in de tijd van de werkloosheidsuitkeringen; pension_age = wettelijke / vervroegde pensioenleeftijd, uitdoving van het SWT en de gedragsreactie inzake pensionering; structural_unemployment = wijziging van de gewestelijke structurele werkloosheidsgraden; labour_supply = gedragsreactie inzake participatie; labour_demand = reactie van de werkgelegenheid in de privésector op de arbeidskosten; cyclical = Okun-reactie op de outputgap (0 omdat het outputeffect van de gap al rechtstreeks op het bbp wordt toegepast: de jobs volgen de output, ze voegen er niets aan toe). Elke andere oorsprong (bevolking, personeelsaantal van de overheid, invaliditeit, scholing) telt als een gemiddelde werkende.'
  dyn.marginal_wage: Brutoloon (of inkomen als zelfstandige), ten opzichte van het gemiddelde van het jobtype, van de jobs die een scenario toevoegt aan of wegneemt uit het basisscenario, naar oorsprong (dezelfde sleutels als dyn.marginal_productivity). Bepaalt de loonmassa, het gemiddelde loon en de loondecielen die door de ontvangstenmodule worden belast.
  dyn.marginal_wage_decile_profile: "Waar mensen die vanuit niet-werk aan de slag gaan in de loonverdeling terechtkomen: relatief aantal intreders in elk van de tien loondecielen van hun jobtype (1 = laagste), vóór de kanteling die hun gemiddelde loon op het relatieve loon van hun herkomst brengt (dyn.marginal_wage). Gebruikt voor de herkomsten vermeld in dyn.marginal_job_entrant_origins; de jobs van de andere herkomsten vertrekken van een vlak profiel. De jobs die een scenario toevoegt aan of wegneemt uit elk deciel van de werknemers in de privésector worden gepubliceerd als labour.scenario_jobs_private_by_decile; loondecielen, gemiddeld loon en loonmassa volgen daaruit."
  dyn.wage_cost.labour_demand_weight: Gewicht van de kloof in de reële arbeidskosten per eenheid product (loonindex ten opzichte van de onderliggende prijzen en de gerechtvaardigde productiviteit, scenario ten opzichte van het basisscenario) in de reactie van de arbeidsvraag. De kloof wordt vermenigvuldigd met het gemiddelde van beh.ld.elasticity_by_decile en geleidelijk ingevoerd met beh.lambda.labour_demand. 1 = een wijziging van het loonniveau werkt zoals een even grote wijziging van de werkgeverskosten, beide gemeten ten opzichte van de prijzen; 0 schakelt het kanaal uit.
  dyn.wage_cost.net_export_output_elasticity: "Kortetermijneffect op de productie van een wijziging van de arbeidskost per eenheid product ten opzichte van het basisscenario (lonen en werkgeversbijdragen, afgezet tegen prijzen en productiviteit) via het concurrentievermogen (netto-uitvoer), na aftrek van het koopkrachtverlies van de gezinnen: output gap = - elasticiteit x logverschil. Het effect dooft uit volgens beh.demand.persistence; het blijvende effect komt van de arbeidsvraag. HEFBOOM en voornaamste modelonzekerheid bij loonkostmaatregelen: 0.05 is de lezing van het Federaal Planbureau (HERMES), 0.30 die van de Nationale Bank (stel deze waarde in om de variant 'Nationale Bank' te draaien: de indexsprong van 2015 verhoogt het bbp dan met 0,5% na vijf jaar en een verlaging van de werkgeversbijdragen met 0,22% van het bbp met 0,2% na vier jaar, zoals in de evaluaties van de Bank, maar de HERMES-varianten voor bijdragen worden dan drie- tot viermaal overschat)."
  dyn.indirect_tax_price_passthrough: Globale vermenigvuldigingsfactor op de doorrekening van wijzigingen van de indirecte belastingen (btw, accijnzen) in de consumptieprijsindex. De prijswijziging van een categorie is beh.cons.pass_through x de wijziging van (1 + belastingtarief); de categorieën worden gewogen met hun aandeel in de consumptie van de huishoudens in 2024. 0 = prijzen en indexering reageren niet (het gedrag van het model vóór dit kanaal bestond). Niet toegepast bij statische doorrekening (beh.enabled = 0).
  dyn.health_index_excluded_categories: Consumptiecategorieën die niet in de gezondheidsindex zitten (wijzigingen van hun belasting beïnvloeden de CPI maar niet de automatische indexering)
  dyn.public_employment.function_weights: 'Aandeel van de werkgelegenheid bij de gezamenlijke overheid per functie, gebruikt om pubwage.staffing_factor (één factor per functie) om te zetten in het personeelsaantal van de overheid: personeelsfactor = 1 + som van gewicht x (factor - 1). Het defensiepersoneel (4,6%) valt niet onder een personeelsfactor.'
  dyn.public_employment.education_level_weights: Aandeel van het onderwijspersoneel per niveau. Een wijziging van een participatiegraad (educ.enrolment) ten opzichte van het basisscenario wijzigt het onderwijspersoneel van dat niveau evenredig (ongewijzigde verhouding leerlingen/leerkracht); "other" reageert niet.
  dyn.public_employment.reabsorption_speed: Aandeel van de personen die ten opzichte van het basisscenario hun job verliezen door een inkrimping van de overheidswerkgelegenheid (of van de vacatures die een aanwervingsgolf bij de overheid in de privésector achterlaat) dat de privésector elk jaar opneemt; de overigen zijn intussen werkloos of inactief (labour.demand_shock_to_unemployment). 1 = onmiddellijke en volledige compensatie (het gedrag van het model vóór dit kanaal bestond).
  dyn.wage_cost.price_passthrough: Langetermijnwijziging van de consumptieprijzen, ten opzichte van het basisscenario, per 1% kloof in de arbeidskosten per eenheid product ten opzichte van het basisscenario (loonmatiging verlaagt de prijzen; een loonstijging door indexering verhoogt ze). De prijswijziging werkt via de automatische indexering door in de lonen. HEFBOOM (0 = de prijzen reageren niet op de loonkosten).
  dyn.wage_cost.price_adjustment_speed: Aandeel van de resterende kloof tussen de consumptieprijzen en hun doelwaarde op basis van de loonkosten dat elk jaar wordt gedicht. De doelwaarde omvat de loonwijzigingen van het jaar die vooraf bekend zijn (onderhandelde verschuiving, indexering van een prijsverschuiving door belastingen, overgeslagen indexering)
  dyn.wage_cost.deflator_ratio: Reactie van de prijs van de marktoutput (bbp-deflator vóór de herwaardering van de overheidsoutput tegen de loonkosten ervan) op de loonkosten, ten opzichte van die van de consumptieprijzen zodra die zich hebben aangepast. De binnenlandse outputprijzen bevatten meer binnenlandse arbeidskosten dan de consumptiekorf, die deels wordt ingevoerd, maar de uitvoerprijzen worden op de wereldmarkten bepaald. Met de overheidsoutput geherwaardeerd tegen kostprijs beweegt de bbp-deflator als geheel na een loonschok 1,1 tot 1,3 keer zo sterk als de consumptieprijzen; in het eerste jaar lopen de outputprijzen voorop (dyn.wage_cost.deflator_lead).
  pension.scheme_spending_share_2024: Verdeling van de pensioenen in geld voor ouderdom en nabestaanden in 2024 (excl. IGO) over de stelsels. Gebruikt door het fetch-script om het COFOG-totaal uit te splitsen (voer fetch_expenditure opnieuw uit na een wijziging).
  pension.scheme_mix_2024: Aandeel van de gepensioneerden per stelsel in 2024, in pensioenequivalenten (uitgaven van het stelsel / gemiddeld pensioen van gepensioneerden met één stelsel; personen met een gemengde loopbaan tellen pro rata mee in elk stelsel). Beginstand; evolueert daarna met de verdeling naar jobtype van de werkenden van 55-64 jaar
  pension.new_pension_mix_2024: Aandeel van elk stelsel in de pensioenen die in 2024 ingaan, in pensioenequivalenten (maandbedrag van de nieuwe rechten van het stelsel / gemiddeld nieuw pensioen van het model). Startverdeling van de nieuw gepensioneerden; ze volgt daarna de verdeling naar type job van de werkenden van 55-64 jaar met de vertraging pension.scheme_mix_lag_years
  pension.new_pension_mix_drift: Jaarlijkse relatieve drift van het gewicht van elk stelsel in de verdeling van de nieuwe pensioenen (pensioenequivalenten), bovenop de verdeling naar type job van de oudere werkenden. Zelfstandigen - het stelsel wordt matuur (meer mensen gaan met pensioen met een loopbaan als zelfstandige, en met meer jaren daarin)
  pension.scheme_mix_lag_years: Gemiddelde vertraging (in jaren) waarmee de verdeling van de nieuwe pensioenen over de stelsels de verdeling naar type job van de werkenden van 55-64 jaar volgt (aandeel zelfstandigen, aandeel statutair personeel bij de werknemers in de overheidssector) - pensioenrechten worden over de hele loopbaan opgebouwd en veel loopbanen zijn gemengd
  pension.career_years_per_delay_year: Loopbaanjaren die worden toegekend per jaar dat mensen hun pensioen later opnemen dan volgens het pensioneringspatroon van 2024 (hogere wettelijke leeftijd, strenger vervroegd pensioen, latere uittredes). Elk toegekend jaar voegt 1/45 van een volledige loopbaan toe aan de nieuwe pensioenen, tot een volledige loopbaan. HEFBOOM (0 = later met pensioen gaan verhoogt de nieuwe pensioenen niet).
  pension.career_income_factor: Aandeel van het loopbaaninkomen dat meetelt in de pensioenformule, per stelsel, voor wie in het jaar met pensioen gaat. Zelfstandigen - de correctiecoëfficiënt die hun inkomen verlaagde, is afgeschaft voor de loopbaanjaren vanaf 2021; de factor stijgt dus met het aandeel van de jaren na 2020 in de loopbaan van de nieuw gepensioneerden, tot de hele loopbaan van 45 jaar op 1 staat (de nieuwe pensioenen van het stelsel groeien vier decennia lang naar kruissnelheid). HEFBOOM.
  pension.avg_pension_2024: Gemiddeld brutojaarpensioen per gepensioneerde per stelsel in 2024 (modeleenheid; het niveau is gekalibreerd op de werkelijke uitgaven)
  pension.new_to_stock_ratio: Gemiddeld pensioen van de nieuw gepensioneerden ten opzichte van het gemiddelde pensioen van het bestand, 2024 (langere loopbanen van recente cohorten)
  pension.replacement_rate: Opbouw- / vervangingspercentage van het pensioen op het (begrensde) gemiddelde loopbaanloon voor een volledige loopbaan. HEFBOOM.
  pension.wage_ceiling: Jaarlijks loonplafond voor de pensioenopbouw (ambtenaren - loonequivalent van het absoluut maximumpensioen). HEFBOOM.
  pension.career_fraction: Gemiddelde loopbaanbreuk (aangerekende jaren / 45) van de nieuw gepensioneerden. HEFBOOM (bv. strengere regels voor gelijkgestelde perioden).
  pension.min_pension: Gewaarborgd minimumpensioen voor een volledige loopbaan, bedrag alleenstaande (toegepast pro rata van de loopbaanbreuk). HEFBOOM.
  pension.new_pension_factor: Vermenigvuldigingsfactor op de NIEUWE pensioenen per stelsel (ten opzichte van de regels van 2024) voor regelwijzigingen die niet door een andere parameter worden gedragen - referentieperiode voor het loon en loopbaanbreuken (tantièmes) van ambtenaren, begrenzing van de gelijkgestelde perioden en beperkt fictief loon voor werknemers. HEFBOOM.
  pension.bonus_malus: Gemiddelde nettoaanpassing van de NIEUWE pensioenen door een bonus (+) / malus (-) die niet per jaar is uitgedrukt, als fractie. HEFBOOM. De wettelijke malus/bonus staat in pension.bonus_malus_per_year
  pension.bonus_malus_per_year: Pensioenbonus/-malus per jaar latere/vroegere pensionering, als fractie van het pensioen (bv. 0.05 = 5% per jaar). HEFBOOM - wijzigt de pensioneringsprikkel die de gedragsmodule ziet en, via pension.bonus_malus_exposure_years, het gemiddelde nieuwe pensioen.
  pension.bonus_malus_exposure_years: Gemiddeld aantal jaren waarvoor de nieuw gepensioneerden van een stelsel aan de bonus/malus per jaar zijn blootgesteld (negatief = vervroegde pensionering overweegt), gemiddeld over alle nieuw gepensioneerden van het stelsel (een scalair is toegestaan en geldt dan voor de drie stelsels)
  pension.welfare_adjustment: Jaarlijkse reële verhoging van de lopende pensioenen bovenop de indexering aan de gezondheidsindex (welvaartsenveloppe), per stelsel - werknemers en zelfstandigen (de ambtenarenpensioenen volgen de perequatieparameters; een scalair is toegestaan en geldt dan voor beide stelsels). HEFBOOM.
  pension.perequation_share: Aandeel van de reële groei van de lonen in de overheidssector dat wordt doorgerekend in de lopende ambtenarenpensioenen (perequatie), vóór het plafond pension.perequation_cap. HEFBOOM (0 = geen reële verhoging van de ambtenarenpensioenen).
  pension.perequation_cap: Plafond op de jaarlijkse reële verhoging van de lopende ambtenarenpensioenen via de perequatie (null = geen plafond). HEFBOOM.
  pension.exit_rate: Jaarlijkse uitstroomkans uit het bestand van pensioenen per stelsel, in pensioenequivalenten (overlijdens gewogen met het verloren pensioen; een scalair is toegestaan en geldt dan voor de drie stelsels). Gebruikt om de instroom van nieuw gepensioneerden af te leiden uit de wijziging van het bestand
  pension.career_wage_lag_years: Gemiddelde vertraging (jaren) waarmee de nieuwe pensioenen de reële lonen volgen (loopbaangemiddelde voor werknemers/zelfstandigen, laatste tien jaar voor ambtenaren)
  pension.past_real_wage_growth: Gemiddelde jaarlijkse reële loongroei in de decennia vóór 2024 (initialiseert de vertraagde index van het loopbaanloon)
  pension.level_factor: Vermenigvuldigingsfactor op de pensioenuitgaven per stelsel (alle lopende pensioenen). HEFBOOM voor lineaire wijzigingen.
  pension.grapa_takeup: Rechthebbenden op de inkomensgarantie voor ouderen (IGO) als aandeel van de bevolking op of boven de wettelijke pensioenleeftijd (65 jaar en ouder in 2024; de garantie gaat in op de wettelijke leeftijd, zodat de verhoging naar 66 en naar 67 jaar telkens een cohorte wegneemt). HEFBOOM.
  pension.grapa_amount: Gemiddelde jaarlijkse IGO-uitkering per rechthebbende. HEFBOOM.
  unemp.replacement_rate: Gemiddeld vervangingspercentage van de werkloosheidsuitkering over de werkloosheidsperiode (65% de eerste 3 maanden, 60% daarna degressief). HEFBOOM.
  unemp.wage_ceiling: Jaarlijks loonplafond voor de werkloosheidsuitkering (gemiddelde over de werkloosheidsperiode). HEFBOOM.
  unemp.min_benefit: Jaarlijkse minimumwerkloosheidsuitkering (gemiddelde over de gezinstypes). HEFBOOM.
  unemp.generosity_factor: Vermenigvuldigingsfactor op de werkloosheidsuitkeringen. HEFBOOM.
  unemp.wage_position: Vroeger loon van de werklozen ten opzichte van de loonverdeling in de privésector
  unemp.coverage_rate: Aandeel van de werklozen in het model (concept van de enquête naar de arbeidskrachten) dat een uitkering ontvangt, ten opzichte van 2024. HEFBOOM (strengere toelaatbaarheid zonder wijziging van statuut; een maatregel legt het niveau vast, vergelijk dus met het pad van het basisscenario). De in 2025 goedgekeurde beperking in de tijd tot 12 à 24 maanden wordt gemodelleerd door de arbeidsmodule (labour.unemp_benefit_max_years), die de uitgeslotenen uit het statuut van werkloze haalt - ze wordt hier NIET herhaald; het pad van het basisscenario hieronder dekt de werklozen die zonder uitkering werk zoeken.
  unemp.temporary_rate: Uitkeringen voor tijdelijke werkloosheid als aandeel van de loonmassa in de privésector (modeleenheid)
  unemp.temporary_gap_sensitivity: Semi-elasticiteit van de tijdelijke werkloosheid ten opzichte van de vraagkloof (een kloof van -1% verhoogt ze met dit aantal %)
  unemp.rcc_beneficiaries: Rechthebbenden in het stelsel van werkloosheid met bedrijfstoeslag (SWT). Enkel TERUGVALWAARDE - gebruikt wanneer de arbeidsmodule labour["rcc_beneficiaries"] niet aanlevert (de hefboom staat daar - labour.rcc_stock_factor).
  unemp.rcc_avg_benefit: Gemiddelde jaarlijkse werkloosheidsuitkering in het SWT (overheidsdeel)
  disab.replacement_rate: Gemiddeld vervangingspercentage van de invaliditeitsuitkering (65% met gezinslast, 55% alleenstaande, 40% samenwonende). HEFBOOM.
  disab.wage_ceiling: Jaarlijks loonplafond voor de ziekte- / invaliditeitsuitkering. HEFBOOM.
  disab.min_benefit: Jaarlijkse minimuminvaliditeitsuitkering (regelmatige werknemer, bedrag alleenstaande). HEFBOOM.
  disab.generosity_factor: Vermenigvuldigingsfactor op de invaliditeitsuitkeringen. HEFBOOM.
  disab.wage_position: Vroeger loon van de invaliden ten opzichte van de loonverdeling in de privésector
  disab.sickness_factor: Vermenigvuldigingsfactor op de uitkeringen voor primaire arbeidsongeschiktheid, arbeidsongevallen en beroepsziekten (volgen de loonmassa). HEFBOOM (bv. verschuiving van het ziekengeld naar de werkgevers).
  disab.allowance_recipients_share: Rechthebbenden op inkomensafhankelijke tegemoetkomingen aan personen met een handicap (IVT/IT, gewestelijke zorgtoelagen) als aandeel van de bevolking van 18 jaar en ouder. HEFBOOM.
  disab.allowance_amount: Gemiddelde jaarlijkse tegemoetkoming aan personen met een handicap per rechthebbende. HEFBOOM.
  family.allowance_per_child: Gemiddelde jaarlijkse kinderbijslag per rechtgevend kind per gewest (basisbedrag + toeslagen; bevoegdheid van de deelstaten). HEFBOOM per gewest.
  family.student_share: Aandeel van de bevolking van 18-24 jaar dat nog recht geeft op kinderbijslag
  assist.takeup_rate: Rechthebbenden op sociale bijstand (leefloon en equivalent) als aandeel van de inactieve bevolking van 18-64 jaar. HEFBOOM.
  assist.amount: Gemiddelde jaarlijkse bijstandsuitkering per rechthebbende. HEFBOOM.
  assist.generosity_factor: Vermenigvuldigingsfactor op de bijstandsuitkeringen. HEFBOOM.
  assist.unemp_spillover: Aandeel van de personen die van werkloosheidsuitkeringen zijn uitgesloten en niet werken (labour["unemp_excluded_to_inactive"], of unemp.coverage_rate < 1) dat sociale bijstand aanvraagt. HEFBOOM.
  health.profile_ages: Ondergrenzen van de leeftijdsklassen van het kostenprofiel van de gezondheidszorg
  health.profile_cost: Relatieve publieke kosten van gezondheidszorg per hoofd voor mannen, per leeftijdsklasse (enkel de vorm; het niveau is gekalibreerd)
  health.profile_female_ratio: Kosten van gezondheidszorg per hoofd van vrouwen ten opzichte van mannen, per leeftijdsklasse
  health.growth_norm: Wettelijke reële groeinorm van de federale begroting voor gezondheidszorg (bovenop de indexering aan de gezondheidsindex). HEFBOOM.
  health.norm_enforcement: Mate waarin de groeinorm de door de behoeften gedreven groei begrenst (1 = de uitgavengroei overschrijdt de norm nooit, 0 = norm genegeerd). HEFBOOM.
  health.income_elasticity: Elasticiteit van de voor leeftijd gecorrigeerde reële gezondheidsuitgaven per hoofd ten opzichte van het reële bbp per hoofd
  health.excess_cost_growth: Jaarlijkse reële groei van de voor leeftijd gecorrigeerde gezondheidsuitgaven per hoofd bovenop die van het bbp per hoofd (technologie, Baumol). HEFBOOM.
  health.healthy_ageing_share: Aandeel van de sinds 2024 gewonnen jaren levensverwachting dat in goede gezondheid wordt doorgebracht, voor de acute zorg - het leeftijdsprofiel van de kosten van gezondheidszorg schuift met evenveel jaren op naar hogere leeftijden (0 = de kosten op een gegeven leeftijd veranderen nooit, 1 = alle gewonnen jaren zijn gezonde jaren). HEFBOOM.
  health.ltc_healthy_ageing_share: Idem voor de langdurige zorg - aandeel van de sinds 2024 gewonnen jaren levensverwachting dat zonder zorgbehoefte wordt doorgebracht (het leeftijdsprofiel van de zorgbehoefte schuift met evenveel jaren op naar hogere leeftijden). HEFBOOM.
  health.copayment_share: Aandeel van de gedekte kosten van gezondheidszorg dat de patiënten betalen (remgeld). HEFBOOM (de overheidsuitgaven schalen met 1 - aandeel).
  health.ltc_from_health_2024: Langdurige zorg die in 2024 onder gezondheid (COFOG 07) is geboekt en naar de lijn langdurige zorg is verplaatst, per betalende entiteit - residentiële ouderenzorg die sinds de zesde staatshervorming door de Gemeenschappen en Gewesten wordt betaald (rusthuizen, rust- en verzorgingstehuizen, psychiatrische verzorgingstehuizen) en thuisverpleging die door de federale ziekteverzekering wordt terugbetaald. Met de uitkeringen in natura voor personen met een handicap en ouderen van COFOG 10.1-10.2 (5 026 mln.) bedraagt de lijn 11 728 mln., 1,89 % van het bbp - de perimeter van de Studiecommissie voor de Vergrijzing (1,9 % van het bbp in 2025, waarvan 1,5 % betaald door de Gemeenschappen en Gewesten en 0,4 % door het federale niveau en de sociale zekerheid). Gebruikt door het fetch-script (voer fetch_expenditure opnieuw uit na een wijziging).
  health.ltc_profile_ages: Ondergrenzen van de leeftijdsklassen van het kostenprofiel van de langdurige zorg
  health.ltc_profile_cost: Relatieve kosten van langdurige zorg per hoofd, per leeftijdsklasse (jonger dan 65 - zorg voor personen met een handicap en psychiatrische verzorgingstehuizen)
  health.ltc_real_cost_growth: Jaarlijkse reële groei van de kosten van langdurige zorg per zorgbehoevende bovenop de loon-/prijsindex ervan. HEFBOOM.
  health.ltc_wage_share: Gewicht van de loonindex (tegenover de CPI) in de prijsindex van de langdurige zorg
  educ.enrolment: Participatiegraad per niveau (primary = 3-11 jaar, secondary = 12-17 jaar, tertiary = 18-24 jaar). HEFBOOM.
  educ.cost_per_pupil: Overheidskosten per leerling per niveau, prijzen van 2024 (other = per inwoner van 3-24 jaar). Evolueert in het model met de overheidslonen en de prijzen. HEFBOOM.
  educ.real_cost_growth: Jaarlijkse reële groei van de kosten per leerling bovenop lonen/prijzen (klasgrootte, omkaderingsnormen). HEFBOOM.
  pubwage.staffing_factor: Vermenigvuldigingsfactor op de loonmassa (personeelsaantallen) per functie. HEFBOOM. Wordt toegepast bovenop de loonmassa van de overheid uit de arbeidsmodule; education = factor op de kosten per leerling.
  pubwage.employer_contribution_rate: Sociale werkgeversbijdragen (werkelijke + toegerekende, incl. pensioenlasten) per euro overheidsloon. HEFBOOM.
  exp.function_factor: Vermenigvuldigingsfactor op de totale werkingsuitgaven per functie (lonen, aankopen, lopende overdrachten). HEFBOOM voor lineaire besparingen of verhogingen.
  exp.intermediate_gdp_elasticity: Elasticiteit van het volume van het intermediair verbruik (aankopen van goederen en diensten) ten opzichte van het reële bbp
  exp.intermediate_volume_growth_extra: Bijkomende jaarlijkse volumegroei van het intermediair verbruik (groeinorm; negatief = efficiëntiewinsten). HEFBOOM.
  exp.other_gdp_elasticity: Elasticiteit ten opzichte van het nominale bbp van de overige lopende overdrachten en van de uitgaven zonder eigen determinant binnen de functionele lijnen
  defence.target_pct_gdp: Defensie-uitgaven zoals geboekt in de overheidsrekeningen (COFOG GF02, ESA - militair materieel telt mee bij de levering, de pensioenen van de militairen staan in de pensioenlijnen) in % van het bbp. HEFBOOM.
  invest.public_pct_gdp: Overheidsinvesteringen exclusief defensie (bruto-investeringen, alle niveaus) in % van het bbp. HEFBOOM.
  invest.capital_transfers_pct_gdp: Investeringsbijdragen en overige kapitaaloverdrachten (excl. defensie) in % van het bbp. HEFBOOM.
  subsidy.service_vouchers_2024: Overheidskosten van de dienstencheques in 2024 (door het fetch-script afgezonderd uit de subsidies van COFOG GF0401; voer fetch_expenditure opnieuw uit na een wijziging)
  subsidy.factor: Vermenigvuldigingsfactor op de subsidies per type (wage = doelgroepverminderingen en vrijstellingen van doorstorting van bedrijfsvoorheffing die als subsidies worden geboekt). HEFBOOM.
  subsidy.gdp_elasticity: Elasticiteit van de vervoers-, energie-/milieu- en overige subsidies ten opzichte van het nominale bbp
  debt.avg_maturity_years: Gemiddelde looptijd van de langetermijnschuld - elk jaar wordt 1/looptijd ervan geherfinancierd tegen de 10-jaarsrente van dat moment
  debt.short_term_share: Aandeel van de schuld met een korte looptijd (elk jaar herprijsd tegen de kortetermijnrente)
  debt.stock_flow_adjustment_pct_gdp: Stock-flowaanpassing die elk jaar aan de schuld wordt toegevoegd (financiële transacties, prefinanciering, privatiseringen < 0), % van het bbp. HEFBOOM.
  transfer.default_revenue_split: Terugvaltoewijzing van een ontvangstenlijn aan de entiteiten wanneer de ontvangstenmodule geen entity_shares geeft
  transfer.ss_altfin_vat_share: Aandeel van de overdracht federaal -> sociale zekerheid in 2024 dat alternatieve financiering uit de btw is (groeit met de btw-ontvangsten)
  transfer.ss_altfin_pit_share: Aandeel van de overdracht federaal -> sociale zekerheid in 2024 dat alternatieve financiering uit de voorheffingen is (groeit met de PB-ontvangsten)
  transfer.ss_grant_real_growth: Jaarlijkse reële groei (boven de gezondheidsindex) van de overige rijkstoelagen aan de sociale zekerheid. HEFBOOM.
  transfer.ss_balancing_share: Aandeel van elke wijziging van het saldo van de sociale zekerheid (ten opzichte van het niveau van 2024 in % van het bbp) dat door de federale evenwichtsdotatie wordt gedekt. HEFBOOM (0 = de sociale zekerheid behoudt haar eigen tekort).
  transfer.sfa_real_growth_link: Aandeel van de reële bbp-groei dat wordt doorgerekend in de federale dotaties aan de gemeenschappen en gewesten krachtens de bijzondere financieringswet (de dotaties worden volledig aan de CPI geïndexeerd). HEFBOOM.
  transfer.sfa_demography_weight: Gewicht van de groei van de bevolking jonger dan 18 jaar in de federale dotaties aan de gemeenschappen (verdeelsleutel van de btw-dotatie)
  transfer.fed_local_assistance_reimbursement: Aandeel van de lokale bijstandsuitkeringen dat de federale overheid terugbetaalt. HEFBOOM.
  transfer.gdp_elasticity: Elasticiteit ten opzichte van het nominale bbp van de overige overdrachten tussen entiteiten (gemeentefondsen, sociale zekerheid -> gewesten, ...)
  transfer.adjustment: Discretionaire wijziging van een overdracht tussen entiteiten (mln. EUR van het jaar, positief = de eerste entiteit betaalt meer). HEFBOOM.
  exp.welfare_adjustment: Jaarlijkse reële verhoging van de plafonds en minima van de vervangingsinkomens en van de bijstandsuitkeringen (welvaartsenveloppe). HEFBOOM.
  exp.benefit_indexation_factor: Aandeel van de jaarlijkse stijging van de gezondheidsindex dat wordt doorgerekend in de lopende sociale uitkeringen (1 = volledige indexering, 0 in één jaar = indexsprong). HEFBOOM.
  exp.eu_contribution_pct_gni: Bijdrage aan de EU-begroting op basis van btw en bni, in % van het bni. HEFBOOM.
  exp.eu_funded_pct_gdp: Uitgaven gefinancierd met EU-overdrachten (uitgesloten uit de Europese netto-uitgavenindicator), % van het bbp
  exp.cyclical_unemployment_semi_elasticity: Semi-elasticiteit van de werkloosheidsuitkeringen ten opzichte van de outputgap, gebruikt om de conjuncturele werkloosheidsuitgaven uit de netto-uitgavenindicator te halen
  exp.budget_semi_elasticity: Semi-elasticiteit van het begrotingssaldo ten opzichte van de outputgap (structureel saldo = saldo - elasticiteit x gap)
  labour.legal_pension_age: Wettelijke pensioenleeftijd. Het profiel van statuten naar leeftijd op en boven de kalibratieleeftijd (65) wordt verschoven met de wijziging x labour.pension_age_passthrough.
  labour.pension_age_first_year_share: Aandeel van een wijziging van de wettelijke pensioenleeftijd dat in het eerste jaar effectief is, in jaargemiddelden (de nieuwe leeftijd geldt voor wie de oude leeftijd bereikt vanaf 1 februari, zodat het aantal personen dat langer moet wachten in de loop van het jaar oploopt)
  labour.pension_age_passthrough: Aantal jaren verschuiving van het statutenprofiel op leeftijden >= 65 per jaar verhoging van de wettelijke pensioenleeftijd (1 = als de leeftijd met één jaar stijgt, gedragen 65-jarigen zich zoals 64-jarigen voordien, wat werk betreft)
  labour.pension_age_benefit_passthrough: Aantal jaren verschuiving van het aandeel personen dat een pensioen ontvangt op de leeftijden tussen 65 en de wettelijke leeftijd, per jaar verhoging van de wettelijke pensioenleeftijd - eerste en tweede jaar verhoging (een scalair geldt voor elk jaar). Hoger dan labour.pension_age_passthrough - wie niet langer werkt en nog niet met pensioen mag, wacht in de werkloosheid, in invaliditeit of zonder uitkering (zelfde verdeling als de personen die één jaar jonger zijn). Een leeftijd wordt alleen vertraagd met de jaren waarmee de wettelijke leeftijd haar voorbij is geschoven - de stap van 66 naar 67 verandert niets voor de 65-jarigen.
  labour.early_retirement_age: Minimumleeftijd voor vervroegd pensioen met de gewone loopbaanvoorwaarde
  labour.early_retirement_career_years: Aantal loopbaanjaren vereist voor vervroegd pensioen op de minimumleeftijd (benadering van de loopbaanvoorwaarde)
  labour.early_retirement_passthrough: Aantal jaren verschuiving van het statutenprofiel op 63-64 jaar (aflopend tot nul op 58 jaar) per jaar verhoging van de leeftijd voor vervroegd pensioen
  labour.early_retirement_career_effect: Aantal jaren verschuiving van het statutenprofiel op 63-64 jaar per bijkomend loopbaanjaar dat voor vervroegd pensioen vereist is
  labour.exit_age_trend_per_year: Jaarlijkse stijging van de effectieve uittredeleeftijd op 63-64 jaar (aflopend tot nul op 58 jaar) door het op kruissnelheid komen van vroegere hervormingen en door cohorteffecten - door de latere intrede op de arbeidsmarkt wordt de loopbaanvoorwaarde van 42 jaar bindend voor jongere cohorten, en elke cohorte vrouwen heeft langere loopbanen. De jaarwaarden cumuleren (een wijziging vanaf jaar t laat het vóór t bereikte niveau ongemoeid).
  labour.exit_age_trend_end_year: Laatste jaar waarin labour.exit_age_trend_per_year nog cumuleert
  labour.exit_age_trend_pension_share: Aandeel van de trend van de uittredeleeftijd (labour.exit_age_trend_per_year) dat ook de ingang van het pensioen uitstelt; de rest is werkgelegenheid die wordt gewonnen op werkloosheid, invaliditeit en inactiviteit vóór het pensioen
  labour.exit_age_trend_late_share: Aandeel van de gecumuleerde trend van de uittredeleeftijd dat ook geldt tussen 65 jaar en de wettelijke pensioenleeftijd (die leeftijden vormen een venster voor vervroegd pensioen zodra de wettelijke leeftijd 66 of 67 jaar is)
  labour.rcc_beneficiaries_2024: Rechthebbenden in het stelsel van werkloosheid met bedrijfstoeslag (SWT) in 2024, geteld als gepensioneerd op 60-64 jaar
  labour.rcc_stock_factor: SWT-bestand ten opzichte van 2024 (0 = stelsel uitgedoofd); wie uitstroomt, gaat naar werk of werkloosheid
  labour.rcc_exit_to_employment: Aandeel van de personen die niet langer in het SWT instromen dat in de privésector aan het werk blijft (de rest wordt werkloos)
  labour.nairu: Structurele werkloosheidsgraad (IAB, aandeel van de beroepsbevolking) per gewest waarnaar de werkloosheid convergeert. GEWESTELIJKE HEFBOOM - één gewest met Change(..., key="WAL").
  labour.nairu_cyclical_factor: Tijdelijke vermenigvuldiger op de structurele werkloosheidsgraad van alle gewesten, gebruikt om de officiële vooruitzichten op korte termijn te volgen. Gescheiden van labour.nairu, zodat een maatregel die de structurele graad van een gewest vastlegt niet wordt verward met de conjunctuur op korte termijn.
  labour.nairu_convergence_speed: Aandeel van de kloof tussen de gewestelijke werkloosheid en haar structurele niveau dat elk jaar wordt gedicht
  labour.unemp_benefit_max_years: Maximale duur van de werkloosheidsuitkeringen in jaren (0 = onbeperkt)
  labour.unemp_time_limit_enforcement: Aandeel van de uitkeringsgerechtigden boven de tijdslimiet dat daadwerkelijk wordt uitgesloten (gefaseerde invoering in golven)
  labour.unemp_time_limit_max_age: Leeftijd vanaf wanneer werklozen van de beperking in de tijd zijn vrijgesteld
  labour.unemp_duration_survival: Aandeel van de uitkeringsgerechtigden van wie de werkloosheidsperiode langer duurt dan x jaar - lijst van [jaren, aandeel]
  labour.unemp_exclusion_to_employment: Aandeel van de door de beperking in de tijd uitgesloten personen dat werk vindt (werknemers in de privésector)
  labour.unemp_exclusion_to_disability: Aandeel van de door de beperking in de tijd uitgesloten personen dat naar ziekte / invaliditeit doorstroomt
  labour.okun_coefficient: Procentuele reactie van het aantal werknemers in de privésector op een vraagkloof van 1%
  labour.demand_shock_to_unemployment: Aandeel van een door de arbeidsvraag gedreven wijziging van de werkgelegenheid in de privésector dat door werkloosheid wordt opgevangen (de rest door inactiviteit)
  labour.public_employment_growth: Groeinorm voor het personeelsaantal van de gezamenlijke overheid, bovenop de koppeling aan de bevolking en het pad van het basisscenario labour.public_employment_outlook_growth, per gewest van woonplaats van het overheidspersoneel (alle bestuursniveaus; een scalair is toegestaan en geldt dan voor de drie gewesten). GEWESTELIJKE HEFBOOM - één gewest met Change(..., key="BRU").
  labour.public_employment_pop_elasticity: Elasticiteit van de werkgelegenheid bij de gezamenlijke overheid ten opzichte van de totale bevolking (1 = constante overheidswerkgelegenheid per inwoner; zet op 0 samen met labour.public_employment_growth voor een zuivere personeelsnorm)
  labour.disability_rate_factor: Vermenigvuldigingsfactor op het leeftijdsspecifieke aandeel personen in invaliditeit ten opzichte van 2024, per gewest van woonplaats (het re-integratiebeleid is een gewestbevoegdheid; een scalair is toegestaan en geldt dan voor de drie gewesten). GEWESTELIJKE HEFBOOM - één gewest met Change(..., key="WAL").
  labour.disability_trend_factor: Trend in het basisscenario van het leeftijdsspecifieke aandeel personen in invaliditeit ten opzichte van 2024, alle gewesten (vermenigvuldigt labour.disability_rate_factor, de gewestelijke hefboom, die relatief blijft ten opzichte van dit pad)
  labour.disability_offset_employment: Aandeel van een wijziging van de invaliditeit dat uit werk komt / naar werk gaat (de rest inactiviteit)
  labour.student_rate_factor: Vermenigvuldigingsfactor op het aandeel niet-werkende studenten van 18 jaar en ouder ten opzichte van 2024
  labour.school_leaving_age: Einde van de leerplicht; onder die leeftijd is elke persoon zonder invaliditeit student
  labour.cohort_effect_strength: Sterkte van de cohorteffecten op de activiteitsgraden (0 = constante leeftijdsspecifieke graden, 1 = de winst van elke cohort tussen 2018/19 en 2023/24 wordt volledig naar hogere leeftijden meegenomen)
  labour.indexation_factor: Aandeel van de inflatie volgens de gezondheidsindex dat via de automatische indexering in de lonen wordt doorgerekend (1 = volledig, 0 = indexsprong)
  labour.indexation_lag_weight: Gewicht van de groei van de gezondheidsindex van het vorige jaar in de loonindexering van dit jaar
  labour.wage_norm_real_cap: Maximale reële loongroei bovenop de indexering (loonnorm, wet van 26 juli 1996); null = geen maximum
  labour.wage_drift: Jaarlijkse loongroei per jobtype bovenop de loonindex (loondrift) (voor het overheidspersoneel - bovenop de mix van loonindex en gezondheidsindex die labour.public_wage_link vastlegt). De jaarwaarden cumuleren (een wijziging vanaf jaar t laat het vóór t bereikte niveau ongemoeid).
  labour.wage_dispersion_factor: Exponent die op het relatieve loonprofiel per tiende van de werknemers in de privésector (SES 2022) wordt toegepast om het profiel van elk jobtype te verkrijgen
  labour.sector_share_drift: Initiële jaarlijkse verschuiving van het aandeel van elke sector in de werkgelegenheid van werknemers in de privésector en zelfstandigen (neemt af met labour.sector_drift_half_life)
  labour.sector_drift_half_life: Halfwaardetijd van de verschuiving van de sectoraandelen
  labour.care_demand_age_weights: Relatieve vraag naar gezondheidszorg en langdurige zorg per persoon naar leeftijd - lijst van [leeftijd, gewicht], lineair daartussen
  labour.care_employment_elasticity: Elasticiteit van de werkgelegenheid in de gezondheidszorg en de maatschappelijke dienstverlening ten opzichte van de met zorgbehoefte gewogen bevolking
  labour.care_employment_max_share: Bovengrens voor het aandeel van de werknemers in de privésector dat in de gezondheidszorg en de maatschappelijke dienstverlening werkt
  labour.education_employment_elasticity: Elasticiteit van het aandeel van het onderwijs in de overheidswerkgelegenheid ten opzichte van het aandeel van de bevolking van 3-22 jaar
  labour.hours_growth: Jaarlijkse groei van het aantal gewerkte uren per werkende
  labour.part_time_share: Aandeel deeltijdwerkers in de werkgelegenheid, 20-64 jaar
  labour.blue_collar_share: Aandeel arbeiders (ouvriers) bij de werknemers in de privésector
  labour.blue_collar_share_trend: Jaarlijkse wijziging van het aandeel arbeiders
  labour.statutory_share: Aandeel statutaire (vastbenoemde) ambtenaren bij de werknemers van de gezamenlijke overheid
  labour.statutory_share_trend: Jaarlijkse wijziging van het aandeel statutairen (de jaarwaarden cumuleren)
  labour.flexi_jobs: Personen met een flexi-job, bij het niveau van de werkgelegenheid in de privésector van 2024
  labour.student_jobs: Studenten met een studentenjob in de loop van het jaar, bij het aantal studenten van 2024
  labour.service_voucher_workers: Dienstenchequewerknemers, bij het niveau van de werkgelegenheid in de privésector van 2024
  labour.cross_border_out: Inwoners die in het buitenland werken, bij het werkgelegenheidsniveau van 2024
  labour.cross_border_in: Niet-inwoners die in België werken, bij het werkgelegenheidsniveau van 2024
  labour.public_share_by_sector: Aandeel van de werknemers van elke sector dat voor de gezamenlijke overheid (S13) werkt; ontbrekende sector = 0
  labour.disabled_2024: Personen in invaliditeit (arbeidsongeschiktheid van meer dan één jaar) in 2024
  labour.disability_age_profile: Relatieve invaliditeitsgraad naar leeftijd voor mannen - lijst van [leeftijd, relatieve graad]; geschaald naar labour.disabled_2024
  labour.disability_female_ratio: Invaliditeitsgraad van vrouwen ten opzichte van mannen van dezelfde leeftijd
  labour.early_retired_age_profile: Relatief aandeel gepensioneerden naar leeftijd onder de wettelijke pensioenleeftijd - lijst van [leeftijd, relatief aandeel]; geschaald naar het EU-SILC-aandeel gepensioneerden bij de 18-64-jarigen (ilc_lvhl02 2024, mannen 4,1%, vrouwen 3,0%)
  labour.calibration_legal_pension_age: Wettelijke pensioenleeftijd die in de waargenomen statutenprofielen van 2024 vervat zit (referentie voor labour.legal_pension_age; geen hefboom)
  labour.calibration_early_retirement_age: Leeftijd voor vervroegd pensioen die in de waargenomen statutenprofielen van 2024 vervat zit (referentie; geen hefboom)
  labour.calibration_early_retirement_career_years: Loopbaanvoorwaarde die in de waargenomen statutenprofielen van 2024 vervat zit (referentie; geen hefboom)
  labour.cohort_start_age: Jongste vijfjarige leeftijdsgroep waarvan de activiteitsgraad cohorteffecten krijgt
  labour.cohort_last_age: Oudste vijfjarige leeftijdsgroep (ondergrens) waarvan de activiteitsgraad cohorteffecten krijgt
  labour.cohort_ratio_bounds: Grenzen op de wijziging over 5 jaar van de activiteitsgraad van een groep die als cohorteffect wordt meegenomen [min, max]
  macro.inflation: Consumptieprijsinflatie (nationale CPI, jaargemiddelde)
  macro.health_index_wedge: Groei van de gezondheidsindex min de CPI-inflatie (de gezondheidsindex omvat geen tabak, alcohol en motorbrandstoffen)
  macro.gdp_deflator_wedge: Groei van de bbp-deflator min de CPI-inflatie. Negatief in 2026-2028 - de invoerprijzen (energie) duwen de consumptieprijzen sterker omhoog dan de prijs van de binnenlandse output (ruilvoetverlies), zodat het nominale bbp minder groeit dan een projectie op basis van de CPI zou geven
  macro.interest_rate_10y: Rendement van de Belgische overheidsobligaties op 10 jaar
  macro.interest_rate_short: Geldmarktrente op 3 maanden (eurozone)
  macro.productivity_growth: Trendmatige groei van de arbeidsproductiviteit per werkende (alle sectoren). Tot 2031 is dit de groei die, met het eigen werkgelegenheidspad van het model, de officiële reële bbp-groei reproduceert
  macro.cyclical_output_gap: Exogene conjuncturele positie van de output ten opzichte van het aanbodpad (komt bovenop de vraagkloof uit de gedragsreacties; de werkgelegenheid in de privésector reageert via labour.okun_coefficient)
  macro.productivity_growth_sector_wedge: Productiviteitsgroei van een sector min de gemeenschappelijke trend (ontbrekende sector = 0)
  macro.hours_output_elasticity: Elasticiteit van de output per werkende ten opzichte van het aantal gewerkte uren per werkende
  macro.real_wage_productivity_share: Aandeel van de trendmatige productiviteitsgroei dat in de reële lonen wordt doorgerekend (1 = constant loonaandeel op lange termijn)
  macro.real_wage_productivity_lag_weight: Gewicht van de trendmatige productiviteitsgroei van het vorige jaar in de reële loongroei van dit jaar
  macro.household_savings_rate: Brutosparen van de huishoudens als aandeel van het bruto beschikbaar inkomen
  macro.fuel_share_of_cp072: Aandeel van de motorbrandstoffen in COICOP 07.2 (gebruik van privévoertuigen), dat Eurostat enkel als geheel publiceert (19,7 mld. EUR in 2024)
  macro.investment_share_factor: Vermenigvuldigingsfactor op de verhouding in 2024 van de bruto-investeringen (incl. woningen) tot het bbp
  macro.gov_consumption_wage_weight: Gewicht van de loonmassa van de overheid in de groei van de overheidsconsumptie (de rest volgt het nominale bbp)
  macro.interest_income_rate_elasticity: Elasticiteit van de rente-inkomsten van de huishoudens ten opzichte van de 10-jaarsrente
  macro.property_transactions_2024: Waarde van de vastgoedtransacties onderworpen aan registratierechten in 2024 (groeit met het nominale bbp)
  macro.inheritance_flow_2024: Waarde van de erfenissen en schenkingen in 2024 (groeit met het aantal overlijdens x het financieel vermogen per hoofd)
  pit.bracket_thresholds: Bovengrenzen van de eerste drie schijven van de personenbelasting (netto belastbaar inkomen)
  pit.bracket_rates: Marginale tarieven van de personenbelasting in de vier schijven
  pit.basic_allowance: 'Belastingvrije som (quotité exemptée), verrekend tegen de tarieven van de laagste schijven. Voor pensioenen en vervangingsinkomens: zie pit.allowance_neutralised_replacement.'
  pit.allowance_special_scale: Schakelaar (1 of 0) - de belasting op de belastingvrije som (basisbedrag en toeslagen) wordt berekend met de bijzondere schaal van pit.allowance_scale_thresholds en pit.allowance_second_band_rate (1) of met de gewone schijven (0).
  pit.allowance_scale_thresholds: Bijzondere schaal voor de belasting op de belastingvrije som - bovengrenzen van de eerste drie schijven ervan (de belastingvrije som en de toeslagen voor kinderen worden gewaardeerd tegen het laagste tarief, 25 %, tot de eerste grens, tegen pit.allowance_second_band_rate, 30 %, tot de tweede, daarna tegen het tarief van de tweede gewone schijf, 40 %, tot de derde en tegen 45 % daarboven).
  pit.allowance_second_band_rate: Bijzondere schaal voor de belasting op de belastingvrije som - tarief van de tweede schijf ervan (tussen de eerste twee grenzen van pit.allowance_scale_thresholds). De andere schijven gebruiken de tarieven van de gewone schijven (25 %, daarna 40 % en 45 %).
  pit.allowance_neutralised_replacement: Deel van de belastingvrije som dat niet ten goede komt aan pensioenen, werkloosheids- en ziekte-uitkeringen. De verhogingen van de belastingvrije som in 2026-2030 worden voor deze inkomens geneutraliseerd door hun belastingverminderingen met hetzelfde voordeel te verlagen, wat hier als een lagere belastingvrije som voor deze inkomens wordt gemodelleerd.
  pit.expense_deduction_rate: Forfaitaire beroepskostenaftrek van werknemers, aandeel van het brutoloon na aftrek van de sociale bijdragen
  pit.expense_deduction_max: Maximum van de forfaitaire beroepskostenaftrek van werknemers
  pit.workbonus_tax_reduction_rate: Fiscale werkbonus - belastingvermindering als aandeel van de werkelijk toegekende sociale werkbonus, voor luik A (lage lonen) en luik B (zeer lage lonen). Het jaarlijkse maximum van de vermindering (1.380 EUR voor inkomsten 2024) is niet gemodelleerd.
  pit.reduction_replacement: Belastingvermindering voor vervangingsinkomens (basisbedrag + bijkomend bedrag), naar soort (pensioenen, werkloosheidsuitkeringen, ziekte- en invaliditeitsuitkeringen). De afzonderlijke afbouw van het bijkomende bedrag is niet gemodelleerd.
  pit.reduction_unemployment_factor: Vermenigvuldigingsfactor op de belastingvermindering voor werkloosheidsuitkeringen (hervormingspad)
  pit.reduction_unemployment_phaseout: Belastbaar inkomen waartussen de belastingvermindering voor werkloosheidsuitkeringen tot nul wordt afgebouwd [begin, einde]
  pit.reduction_phaseout_start: Belastbaar inkomen waarboven de belastingvermindering voor pensioenen en ziekte-uitkeringen wordt afgebouwd
  pit.reduction_phaseout_end: Belastbaar inkomen waarbij de afbouw van de belastingvermindering voor pensioenen en ziekte-uitkeringen eindigt
  pit.reduction_floor_share: Aandeel van de belastingvermindering voor vervangingsinkomens dat boven het einde van de afbouw behouden blijft, naar soort
  pit.reduction_pension_top_limits: Belastbaar inkomen waartussen het resterende derde van de belastingvermindering voor pensioenen wordt ingetrokken [begin, einde] (van toepassing wanneer pit.reduction_pension_top_phaseout gelijk is aan 1)
  pit.reduction_pension_top_phaseout: Schakelaar (0 of 1) voor de intrekking van de belastingvermindering voor pensioenen bij hoge inkomens
  pit.autonomy_factor: Aandeel van de federale belasting Staat dat aan de gewesten wordt overgedragen (autonomiefactor / facteur d'autonomie)
  pit.regional_surcharge: Gewestelijke opcentiemen (centimes additionnels) op de gereduceerde belasting Staat, per gewest van woonplaats. HEFBOOM - één gewest met Change(key="WAL").
  pit.municipal_surcharge: Gemiddelde gemeentelijke opcentiemen op de totale (federale + gewestelijke) personenbelasting, per gewest. HEFBOOM - één gewest met Change(key="BRU").
  pit.company_car_benefit: Gemiddeld belastbaar voordeel van alle aard van een bedrijfswagen (avantage de toute nature)
  pit.company_car_share_by_decile: Aandeel van de werknemers in de privésector met een bedrijfswagen, per loondeciel (van laagste tot hoogste)
  pit.pension_decile_profile: Brutopensioen van elk tiende van de gepensioneerden ten opzichte van het gemiddelde pensioen (gebruikt om de pensioenuitgaven progressief te belasten)
  pit.benefit_decile_profile: Werkloosheids- of invaliditeitsuitkering van elk tiende van de uitkeringsgerechtigden ten opzichte van de gemiddelde uitkering
  pit.tax_expenditure_pension_savings: Budgettaire kosten van de federale belastingvermindering voor pensioensparen en langetermijnsparen, op de schaal van 2024 (groeit met het nominale bbp)
  pit.tax_expenditure_service_vouchers: Budgettaire kosten van de gewestelijke belastingverminderingen voor dienstencheques (titres-services), per gewest, op de schaal van 2024 (groeit met het nominale bbp). HEFBOOM - zet een gewest op 0 om ze af te schaffen.
  pit.tax_expenditure_mortgage: Budgettaire kosten van de gewestelijke belastingvoordelen voor leningen voor de eigen woning (woonbonus, chèque habitat, bonus logement), per gewest, op de schaal van 2024 (groeit met het nominale bbp). HEFBOOM - zet een gewest op 0 om ze af te schaffen.
  ssc.employee_rate: Tarief van de werknemersbijdrage voor de sociale zekerheid op de brutolonen (privésector en contractueel overheidspersoneel)
  ssc.employee_rate_statutory: Tarief van de persoonlijke bijdrage van statutaire ambtenaren (7,5 % Fonds voor overlevingspensioenen + 3,55 % gezondheidszorg)
  ssc.public_statutory_share: Aandeel statutair personeel bij de werknemers in de overheidssector dat in de loonfiche van het type emp_public wordt gebruikt
  ssc.pay_months: Aantal maandlonen in het brutojaarloon (12 + dertiende maand + dubbel vakantiegeld), gebruikt om het maandelijkse referteloon van de werkbonus af te leiden
  ssc.workbonus_a_max_monthly: Sociale werkbonus, luik A (lage lonen) - maximale maandelijkse vermindering van de werknemersbijdragen, bedienden
  ssc.workbonus_b_max_monthly: Sociale werkbonus, luik B (zeer lage lonen) - maximale maandelijkse vermindering van de werknemersbijdragen, bedienden
  ssc.workbonus_b_full_wage_monthly: Maandelijks referteloon tot waar luik B van de sociale werkbonus volledig wordt toegekend
  ssc.workbonus_a_full_wage_monthly: Maandelijks referteloon tot waar luik A van de sociale werkbonus volledig wordt toegekend en waarbij luik B nul bereikt
  ssc.workbonus_zero_wage_monthly: Maandelijks referteloon waarbij de sociale werkbonus (luik A) volledig is afgebouwd
  ssc.special_thresholds: Bijzondere bijdrage voor de sociale zekerheid - inkomensgrenzen van de jaarschaal (belastbaar inkomen van een alleen belaste persoon); de laatste grens is die waar het maximum wordt bereikt
  ssc.special_rates: Bijzondere bijdrage voor de sociale zekerheid - tarief in elke schijf van de jaarschaal
  ssc.special_max: Maximale jaarlijkse bijzondere bijdrage voor de sociale zekerheid (per huishouden tot inkomsten 2027, per persoon vanaf 2028)
  ssc.employer_rate: Basistarief van de werkgeversbijdragen, privésector (incl. loonmatiging), na de taxshift
  ssc.employer_other_rate: Overige werkgeversbijdragen op de brutolonen (bijdrage van 1,60-1,69 % voor werkgevers met 10 of meer werknemers, Fonds voor sluiting van ondernemingen, tijdelijke werkloosheid, Asbestfonds, bijdrage op de tweede pijler, vakantiegeld van arbeiders enz.), gemiddelde
  ssc.structural_reduction_slope: Structurele vermindering van de werkgeversbijdragen (categorie 1), lagelonencomponent - vermindering per euro loon onder de grens S0
  ssc.structural_reduction_threshold: Brutojaarloon (4 x de kwartaalgrens S0) waaronder de lagelonencomponent van de structurele vermindering van de werkgeversbijdragen geldt
  ssc.structural_reduction_low_slope: Structurele vermindering van de werkgeversbijdragen (categorie 1), component zeer lage lonen - vermindering per euro loon onder de grens S2
  ssc.structural_reduction_low_threshold: Brutojaarloon (4 x de kwartaalgrens S2) waaronder de component zeer lage lonen van de structurele vermindering geldt
  ssc.employer_cap_wage: Brutojaarloon (4 x het kwartaalplafond) waarboven geen basiswerkgeversbijdragen meer verschuldigd zijn (gedeeltelijke vrijstelling voor zeer hoge lonen)
  ssc.employer_cap_exempt_share: Aandeel van de basiswerkgeversbijdrage dat is vrijgesteld op het deel van het loon boven ssc.employer_cap_wage (0 = geen plafond)
  ssc.employer_rate_public: Gemiddeld werkelijk tarief van de werkgeversbijdragen op de lonen van de gezamenlijke overheid (contractueel personeel tegen tarieven zoals in de privésector, statutair personeel tegen verlaagde tarieven, bijdragen aan het pensioenfonds van de lokale besturen)
  ssc.self_employed_rate: Tarief van de sociale bijdragen van zelfstandigen (in hoofdberoep) tot het eerste plafond
  ssc.self_employed_rate_upper: Tarief van de sociale bijdragen van zelfstandigen tussen het eerste en het tweede plafond (nul daarboven)
  ssc.self_employed_ceiling_1: Eerste inkomensplafond van de bijdragen van zelfstandigen
  ssc.self_employed_ceiling_2: Tweede inkomensplafond van de bijdragen van zelfstandigen (geen bijdrage daarboven)
  ssc.self_employed_min_income: Minimuminkomen waarop een zelfstandige in hoofdberoep bijdragen betaalt
  ssc.pension_health_rate: ZIV-bijdrage ingehouden op de pensioenen
  ssc.pension_health_threshold: Brutojaarpensioen waaronder geen ZIV-bijdrage wordt ingehouden (de bijdrage mag het pensioen niet onder dit bedrag doen dalen), alleenstaande
  cit.rate: Standaardtarief van de vennootschapsbelasting
  cit.sme_rate: Verlaagd tarief van de vennootschapsbelasting op de eerste 100.000 EUR winst van kleine vennootschappen
  cit.sme_base_share: Aandeel van de belastbare grondslag dat tegen het verlaagde kmo-tarief wordt belast
  cit.innovation_deduction_rate: Aftrek voor innovatie-inkomsten - aandeel van de in aanmerking komende netto-innovatie-inkomsten dat van vennootschapsbelasting is vrijgesteld
  cit.innovation_income_share: In aanmerking komende innovatie-inkomsten als aandeel van de winst vóór aftrekken
  cit.investment_deduction_base_share: Aandeel van de winst vóór aftrekken dat door de investeringsaftrek wegvalt
  cit.minimum_tax_rate: Effectief minimumtarief voor grote multinationale groepen (OESO, Pijler 2, van kracht sinds 2024)
  cit.minimum_tax_base_share: Aandeel van de belastbare winst van groepen binnen het toepassingsgebied dat onder het minimumtarief wordt belast
  cit.minimum_tax_low_etr: Gemiddeld effectief tarief van de laagbelaste winst waarop de bijheffing van de minimumbelasting van toepassing is
  vat.rate_standard: Normaal btw-tarief
  vat.rate_intermediate: Tussentarief van de btw (restaurantmaaltijden, sociale woningen, margarine, steenkool; hotels en campings vanaf maart 2026)
  vat.rate_reduced: Verlaagd btw-tarief (voeding, geneesmiddelen, boeken, renovatie van oude woningen, gas en elektriciteit voor huishoudens, personenvervoer; hotels tot februari 2026)
  vat.mix: Aandeel van elke belastbare grondslag dat tegen het [normale, tussen-, verlaagde, nul- of vrijgestelde] tarief wordt belast (aandelen van de waarde vóór btw). De sleutels zijn de consumptiecategorieën plus drie grondslagen buiten de huishoudens (investeringen in nieuwe woningen, overheidsaankopen, inputs van btw-vrijgestelde sectoren). Wijzig de rij van een categorie om ze naar een ander tarief te verplaatsen.
  vat.gov_purchases_share: Aankopen van de gezamenlijke overheid waarop niet-aftrekbare btw rust (intermediair verbruik + investeringen) als aandeel van de consumptieve bestedingen van de overheid. Enkel als terugvaloptie - gebruikt wanneer de uitgavenlijnen niet beschikbaar zijn; anders wordt de grondslag daaruit opgebouwd (vat.gov_intermediate_share).
  vat.gov_intermediate_share: Aandeel van het intermediair verbruik (en de defensie-investeringen) in de uitgavenlijnen die lonen en aankopen combineren (administratie, onderwijs, defensie, politie, vervoer ...). Samen met de overheidsinvesteringen vormt het de grondslag van de niet-aftrekbare btw die de overheid zelf betaalt.
  vat.gov_marginal_purchases_share: Aandeel van een WIJZIGING van die uitgavenlijnen ten opzichte van het basisscenario dat uit aankopen van goederen en diensten bestaat (de rest zijn lonen). 1 = een vermindering van de consumptie valt op de aankopen, zoals in de varianten van het Federaal Planbureau; vat.gov_intermediate_share = pro rata van lonen en aankopen. HEFBOOM.
  vat.exempt_sector_input_share_gdp: Aankopen waarop niet-aftrekbare btw rust buiten de huishoudens, de investeringen in woningen en de overheid - inputs en investeringen van btw-vrijgestelde activiteiten (financiën, gezondheid, onderwijs, verhuur, instellingen zonder winstoogmerk) en niet-aftrekbare kosten van andere ondernemingen - als aandeel van het bbp
  vat.compliance_gap: Btw-kloof (compliance gap) op leveringen tegen het normale tarief - aandeel van de tegen 21 % verschuldigde btw dat niet wordt geïnd (fraude, insolvabiliteit, fouten). HEFBOOM voor fraudebestrijdingsmaatregelen.
  vat.compliance_gap_reduced: Btw-kloof (compliance gap) op leveringen tegen het verlaagde en het tussentarief (6 % en 12 %) - aandeel van de tegen die tarieven verschuldigde btw dat niet wordt geïnd.
  excise.fuel_duty: Accijns op motorbrandstof, gemiddelde van benzine en diesel
  excise.fuel_pretax_price: Gemiddelde pompprijs van motorbrandstof vóór accijnzen en btw
  excise.tobacco_duty: Accijns op tabak (specifiek + ad valorem), per pakje van 20 sigaretten
  excise.tobacco_pretax_price: Prijs van een pakje van 20 sigaretten vóór accijnzen en btw
  excise.alcohol_duty: Accijns op alcoholische dranken, gemiddelde per liter zuivere alcohol over bier, wijn en gedistilleerde dranken
  excise.alcohol_pretax_price: Gemiddelde prijs van alcoholische dranken vóór accijnzen en btw, per liter zuivere alcohol
  excise.energy_duty: Federale accijns op gas en elektriciteit voor huishoudens, gemiddelde per MWh huishoudelijke energie
  excise.energy_shift_factor: Vermenigvuldigingsfactor op excise.energy_duty voor de bij wet vastgelegde verschuiving van de accijnzen van elektriciteit naar gas (gewogen tarief voor huishoudens ten opzichte van ongewijzigde tarieven van 2024)
  excise.energy_green_levy: Gewestelijke heffingen voor groenestroomcertificaten en energiefondsen die in de energiefactuur worden doorgerekend, gemiddelde per MWh
  excise.energy_pretax_price: Gemiddelde prijs voor huishoudens van elektriciteit, gas en huisbrandolie vóór heffingen en btw
  excise.beverage_packaging_rate: Accijnzen op alcoholvrije dranken en koffie plus de verpakkingsheffing, ad-valoremequivalent op de consumptie van voeding en dranken
  cap.withholding_rate: Tarief van de roerende voorheffing op interesten en dividenden (précompte mobilier)
  cap.withholding_reduced_rate: Verlaagd tarief van de roerende voorheffing (VVPRbis-dividenden van kleine vennootschappen, liquidatiereserves, gereglementeerde spaardeposito's boven de vrijstelling)
  cap.income_share_reduced: Aandeel van de rente- en dividendinkomsten van de huishoudens dat tegen het verlaagde tarief wordt belast
  cap.income_share_exempt: Aandeel van de rente- en dividendinkomsten van de huishoudens dat van roerende voorheffing is vrijgesteld (rente op spaardeposito's onder 1.020 EUR, eerste 833 EUR aan dividenden, pensioen- en verzekeringsproducten)
  cap.securities_account_tax_rate: Jaarlijkse taks op de effectenrekeningen boven 1 miljoen EUR
  cap.tob_rate: Taks op de beursverrichtingen (TOB / beurstaks), gemiddeld tarief op de belaste verrichtingen
  cap.gains_tax_rate: Belasting op de meerwaarden op financiële activa gerealiseerd door huishoudens (solidariteitsbijdrage), op meerwaarden opgebouwd vanaf 1 januari 2026
  cap.gains_taxable_gains: Belastbare gerealiseerde meerwaarden op financiële activa boven de vrijstelling, op de schaal van 2024 (groeit met het financieel vermogen van de huishoudens). Meerwaarden opgebouwd vóór 2026 zijn vrijgesteld, zodat de grondslag geleidelijk toeneemt.
  prop.region_base_share: Gewestelijke aandelen in de grondslagen van de onroerende voorheffing en de successierechten (waarde van de transacties, nalatenschappen, huurwaarden)
  prop.registration_rate: Normaal tarief van de registratierechten op de aankoop van onroerend goed, per gewest
  prop.registration_rate_sole_home: Registratierechten op de aankoop van een enige eigen woning, per gewest (abattementen zijn weergegeven als een effectief tarief)
  prop.sole_home_share: Aandeel van de waarde van de vastgoedtransacties dat als enige eigen woning wordt aangekocht
  prop.inheritance_rate: Gemiddeld effectief tarief van de successie- en schenkingsrechten op de stroom van erfenissen en schenkingen, per gewest
  prop.property_tax_rate: Gewestelijk basistarief van de onroerende voorheffing op het geïndexeerd kadastraal inkomen
  prop.property_tax_local_multiplier: Provinciale + gemeentelijke opcentiemen op de onroerende voorheffing, als veelvoud van de gewestelijke heffing (opcentiemen / 100)
  rev.insurance_premium_tax_rate: Jaarlijkse taks op de verzekeringsverrichtingen (normaal tarief), plus de toeslagen voor de sociale zekerheid op auto-, brand- en hospitalisatieverzekeringen via de kalibratie
  rev.dividends: Dividenden ontvangen door de overheid, per participatie, op de schaal van 2024 (groeien met het nominale bbp). Zet een participatie op 0 om de verkoop ervan te simuleren.
  rev.line_factor: "Discretionaire vermenigvuldiger op een ontvangstenlijn (1.0 = huidig beleid), voor lijnen zonder expliciet wettelijk tarief (voertuigbelastingen, milieubelastingen, bankenheffingen, verkopen, ...) en voor gedateerde wijzigingen in het basisscenario. Eén lijn wordt aangesproken met Change(key=\"<line>\")."
  pit.child_allowance_supplement: Toeslag op de belastingvrije som voor 1, 2, 3 en 4 kinderen ten laste (gecumuleerde bedragen, per inkomstenjaar), toegekend aan de partner met het hoogste belastbaar inkomen. HEFBOOM.
  pit.child_allowance_extra_per_child: Toeslag op de belastingvrije som voor elk kind ten laste boven het vierde (per inkomstenjaar). HEFBOOM.
  pit.single_parent_allowance: Bijkomende belastingvrije som voor een alleenstaande met kinderen ten laste (per inkomstenjaar). HEFBOOM.
  pit.child_credit_max_per_child: Maximaal terugbetaalbaar belastingkrediet per kind ten laste voor het deel van de toeslagen voor kinderen dat niet met belasting kan worden verrekend (niet-benutte toeslag x tarief van de laagste schijf). HEFBOOM.
  pit.marital_quotient_rate: Huwelijksquotiënt - aandeel van het gezamenlijke netto beroepsinkomen van het koppel tot waar inkomen wordt toegekend aan de partner met weinig of geen eigen inkomen. HEFBOOM.
  pit.marital_quotient_max: Maximumbedrag dat via het huwelijksquotiënt aan de partner wordt toegekend, per inkomstenjaar - 'work' voor koppels in het algemeen, 'pension' voor koppels waarvan beide partners 66 jaar zijn (67 vanaf aj. 2031). HEFBOOM.
  educ.community_cost_factor: Vermenigvuldigingsfactor op de overheidskosten per leerling (alle niveaus) per gemeenschap. Het cijfer voor de Franse Gemeenschap omvat Wallonië (incl. de Duitstalige Gemeenschap, die niet afzonderlijk wordt gemodelleerd) en de Franstalige scholen in Brussel; de Vlaamse Gemeenschap omvat Vlaanderen en de Nederlandstalige scholen in Brussel (verdeling regional.brussels_dutch_share). GEMEENSCHAPSHEFBOOM - Change(..., key="french_community").
  educ.community_enrolment_factor: Vermenigvuldigingsfactor op de participatiegraden (alle niveaus) per gemeenschap; het aantal leerlingen en, bij een ongewijzigde verhouding leerlingen/leerkracht, het onderwijzend personeel evolueren evenredig. GEMEENSCHAPSHEFBOOM - Change(..., key="flemish_community").
  family.childcare_factor: Vermenigvuldigingsfactor op de uitgaven van de gemeenschappen voor kinderopvang en gezinsondersteuning (Opgroeien / Kind en Gezin, ONE) per gemeenschap; van toepassing op het aandeel van de gemeenschappen en gewesten in de lijn. GEMEENSCHAPSHEFBOOM - Change(..., key="french_community").
  health.ltc_regional_factor: Vermenigvuldigingsfactor op de uitgaven van de deelstaten voor langdurige zorg (residentiële ouderenzorg, thuiszorg, zorgbudgetten; bevoegdheid van de deelstaten sinds de zesde staatshervorming) voor de inwoners van elk gewest. GEWESTELIJKE HEFBOOM - Change(..., key="FLA").
  subsidy.service_voucher_factor: Vermenigvuldigingsfactor op de gewestelijke subsidie per dienstencheque (titres-services, gewestbevoegdheid sinds 2015) per gewest; wordt vermenigvuldigd met subsidy.factor[service_vouchers]. Begrotingsaandelen van de gewesten - regional.service_voucher_shares. GEWESTELIJKE HEFBOOM - Change(..., key="BRU").
  subsidy.target_group_factor: Vermenigvuldigingsfactor op de gewestelijke doelgroepverminderingen van de werkgeversbijdragen en andere gewestelijke loonsubsidies (het aandeel van de gemeenschappen en gewesten in de lijn loonsubsidies, over de gewesten verdeeld volgens de werknemers in de privésector die er wonen); wordt vermenigvuldigd met subsidy.factor[wage]. Enkel budgettair effect (voor deze hefboom is geen reactie van de arbeidsvraag gemodelleerd). GEWESTELIJKE HEFBOOM - Change(..., key="WAL").
  invest.regional_extra_pct_gdp: Bijkomende overheidsinvesteringen van de overheden van een gewest, in % van het bbp van dat gewest, bovenop invest.public_pct_gdp (alle niveaus, % van het nationale bbp). GEWESTELIJKE HEFBOOM - Change(..., key="FLA").
  labour.activation_factor: Activeringsinspanning van de gewestelijke dienst voor arbeidsbemiddeling (VDAB, Forem, Actiris) ten opzichte van haar eigen niveau van 2024, per gewest. Een waarde boven 1 verlaagt de structurele werkloosheidsgraad van het gewest (elasticiteit labour.activation_nairu_elasticity) en verhoogt evenredig het aandeel van de door de federale beperking in de tijd uitgesloten personen dat werk vindt. GEWESTELIJKE HEFBOOM - één gewest met Change(..., key="BRU").
  labour.activation_nairu_elasticity: Elasticiteit van de structurele werkloosheidsgraad van een gewest ten opzichte van zijn activeringsinspanning (structurele graad x factor ^ -elasticiteit)
  pit.region_tax_share: Aandelen van de gewesten van woonplaats in de belasting Staat (federale + gewestelijke personenbelasting), gebruikt als gewichten voor de nationaal gemiddelde opcentiemen van een loonfiche zonder gewest. De geaggregeerde ontvangstenlijnen gebruiken ze niet (die berekenen elk gewest op basis van zijn eigen bevolking).
  pit.single_parent_eligible_share: Aandeel van de afzonderlijk belaste personen met kinderen ten laste dat de toeslag op de belastingvrije som voor alleenstaande ouders krijgt (enkel in de populatie van fiscale eenheden; een loonfiche van een alleenstaande ouder krijgt hem altijd). Lager dan 1 vanaf inkomstenjaar 2029, wanneer de toeslag wordt geweigerd als een andere volwassene die geen naaste verwant is deel uitmaakt van het huishouden.
  pit.sole_income_pension_share: Aandeel van de gezamenlijke aangiften met één inkomen (de koppels voor wie het huwelijksquotiënt het zwaarst weegt) dat op gepensioneerde koppels betrekking heeft; de overige zijn koppels op beroepsactieve leeftijd. Bepaalt mee de populatie van fiscale eenheden achter de geaggregeerde personenbelasting.
  pit.two_income_lower_share: Aandeel van het gezamenlijk belastbaar inkomen van een tweeverdienerskoppel dat de partner met het laagste inkomen heeft - vijf even waarschijnlijke waarden. Eenmaal gebruikt, in het basisjaar, om de verdeling van de belastingaangiften om te zetten in een verdeling van personen (de schijven gelden voor elke partner); het bepaalt vooral hoeveel inkomen van koppels de hoogste schijf bereikt.
  regional.productivity_growth_wedge: Verschil tussen de productiviteitsgroei van een gewest (plaats van tewerkstelling) en de nationale trend macro.productivity_growth. Verhoogt het gewestelijk bbp en, volgens het gewicht van het gewest, het nationale bbp. De lonen blijven de nationale trend volgen (zie belsim.regional). GEWESTELIJKE HEFBOOM - Change(..., key="FLA").
  regional.commuting_matrix: Aandeel van de werkende inwoners van een gewest (buitenste sleutel) dat in elk gewest werkt (binnenste sleutel); de rest werkt in het buitenland. De werkgelegenheid naar plaats van tewerkstelling wordt vervolgens gekalibreerd op de regionale rekeningen.
  regional.brussels_dutch_share: Aandeel van de Brusselse bevolking dat door de Vlaamse Gemeenschap wordt bediend (de rest door de Franse Gemeenschap); verdeelt de uitgaven en rekeningen van de gemeenschappen over de gewesten.
  regional.service_voucher_shares: Aandelen van de gewesten in het subsidiebudget voor dienstencheques (gewichten van subsidy.service_voucher_factor)
  regional.entity_accounts_2024: ESA 2010-rekeningen 2024 van de deelstaten - totale ontvangsten, totale uitgaven, saldo (vorderingensaldo) en geconsolideerde brutoschuld. walloon_region = Waals Gewest + Duitstalige Gemeenschap (579,5 / 695,5 / -116,0 / 1 224,0); brussels_region = Gewest + GGC + FGC (COCOF) + VGC (niet-geconsolideerde som). De entiteiten zijn onderling niet geconsolideerd; het verschil met subsector S1312 (interregionale eenheden +771,1 saldo, overdrachten tussen entiteiten -6 745,5 aan beide zijden, schuld 3 532,6 - 5 120,4) is de pseudo-entiteit interregional_consolidation.
  regional.sfa_grants_2024: Overdrachten krachtens de bijzondere financieringswet van de federale overheid aan elke entiteit in 2024, per mechanisme - vat_pupils (btw-dotatie aan de gemeenschappen, volgt het aantal leerlingen), pit_key (PB-dotaties die de opbrengst van de personenbelasting op het grondgebied volgen - PB-dotatie van de gemeenschappen, dotaties van de gewesten voor werkgelegenheid, fiscale uitgaven en het residu), needs_population (kinderbijslag, ouderenzorg, gezondheidszorg en ziekenhuizen - volgen de bevolking jonger dan 18 en ouder dan 80 jaar), solidarity (nationaal solidariteitsmechanisme voor gewesten waarvan het aandeel in de PB lager ligt dan hun bevolkingsaandeel), transition (overgangsmechanisme, nominaal constant tot 2024 en daarna afgebouwd), other (financiering van Brussel, compensatie voor pendelaars en internationale ambtenaren, overige). De gewestelijke opcentiemen op de PB en de gewestelijke belastingen zijn eigen ontvangsten en zijn niet inbegrepen. Het model
    schaalt de componenten buiten het overgangsmechanisme zodat hun som gelijk is aan de geaggregeerde federale overdracht van de saldomodule (ESA, 57 018 in 2024 tegenover 56 222 hier).
  regional.sfa_transition_phase_out: Overgangsmechanisme van de bijzondere financieringswet - laatste jaar tegen het volledige nominale bedrag en aantal jaren van de lineaire afbouw tot nul
  regional.own_taxes_2024: Eigen fiscale ontvangsten van de gewesten in 2024 (ESA) - gewestelijke personenbelasting en overige gewestelijke belastingen (indirecte belastingen + kapitaalbelastingen). Gebruikt voor de gewestelijke verdeling van de belastinglijnen wanneer de ontvangstenmodule geen ontvangsten per gewest publiceert.
  regional.local_government_2024: Rekeningen 2024 van de lokale overheden (S1313) per gewest (WAL incl. de Duitstalige gemeenten). Het deel dat niet aan een gewest is toegewezen (politie- en hulpverleningszones enz. - ontvangsten 8 843,2, schuld 1 443,8) wordt evenredig gespreid door het model, dat deze aandelen toepast op de nationale aggregaten van de lokale overheden.
  regional.consolidation_shares: Gewestelijke toewijzing van de overdrachten tussen deelstaten die in subsector S1312 worden geconsolideerd (hoofdzakelijk de Sint-Emiliaoverdracht van de Franse Gemeenschap aan het Waals Gewest en de COCOF, 4 611 mln. EUR aan Wallonië in de begroting 2024, en de financiering van de Brusselse gemeenschapscommissies door het Gewest); enkel gebruikt voor regional.gov_revenue / gov_expenditure.
  regional.fiscal_incidence_keys: Verdeelsleutel per gewest van de uitgavenlijnen van de federale overheid en de sociale zekerheid voor regional.net_fiscal_transfer (niet-vermelde lijnen - bevolking). Sleutels - retired, elderly (65+), unemployed, disabled, health_need (kostenprofiel naar leeftijd), children, inactive (18-64), private_employees, population.
  dyn.wage_cost.employer_contribution_weight: Gewicht van een wijziging van de werkgeversbijdragen (arbeidskosten per euro brutoloon) in de loonkostenkloof die in de consumptieprijzen doorwerkt. Lager dan 1 omdat een deel van een bijdragewijziging in de marges en in het latere loonoverleg wordt opgevangen in plaats van in de prijzen te worden doorgerekend.
  dyn.wage_bargaining.worker_share_employer_contributions: 'Aandeel van een wijziging van de werkgeversbijdragen (arbeidskosten per euro brutoloon) dat de werknemers uiteindelijk dragen zodra de lonen opnieuw zijn onderhandeld: na een verhoging dalen de brutolonen met dit aandeel van de stijging van de arbeidskosten. De verschuiving van de loonindex beïnvloedt de arbeidsvraag, de prijzen en het concurrentievermogen via het kanaal van de reële arbeidskosten per eenheid product. HEFBOOM (0 = de brutolonen reageren niet op de werkgeversbijdragen).'
  dyn.wage_bargaining.compensation_employee_taxes: Aandeel van een verlies aan nettoloon door sociale werknemersbijdragen of personenbelasting (bij ongewijzigd brutoloon) dat de werknemers in hun brutoloon terugwinnen zodra de lonen opnieuw zijn onderhandeld; het verhoogt de arbeidskosten, zodat de banen verloren gaan via de arbeidsvraag en niet via het arbeidsaanbod. HEFBOOM (0 = belastingen op werknemers werken nooit door in de arbeidskosten).
  dyn.wage_bargaining.worker_share_indirect_taxes: Aandeel van een stijging van de consumptieprijzen door indirecte belastingen dat de lonen via het loonoverleg opnieuw verliezen nadat de automatische indexering ze eerst volledig heeft gecompenseerd (de lonen kunnen niet blijven voorlopen op de prijzen die de ondernemingen ontvangen, die de belasting niet bevatten).
  dyn.wage_bargaining.speed: Aandeel van de resterende kloof tussen de onderhandelde loonverschuiving en haar doelwaarde dat elk jaar wordt gedicht. De doelwaarde is de belastingwig en de vraagkloof van het vorige jaar, zodat de lonen niet reageren in het jaar van de maatregel (lopende akkoorden).
  dyn.wage_bargaining.activity_weight: 'Langetermijnreactie van de onderhandelde lonen op de vraagkloof van het vorige jaar (procent loon per procent outputkloof): de lonen volgen het conjuncturele verlies of de conjuncturele winst aan productiviteit en de toestand van de arbeidsmarkt. Geleidelijk ingevoerd met dyn.wage_bargaining.speed en teruggedraaid wanneer de kloof zich sluit.'
  dyn.indexation.tax_shift_lag_weight: "Gewicht van het vorige jaar in de indexering van de lonen op een verschuiving van de consumptieprijzen door een wijziging van de indirecte belastingen (de rest wordt geïndexeerd in het jaar van de wijziging). Lager dan labour.indexation_lag_weight, dat geldt voor inflatie die zich in de loop van het jaar opbouwt: een belastingwijziging die op 1 januari ingaat verhoogt de index van het hele jaar en de indexeringsmechanismen (spilindex, afgevlakte gezondheidsindex) halen de achterstand binnen enkele maanden in. 0 = volledig geïndexeerd in het jaar van de wijziging."
  dyn.cpi.imputed_rent_share_of_housing: Aandeel van de toegerekende huur van eigenaars-bewoners in de consumptiecategorie "huisvesting" (werkelijke en toegerekende huur). Toegerekende huur maakt in de nationale rekeningen deel uit van de consumptie van de huishoudens, maar niet van de consumptieprijsindex; ze wordt dus weggelaten uit de gewichten waarmee wijzigingen van de indirecte belastingen de CPI en de gezondheidsindex beïnvloeden.
  rev.regional_factor: Discretionaire vermenigvuldigingsfactor per gewest op het gewestelijke en lokale deel van een ontvangstenlijn zonder expliciet gewestelijk tarief (verkeersbelastingen, gewestelijke energieheffingen, belastingen op spelen en weddenschappen, milieubelastingen, lokale belastingen). 1.0 = huidig beleid. Een maatregel voor één gewest is Change(key="<line>.<REGION>"), bv. key="vehicle_taxes.WAL". Het deel van de federale overheid en de sociale zekerheid in een gemengde lijn blijft ongewijzigd (gebruik rev.line_factor voor de volledige lijn).
  rev.regional_allocation: Sleutel waarmee een nationale ontvangstenlijn aan de gewesten wordt toegewezen wanneer het model er geen gewestelijke grondslag voor heeft - consumption (beschikbaar inkomen van de inwoners, uit de populatie van fiscale eenheden), population (bevolking) of vehicles (volwassenen x rev.vehicle_tax_relative). De inkomstenbelasting en de sociale bijdragen worden toegewezen volgens de woonplaats van de belastingplichtige en de onroerende belastingen met de gewestelijke grondslagen en tarieven; ze staan hier niet vermeld.
  rev.vehicle_tax_relative: Verkeersbelastingen (jaarlijkse verkeersbelasting, belasting op de inverkeerstelling, kilometerheffing) per volwassen inwoner, per gewest, ten opzichte van Vlaanderen. Bepaalt de gewestelijke verdeling van de lijn; het niveau is gekalibreerd.
  beh.ret.accrual_max_years: 'Bovengrens voor het aantal jaren latere pensionering dat de opbouwprikkel als geheel (loopbaanopbouw plus bonus/malus, a in % van het pensioen per bijkomend gewerkt jaar) kan verklaren: jaren = max x tanh(beh.ret.years_per_pp_accrual x a / max); een hervorming verschuift de pensionering met het verschil van die uitdrukking tussen het scenario en het basisscenario. Een malus werkt dus vooral wanneer hij wordt ingevoerd: wie reageert, doet dat al wanneer hij klein is, slechts een deel van elke cohorte is betrokken en niemand kan uitstellen tot na de wettelijke leeftijd. Een hoge waarde (100) maakt de reactie lineair.'
  demo.mortality_improvement_by_sex: Vermenigvuldigingsfactor per geslacht (M, F) op het jaarlijkse veranderingstempo van de leeftijdsspecifieke sterftekansen van EUROPOP2023, bovenop demo.mortality_improvement - in de nationale projectie haalt de levensverwachting van mannen die van vrouwen sneller in dan in EUROPOP2023
  dist.three_adults_pensioner_share: "Aandeel van de huishoudens van drie volwassenen (twee verdieners en een derde volwassene) waarvan de derde volwassene gepensioneerd is. In de andere werkt de derde volwassene (zoveel als de hoofdverdieners en hun partners overlaten van de werkgelegenheid van het model, in de laagste inkomensgroep van de werknemers), is hij werkloos of langdurig ziek (wie niet past in de huishoudens zonder werk of als partner van een eenverdienerskoppel) of heeft hij geen eigen inkomen. Het huishoudtype draagt het gemiddelde van deze gevallen en telt voor dit aandeel van een gepensioneerde wanneer de set wordt geschaald op het aantal gepensioneerden."
  dist.fiscal_dispersion: Mate waarin de lonen van de inkomensgroepen de spreiding van de belastingaangiften volgen (0 = de loondecielen van het model zoals ze zijn, 1 = de relatieve inkomens van de groepen zijn die van de belastingaangiften). Het belastbaar inkomen van elke groep komt al uit de fiscale statistieken, die meer lage en meer hoge inkomens tellen dan de loondecielen van het model; met 1 worden de brutolonen van een groep geschaald met haar belastbaar inkomen in de aangiften ten opzichte van de gemiddelde groep, zodat de totale lonen ongewijzigd blijven, de belasting ongewijzigd blijft en de huishoudens even ongelijk zijn als de aangiften.
  dist.grapa_amounts: Inkomensgarantie voor ouderen (IGO), gewaarborgde jaarbedragen - basisbedrag (per persoon die de hoofdverblijfplaats deelt) en verhoogd bedrag (alleenwonende). Een huishouden van gepensioneerden ontvangt het gewaarborgde bedrag min het aangerekende deel van zijn pensioenen, tegen de opnamegraad die de begrotingslijn reproduceert.
  dist.grapa_pension_counted: Aandeel van een pensioen dat in de inkomensgarantie voor ouderen als bestaansmiddel wordt aangerekend (de rest is vrijgesteld). Andere bestaansmiddelen (spaargeld, kadastraal inkomen, beroepsinkomen van de partner) zijn niet gemodelleerd - de op de begroting afgestemde opnamegraad staat ervoor in de plaats.
  dist.family_social_supplement: Inkomensafhankelijke sociale toeslag bij de kinderbijslag - jaarbedrag per kind en plafond van het bruto gezinsinkomen waaronder hij wordt betaald. Gezinnen onder het plafond krijgen hem bovenop het basisbedrag; het basisbedrag is het begrotingsgemiddelde per kind (family.allowance_per_child) min de gemiddelde kosten van de toeslag.
  dist.family_supplement_child_share: Aandeel van de kinderen dat de sociale toeslag ontvangt (bepaalt hoeveel het basisbedrag onder het begrotingsgemiddelde per kind ligt).
  dist.capital_income_share: Inkomen uit kapitaal en vermogen van de huishoudens (interesten, dividenden, ontvangen huur) vóór roerende voorheffing, als aandeel van het beschikbaar inkomen van de reeks huishoudens - het bedrag dat een inkomensenquête registreert, niet het totaal van de nationale rekeningen.
  dist.capital_income_by_decile: Verdeling van het inkomen uit kapitaal en vermogen over de tienden van het equivalent beschikbaar inkomen (van laag naar hoog; herschaald tot een som van 1).
  dist.property_tax_household_share: Aandeel van de onroerende voorheffing dat de huishoudens op hun eigen woning betalen en dat in het enquêteconcept van het beschikbaar inkomen wordt afgetrokken (de rest wordt door vennootschappen en verhuurders betaald).
  dist.property_tax_by_decile: Verdeling van de onroerende voorheffing van de huishoudens over de tienden van het equivalent beschikbaar inkomen (van laag naar hoog; herschaald tot een som van 1).
  dyn.wage_cost.deflator_lead: "Hoe ver de outputprijzen voorlopen op de consumptieprijzen na een wijziging van de loonkosten: deel van de afstand tussen het tot dan toe bereikte effect op de consumptieprijzen en het doel ervan (dyn.wage_cost.price_passthrough x het loonkostverschil) dat de prijs van de binnenlandse productie al heeft afgelegd. 1 = producenten passen hun prijzen meteen aan en de consumptieprijzen volgen aan het tempo van dyn.wage_cost.price_adjustment_speed; 0 = beide bewegen samen. Het bepaalt hoeveel van een loonkostschok de winsten (en de vennootschapsbelasting) in het eerste jaar dragen."
  dyn.prices.demand_gap_sensitivity: 'Wijziging van het niveau van de consumptieprijzen (en van de prijs van de binnenlandse output), ten opzichte van het basisscenario, per punt vraagkloof van het vorige jaar: onderbenutting drukt de marges en de loondrift, zodat de prijzen blijven dalen zolang de output onder het door het aanbod bepaalde niveau blijft (en stijgen bij hoogconjunctuur). De prijswijziging bereikt de lonen en de uitkeringen via de automatische indexering. HEFBOOM (0 = de prijzen reageren niet op onderbenutting).'
  pension.postponement_pension_ratio: Pensioen van de personen die hun pensionering uitstellen (of vervroegen) als reactie op een financiële prikkel (gedragsreactie inzake pensionering in een scenario), ten opzichte van het gemiddelde nieuwe pensioen. De bespaarde pensioenuitgaven per persoonsjaar uitstel zijn deze verhouding x het gemiddelde nieuwe pensioen. Geen effect in het basisscenario.
  pension.capital_bonus: Pensioenbonus van de wet van 25 april 2024, uitbetaald als kapitaal bij de pensionering - gemiddeld bedrag per NIEUW gepensioneerde (alle nieuw gepensioneerden, met of zonder bonus), in EUR van 2024, door het model geïndexeerd met de gezondheidsindex. Het recht werd opgebouwd per gewerkte dag na de vroegst mogelijke pensioendatum, gedurende ten hoogste drie jaar (3.775, 7.550 en 11.325 EUR voor het eerste, tweede en derde jaar, of 11.325 EUR per jaar bij een loopbaan van 43 jaar of meer, index van juli 2023). De opbouw stopte op 31 december 2025 - het basisscenario betaalt de rechten uit die tussen 1 juli 2024 en die datum zijn opgebouwd. HEFBOOM - 4 600 vanaf 2029 (3 000 in 2027, 4 000 in 2028) herstelt de bonus zoals hij op kruissnelheid zou zijn gekomen.
  health.indexation_lag_share: Aandeel van een afwijking van de gezondheidsindex ten opzichte van het basisscenario (een scenario dat de consumptieprijzen wijzigt, bv. een btw-wijziging) dat de uitgaven voor gezondheidszorg pas een jaar later bereikt - de begroting van de ziekteverzekering en de honoraria worden vóór het begin van het jaar vastgelegd. Geen effect in het basisscenario.
  transfer.level_factor: Niveau van een overdracht tussen entiteiten ten opzichte van de regel ervan (1 = de regel - mechanismen van de bijzondere financieringswet, terugbetaling van de bijstand, onderwijsuitgaven en nominaal bbp voor de dotaties van de gewesten en gemeenschappen aan de lokale overheden). Het basisscenario bevat het pad van de dotaties van de gewesten en gemeenschappen aan de lokale overheden uit de officiële vooruitzichten. HEFBOOM.
  entity.staff_cost_factor: Niveaufactor op de beloning van werknemers (D1) van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - bovenop het algemene pad van de overheidswerkgelegenheid en de overheidslonen (labour.public_employment_growth, labour.wage_drift, labour.public_wage_link), de selectieve vervanging van vertrekkers en de lineaire besparingen van de federale overheid (1,8% per
    jaar op het personeel in 2025-2029 geeft 0.913 in 2029), de Brusselse aanwervingsstop, de gedeeltelijke vervanging in de Waalse administratie. HEFBOOM - één entiteit met Change(..., key="walloon_region").
  entity.purchases_factor: Niveaufactor op de aankopen van goederen en diensten (P2) en de betaalde belastingen van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - beperkte of geen indexering van de werkingsbudgetten (Vlaamse begroting 2025-2026, Waalse en Brusselse plannen, federale lineaire besparingen). HEFBOOM - één entiteit met Change(..., key="walloon_region").
  entity.subsidies_factor: Niveaufactor op de subsidies (D3 - loonsubsidies, dienstencheques, vervoer, energie en overige) van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - uitdoving van de Vlaamse doelgroepverminderingen en subsidieverlagingen van de begroting 2026, vermindering van de Waalse tewerkstellingssteun (APE), einde van de fiscale aftrekbaarheid van dienstencheques in Brussel;
    nieuwe federale loonkostenmaatregelen verhogen de federale subsidies. HEFBOOM - één entiteit met Change(..., key="walloon_region").
  entity.current_transfers_factor: Niveaufactor op de overige inkomensoverdrachten (D7 - aan huishoudens, instellingen zonder winstoogmerk, ondernemingen en het buitenland, excl. de EU-bijdrage) van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - besparingen op de toelagen aan instellingen zonder winstoogmerk en op ontwikkelingssamenwerking. HEFBOOM - één entiteit met Change(..., key="walloon_region").
  entity.capital_transfers_factor: Niveaufactor op de kapitaaloverdrachten (D9 - investeringsbijdragen en overige) van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - verdeling over de entiteiten van het algemene pad invest.capital_transfers_pct_gdp (einde van de Waalse en Vlaamse relanceplannen, Brusselse overstap van investeringsbijdragen naar leningen, eenmalige federale steun aan
    de spoorwegen en voor de nucleaire ontmanteling). HEFBOOM - één entiteit met Change(..., key="walloon_region").
  entity.investment_factor: Niveaufactor op de investeringen (bruto-investeringen en overige verwervingen van niet-financiële activa, excl. defensiematerieel) van één entiteit ten opzichte van ongewijzigd beleid (1 = de determinanten van de uitgavenlijnen), per entiteit - federal, social_security, flemish_community, walloon_region (incl. de Duitstalige Gemeenschap), french_community, brussels_region (incl. de gemeenschapscommissies), local. Geldt voor het aandeel van de entiteit in elke lijn (rekeningen 2024; deelstaten - hun gewicht in het deel gemeenschappen en gewesten van de lijn) x het aandeel van deze categorie in de lijn; niet voor de rente, defensie, de EU-bijdrage en de sociale uitkeringen. Het basisscenario bevat de goedgekeurde begrotingen en meerjarenplannen zoals de officiële vooruitzichten ze opnemen - einde van de relanceplannen van de gewesten, lokale verkiezingscyclus (piek in 2024 en 2030). HEFBOOM - één entiteit met Change(..., key="walloon_region").
  labour.hidden_unemployment_ratio: Ingeschreven werkzoekenden die niet werkloos zijn volgens de IAB-definitie (inactief in het model), per werkloze in 2024. Wanneer de structurele werkloosheidsgraad van een gewest onder het niveau van 2024 daalt, stroomt hetzelfde aandeel van hen als van de werklozen door van inactiviteit naar werk (er gebeurt niets zolang de werkloosheid op of boven het niveau van 2024 ligt).
  labour.target_group_employment_elasticity: Langetermijnreactie van de werkgelegenheid in de privésector van een gewest op een wijziging van zijn doelgroepverminderingen (subsidy.target_group_factor ten opzichte van het basisscenario) - % van de werkgelegenheid in de privésector per % van de arbeidskosten in de privésector dat door de subsidie wordt overgenomen
  labour.target_group_adjustment_speed: Aandeel van de resterende kloof tot de langetermijnreactie van labour.target_group_employment_elasticity dat elk jaar wordt gedicht
  labour.public_employment_outlook_growth: Groei van de werkgelegenheid bij de gezamenlijke overheid in het basisscenario, bovenop de koppeling aan de bevolking, alle gewesten - de personeelsbeslissingen van de regeringen voor 2025-2031 zoals de officiële vooruitzichten ze opnemen (selectieve vervanging in de federale en de Waalse administratie, de Brusselse aanwervingsstop, Vlaamse personeelsbesparingen). De hefboom labour.public_employment_growth komt daar bovenop.
  labour.public_wage_link: Aandeel van de groei van de loonindex (loonvorming in de privésector - indexering plus reële verhogingen) dat wordt doorgerekend in de overheidslonen per hoofd; de rest volgt enkel de gezondheidsindex (automatische indexering van de weddeschalen). 1 = de overheidslonen volgen de lonen in de privésector. Een verschil tussen de loonindex van een scenario en die van het basisscenario wordt altijd volledig doorgerekend.
  pit.indexation_lag_base: Wettelijke indexering van de bedragen in de personenbelasting - consumptieprijsindex van het jaar vóór het basisjaar ten opzichte van het basisjaar. De wet indexeert de bedragen van inkomstenjaar t op de gemiddelde consumptieprijzen van jaar t-1 (art. 178 van het Wetboek van de inkomstenbelastingen), terwijl de parameters met de gezondheidsindex van jaar t worden aangepast; de ontvangstenmodule past de verhouding toe (0 = schakelt de correctie uit).
  ssc.fte_floor_wage: "Jaarlijks voltijds minimumloon dat wordt gebruikt om lage jaarlonen als deeltijds werk te lezen - de structurele vermindering van de werkgeversbijdragen wordt volgens de wet berekend op het referteloon in voltijds equivalent en geschaald met de prestatiebreuk, zodat lonen onder dit bedrag die breuk krijgen van de vermindering van een voltijds minimumloon (12 x het minimummaandinkomen, geïndexeerd). 0 = vermindering berekend op de jaarlonen zoals ze zijn (de onderste twee loondecielen betalen dan bijna geen werkgeversbijdragen). De reactie van de arbeidsvraag op bijdrageverminderingen is afgesteld met deze regel ingeschakeld."
  cit.base_share_path: Belastbare vennootschapswinsten in het basisscenario, als aandeel van het bbp ten opzichte van 2024 (index per jaar). De winstbenadering van het model kent geen afschrijvingsdynamiek; in de jaren van dit pad volgt de belastbare grondslag van het basisscenario het pad, daarna wordt de verhouding tot de benadering aangehouden. Een scenario wijzigt de grondslag via de benadering.
  excise.volume_growth: Jaarlijkse groei van de belaste volumes motorbrandstof, tabak en alcohol in het basisscenario (de reële consumptie van de categorie in het model wordt door deze trend vervangen; een scenario wijzigt de volumes nog steeds via zijn effect op de consumptie). HEFBOOM voor het tempo van de elektrificatie of van de daling van het roken.
  rev.ets2_price: Prijs van een emissierecht in het tweede EU-emissiehandelssysteem (ETS2 - brandstoffen voor wegvervoer en verwarming), waarvan de veilingopbrengsten vanaf 2028 overheidsontvangsten zijn (toegevoegd aan de lijn emissierechten en milieubelastingen). 0 = geen ETS2.
  rev.ets2_emissions: Emissies die onder ETS2 vallen, op hun niveau van 2024 (wegvervoer en verwarming van gebouwen). In de projectie volgen ze het belaste volume motorbrandstof (excise.volume_growth).
  rev.outturn_persistence: "Deel van het verschil tussen de waargenomen realisatie van 2025 van een lijn en het model dat in latere jaren blijft bestaan in de eigen projectie van het model (niet vermelde lijnen - 1, het niveau van 2025 wordt de nieuwe basis; 0 = het verschil was eenmalig of een kwestie van timing). Zolang rev.fpb_alignment aanstaat, volgen de categorieën die het dekt in 2026-2031 de wijziging van het Planbureau vanaf het waargenomen niveau van 2025, wat hier ook wordt ingevuld."
  beh.ld.composition_net_share: "De arbeidsvraag reageert in twee delen op een wijziging van de werkgeverskost. (1) De arbeidskost als geheel: de reactie van elk loondeciel (beh.ld.elasticity_by_decile x de wijziging van zijn werkgeverskost), gewogen met het aandeel van het deciel in de arbeidskost - wat een algemene verlaging met hetzelfde budget zou opleveren. (2) De samenstelling van de werkgelegenheid: een verlaging die op lage lonen is geconcentreerd levert meer banen per euro op, omdat die banen goedkoop zijn; die premie in aantal banen is de met de aantallen gewogen reactie min de met de kosten gewogen reactie. Deze parameter is het deel van de premie dat een netto toevoeging aan de werkgelegenheid is: de rest zijn laagbetaalde banen die beter betaalde werknemers vervangen (substitutie tussen loonklassen). 1 = elke baan telt (weging met aantallen), 0 = alleen de arbeidskost als geheel telt. De premie bouwt zich op aan een eigen tempo (beh.lambda, labour_composition). Nul voor een maatregel die de kost van elk deciel in dezelfde verhouding wijzigt."
  beh.demand.lagged_price_lines: "Uitgavenlijnen die als aankopen zijn ingedeeld en waarvan de prijs de gezondheidsindex van het vorige jaar volgt voor het aandeel health.indexation_lag_share (de begroting van de ziekteverzekering en haar honoraria worden vóór de start van het jaar vastgelegd). Ze worden met die index gedefleerd, niet met de mix van lonen en prijzen van de andere aankopen, en hun indexering is inkomen van de zorgverleners"
  dyn.wage_cost.deflator_lead_indexation: "Dezelfde voorsprong als dyn.wage_cost.deflator_lead voor het deel van een loonkostwijziging dat voortkomt uit een indexering die ten opzichte van het basisscenario wordt overgeslagen of toegevoegd (indexsprong): 0 = producenten rekenen loonmatiging niet sneller door in hun prijzen dan de consumptieprijzen dalen, zodat de marges (en de vennootschapsbelasting) het verschil in de eerste jaren dragen; 1 = zoals voor belastingen."
  dist.jobless_couple_second_benefit_share: "Aandeel van de huishoudens van twee of drie volwassenen zonder werk (geen gepensioneerden) waarin een tweede volwassene een werkloosheids- of invaliditeitsuitkering ontvangt; in de andere heeft de tweede volwassene geen eigen inkomen."
  dist.sole_earner_low_income_ratio: "Hoe vaak een werkende uit de laagste inkomensgroep (onderste vijfde van de werknemers, onderste kwart van de zelfstandigen) de enige verdiener van het huishouden is - alleenwonend, alleenstaande ouder, partner zonder werk - ten opzichte van de gemiddelde werkende (1 = even vaak; de verplaatste werkenden zijn hoofdverdieners van tweeverdienershuishoudens, zodat het aantal werkenden in elke inkomensgroep ongewijzigd blijft). De laagste groepen bevatten lonen van een deel van het jaar en kleine deeltijdse banen, typisch voor tweede verdieners en voor jongvolwassenen die bij hun ouders wonen (de werkende derde volwassenen van de set zitten allemaal in de laagste groep van de werknemers)."
  dist.within_group_dispersion: "Spreiding van de inkomens van de personen van één synthetisch huishouden rond zijn inkomen (standaardafwijking van de logaritme van het inkomen; 0 = iedereen van een huishoudtype en inkomensgroep heeft precies dat inkomen, zodat een groep volledig onder of volledig boven de armoedegrens ligt). Eén waarde voor arbeids- en kapitaalinkomen (markt), één voor uitkeringen; een huishouden krijgt het gemiddelde, gewogen met het aandeel van het marktinkomen in zijn bruto-inkomen. Ze speelt in de armoedecijfers, de Gini-coëfficiënt en de S80/S20-verhouding, niet in de inkomensaandelen van de tienden of de bedragen per huishouden."
  dist.children_number_spread: "Aantal kinderen waarvoor de huishoudtypes staan wanneer de set niet elk aantal bevat. large_family_children is het gemiddelde aantal kinderen van de gezinnen met 3 of meer - een gezin van de types met drie kinderen telt voor dat aantal op de equivalentieschaal, verminderd met het deel allowance_offset van het effect van een extra kind dat de kinderbijslag goedmaakt. Voor de huishoudens van drie volwassenen met kinderen (één type, één kind) geven dezelfde twee waarden de spreiding van het inkomen per equivalente volwassene die voortkomt uit het aantal kinderen (1, 2, 3 of meer in de huishoudstatistieken)."
  dist.other_benefit_recipients: "Uitkeringen in geld uit de begroting die de huishoudregels niet opleveren en die de inkomensenquête wel telt - voor elke uitgavenlijn de soorten volwassenen van de huishoudset die ze gelijk verdelen (work = werkenden, unemployment, disability = met een invaliditeitsuitkering, none = volwassenen zonder eigen inkomen) en of er personenbelasting op drukt (tegen het gemiddelde tarief van het huishouden). De bedragen zijn de begrotingslijnen van het jaar (voor de sociale bijstand - de lijn min het leefloon dat de regels al aan de huishoudens van de set uitkeren)."
  pit.allowance_neutralised_population_share: "Deel van de neutralisering van de hogere belastingvrije som (pit.allowance_neutralised_replacement) dat effectief speelt in de populatie van fiscale eenheden met pensioenen of uitkeringen. Lager dan 1 omdat velen van hen in het jaar ook arbeidsinkomen hebben (een deel van het jaar werkloos of ziek, werkende gepensioneerden) en de verlaging van hun belastingvermindering evenredig is met het vervangingsinkomen - zij behouden een deel van de verhoging. Enkel voor de totale ontvangsten; de calculator voor één loonbrief neutraliseert volledig."
  pit.reform_other_measures_cost: "Nettokost van de maatregelen van de hervorming van de personenbelasting van 2026 die de belastingcalculator niet bevat (auteursrechtenregime, overuren, ondernemersaftrek, lagere belasting op pensioenen, vermeerdering wegens geen voorafbetalingen, bezoldiging van bedrijfsleiders en de 20%-regel, min de correctiefactor voor de gemeenten), alle overheidsniveaus, in miljoen euro op het bbp-niveau van 2024 (groeit mee met het bbp). 0 = zonder deze maatregelen. HEFBOOM."
  rev.fpb_alignment_enabled: "Schakelaar (1 of 0) voor rev.fpb_alignment - 0 verwijdert elke afstemming van de ontvangsten in het basisscenario op de vooruitzichten van het Planbureau en laat de eigen projectie van het model over (wetgeving, belastinggrondslagen en de waargenomen rekeningen van 2025 doorgetrokken). HEFBOOM."
  rev.fpb_alignment: "Afstemming op de vooruitzichten bij ongewijzigd beleid van het Planbureau van juni 2026, oorzaak niet geïdentificeerd - vermenigvuldiger op de ontvangstenlijnen van een categorie van de rekeningen van het Bureau, per jaar. De waargenomen rekeningen van 2025 zijn het vertrekpunt en worden niet overschreven - vanaf 2026 is alleen de wijziging van elke categorie sinds 2025, in punten van het bbp, die van het Bureau. Categorieën - directe belastingen van gezinnen en indirecte belastingen, telkens voor de federale overheid met de sociale zekerheid (_federal), de gewesten en gemeenschappen (_regions) en de lokale overheden (_local); vennootschapsbelasting; capital_taxes (erf- en schenkbelasting); contributions (effectieve sociale bijdragen). 1 = geen afstemming. De waarden van 2031 gelden nadien. Uitschakelen met rev.fpb_alignment_enabled."

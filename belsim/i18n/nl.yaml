  sca2026_fertility: Studiecommissie voor de Vergrijzing / Federaal Planbureau-Statbel - totaal vruchtbaarheidscijfer
  sca2026_life_expectancy_men: Studiecommissie voor de Vergrijzing / Federaal Planbureau-Statbel - levensverwachting bij de geboorte, mannen
  sca2026_life_expectancy_women: Studiecommissie voor de Vergrijzing / Federaal Planbureau-Statbel - levensverwachting bij de geboorte, vrouwen
  sca2026_net_migration: Studiecommissie voor de Vergrijzing / Federaal Planbureau-Statbel - internationaal migratiesaldo
  pop2026_total: Bevolkingsvooruitzichten Federaal Planbureau-Statbel 2025-2080 - totale bevolking (30 juni; het model telt op 1 januari)
  pop2026_67_plus: Bevolkingsvooruitzichten Federaal Planbureau-Statbel - bevolking van 67 jaar en ouder

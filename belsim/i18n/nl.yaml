# Translations of the model-provided text (nl). Layout and kinds: see belsim/i18n/__init__.py.
# Keys are stable ids, or the English text itself for group / unit / tag / target / text.
# What is missing: uv run python -m belsim.i18n.check   (missing entries fall back to English)
line:
  revenue.ssc_employer_private:
    label: Werkgeversbijdragen, privésector
    description: 'Werkelijke sociale werkgeversbijdragen betaald door werkgevers buiten de overheid: faciaal tarief op de brutolonen, verminderd met de structurele vermindering (lage lonen) en, vanaf midden 2025, de vrijstelling boven het plafond voor zeer hoge lonen.'
  revenue.ssc_employer_public:
    label: Werkgeversbijdragen, overheidssector
    description: Werkelijke sociale werkgeversbijdragen die de gezamenlijke overheid op haar eigen loonmassa betaalt.
  revenue.ssc_imputed:
    label: Toegerekende bijdragen (ambtenarenpensioenen)
    description: Toegerekende werkgeversbijdragen, de tegenhanger van de niet-gekapitaliseerde ambtenarenpensioenen (ook als uitgave geboekt).
  revenue.ssc_employee:
    label: Werknemersbijdragen
    description: Persoonlijke bijdragen op de lonen (13,07 %) verminderd met de werkbonus voor lage lonen (luik A en luik B).
  revenue.ssc_self_employed:
    label: Bijdragen van zelfstandigen
    description: Sociale bijdragen van de zelfstandigen (20,5 % / 14,16 % met inkomensplafonds en een minimumbijdrage).
  revenue.ssc_replacement_income:
    label: Bijdragen op vervangingsinkomens
    description: Bijdragen van niet-werkenden, hoofdzakelijk de ZIV-bijdrage van 3,55 % op de pensioenen.
  revenue.special_ssc:
    label: Bijzondere bijdrage voor de sociale zekerheid
    description: Bijzondere bijdrage van de werknemers per schijf van het belastbaar inkomen (in het ESA geboekt als inkomstenbelasting, ontvangen door de sociale zekerheid); gehalveerd en geïndividualiseerd vanaf inkomstenjaar 2028.
  revenue.pit_federal:
    label: Personenbelasting, federaal
    description: Federale personenbelasting (bedrijfsvoorheffing, voorafbetalingen, inkohieringen, niet-inwoners) na overdracht van het gewestelijke aandeel; na aftrek van de federale belastingvermindering voor pensioensparen.
  revenue.pit_regional:
    label: Personenbelasting, gewestelijke opcentiemen
    description: Gewestelijke opcentiemen (centimes additionnels) op de gereduceerde belasting Staat, na aftrek van de gewestelijke belastingverminderingen (dienstencheques, wonen).
  revenue.pit_local:
    label: Personenbelasting, gemeentelijke opcentiemen
    description: Gemeentelijke opcentiemen op de personenbelasting.
  revenue.cit:
    label: Vennootschapsbelasting
    description: Vennootschapsbelasting incl. voorafbetalingen, inkohieringen, buitenlandse vennootschappen en roerende voorheffing betaald door vennootschappen.
  revenue.vat:
    label: Btw
    description: Belasting over de toegevoegde waarde op de consumptie van de huishoudens, de investeringen in woningen, de overheidsaankopen en de inputs van vrijgestelde sectoren.
  revenue.excise_fuel:
    label: Accijnzen op brandstoffen en energieproducten
    description: Accijnzen op minerale oliën en energieproducten, incl. de bijdragen voor de strategische voorraden.
  revenue.excise_tobacco:
    label: Accijnzen op tabak
    description: Accijnzen op tabaksproducten.
  revenue.excise_alcohol:
    label: Accijnzen op alcohol
    description: Accijnzen op bier, wijn, gedistilleerde dranken en tussenproducten.
  revenue.excise_energy:
    label: Federale energieheffingen
    description: Bijdrage op de energie, federale bijdrage op elektriciteit en gas, bijdragen op huisbrandolie.
  revenue.energy_green_levies:
    label: Groenestroomcertificaten en gewestelijke energieheffingen
    description: Gewestelijke groenestroomverplichtingen en nettoeslagen die als belastingen op energie worden geboekt.
  revenue.excise_beverages_packaging:
    label: Accijnzen op frisdranken en koffie, verpakkingsheffing
    description: Accijnzen op alcoholvrije dranken en koffie, verpakkingsheffing, heffingen voor de dierengezondheid.
  revenue.insurance_premium_tax:
    label: Taks op de verzekeringspremies
    description: Jaarlijkse taks op de verzekeringsverrichtingen (9,25 %, 9,60 % vanaf juli 2026) en toeslagen voor de sociale zekerheid op auto-, brand- en hospitalisatieverzekeringen.
  revenue.gambling_lottery:
    label: Belastingen op spelen en weddenschappen en Nationale Loterij
    description: Gewestelijke belastingen op spelen en weddenschappen, winst en monopolierente van de Nationale Loterij.
  revenue.withholding_tax:
    label: Roerende voorheffing op interesten en dividenden
    description: Roerende voorheffing (30 %) op de interesten en dividenden die de huishoudens ontvangen.
  revenue.capital_gains_tax:
    label: Meerwaardebelasting op financiële activa
    description: Belasting op gerealiseerde meerwaarden op financiële activa (10 % vanaf 2026, wet van 6 april 2026). De opbrengst volgt de officiële raming en is niet gekalibreerd.
  revenue.securities_account_tax:
    label: Taks op de effectenrekeningen
    description: Jaarlijkse taks op de effectenrekeningen boven 1 miljoen EUR (0,15 %, 0,30 % vanaf 2026).
  revenue.stock_exchange_tax:
    label: Beurstaks
    description: Taks op de beursverrichtingen (TOB).
  revenue.registration_duties:
    label: Registratierechten
    description: Gewestelijke registratierechten op de aankoop van onroerend goed en hypotheekrechten.
  revenue.inheritance_gift_tax:
    label: Successie- en schenkingsrechten
    description: Gewestelijke successierechten (erfbelasting) en schenkingsrechten (schenkbelasting).
  revenue.property_tax:
    label: Onroerende voorheffing
    description: 'Onroerende voorheffing (précompte immobilier): gewestelijke heffing plus provinciale en gemeentelijke opcentiemen.'
  revenue.vehicle_taxes:
    label: Verkeers- en wegenbelastingen
    description: Jaarlijkse verkeersbelasting, belasting op de inverkeerstelling (BIV/TMC) en kilometerheffing, betaald door huishoudens en ondernemingen.
  revenue.environmental_taxes:
    label: Emissierechten en andere milieubelastingen
    description: Geveilde ETS-emissierechten, gewestelijke heffingen op water, afval en mest.
  revenue.bank_levies:
    label: Heffingen op banken en de financiële sector
    description: Jaarlijkse taks op de kredietinstellingen, bijdrage voor de depositogarantie, taks op de collectieve beleggingsinstellingen en de verzekeringsondernemingen.
  revenue.nuclear_levy:
    label: Nucleaire heffing
    description: Bijdrage ten laste van de kernexploitanten (repartitiebijdrage).
  revenue.pharma_levies:
    label: Heffingen op de farmaceutische industrie
    description: Heffingen op de omzet van de farmaceutische industrie (voor de sociale zekerheid).
  revenue.other_taxes_production:
    label: Overige belastingen op productie en producten
    description: Lokale bedrijfsbelastingen, griffie- en documentrechten, vliegtaks, overige federale en gewestelijke belastingen op de productie.
  revenue.other_taxes_income_wealth:
    label: Overige belastingen op inkomen, vermogen en kapitaal
    description: Lokale belastingen op huishoudens, taks op de vzw's, taks op het langetermijnsparen, fiscale regularisatie.
  revenue.sales:
    label: Verkopen van goederen en diensten
    description: Marktoutput, output voor eigen finaal gebruik en betalingen voor niet-marktoutput (retributies, inschrijvingsgelden, ziekenhuis- en zorgbijdragen).
  revenue.interest_received:
    label: Ontvangen rente
    description: Rente ontvangen van buiten de gezamenlijke overheid.
  revenue.dividends_received:
    label: Ontvangen dividenden
    description: Dividenden uit overheidsparticipaties (Belfius, BNP Paribas, Proximus, bpost, Nationale Bank, gewestelijke en gemeentelijke participaties).
  revenue.rent_other_property_income:
    label: Pachten en overig inkomen uit vermogen
    description: Pachten op grond en natuurlijke hulpbronnen, overig inkomen uit beleggingen.
  revenue.eu_transfers_current:
    label: Lopende overdrachten van de EU
    description: Lopende overdrachten van de EU-instellingen (incl. subsidies uit de herstel- en veerkrachtfaciliteit tot 2026).
  revenue.other_current_transfers:
    label: Overige ontvangen lopende overdrachten
    description: Diverse lopende overdrachten van buiten de gezamenlijke overheid, overige internationale samenwerking, ontvangen subsidies.
  revenue.eu_transfers_capital:
    label: Kapitaaloverdrachten van de EU
    description: Investeringsbijdragen van de EU-instellingen.
  revenue.other_capital_transfers:
    label: Overige ontvangen kapitaaloverdrachten
    description: Investeringsbijdragen en overige kapitaaloverdrachten van buiten de gezamenlijke overheid.
  revenue.uncollectible_taxes:
    label: Gevestigde maar waarschijnlijk oninbare belastingen
    description: 'ESA-correctie D.995 (negatief): gevestigde btw, voorheffingen en bijdragen die niet zullen worden geïnd.'
  expenditure.interest:

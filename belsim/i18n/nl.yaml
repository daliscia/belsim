  ar2024_pensions: Ageing Report 2024 - bruto-overheidsuitgaven voor pensioenen
  ar2024_health: 'Ageing Report 2024 - overheidsuitgaven voor gezondheidszorg (niveau 2022: 6,14)'
  ar2024_health_change: Ageing Report 2024 - wijziging van de overheidsuitgaven voor gezondheidszorg (de gepubliceerde wijziging 2022-2070 bedraagt +0,63 procentpunt)
  ar2024_long_term_care: 'Ageing Report 2024 - overheidsuitgaven voor langdurige zorg (niveau 2022: 2,31)'
  ar2024_education: 'Ageing Report 2024 - overheidsuitgaven voor onderwijs (niveau 2022: 5,63)'
  ar2024_employment_rate_20_64: Ageing Report 2024 - werkgelegenheidsgraad 20-64 jaar
  ar2024_unemployment_rate: Ageing Report 2024 - werkloosheidsgraad 20-64 jaar

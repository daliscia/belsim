measure:
  VAT standard rate 21% -> 22%:
    name: Normaal btw-tarief 21% -> 22%
    description: Het normale btw-tarief vanaf 2027 met één punt verhogen.
  VAT reduced rate 6% -> 9%:
    name: Verlaagd btw-tarief 6% -> 9%
    description: Het verlaagde btw-tarief (voeding, geneesmiddelen, renovatie ...) vanaf 2027 van 6% naar 9% optrekken.
  Income tax - tax-free allowance +EUR 2,000:
    name: Personenbelasting - belastingvrije som +2.000 EUR
    description: De belastingvrije som in de personenbelasting met 2.000 EUR verhogen (euro's van 2027, daarna geïndexeerd) voor inkomen uit arbeid. Zoals in de hervorming van 2026 wordt de verhoging geneutraliseerd voor pensioenen en vervangingsinkomens (laat de tweede wijziging weg om ze aan iedereen toe te kennen).
  Income tax - top rate 50% -> 55%:
    name: Personenbelasting - hoogste tarief 50% -> 55%
    description: Het hoogste marginale tarief van de personenbelasting vanaf 2027 met vijf punten verhogen.
  Corporate tax 25% -> 20%:
    name: Vennootschapsbelasting 25% -> 20%
    description: Het standaardtarief van de vennootschapsbelasting vanaf 2027 verlagen tot 20%.
  Employer social contributions -2 points:
    name: Werkgeversbijdragen -2 punten
    description: Het faciale tarief van de sociale werkgeversbijdragen vanaf 2027 met twee punten verlagen.
  Capital gains tax 10% -> 20%:
    name: Meerwaardebelasting 10% -> 20%
    description: Het tarief van de belasting op financiële meerwaarden vanaf 2027 verdubbelen.
  Withholding tax 30% -> 35%:
    name: Roerende voorheffing 30% -> 35%
    description: De roerende voorheffing op interesten en dividenden vanaf 2027 met vijf punten verhogen.
  Fuel excise +10 cents per litre:
    name: Accijnzen op brandstof +10 cent per liter
    description: De accijns op motorbrandstoffen vanaf 2027 met 0,10 EUR per liter verhogen.
  Tobacco excise +25%:
    name: Accijnzen op tabak +25%
    description: De accijnzen op tabak vanaf 2027 met een kwart verhogen.
  Legal pension age 68 from 2035:
    name: Wettelijke pensioenleeftijd 68 jaar vanaf 2035
    description: De wettelijke pensioenleeftijd in 2035 van 67 naar 68 jaar optrekken.
  Keep legal pension age at 66:
    name: Wettelijke pensioenleeftijd op 66 jaar houden
    description: De bij wet vastgelegde verhoging van de wettelijke pensioenleeftijd naar 67 jaar in 2030 schrappen.
  Pension malus 5% per year of early retirement:
    name: Pensioenmalus van 5% per jaar vervroegde pensionering
    description: Nieuwe pensioenen vanaf 2027 met 5% verminderen per jaar pensionering vóór de wettelijke leeftijd (en latere pensionering symmetrisch belonen).
  Restore civil-servant pension perequation:
    name: Perequatie van de ambtenarenpensioenen herstellen
    description: De reële loongroei in de overheidssector vanaf 2027 opnieuw volledig doorrekenen in de lopende ambtenarenpensioenen, zonder het plafond van 0,3% per jaar (de perequatie werd afgeschaft door de pensioenwet van 30 mei 2026).
  Abolish the unemployment benefit time limit:
    name: Beperking in de tijd van de werkloosheidsuitkeringen afschaffen
    description: Terugkeren naar werkloosheidsuitkeringen van onbeperkte duur (de beperking tot 12-24 maanden van 2026 ongedaan maken).
  Index jump of 2% over 2027-2029:
    name: Indexsprong van 2% over 2027-2029
    description: 2% automatische indexering van de lonen en de sociale uitkeringen overslaan, gespreid over drie jaar naarmate de inflatie oploopt (de vorm van de indexsprong van 2015).
  Index jump in 2027:
    name: Indexsprong in 2027
    description: Eén volledig jaar automatische indexering van de lonen en de sociale uitkeringen overslaan (2027; ongeveer 3% in het basisscenario, meer dan de indexsprong van 2015).
  Health-care growth norm 2%:
    name: Groeinorm van de gezondheidszorg 2%
    description: De reële groei van de uitgaven voor gezondheidszorg vanaf 2030 beperken tot 2% per jaar (basisscenario 2,5%).
  Defence 3.5% of GDP by 2035:
    name: Defensie 3,5% van het bbp tegen 2035
    description: De defensie-uitgaven lineair optrekken van het pad in het basisscenario tot 3,5% van het bbp in 2035.
  Public investment +1% of GDP:
    name: Overheidsinvesteringen +1% van het bbp
    description: De overheidsinvesteringen met één punt van het bbp verhogen, geleidelijk ingevoerd over 2027-2030.
  Public employment -1% a year for 5 years:
    name: Overheidswerkgelegenheid -1% per jaar gedurende 5 jaar
    description: De werkgelegenheid bij de gezamenlijke overheid van 2027 tot 2031 met 1% per jaar inkrimpen.
  Cut subsidies to firms by 10%:
    name: Subsidies aan ondernemingen met 10% verlagen
    description: De loonsubsidies, dienstencheques, vervoers-, energie- en overige subsidies vanaf 2027 met 10% verminderen.
  Welfare envelope restored from 2027:
    name: Welvaartsenveloppe hersteld vanaf 2027
    description: De reële verhogingen van pensioenen en uitkeringen hervatten vanaf 2027 in plaats van 2030.
  Net migration +20,000 a year:
    name: Migratiesaldo +20.000 per jaar
    description: Hoger internationaal migratiesaldo dan in de referentieprojectie, vanaf 2027.
  Productivity growth +0.25 point:
    name: Productiviteitsgroei +0,25 punt
    description: Snellere trendmatige productiviteitsgroei dan in de aanname van het basisscenario, vanaf 2027.
  Interest rates +1 point:
    name: Rentetarieven +1 punt
    description: Lange en korte rente vanaf 2027 één punt boven de aanname van het basisscenario.
  Tax thresholds follow prices only (fiscal drag):
    name: Fiscale grensbedragen volgen enkel de prijzen (fiscal drag)
    description: De grensbedragen van de inkomstenbelasting en de bijdragen na 2030 enkel aan de prijzen indexeren (huidige wetgeving), zodat de belastingdruk met de reële lonen toeneemt.
  Static costing (no behavioural responses):
    name: Statische doorrekening (geen gedragsreacties)
    description: Alle gedrags- en vraagreacties uitschakelen; voeg toe aan een scenario om het mechanische effect ervan te zien.
  'Wallonia: structural unemployment -1 point by 2032':
    name: 'Wallonië: structurele werkloosheid -1 punt tegen 2032'
    description: De structurele werkloosheidsgraad van Wallonië met één procentpunt verlagen, geleidelijk ingevoerd van 2027 tot 2032 (arbeidsmarkthervorming, opleiding, mobiliteit).
  'Brussels: activation effort +25%':
    name: 'Brussel: activeringsinspanning +25%'
    description: De activeringsinspanning van Actiris vanaf 2027 met een kwart verhogen (geleidelijk ingevoerd over drie jaar) - lagere structurele werkloosheid in Brussel en meer personen die door de federale beperking in de tijd zijn uitgesloten, vinden werk.
  'Wallonia: invalidity -10% (return to work)':
    name: 'Wallonië: invaliditeit -10% (terug naar werk)'
    description: Het aandeel personen in invaliditeit in Wallonië met 10% verminderen via gewestelijke re-integratietrajecten, geleidelijk ingevoerd van 2027 tot 2032.
  'Flanders: +0.25 point regional productivity growth':
    name: 'Vlaanderen: +0,25 punt regionale productiviteitsgroei'
    description: De productiviteit in Vlaanderen groeit vanaf 2027 een kwart punt per jaar sneller dan de nationale trend.
  'Wallonia: family allowance +10%':
    name: 'Wallonië: kinderbijslag +10%'
    description: De Waalse kinderbijslag vanaf 2027 met 10% verhogen.
  'Brussels: public employment -1% a year for 5 years':
    name: 'Brussel: overheidswerkgelegenheid -1% per jaar gedurende 5 jaar'
    description: Het aantal overheidswerknemers dat in Brussel woont van 2027 tot 2031 met 1% per jaar verminderen (alle bestuursniveaus).
  'Flanders: public investment +0.5% of regional GDP':
    name: 'Vlaanderen: overheidsinvesteringen +0,5% van het gewestelijk bbp'
    description: De overheidsinvesteringen van de Vlaamse overheden met 0,5% van het Vlaamse bbp verhogen, geleidelijk ingevoerd over 2027-2029.
  'French Community: education cost per pupil -5%':
    name: 'Franse Gemeenschap: onderwijskosten per leerling -5%'
    description: De overheidskosten per leerling in het onderwijs van de Franse Gemeenschap (Wallonië en de Franstalige scholen in Brussel) met 5% verlagen, geleidelijk ingevoerd over 2027-2030.
  'Flanders: elderly-care spending +10%':
    name: 'Vlaanderen: uitgaven voor ouderenzorg +10%'
    description: De Vlaamse uitgaven voor langdurige zorg (residentiële zorg, zorgbudgetten) vanaf 2027 met 10% verhogen.
  'Brussels: service-voucher subsidy -20%':
    name: 'Brussel: subsidie voor dienstencheques -20%'
    description: De Brusselse subsidie per dienstencheque vanaf 2027 met 20% verlagen.
  'Flanders: international immigration +20%':
    name: 'Vlaanderen: internationale immigratie +20%'
    description: Vanaf 2027 vestigen zich een vijfde meer internationale immigranten in Vlaanderen (het arbeidsmigratiebeleid is een gewestbevoegdheid); de immigratie naar de andere gewesten blijft ongewijzigd.
  'Brussels: a quarter fewer residents leave for the other regions':
    name: 'Brussel: een kwart minder inwoners vertrekt naar de andere gewesten'
    description: De verhuizingen uit Brussel naar Vlaanderen en Wallonië vanaf 2027 met 25% verminderen (woon- en gezinsbeleid dat huishoudens in de stad houdt), geleidelijk ingevoerd over 2027-2030.

  fpb2026_health_index: Middellangetermijnvooruitzichten van het Federaal Planbureau - gezondheidsindex, jaarlijkse verandering
  fpb2026_employment: Middellangetermijnvooruitzichten van het Federaal Planbureau - binnenlandse werkgelegenheid (het model telt de nationale werkgelegenheid van inwoners)

text:
  "Incomes vary between income groups; inside a group they are spread around the group's income by an assumed dispersion (in the poverty rates, the Gini coefficient and S80/S20 only) and partners' incomes are combined independently; capital and property income and the recurrent property tax are spread by tenth of income on assumed shares (the amount an income survey records, not the national-accounts total): inequality and poverty indicators are indicative; read their change between baseline and scenario rather than their level. By household type the poverty rates are within about 2 points of the observed ones: somewhat too high for people living alone and single parents, too low for families with children and households of three or more adults.": "De inkomens verschillen tussen inkomensklassen; binnen een klasse worden ze rond het inkomen van de klasse gespreid volgens een aangenomen spreiding (alleen voor de armoedecijfers, de Gini-coëfficiënt en S80/S20) en de inkomens van partners worden onafhankelijk gecombineerd; roerende en onroerende inkomsten en de onroerende voorheffing worden per inkomenstiende gespreid volgens aangenomen aandelen (het bedrag dat een inkomensenquête registreert, niet het totaal van de nationale rekeningen): de ongelijkheids- en armoede-indicatoren zijn indicatief; lees hun verandering tussen basisscenario en scenario, niet hun niveau. Per huishoudtype liggen de armoedecijfers binnen ongeveer 2 punten van de waargenomen cijfers: wat te hoog voor alleenwonenden en alleenstaande ouders, te laag voor gezinnen met kinderen en huishoudens van drie of meer volwassenen."
  "Weights are the 2024 household structure rescaled to the baseline head counts of the year (workers, pensioners, unemployed, long-term sick), the same in both runs: people who find or lose a job because of the scenario are not shown (see the employment results for that). In the baseline the unemployed who no longer receive a benefit and the people excluded by the time limit who claim it live on the integration income.": "De gewichten zijn de huishoudstructuur van 2024, herschaald naar de aantallen van het basisscenario in het jaar (werkenden, gepensioneerden, werklozen, langdurig zieken), dezelfde in beide simulaties: mensen die door het scenario een job vinden of verliezen, worden niet getoond (zie daarvoor de werkgelegenheidsresultaten). In het basisscenario leven de werklozen die geen uitkering meer ontvangen en de mensen die door de beperking in de tijd zijn uitgesloten en het aanvragen, van het leefloon."
  ? 'Baseline values are levels in the stated unit for a year, or for a period "y0-y1" an average annual growth / a change in points (see each entry''s transform). Measure targets are scenario-minus-baseline effects. Sign convention for budget effects: positive = improves the general-government balance.'
  : 'De waarden van het basisscenario zijn niveaus in de vermelde eenheid voor een jaar of, voor een periode "y0-y1", een gemiddelde jaarlijkse groei / een wijziging in punten (zie de transformatie van elk item). De doelwaarden van maatregelen zijn effecten van het scenario ten opzichte van het basisscenario. Tekenconventie voor budgettaire effecten: positief = verbetert het saldo van de gezamenlijke overheid.'
  ? 'Synthetic-household approximation: the tax-benefit rules of the model are applied to household types (2024 household statistics) repeated over the income groups of the tax returns, so the households add up to the income tax of the budget. It is not a microsimulation on survey or administrative data.'
  : 'Benadering met synthetische huishoudens: de belasting- en uitkeringsregels van het model worden toegepast op huishoudtypes (huishoudstatistieken van 2024) die over de inkomensgroepen van de belastingaangiften worden herhaald, zodat de huishoudens samen overeenkomen met de personenbelasting van de begroting. Het is geen microsimulatie op enquête- of administratieve gegevens.'
  ? The change in income is net of the scenario's effect on consumer prices, valued on the household's baseline basket; it is expressed in euros of the year at baseline prices.
  : De inkomenswijziging is gecorrigeerd voor het effect van het scenario op de consumptieprijzen, gewaardeerd op de korf van het huishouden in het basisscenario; ze is uitgedrukt in euro's van het jaar tegen de prijzen van het basisscenario.
  ? Earnings are those of all employees (part-time included) from the simulated earnings distribution; the income taxed is that of the same income group in the tax returns (untaxed pay components, part-year work).
  : De lonen zijn die van alle werknemers (deeltijdwerkers inbegrepen) uit de gesimuleerde loonverdeling; het belaste inkomen is dat van dezelfde inkomensgroep in de belastingaangiften (onbelaste loonbestanddelen, werk gedurende een deel van het jaar).
  wage levels and indexation from the macro simulation, net of tax under baseline rules: loonniveaus en indexering uit de macrosimulatie, na belasting volgens de regels van het basisscenario
  replacement incomes, assistance and family allowances (rules and indexation): vervangingsinkomens, bijstand en kinderbijslag (regels en indexering)
  employee social contributions: sociale werknemersbijdragen
  VAT, excise and the resulting consumer prices on the baseline basket: btw, accijnzen en de daaruit voortvloeiende consumptieprijzen op de korf van het basisscenario
  ? Pensioner households receive the model's average pension income per pensioner (pensions in payment, all pensions of a person together), which reacts slowly to rules that only apply to new pensioners.
  : Huishoudens van gepensioneerden ontvangen het gemiddelde pensioeninkomen per gepensioneerde van het model (lopende pensioenen, alle pensioenen van een persoon samen), dat slechts traag reageert op regels die alleen voor nieuwe gepensioneerden gelden.
  personal income tax incl. local surcharges and child credit, withholding tax on capital income, recurrent property tax: personenbelasting incl. gemeentelijke opcentiemen en belastingkrediet voor kinderen, roerende voorheffing, onroerende voorheffing
  "Disposable income per household, EUR per year, in the concept of the income survey (EU-SILC): gross incomes incl. capital and property income and the other cash benefits of the budget + family allowances - employee social contributions - personal income tax, withholding tax on capital income and recurrent property tax. 'delta' is the change in disposable income less the extra cost of the baseline basket at scenario prices.": "Beschikbaar inkomen per huishouden, in euro per jaar, in het concept van de inkomensenquête (EU-SILC): bruto-inkomens, inclusief inkomen uit kapitaal en vermogen en de andere uitkeringen in geld uit de begroting + kinderbijslag - persoonlijke sociale bijdragen - personenbelasting, roerende voorheffing en onroerende voorheffing. 'delta' is de wijziging van het beschikbaar inkomen min de meerkost van de korf van het basisscenario tegen de prijzen van het scenario."
  "Benefits use average rules (one cohabitant rate, no head-of-household rate); the income guarantee for the elderly and the social supplement to family allowances follow simplified rules; the cash benefits of the budget that the rules do not produce (sickness and career-break benefits, allowances for persons with disabilities, family allowances of students, integration income of people living with others) are shared between the adults or children concerned on assumed keys; social tariffs, housing costs, regional tax differences, company cars and wealth are not modelled.": "De uitkeringen volgen gemiddelde regels (één tarief voor samenwonenden, geen tarief voor gezinshoofden); de inkomensgarantie voor ouderen en de sociale toeslag bij de kinderbijslag volgen vereenvoudigde regels; de uitkeringen in geld uit de begroting die de regels niet opleveren (ziekte- en loopbaanonderbrekingsuitkeringen, tegemoetkomingen voor personen met een handicap, kinderbijslag van studenten, leefloon van wie bij anderen woont) worden volgens aangenomen sleutels verdeeld over de betrokken volwassenen of kinderen; sociale tarieven, woonkosten, gewestelijke belastingverschillen, bedrijfswagens en vermogen zijn niet gemodelleerd."

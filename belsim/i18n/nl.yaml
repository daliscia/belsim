  ar2024_potential_growth: 'Ageing Report 2024 - potentiële bbp-groei (gemiddelde 2022-2070: 1,32)'
  ar2024_population: Ageing Report 2024 (EUROPOP2023) - totale bevolking
  fpb_promes2026_health_real_growth: PROMES-projectie van het Federaal Planbureau (bij ongewijzigd beleid) - gemiddelde jaarlijkse reële groei van de overheidsuitgaven voor de ziekteverzekering over tien jaar; 2,6% per jaar werd ook waargenomen in 2020-2025. De DC2024-doorrekeningen gebruiken een reëel basisscenario van 3,3% per jaar
  coa2026_defence_2pct_norm: Federaal begrotingsplan - defensie-inspanning op de NAVO-norm van 2% (totale defensie-inspanning incl. pensioenen en andere departementen). Niet vergelijkbaar met de modellijn vóór 2029 - het model boekt defensie op basis van de nationale rekeningen (materieel bij de levering, 1,4% van het bbp in 2025, oplopend tot 2,0% in 2029)
  coa2026_securities_tax_2024: Jaarlijkse taks op de effectenrekeningen - realisatie 2024
  budget2026_excise_total: Accijnzen en diversen, federale kasontvangsten (realisatie 2024, monitoring 2025). Op kasbasis en incl. kleine diverse posten; model = ESA-accijnslijnen
  budget2025_excise_energy: Accijnzen op energieproducten en elektriciteit, vermoedelijke realisatie 2024 (som van de lijn van de Rijksmiddelenbegroting 5.558,2 en het toegewezen deel 1.321,0)
  hermes_public_investment_cut: HERMES-variant - overheidsinvesteringen ex ante met 0,5% van het bbp verlaagd
  hermes_public_consumption_cut: HERMES-variant - overheidsconsumptie (aankopen van goederen en diensten) ex ante met 0,5% van het bbp verlaagd. Modelequivalent - lineaire factor op de werkingsuitgaven
  hermes_social_benefits_cut: HERMES-variant - sociale uitkeringen ex ante met 0,5% van het bbp verlaagd (voor de helft pensioenen, voor de helft kinderbijslag)
  hermes_vat_increase: HERMES-variant - btw op de particuliere consumptie ex ante met 0,5% van het bbp verhoogd (alle tarieven proportioneel). Het officiële cijfer dat het dichtst aanleunt bij "+1 punt normaal btw-tarief", waarvoor geen officiële doorrekening is gevonden
  hermes_employer_ssc_increase: HERMES-variant - sociale werkgeversbijdragen ex ante met 0,5% van het bbp verhoogd (arbeidskosten per uur +1,62% in jaar t, +1,38% in t+4)
  hermes_employee_ssc_increase: HERMES-variant - sociale werknemersbijdragen ex ante met 0,5% van het bbp verhoogd
  hermes_pit_increase: HERMES-variant - personenbelasting ex ante met 0,5% van het bbp verhoogd
  hermes2018_employer_ssc_cut_general: HERMES-variant (editie 2018) - algemene verlaging van de werkgeversbijdragen met 0,5% van het bbp ex ante (impliciete tarieven ongeveer -8%); terugverdieneffect 38% / 51% / 52% in t / t+2 / t+4
  hermes2018_employer_ssc_cut_low_wage: HERMES-variant (editie 2018) - verlaging van de werkgeversbijdragen met 0,5% van het bbp ex ante gericht op de lage lonen (tarieven voor lage lonen ongeveer -40%). Creëert 60% meer jobs dan de algemene verlaging (35,2 tegenover 21,9 duizend in t+4)
  hermes2018_public_consumption_multiplier: HERMES-variant (editie 2018) - overheidsconsumptie met 0,5% van het bbp verhoogd - begrotingsmultiplicator 0,70 in jaar t, 0,64 in t+4; terugverdieneffect 34%, daarna 27%
  dc2024_allowance_13000: DC2024 VB-101 - belastingvrije som verhoogd van 10.570 EUR tot 13.000 EUR voor alle belastingplichtigen. Budgettaire impuls in prijzen van 2024 en situatie 2024
  arizona_allowance_15600: Arizona-belastinghervorming - belastingvrije som verhoogd van 10.910 EUR tot 15.600 EUR tegen inkomstenjaar 2030, geneutraliseerd voor pensioenen en vervangingsinkomens (microsimulatie FOD Financiën, alle niveaus, tegenover de geïndexeerde belastingvrije som van vóór de hervorming). De hervorming zit in het basisscenario van het model; het contrafactische scenario herstelt de belastingvrije som van vóór de hervorming (11.176 in euro's van 2026 volgens params/revenue.yaml)
  dc2024_pit_45_to_40: DC2024 VB-103 - tarief van 45% in de personenbelasting verlaagd tot 40%
  dc2024_abolish_special_ssc: DC2024 N-VA-101 / MR-102 - afschaffing van de bijzondere bijdrage voor de sociale zekerheid (BBSZ)
  dc2024_vat_food_zero: DC2024 PVDA-PTB-102 - btw op voeding verlaagd van 6% tot 0%
  cit_reform_2018_rate_cut: Hervorming van de vennootschapsbelasting 2018-2020 - nominaal tarief van 33,99% naar 25% (impliciet tarief van 32,20% naar 24,25%), brutokosten van de tariefverlaging op kruissnelheid, vóór compenserende maatregelen (FOD Financiën, macro-effecten niet meegerekend). Ongeveer 530 mln. EUR per nominaal punt (eigen berekening)
  securities_tax_doubling: Taks op de effectenrekeningen verdubbeld van 0,15% tot 0,30% in 2026 - bijkomende opbrengst op jaarbasis (414 in 2026), zonder verondersteld gedragseffect
  capital_gains_tax_yield: Belasting van 10% op de meerwaarden op financiële activa vanaf 2026 - verwachte opbrengst (FOD Financiën - 120 netto in 2026, 600 vanaf 2032; meerjarenbegroting - 500 tegen de horizon 2029). Het Rekenhof acht de raming onbetrouwbaar; er is geen gedrag in gemodelleerd
  unemployment_time_limit: Werkloosheidsuitkeringen beperkt tot twee jaar (van kracht in 2026, 55-plussers met een lange loopbaan vrijgesteld) tegenover onbeperkte duur
  dc2024_unemployment_limit_direct_saving: DC2024 MR-201 - werkloosheidsuitkeringen beperkt tot 2 jaar (55-plussers uitgezonderd), enkel de rechtstreekse besparing op de werkloosheidsuitgaven, prijzen en situatie van 2024
  dc2024_pension_age_65: DC2024 PVDA-PTB-301 - wettelijke pensioenleeftijd op 65 jaar gehouden in plaats van 66 jaar vanaf 2025 (budgettaire impuls, prijzen van 2024)
  dc2024_health_norm_1_5: DC2024 Open Vld-402 - reële groeinorm van de gezondheidszorg van 1,5% per jaar vanaf 2025, tegenover het FPB-basisscenario bij ongewijzigd beleid van 3,3% reële groei per jaar (prijzen van 2024)
  pension_bonus_malus_2026: Arizona-pensioenbonus-malus vanaf 2027 (malus van 2% per jaar vervroegde pensionering voor de geboortejaren 1961-65, 4% voor 1966-74, 5% vanaf 1975; oude pensioenbonus afgeschaft), met pensioneringsgedrag. Constante prijzen van 2024
  pension_reform_2015: Pensioenhervorming van 2015 (wettelijke leeftijd 66 jaar in 2025 en 67 jaar in 2030, vervroegd pensioen op 63 jaar met 42 loopbaanjaren, bonus afgeschaft, SWT verstrengd) tegenover geen hervorming, horizon 2060, referentiescenario ("verschuiving"). Het contrafactische scenario van het model herstelt enkel de wettelijke leeftijd van 65 jaar en het vervroegd pensioen op 62 jaar met 40 jaar
  index_jump_2015_fpb: Indexsprong van 2% (2015) voor lonen, overheidswedden en sociale uitkeringen - HERMES-evaluatie van het FPB, zesde jaar (2020). Modelequivalent - één jaar overgeslagen indexering in 2027, afgelezen in 2032
  index_jump_2015_nbb: Indexsprong van 2% (2015) - evaluatie met het kwartaalmodel van de NBB, vijfde jaar (2019), in de veronderstelling van budgetneutraliteit. Modelequivalent zoals hierboven, afgelezen in 2031
  employer_ssc_cut_2016_nbb: Verlaging van de werkgeversbijdragen met 960 mln. EUR in 2016 (mix van lineaire verlaging en lage lonen) - kwartaalmodel van de NBB, vierde jaar (2019). Modelequivalent - één punt werkgeverstarief vanaf 2027 (ongeveer hetzelfde aandeel van het bbp), afgelezen in 2030
  tax_shift_2016_2020_fpb: Volledige taxshift 2015-2020 (lasten op arbeid -2,1% van het bbp, waarvan werkgeversbijdragen in de marktsector -3.642 mln. in 2020; voor 1,2% van het bbp gefinancierd) - FPB HERMES. Gemengd pakket, geen enkelvoudige modelmaatregel
  arizona_pension_reform_fpb: Volledige pensioenhervorming 2025-2026 (bonus-malus, ambtenarenpensioenen, perequatie, gelijkgestelde perioden ...) - evaluatie van het FPB. Voor verscheidene onderdelen is er geen hefboom in het model
  dc2024_wealth_tax: DC2024 Ecolo-103 - vermogensbelasting van 0,5% (1-2 mln.), 1% (2-5 mln.), 2% (boven 5 mln.); geen ontwijking verondersteld (het FPB noemt dit een overschatting). Het model heeft geen parameter voor een vermogensbelasting
  defence_additional_spending: Bijkomende defensie-uitgaven die nodig zijn om 2% van het bbp te bereiken vanaf 2025 in plaats van 2029 (16.783 over 2025-2029). Het vroegere pad zit niet in het model, zodat er geen contrafactisch scenario kan worden opgesteld
  vat_standard_plus_1_point: Officiële doorrekening (FOD Financiën, FPB, NBB, Rekenhof of Hoge Raad van Financiën) van +1 punt normaal btw-tarief (21% naar 22%), statisch of na indexeringseffecten
  arizona_agreement_full_costing: Doorrekening door het FPB van het volledige Arizona-regeerakkoord (saldo en jobs in 2029)
  unemployment_limit_employment_effect: Geïsoleerd officieel werkgelegenheidseffect van de beperking van de werkloosheid tot 2 jaar
  legal_pension_age_67_isolated: Effect van enkel de verhoging van de wettelijke leeftijd van 66 naar 67 jaar op de werkgelegenheid en de pensioenuitgaven
  nbb_tax_shift_study: Eigen evaluatie van de taxshift door de NBB (jobs, bbp, saldo per jaar) en NBB-studie van december 2017 over de hervorming van de vennootschapsbelasting
  defence_2_5_and_3_5_costing: Officiële doorrekening van defensie op 2,5% (2034) of 3,5% (2035) van het bbp
  tobacco_fuel_excise_per_rate_change: Opbrengst van een gegeven verhoging van het accijnstarief op tabak of brandstof (tariefwijziging en opbrengst samen), opbrengst van het cliquetsysteem
  cit_per_point_macro: Ex-postevaluatie (macro) van de verlaging van het tarief van de vennootschapsbelasting
  ec_forecast_2025_values: Waarden voor 2025 uit de najaarsprognoses 2026 van de Europese Commissie en tabel van de voorjaarsprognoses 2026
  hermes_public_employment_variant: HERMES-variant voor de overheidswerkgelegenheid, schokken van 1% van het bbp of horizonten van meer dan vijf jaar
  vat_standard_22_press_2026: Normaal btw-tarief van 21% naar 22% - opbrengst van 1,5 mld. EUR per jaar, genoemd in het begrotingsdebat van 2026 (vicepremier Prévot op RTBF "QR le débat"; hetzelfde cijfer voor het N-VA-voorstel in VRT 25.02.2026 en VTM/Redactie24 25.02.2026). Geen auteur, methode of jaar vermeld; evenmin of het cijfer vóór of na gedragsreacties en indexering geldt
  vat_standard_22_leak_2022: Normaal btw-tarief van 21% naar 22% - 1,9 mld. EUR, cijfer bij de voorstellen van de expertengroep die de blauwdruk voor de belastinghervorming van 2022 voorbereidde (werkgroep van de Hoge Raad van Financiën), zoals uitgelekt in de pers. Niet vermeld of het om een statische raming of een raming met gedragsreacties gaat
  vat_reduced_rates_to_9: Verlaagde btw-tarieven van 6% en 12% samengevoegd tot één tarief van 9% - opbrengst "tussen 1,5 en 3 mld." verwacht door de eerste minister tijdens de begrotingsbesprekingen van oktober 2025 (de hoofdeconoom van Voka noemt 1 mld. haalbaar). De vork hangt af van welke producten op 6% zouden blijven of naar 0% zouden gaan; de modelmaatregel verplaatst alles en zou dus rond of boven de bovengrens van de vork moeten uitkomen
  vat_reform_22_and_9_press_2026: Btw-hervorming besproken voor de begroting 2027 - normaal tarief van 22% plus samenvoeging van 6% en 12% tot 9% - "tussen 2,5 en 4 mld. per jaar volgens ramingen", afhankelijk van de producten tegen nultarief en van de reacties van de consumenten (geen auteur vermeld). Afgevoerd in oktober 2026. De modelmaatregel heeft geen nultarief
  arizona_vat_hotels_12: Btw op logies in hotels en op campings verhoogd van 6% tot 12% op 1 maart 2026 - opbrengst op jaarbasis (raming FOD Financiën op basis van externe gegevens, zonder gedragsreacties). Zit in het basisscenario van het model; het contrafactische scenario herstelt de tariefmix van de categorie restaurants en hotels van vóór de hervorming
  hermes_vat_increase_prices: HERMES-variant - btw ex ante met 0,5% van het bbp verhoogd (zoals hermes_vat_increase) - detail van prijzen, lonen en ontvangsten. De prijzen stijgen meteen met ongeveer 1,2% (volledige doorrekening), de indexering verhoogt de arbeidskosten per uur met 1,33% in jaar t, en de verbetering van het saldo daalt van 0,31 tot 0,15% van het bbp
  hermes_employer_ssc_increase_prices: HERMES-variant - werkgeversbijdragen ex ante met 0,5% van het bbp verhoogd (zoals hermes_employer_ssc_increase) - doorrekening van de arbeidskosten in de consumptieprijzen. Arbeidskosten per uur +1,62 / +1,54 / +1,38%, arbeidskosten per eenheid product +1,38 / +1,16 / +1,01%, consumptiedeflator +0,29 / +0,31 / +0,26% - d.i. ongeveer 0,2% op de consumptieprijzen per 1% arbeidskosten per uur
  hermes2018_vat_cut: HERMES-variant (editie 2018) - btw op de particuliere consumptie ex ante met 0,5% van het bbp verlaagd (-2.328 mln. in jaar t). Consumptiedeflator -1,09 / -1,18 / -1,16%; terugverdieneffect 33% / 62% / 64% in t / t+2 / t+4 omdat lagere prijzen de indexering van lonen en uitkeringen afremmen
  hermes2018_employer_ssc_cut_general_prices: HERMES-variant (editie 2018) - algemene verlaging van de werkgeversbijdragen met 0,5% van het bbp (zoals hermes2018_employer_ssc_cut_general) - doorrekening in de prijzen. Arbeidskosten per uur -1,40 / -1,38 / -1,21%, consumptiedeflator -0,17 / -0,23 / -0,21% (ongeveer 0,15% per 1% arbeidskosten). Variant lage lonen - arbeidskosten -1,73 / -2,05 / -1,97%, deflator -0,22 / -0,35 / -0,35%
  index_jump_2015_nbb_path: Indexsprong van 2% (2015) - kwartaalmodel van de NBB, pad jaar per jaar (zoals index_jump_2015_nbb, dat het vijfde jaar bevat). De consumptieprijzen en de gezondheidsindex dalen met ongeveer een derde van de daling van de arbeidskosten per uur (-1,1% tegenover -3,1% na vijf jaar)
  index_jump_2015_fpb_path: Indexsprong van 2% (2015) - FPB HERMES, pad 2016 / 2018 / 2020 (zoals index_jump_2015_fpb, dat 2020 bevat). Consumptiedeflator -0,2 / -0,4 / -0,6%, d.i. ongeveer een kwart van de daling van de arbeidskosten met 2,6% tegen het zesde jaar - een tragere en kleinere doorrekening dan in het NBB-model
  employer_ssc_cut_2016_nbb_prices: Verlaging van de werkgeversbijdragen met 960 mln. EUR in 2016, mix van lineaire verlaging en lage lonen (zoals employer_ssc_cut_2016_nbb) - kwartaalmodel van de NBB, doorrekening in de prijzen. Arbeidskosten per uur -0,7 / -1,0 / -0,9 / -0,9%, consumptieprijzen -0,2 / -0,4 / -0,3 / -0,3% in de jaren 1 tot 4 (ongeveer een derde)
  vat_reform_2023_van_peteghem: Voorstel van belastinghervorming van de minister van Financiën van maart 2023 - verlaagde btw-tarieven van 6% en 12% samengevoegd tot 9%, met 0% voor groenten en fruit, geneesmiddelen, luiers en openbaar vervoer en behoud van 6% voor gas, elektriciteit, water, verwarming en afbraak en heropbouw - verwachte opbrengst (cijfer van het kabinet, gemeld door Belga; jaar en methode niet vermeld). De aandelen tegen nultarief en de beschermde aandelen kunnen in vat.mix niet worden afgezonderd; vergelijk met vat_reduced_rates_to_9, dat alles naar 9% verplaatst
  arizona_vat_rate_changes_2026: Wijzigingen van btw-tarieven uit het begrotingsakkoord van november 2025, jaarlijkse opbrengsten geraamd door de FOD Financiën op basis van externe gegevens (geen gedetailleerde gegevens uit de btw-aangiften, geen gedragsreacties). Hotels en pesticiden traden in werking op 1 maart 2026; de verhogingen voor afhaalmaaltijden en cultuur/sport werden ingetrokken op 13.02.2026 (zie de bronnota bij vat.mix in params/revenue.yaml). De categorieën kunnen in vat.mix niet worden afgezonderd (hotels - zie arizona_vat_hotels_12)
  excise_reform_2026_2029: Hervorming van de energieaccijnzen 2026-2029 (jaarlijkse verhogingen voor fossiele brandstoffen, verlagingen voor elektriciteit) - gecumuleerde opbrengsten in 2029 zoals begroot; de FOD Financiën baseert ze op de ontvangsten van 2025, zonder volume- of gedragseffecten. De beoogde verhoging van het gastarief bedraagt 1,08 EUR per MWh, tot 10,31 in 2026. De verschuiving van elektriciteit naar gas zit al in het basisscenario van het model (excise.energy_shift_factor) en de tariefwijzigingen voor benzine, diesel en huisbrandolie zijn niet vermeld
  tax_shift_indirect_tax_measures: Maatregelen inzake indirecte belastingen ter financiering van de taxshift 2015-2020, ex-anteopbrengsten gebruikt door het FPB (bijkomende bedragen per jaar, accijnzen inclusief btw). De omvang van de tariefwijzigingen staat niet in het rapport, dus geen modelmaatregel
  tax_shift_2016_2020_fpb_prices: Volledige taxshift 2015-2020 - FPB HERMES, effect op de prijzen en de arbeidskosten (zoals tax_shift_2016_2020_fpb). De consumptieprijzen stijgen omdat de verhogingen van btw en accijnzen zwaarder wegen dan de doorrekening van de lagere arbeidskosten; de gezondheidsindex, die geen tabak, alcohol en motorbrandstoffen omvat, stijgt veel minder, zodat de indexering nauwelijks wordt beïnvloed
  vat_electricity_2014_nbb: Btw op elektriciteit voor huishoudens verlaagd van 21% tot 6% op 1 april 2014 (teruggedraaid op 1 september 2015) - effect op de consumptieprijzen. De consumptieprijzen van elektriciteit daalden in 2014 met 9,6%, terwijl ze zonder de btw-wijziging met amper 1,5% zouden zijn gedaald; een volledige doorrekening over negen maanden zou ongeveer 9,3 punten geven (eigen berekening - 12,4% x 9/12), zodat de doorrekening nagenoeg volledig was. Het model kan elektriciteit niet afzonderen binnen energy_home
  vat_reduced_rate_official_costing: Officiële doorrekening van de verhoging van het tarief van 6% naar 9% en van een verlaging of verhoging van het tarief van 12%, per productgroep, en de tekst van het rapport van de Hoge Raad van Financiën van mei 2020 (financieringsscenario's met btw) en van de blauwdruk van 2022 voor de belastinghervorming
  vat_pass_through_studies: Officiële ramingen van de doorrekening van btw-wijzigingen in de consumptieprijzen - btw-verlaging in de horeca van 2010 (21% naar 12%), btw-verlaging op energie van 2022 (21% naar 6% op elektriciteit en gas), terugdraaiing van de verlaging op elektriciteit in september 2015; en de raming van het FPB van het terugverdieneffect van de btw-verlaging op elektriciteit van 2014
  nbb_noname_wage_price_elasticities: Technische varianten met het NONAME-model van de NBB (effect van een wijziging van de loonkosten met 1% op de consumptiedeflator na 1, 2 en 4 jaar) en een NBB-studie over het effect van de taxshift op de prijzen
  ec_vat_rate_gap_2023: Rapport 2025 van de Europese Commissie over de btw-kloof, België 2023 - tariefkloof (ontvangsten die door verlaagde tarieven worden gederfd, % van de notionele ideale ontvangsten). Zelfde pagina - beïnvloedbare beleidskloof 27,6%, kloof door nationale vrijstellingen 9,5%, kloof door EU-verplichte vrijstellingen 5,0%, btw-ontvangsten 37.413 mln., nalevingskloof 5.230 mln. (12,3% van de verschuldigde btw). Geen modelreeks
  fpb2026_gdp_nominal_index: Middellangetermijnvooruitzichten van het Federaal Planbureau - nominaal bbp, index 2024 = 100 (niveaus van 620.272 in 2024 tot 778.846 in 2031; als index vergeleken omdat het niveau van 2024 in het model uit een recentere versie van de rekeningen komt)

measure:
  VAT standard rate 21% -> 22%:
    name: Taux normal de TVA 21 % -> 22 %
    description: Relèvement d'un point du taux normal de TVA à partir de 2027.
  VAT reduced rate 6% -> 9%:
    name: Taux réduit de TVA 6 % -> 9 %
    description: Relèvement du taux réduit de TVA (alimentation, médicaments, rénovation ...) de 6 % à 9 % à partir de 2027.
  Income tax - tax-free allowance +EUR 2,000:
    name: IPP - quotité exemptée d'impôt +2 000 EUR
    description: Relèvement de 2 000 EUR de la quotité exemptée d'impôt à l'impôt des personnes physiques (euros de 2027, ensuite indexés) pour les revenus du travail. Comme dans la réforme de 2026, le relèvement est neutralisé pour les pensions et les revenus de remplacement (supprimer la seconde modification pour l'accorder à tous).
  Income tax - top rate 50% -> 55%:
    name: IPP - taux supérieur 50 % -> 55 %
    description: Relèvement de cinq points du taux marginal supérieur de l'impôt des personnes physiques à partir de 2027.
  Corporate tax 25% -> 20%:
    name: Impôt des sociétés 25 % -> 20 %
    description: Abaissement du taux normal de l'impôt des sociétés à 20 % à partir de 2027.
  Employer social contributions -2 points:
    name: Cotisations patronales -2 points
    description: Réduction de deux points du taux facial des cotisations patronales à partir de 2027.
  Capital gains tax 10% -> 20%:
    name: Taxe sur les plus-values 10 % -> 20 %
    description: Doublement du taux de la taxe sur les plus-values financières à partir de 2027.
  Withholding tax 30% -> 35%:
    name: Précompte mobilier 30 % -> 35 %
    description: Relèvement de cinq points du précompte mobilier sur les intérêts et dividendes à partir de 2027.
  Fuel excise +10 cents per litre:
    name: Accises sur les carburants +10 cents par litre
    description: Relèvement des accises sur les carburants de 0,10 EUR par litre à partir de 2027.
  Tobacco excise +25%:
    name: Accises sur le tabac +25 %
    description: Relèvement d'un quart des accises sur le tabac à partir de 2027.
  Legal pension age 68 from 2035:
    name: Âge légal de la pension à 68 ans dès 2035
    description: Relèvement de l'âge légal de la pension de 67 à 68 ans en 2035.
  Keep legal pension age at 66:
    name: Maintien de l'âge légal de la pension à 66 ans
    description: Annulation du relèvement, prévu par la loi, de l'âge légal de la pension à 67 ans en 2030.
  Pension malus 5% per year of early retirement:
    name: Malus de pension de 5 % par année d'anticipation
    description: Réduction des nouvelles pensions de 5 % par année de départ avant l'âge légal (et bonification symétrique des départs plus tardifs) à partir de 2027.
  Restore civil-servant pension perequation:
    name: Rétablissement de la péréquation des pensions des fonctionnaires
    description: La croissance réelle des salaires du secteur public est à nouveau intégralement répercutée sur les pensions en cours des fonctionnaires à partir de 2027, sans le plafond de 0,3 % par an (la péréquation a été supprimée par la loi sur les pensions du 30 mai 2026).
  Abolish the unemployment benefit time limit:
    name: Suppression de la limitation dans le temps des allocations de chômage
    description: Retour à des allocations de chômage illimitées dans le temps (annulation de la limitation à 12-24 mois de 2026).
  Index jump of 2% over 2027-2029:
    name: Saut d'index de 2 % sur 2027-2029
    description: Renonciation à 2 % d'indexation automatique des salaires et des prestations sociales, étalée sur trois ans à mesure que l'inflation s'accumule (la forme du saut d'index de 2015).
  Index jump in 2027:
    name: Saut d'index en 2027
    description: Suspension pendant une année entière de l'indexation automatique des salaires et des prestations sociales (2027 ; environ 3 % dans le scénario de référence, soit plus que le saut d'index de 2015).
  Health-care growth norm 2%:
    name: Norme de croissance des soins de santé de 2 %
    description: Plafonnement de la croissance réelle des dépenses de soins de santé à 2 % par an à partir de 2030 (2,5 % dans le scénario de référence).
  Defence 3.5% of GDP by 2035:
    name: Défense à 3,5 % du PIB d'ici 2035
    description: Relèvement linéaire des dépenses de défense, depuis la trajectoire de référence jusqu'à 3,5 % du PIB en 2035.
  Public investment +1% of GDP:
    name: Investissements publics +1 % du PIB
    description: Relèvement des investissements publics d'un point de PIB, de manière progressive sur 2027-2030.
  Public employment -1% a year for 5 years:
    name: Emploi public -1 % par an pendant 5 ans
    description: Réduction de l'emploi des administrations publiques de 1 % par an de 2027 à 2031.
  Cut subsidies to firms by 10%:
    name: Réduction de 10 % des subsides aux entreprises
    description: Réduction de 10 % des subsides salariaux, des titres-services et des subsides aux transports, à l'énergie et autres à partir de 2027.
  Welfare envelope restored from 2027:
    name: Rétablissement de l'enveloppe bien-être dès 2027
    description: Reprise des revalorisations réelles des pensions et des allocations dès 2027 au lieu de 2030.
  Net migration +20,000 a year:
    name: Solde migratoire +20 000 par an
    description: Solde migratoire international supérieur à celui de la projection de référence, à partir de 2027.
  Productivity growth +0.25 point:
    name: Croissance de la productivité +0,25 point
    description: Croissance tendancielle de la productivité plus rapide que dans l'hypothèse de référence, à partir de 2027.
  Interest rates +1 point:
    name: Taux d'intérêt +1 point
    description: Taux d'intérêt à long et à court terme supérieurs d'un point à l'hypothèse de référence à partir de 2027.
  Tax thresholds follow prices only (fiscal drag):
    name: Seuils fiscaux liés aux seuls prix (progression à froid)
    description: Les seuils de l'impôt sur le revenu et des cotisations restent indexés sur les seuls prix après 2030 (législation actuelle), de sorte que la pression fiscale augmente avec les salaires réels.
  Static costing (no behavioural responses):
    name: Chiffrage statique (sans réactions comportementales)
    description: Désactive toutes les réactions comportementales et les effets de demande ; à ajouter à un scénario pour en voir l'effet mécanique.
  'Wallonia: structural unemployment -1 point by 2032':
    name: 'Wallonie : chômage structurel -1 point d''ici 2032'
    description: Baisse d'un point de pourcentage du taux de chômage structurel de la Wallonie, de manière progressive de 2027 à 2032 (réforme du marché du travail, formation, mobilité).
  'Brussels: activation effort +25%':
    name: 'Bruxelles : effort d''activation +25 %'
    description: Relèvement d'un quart de l'effort d'activation d'Actiris à partir de 2027 (de manière progressive sur trois ans) - le chômage structurel recule à Bruxelles et davantage de personnes exclues par la limitation fédérale dans le temps trouvent un emploi.
  'Wallonia: invalidity -10% (return to work)':
    name: 'Wallonie : invalidité -10 % (retour au travail)'
    description: Réduction de 10 % de la part des personnes en invalidité en Wallonie grâce à des programmes régionaux de retour au travail, de manière progressive de 2027 à 2032.
  'Flanders: +0.25 point regional productivity growth':
    name: 'Flandre : croissance régionale de la productivité +0,25 point'
    description: La productivité en Flandre croît d'un quart de point par an plus vite que la tendance nationale à partir de 2027.
  'Wallonia: family allowance +10%':
    name: 'Wallonie : allocations familiales +10 %'
    description: Relèvement de 10 % des allocations familiales wallonnes à partir de 2027.
  'Brussels: public employment -1% a year for 5 years':
    name: 'Bruxelles : emploi public -1 % par an pendant 5 ans'
    description: Réduction de 1 % par an, de 2027 à 2031, du nombre d'agents publics résidant à Bruxelles (tous niveaux de pouvoir).
  'Flanders: public investment +0.5% of regional GDP':
    name: 'Flandre : investissements publics +0,5 % du PIB régional'
    description: Relèvement des investissements publics des pouvoirs publics flamands de 0,5 % du PIB flamand, de manière progressive sur 2027-2029.
  'French Community: education cost per pupil -5%':
    name: 'Communauté française : coût de l''enseignement par élève -5 %'
    description: Réduction de 5 % du coût public par élève dans l'enseignement de la Communauté française (Wallonie et écoles francophones de Bruxelles), de manière progressive sur 2027-2030.
  'Flanders: elderly-care spending +10%':
    name: 'Flandre : dépenses de soins aux personnes âgées +10 %'
    description: Relèvement de 10 % des dépenses flamandes de soins de longue durée (soins résidentiels, budgets de soins) à partir de 2027.
  'Brussels: service-voucher subsidy -20%':
    name: 'Bruxelles : subside aux titres-services -20 %'
    description: Réduction de 20 % du subside bruxellois par titre-service à partir de 2027.
  'Flanders: international immigration +20%':
    name: 'Flandre : immigration internationale +20 %'
    description: Un cinquième d'immigrants internationaux en plus s'installent en Flandre à partir de 2027 (la politique de migration économique est une compétence régionale) ; l'immigration vers les autres régions est inchangée.
  'Brussels: a quarter fewer residents leave for the other regions':
    name: 'Bruxelles : un quart d''habitants en moins partent vers les autres régions'
    description: Réduction de 25 % des départs de Bruxelles vers la Flandre et la Wallonie à partir de 2027 (politique du logement et de la famille qui maintient les ménages en ville), de manière progressive sur 2027-2030.

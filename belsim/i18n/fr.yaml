  ar2024_unemployment_rate: Ageing Report 2024 - taux de chômage des 20-64 ans
  ar2024_productivity_growth: Ageing Report 2024 - croissance de la productivité horaire du travail (la moyenne 2022-2070 est de 1,12)
  ar2024_potential_growth: Ageing Report 2024 - croissance du PIB potentiel (la moyenne 2022-2070 est de 1,32)
  ar2024_population: Ageing Report 2024 (EUROPOP2023) - population totale
  fpb_promes2026_health_real_growth: Bureau fédéral du Plan, projection PROMES (à politique inchangée) - croissance réelle annuelle moyenne des dépenses publiques d'assurance soins de santé sur dix ans ; 2,6 % par an ont également été observés en 2020-2025. Les chiffrages DC2024 retiennent une référence de 3,3 % de croissance réelle par an
  coa2026_defence_2pct_norm: Plan budgétaire fédéral - effort de défense à la norme OTAN de 2 % (effort de défense total, y compris les pensions et les autres départements). Non comparable à la ligne du modèle avant 2029 - le modèle enregistre la défense sur la base des comptes nationaux (matériel à la livraison, 1,4 % du PIB en 2025, pour atteindre 2,0 % en 2029)
  coa2026_securities_tax_2024: Taxe annuelle sur les comptes-titres - réalisations 2024
  budget2026_excise_total: Accises et divers, recettes fédérales de caisse (réalisations 2024, monitoring 2025). Base caisse, y compris de petits postes divers ; modèle = lignes d'accises en SEC
  budget2025_excise_energy: Accises sur les produits énergétiques et l'électricité, réalisations probables 2024 (somme de la ligne des voies et moyens, 5 558,2, et de la partie attribuée, 1 321,0)
  hermes_public_investment_cut: Variante HERMES - réduction des investissements publics de 0,5 % du PIB ex ante
  hermes_public_consumption_cut: Variante HERMES - réduction de la consommation publique (achats de biens et de services) de 0,5 % du PIB ex ante. Équivalent dans le modèle - facteur linéaire sur les dépenses de fonctionnement
  hermes_social_benefits_cut: Variante HERMES - réduction des prestations sociales de 0,5 % du PIB ex ante (pour moitié les pensions, pour moitié les allocations familiales)
  hermes_vat_increase: Variante HERMES - relèvement de la TVA sur la consommation privée de 0,5 % du PIB ex ante (tous les taux, proportionnellement). Chiffre officiel le plus proche de « +1 point de taux normal de TVA », pour lequel aucun chiffrage officiel n'a été trouvé
  hermes_employer_ssc_increase: Variante HERMES - relèvement des cotisations patronales de 0,5 % du PIB ex ante (coût salarial horaire +1,62 % l'année t, +1,38 % en t+4)
  hermes_employee_ssc_increase: Variante HERMES - relèvement des cotisations personnelles de 0,5 % du PIB ex ante
  hermes_pit_increase: Variante HERMES - relèvement de l'impôt des personnes physiques de 0,5 % du PIB ex ante
  hermes2018_employer_ssc_cut_general: Variante HERMES (édition 2018) - réduction générale des cotisations patronales de 0,5 % du PIB ex ante (taux implicites d'environ -8 %) ; taux de retour de 38 % / 51 % / 52 % en t / t+2 / t+4
  hermes2018_employer_ssc_cut_low_wage: Variante HERMES (édition 2018) - réduction des cotisations patronales de 0,5 % du PIB ex ante ciblée sur les bas salaires (taux sur les bas salaires d'environ -40 %). Crée 60 % d'emplois de plus que la réduction générale (35,2 milliers contre 21,9 en t+4)
  hermes2018_public_consumption_multiplier: Variante HERMES (édition 2018) - hausse de la consommation publique de 0,5 % du PIB - multiplicateur budgétaire de 0,70 l'année t, de 0,64 en t+4 ; taux de retour de 34 % puis de 27 %
  dc2024_allowance_13000: DC2024 VB-101 - quotité exemptée d'impôt portée de 10 570 EUR à 13 000 EUR pour tous les contribuables. Impulsion budgétaire aux prix de 2024 et dans la situation de 2024
  arizona_allowance_15600: Réforme fiscale Arizona - quotité exemptée d'impôt portée de 10 910 EUR à 15 600 EUR d'ici l'année de revenus 2030, neutralisée pour les pensions et les revenus de remplacement (microsimulation du SPF Finances, tous niveaux de pouvoir, par rapport à la quotité indexée d'avant la réforme). La réforme figure dans le scénario de référence du modèle ; le contrefactuel rétablit la quotité d'avant la réforme (11 176 en euros de 2026 selon params/revenue.yaml)
  dc2024_pit_45_to_40: DC2024 VB-103 - taux de 45 % de l'impôt des personnes physiques abaissé à 40 %
  dc2024_abolish_special_ssc: DC2024 N-VA-101 / MR-102 - suppression de la cotisation spéciale de sécurité sociale (CSSS)
  dc2024_vat_food_zero: DC2024 PVDA-PTB-102 - TVA sur l'alimentation abaissée de 6 % à 0 %
  cit_reform_2018_rate_cut: Réforme de l'impôt des sociétés 2018-2020 - taux nominal ramené de 33,99 % à 25 % (taux implicite de 32,20 % à 24,25 %), coût brut de la baisse du taux en régime de croisière, avant mesures compensatoires (SPF Finances, hors effets macroéconomiques). Environ 530 Mio EUR par point de taux nominal (calcul propre)
  securities_tax_doubling: Taxe sur les comptes-titres doublée de 0,15 % à 0,30 % en 2026 - rendement supplémentaire en année pleine (414 en 2026), sans effet comportemental supposé
  capital_gains_tax_yield: Taxe de 10 % sur les plus-values sur actifs financiers à partir de 2026 - rendement attendu (SPF Finances - 120 nets en 2026, 600 à partir de 2032 ; budget pluriannuel - 500 à l'horizon 2029). La Cour des comptes juge l'estimation peu fiable ; les comportements n'y sont pas modélisés
  unemployment_time_limit: Allocations de chômage limitées à deux ans (en vigueur en 2026, dispense pour les 55 ans et plus à longue carrière) par rapport à une durée illimitée
  dc2024_unemployment_limit_direct_saving: DC2024 MR-201 - allocations de chômage limitées à 2 ans (55 ans et plus exclus), économie directe sur les seules dépenses de chômage, prix et situation de 2024
  dc2024_pension_age_65: DC2024 PVDA-PTB-301 - âge légal de la pension maintenu à 65 ans au lieu de 66 ans à partir de 2025 (impulsion budgétaire, prix de 2024)
  dc2024_health_norm_1_5: DC2024 Open Vld-402 - norme de croissance réelle des soins de santé de 1,5 % par an à partir de 2025, par rapport à la référence à politique inchangée du BFP de 3,3 % de croissance réelle par an (prix de 2024)

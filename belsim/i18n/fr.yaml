# Translations of the model-provided text (fr). Layout and kinds: see belsim/i18n/__init__.py.
# Keys are stable ids, or the English text itself for group / unit / tag / target / text.
# What is missing: uv run python -m belsim.i18n.check   (missing entries fall back to English)
line:
  revenue.ssc_employer_private:
    label: Cotisations patronales, secteur privé
    description: 'Cotisations sociales effectives à charge des employeurs hors administrations publiques : taux facial sur les salaires bruts, diminué de la réduction structurelle (bas salaires) et, à partir de la mi-2025, de l''exonération au-delà du plafond des très hauts salaires.'
  revenue.ssc_employer_public:
    label: Cotisations patronales, secteur public
    description: Cotisations sociales effectives à charge des administrations publiques sur leur propre masse salariale.
  revenue.ssc_imputed:
    label: Cotisations imputées (pensions des fonctionnaires)
    description: Cotisations patronales imputées, contrepartie des pensions non capitalisées des fonctionnaires (également enregistrées en dépenses).
  revenue.ssc_employee:
    label: Cotisations personnelles
    description: Cotisations personnelles sur les salaires (13,07 %), diminuées du bonus à l'emploi pour les bas salaires (volets A et B).
  revenue.ssc_self_employed:
    label: Cotisations des indépendants
    description: Cotisations des travailleurs indépendants (20,5 % / 14,16 %, avec plafonds de revenus et cotisation minimale).
  revenue.ssc_replacement_income:
    label: Cotisations sur les revenus de remplacement
    description: Cotisations des non-actifs, principalement la cotisation soins de santé de 3,55 % sur les pensions.
  revenue.special_ssc:
    label: Cotisation spéciale de sécurité sociale
    description: Cotisation spéciale des salariés par tranche de revenu imposable (enregistrée comme impôt sur le revenu dans le SEC, perçue par la sécurité sociale) ; réduite de moitié et individualisée à partir des revenus 2028.
  revenue.pit_federal:
    label: Impôt des personnes physiques, fédéral
    description: Impôt des personnes physiques fédéral (précompte professionnel, versements anticipés, rôles, non-résidents) après transfert de la part régionale ; net de l'avantage fiscal fédéral pour l'épargne-pension.
  revenue.pit_regional:
    label: Impôt des personnes physiques, additionnels régionaux
    description: Centimes additionnels régionaux sur l'impôt État réduit, nets des réductions d'impôt régionales (titres-services, logement).
  revenue.pit_local:
    label: Impôt des personnes physiques, additionnels communaux
    description: Additionnels communaux à l'impôt des personnes physiques.
  revenue.cit:
    label: Impôt des sociétés
    description: Impôt des sociétés, y compris versements anticipés, rôles, sociétés non résidentes et précompte acquitté par les sociétés.
  revenue.vat:
    label: TVA
    description: Taxe sur la valeur ajoutée sur la consommation des ménages, l'investissement en logements, les achats des administrations publiques et les intrants des secteurs exemptés.
  revenue.excise_fuel:
    label: Accises sur les carburants et les produits énergétiques
    description: Droits d'accise sur les huiles minérales et les produits énergétiques, y compris les cotisations pour les stocks stratégiques.
  revenue.excise_tobacco:
    label: Accises sur le tabac
    description: Droits d'accise sur les produits du tabac.
  revenue.excise_alcohol:
    label: Accises sur l'alcool
    description: Droits d'accise sur la bière, le vin, les spiritueux et les produits intermédiaires.
  revenue.excise_energy:
    label: Prélèvements fédéraux sur l'énergie
    description: Cotisation sur l'énergie, cotisation fédérale sur l'électricité et le gaz, cotisations sur le gasoil de chauffage.
  revenue.energy_green_levies:
    label: Certificats verts et prélèvements régionaux sur l'énergie
    description: Obligations régionales de certificats verts et surcharges de réseau enregistrées comme impôts sur l'énergie.
  revenue.excise_beverages_packaging:
    label: Accises sur les boissons non alcoolisées et le café, cotisation d'emballage
    description: Accises sur les boissons non alcoolisées et le café, cotisation d'emballage, cotisations pour la santé animale.
  revenue.insurance_premium_tax:
    label: Taxe sur les primes d'assurance
    description: Taxe annuelle sur les contrats d'assurance (9,25 %, 9,60 % à partir de juillet 2026) et suppléments au profit de la sécurité sociale sur les assurances auto, incendie et hospitalisation.
  revenue.gambling_lottery:
    label: Taxes sur les jeux et paris, Loterie Nationale
    description: Taxes régionales sur les jeux et paris, bénéfices de monopole et rente de la Loterie Nationale.
  revenue.withholding_tax:
    label: Précompte mobilier sur les intérêts et dividendes
    description: Précompte mobilier (30 %) sur les intérêts et dividendes perçus par les ménages.
  revenue.capital_gains_tax:
    label: Taxe sur les plus-values sur actifs financiers
    description: Taxe sur les plus-values réalisées sur actifs financiers (10 % à partir de 2026, loi du 6 avril 2026). Le rendement suit l'estimation officielle, il n'est pas calibré.
  revenue.securities_account_tax:
    label: Taxe sur les comptes-titres
    description: Taxe annuelle sur les comptes-titres de plus de 1 million EUR (0,15 %, 0,30 % à partir de 2026).
  revenue.stock_exchange_tax:
    label: Taxe sur les opérations de bourse
    description: Taxe sur les opérations de bourse (TOB).
  revenue.registration_duties:
    label: Droits d'enregistrement
    description: Droits d'enregistrement régionaux sur les achats immobiliers et droits d'hypothèque.
  revenue.inheritance_gift_tax:
    label: Droits de succession et de donation
    description: Droits de succession et de donation régionaux.
  revenue.property_tax:
    label: Précompte immobilier
    description: 'Précompte immobilier : prélèvement régional et centimes additionnels provinciaux et communaux.'
  revenue.vehicle_taxes:
    label: Taxes sur les véhicules et taxes routières
    description: Taxe de circulation annuelle, taxe de mise en circulation (TMC) et prélèvement kilométrique, à charge des ménages et des sociétés.
  revenue.environmental_taxes:
    label: Quotas d'émission et autres taxes environnementales
    description: Quotas d'émission ETS mis aux enchères, taxes régionales sur l'eau, les déchets et les effluents d'élevage.
  revenue.bank_levies:
    label: Taxes sur les banques et le secteur financier
    description: Taxe annuelle sur les établissements de crédit, contribution à la garantie des dépôts, taxe sur les organismes de placement collectif et les entreprises d'assurance.
  revenue.nuclear_levy:
    label: Contribution nucléaire
    description: Contribution due par les exploitants nucléaires.
  revenue.pharma_levies:
    label: Cotisations de l'industrie pharmaceutique
    description: Cotisations sur le chiffre d'affaires de l'industrie pharmaceutique (au profit de la sécurité sociale).
  revenue.other_taxes_production:
    label: Autres impôts sur la production et les produits
    description: Taxes locales sur les entreprises, droits de greffe et droits sur les écrits, taxe sur le transport aérien, autres impôts fédéraux et régionaux sur la production.
  revenue.other_taxes_income_wealth:

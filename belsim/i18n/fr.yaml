param:
  "health.norm_room_spent": "Part de la marge entre la croissance liée aux besoins et la norme de croissance qui est dépensée lorsque les besoins croissent moins vite que la norme (0 = la norme n'est qu'un plafond et la marge inutilisée n'est pas dépensée, 1 = la norme est la croissance du budget et le budget est dépensé, de sorte qu'une norme supérieure à la croissance liée aux besoins augmente les dépenses). Agit avec health.norm_enforcement. LEVIER - une proposition du type « une norme de croissance de x % » correspond à la paire health.growth_norm = x et ce paramètre = 1."
  "pension.min_pension_spending_share": "Part des dépenses de pension de chaque régime qui est payée au minimum garanti ou à proximité et qui suit proportionnellement une modification de pension.min_pension (pensions en cours comme nouvelles pensions). Une hausse du minimum de 1 % augmente les dépenses du régime de cette part x 1 %. Sans effet tant que le minimum est le montant indexé de 2024."
  "beh.demand.household_transfer_esa_prefixes": "Codes SEC 2010 identifiant les lignes de dépenses qui sont des prestations en espèces des ménages (prestations sociales autres qu'en nature) ; elles font partie du revenu des ménages dans le bloc de la demande. Les lignes classées comme achats (prestations en nature) ne sont pas concernées"
  "beh.demand.household_direct_tax_esa_prefixes": "Codes SEC 2010 identifiant les lignes de recettes qui sont des impôts directs et des cotisations sociales des ménages (impôts sur le revenu et le patrimoine, cotisations sociales des ménages, impôts en capital) ; elles sont déduites du revenu des ménages dans le bloc de la demande. Les lignes payées par les entreprises (beh.demand.firm_tax_keywords) ne sont pas concernées ; les cotisations imputées des employeurs ne sont pas payées par les ménages"
  "demo.emigration_rate_age_profile": "Profil par âge de l'émigration internationale par rapport aux taux par âge observés en 2023-2024 : liste de nœuds [âge, facteur], interpolation linéaire entre eux (1 = taux observé). Fait partie de la trajectoire de référence : l'immigration est le solde migratoire (demo.net_migration) plus l'émigration que ces taux impliquent, de sorte qu'un facteur plus élevé à certains âges remplace des partants plus âgés par des arrivants (le plus souvent jeunes) sans modifier le solde migratoire."
  "dist.pensioner_institution_share": "Part des pensionnés qui ne vivent pas dans un ménage privé (maisons de repos et de soins, autres institutions). L'enquête sur les revenus et l'ensemble des ménages ne couvrent que les ménages privés ; les ménages de pensionnés sont donc calés sur les pensionnés du modèle diminués de cette part."
  "dist.pensioner_couple_second_average_share": "Part des couples de pensionnés à la pension moyenne dans lesquels les deux partenaires perçoivent une pension moyenne (dans les autres, la seconde pension est une pension minimum)."
  "dyn.marginal_job_entrant_origins": "Origines d'un écart d'emploi par rapport au scénario de référence (clés de dyn.marginal_wage) dont les emplois sont répartis sur les déciles de salaire à partir du profil des entrants (dyn.marginal_wage_decile_profile) : les personnes qui travaillent en raison de la limitation dans le temps des allocations de chômage, d'un taux de chômage structurel plus bas (activation) ou d'une réaction de l'offre de travail. Les autres origines partent d'un profil uniforme : le report du départ à la pension (proche du salaire moyen), la réaction au coût du travail (que le comportement déplace vers les déciles dont le coût pour l'employeur a changé, adjust.labour_demand_decile_shift) et le cycle."
  "pit.bracket_base_factor": "Base imposable alternative, désactivée par défaut - multiplicateur du revenu imposable situé dans chaque tranche du barème de l'impôt des personnes physiques (25 / 40 / 45 / 50 %), dans la population d'unités fiscales qui sous-tend l'impôt agrégé. Tous à 1 = la distribution des déclarations de 2024. Mettre [1, 1, 0.88, 0.88] pour les bases plus étroites des tranches supérieures qu'impliquent les chiffrages 2024 du Bureau du Plan (un seul facteur pour les deux tranches supérieures, afin que le déplacement de la limite entre elles soit chiffré sur le même pied) ; les recettes sont inchangées l'année de l'activation (l'impôt que la base plus étroite n'explique pas est porté comme un montant qui croît avec le PIB et ne réagit pas au barème), de sorte qu'une modification des taux ou des tranches est chiffrée sur la base plus étroite - comparez une mesure entre deux simulations qui portent toutes deux ce changement. LEVIER (sensibilité)."
  "pit.tax_unit_type_follows_income": "Interrupteur (1 ou 0) - le type d'unité fiscale d'un contribuable (imposé isolément, partenaire d'un couple à deux revenus, revenu unique d'un couple) suit sa place dans la distribution des revenus, comme dans les déclarations fiscales ; 0 donne à chaque classe de revenus la même répartition. Lu une seule fois, pour l'année de base - il façonne la population d'unités fiscales qui sous-tend l'impôt agrégé, pas la loi."
  "ssc.special_joint_thresholds": "Cotisation spéciale de sécurité sociale - limites de revenu du barème des ménages soumis à une imposition commune (conjoints et cohabitants légaux), appliquées à leur revenu imposable commun ; la dernière limite est celle où le maximum est atteint. Vide à partir des revenus de 2028 - la cotisation est alors due par personne selon le barème de ssc.special_thresholds."
  "ssc.special_joint_rates": "Cotisation spéciale de sécurité sociale - taux dans chaque tranche du barème des ménages soumis à une imposition commune (ssc.special_joint_thresholds)"
  beh.enabled: Interrupteur général des réactions comportementales et de la rétroaction de la demande (1 = activé, 0 = chiffrage statique)
  beh.scale: Multiplicateur global appliqué à toutes les réactions comportementales et à tous les multiplicateurs budgétaires (0.5 bas / 1 central / 1.5 haut)
  beh.lambda: "Vitesse d'ajustement partiel par canal (offre de travail, marge intensive, demande de travail, composition de l'emploi - labour_composition -, départ à la retraite, etc.) = part de la réaction de long terme atteinte la première année (l'écart restant se résorbe ensuite dans la même proportion chaque année)"
  beh.clip: Bornes sur les cibles de long terme, afin que des mesures extrêmes ne produisent pas de résultats aberrants. Les facteurs sont bornés en logarithmes (0.7 = facteur compris entre exp(-0.7)=0.50 et exp(0.7)=2.0) ; emp_rate est la variation en log du taux d'emploi d'une cellule ; emp_rate_delta_abs est le plafond absolu de la variation additive du taux d'emploi d'une cellule ; retirement est exprimé en années
  beh.marginal_step: Variation relative du revenu brut utilisée pour mesurer le taux marginal effectif d'imposition (différence finie)
  beh.ext.elasticity_by_decile: Élasticité de la participation au gain financier du travail (salaire net moins revenu net hors emploi), par décile de salaire (1 = le plus bas)
  beh.ext.sex_multiplier: Multiplicateur de l'élasticité de participation selon le sexe
  beh.ext.age_bands: Limites d'âge des groupes jeunes / âges intermédiaires / âgés pour les réactions de l'offre de travail [début jeunes, début âges intermédiaires, début âgés, fin (exclue)]
  beh.ext.age_multiplier: Multiplicateur de l'élasticité de participation selon le groupe d'âge
  beh.ext.decile_tilt: 'Position de chaque groupe dans la distribution des salaires : le poids du décile d est proportionnel à exp(-tilt * z_d), z_d allant de -1 (décile le plus bas) à +1 (décile le plus élevé). Les inclinaisons selon le sexe et l''âge s''additionnent. Valeur positive = concentration dans les déciles inférieurs'
  beh.ext.outside_option_weights: "Répartition des situations hors emploi utilisée pour le revenu hors emploi d'un travailleur : allocation de chômage, indemnité d'invalidité, aide sociale (revenu d'intégration : forfaitaire, non imposé), absence de revenu de remplacement (la somme des poids vaut 1)"
  beh.ext.min_gain_share: Plancher du gain financier du travail, en part du salaire net (évite le logarithme d'un gain nul ou négatif dans les pièges à l'emploi)
  beh.eti.employee_by_decile: "Élasticité de l'apport de travail effectif des salariés (heures, effort) au taux marginal de rétention (1 - taux marginal d'imposition), par décile de salaire ; appliquée comme un effet sur la productivité du travail. Le rendement net d'une heure supplémentaire inclut la part d'une perte de salaire net que la négociation restitue dans le salaire brut (dyn.wage_bargaining.compensation_employee_taxes), et la réaction modifie la production à concurrence de la part des salariés du secteur privé dans les revenus du travail (la production des administrations publiques est mesurée au coût)"
  beh.eti.self_employed_by_decile: Élasticité du revenu imposable des indépendants au taux marginal de rétention (1 - taux marginal d'imposition), par décile de revenu
  beh.ld.elasticity_by_decile: "Élasticité de long terme de l'emploi privé au coût réel du travail (coût pour l'employeur à salaire brut inchangé, et niveau des salaires par rapport aux prix et à la productivité), par décile de salaire. Les déciles sont pondérés par leur part dans le coût du travail ; les emplois supplémentaires d'une variation concentrée sur certains déciles sont régis par beh.ld.composition_net_share"
  beh.ret.years_per_pct_replacement: Années d'avancement du départ effectif à la pension par hausse de 1 % du taux de remplacement net de la pension (pension nette / salaire net) ; une baisse de 10 % des pensions retarde le départ de 10 fois cette valeur
  beh.ret.years_per_pp_accrual: Années de report du départ à la pension par point de pourcentage de pension supplémentaire acquise par année de travail additionnelle (acquisition de droits de carrière plus bonus/malus), pour un incitant faible ; la réaction plafonne à mesure que l'incitant augmente (beh.ret.accrual_max_years). Utilisé uniquement si le module des dépenses fournit calc.pension_accrual_incentive(p)
  beh.cons.elasticity: Élasticité-prix propre de long terme du volume consommé, par catégorie (inclut l'effet de revenu réel pour les grandes catégories)
  beh.cons.cross_border: Élasticité additionnelle du volume taxé en Belgique due aux achats transfrontaliers, au tourisme à la pompe et au commerce illicite (ajoutée à l'élasticité-prix propre)
  beh.cons.pass_through: Part d'une modification de la fiscalité indirecte répercutée sur les prix à la consommation, par catégorie
  beh.cit.base_semi_elasticity: 'Semi-élasticité de la base de l''impôt des sociétés au taux effectif de l''ISoc : variation en log de la base pour une variation de 1.0 du taux (donc +1 point de taux = -1,2 % de base)'
  beh.cit.productivity_semi_elasticity: Variation en log, à long terme, de la productivité du travail pour une variation de 1.0 du taux effectif de l'ISoc (effet sur l'investissement et l'intensité capitalistique ; +10 points d'ISoc = -1 % de productivité)
  beh.cap.net_of_tax_elasticity: Élasticité de la base imposable des revenus du capital des ménages au taux de rétention (1 - taux d'imposition des revenus du capital)
  beh.prop.transactions_semi_elasticity: Variation en log de la valeur des transactions immobilières pour une variation de 1.0 du taux de taxation des transactions (droits d'enregistrement) ; utilisé uniquement si le module des recettes fournit calc.property_transaction_tax_rate(p)
  beh.demand.enabled: Interrupteur de la rétroaction de court terme de l'impulsion budgétaire sur la demande (1 = activé)
  beh.demand.mult_purchases: Multiplicateur de première année, sur la production, des achats publics (salaires, biens et services, investissements, prestations en nature)
  beh.demand.mult_transfers: "Multiplicateur, sur la production, d'une variation du revenu disponible réel des ménages une fois qu'ils ont ajusté leurs dépenses (propension marginale à consommer nette de la fuite par les importations ; l'effet de première année est cette valeur x beh.demand.income_first_year_share). Le revenu des ménages est construit à partir des flux propres du modèle (salaires des salariés du secteur privé, revenu des indépendants, revenus du capital, prestations en espèces, moins les impôts et cotisations payés par les ménages), déflaté par les prix à la consommation du scénario rapportés à ceux du scénario de référence, et pris net de la variation du PIB réel du côté de l'offre. Le même multiplicateur s'applique à la variation nominale des autres transferts (subsides, transferts en capital, transferts à l'étranger)."
  beh.demand.mult_taxes_firms: "Multiplicateur, sur la production, des impôts et cotisations payés par les entreprises, par type : la clé est une sous-chaîne de la ligne de recettes (nom, libellé ou groupe ; lignes correspondant à beh.demand.firm_tax_keywords), la valeur le multiplicateur (valeur absolue). Impôt des sociétés : faible, la majeure partie est absorbée par les bénéfices. Cotisations patronales : aucun multiplicateur propre, car leurs effets sont modélisés un par un : l'emploi, les salaires négociés, les prix à la consommation et les dividendes modifient le revenu réel des ménages (beh.demand.mult_transfers), le coût du travail modifie la compétitivité (dyn.wage_cost.net_export_output_elasticity) et la demande de travail."
  beh.demand.firm_tax_keywords: Sous-chaînes en minuscules identifiant les lignes de recettes (nom, libellé ou groupe) payées par les entreprises, pour le choix du multiplicateur
  beh.demand.purchases_pay_share: "Part des rémunérations dans les achats publics autres que les soins de santé (beh.demand.lagged_price_lines), utilisée pour les déflater - la part des rémunérations suit l'indice des salaires, le reste (biens et services, autres prestations en nature, investissements) l'indice santé. La variation du prix des achats n'est pas de la demande ; la rémunération publique par tête fait partie du revenu des ménages dans le bloc de la demande"
  beh.demand.purchases_output_elasticity: Part des achats publics qui suit le PIB réel à politique inchangée (dépenses de fonctionnement hors rémunérations, investissements et défense fixés en % du PIB, une partie des soins de santé). Les achats induits par une variation du PIB réel provenant de l'offre ne sont pas comptés comme une impulsion budgétaire, à l'instar des recettes retirées au moyen de beh.demand.budget_semi_elasticity
  beh.demand.income_first_year_share: Part de l'effet sur la demande d'une variation du revenu des ménages (transferts, impôts sur les ménages) atteinte la première année ; l'écart restant se résorbe ensuite dans la même proportion chaque année
  beh.demand.mult_default: Multiplicateur moyen utilisé lorsque l'impulsion ne peut pas être ventilée par ligne de recettes ou de dépenses (solution de repli fondée sur le solde primaire)
  beh.demand.persistence: 'Part de l''écart de demande de l''année précédente qui persiste (0.95 : une impulsion permanente conserve 81 % de son effet de première année après 4 ans, puis s''estompe à mesure que la production revient à son niveau déterminé par l''offre)'
  beh.demand.budget_semi_elasticity: Semi-élasticité du solde budgétaire à la production, utilisée pour retirer la partie endogène (réactions de l'offre modifiant le PIB) de la variation mesurée du solde avant d'appliquer les multiplicateurs
  beh.pubcap.output_per_capital: 'Variation de la production par unité de variation du stock de capital public par rapport au scénario de référence (toutes deux en points de PIB) : consommation de capital fixe des actifs publics, qui fait partie du PIB mesuré, plus les services rendus par les infrastructures publiques à la production privée'
  beh.pubcap.depreciation_rate: Dépréciation annuelle de l'écart de capital public constitué par une modification des investissements publics
  beh.pubcap.investment_esa_prefixes: Préfixes de codes SEC 2010 identifiant les lignes de dépenses qui relèvent exclusivement de la formation de capital public (leur écart par rapport au scénario de référence constitue l'écart de capital public)
  beh.demand.max_gap: Borne de l'écart de demande en valeur absolue
  beh.demand.purchase_keywords: Sous-chaînes en minuscules identifiant les lignes de dépenses (nom, libellé ou groupe) qui sont des achats publics plutôt que des transferts en espèces, pour le choix du multiplicateur
  beh.demand.purchase_esa_prefixes: Préfixes de codes SEC 2010 identifiant les achats (rémunérations, consommation intermédiaire, formation de capital, transferts sociaux en nature)
  beh.demand.interest_keywords: Sous-chaînes en minuscules / codes SEC identifiant les lignes d'intérêts (exclues de l'impulsion primaire)
  core.tax_threshold_wage_link: Part de la croissance des salaires réels répercutée sur les seuils de l'impôt sur le revenu et des cotisations sociales, en plus de leur indexation légale sur les prix. 0 = législation actuelle (les seuils ne suivent que les prix, de sorte que la pression fiscale augmente avec les salaires réels) ; 1 = les seuils suivent les salaires (taux moyen d'imposition constant). LEVIER.
  demo.net_migration: Solde migratoire international (immigration moins émigration, personnes par an) lorsque les facteurs d'immigration et d'émigration valent 1. L'émigration suit des taux par âge ; l'immigration est fixée de manière à ce que le solde soit égal à ce nombre.
  demo.immigration_factor: Multiplicateur de l'immigration internationale brute qui s'installe dans chaque région (1 = trajectoire de référence ; les parts régionales de l'immigration sont celles observées en 2023-2024). Un scalaire est accepté et s'applique aux trois régions. LEVIER RÉGIONAL - Change(..., key="BRU").
  demo.emigration_factor: Multiplicateur des taux d'émigration internationale par âge des habitants de chaque région (1 = taux observés en 2023-2024). Un scalaire est accepté et s'applique aux trois régions. LEVIER RÉGIONAL - Change(..., key="BRU").
  demo.internal_migration_factor: Multiplicateur des taux de migration au départ de chaque région vers les deux autres régions (1 = flux observés en 2023-2024). Un scalaire est accepté et s'applique aux trois régions. LEVIER RÉGIONAL - Change(..., key="BRU").
  demo.tfr_target: Indice conjoncturel de fécondité national atteint en demo.tfr_target_year. La trajectoire de fécondité est celle d'EUROPOP2023, ajustée linéairement (à partir de 2024) vers cette cible ; à la valeur de référence, la trajectoire EUROPOP est suivie telle quelle.
  demo.tfr_target_year: Année au cours de laquelle demo.tfr_target est atteint (maintenu ensuite, par rapport à la trajectoire de référence)
  demo.tfr_convergence_year: Année à laquelle l'écart entre la fécondité observée en 2024 (ICF de 1,44) et la trajectoire EUROPOP2023 (1,54 en 2024) est résorbé, de manière linéaire.
  demo.fertility_factor: Multiplicateur régional des taux de fécondité par âge (après application de la trajectoire nationale de l'ICF)
  demo.mortality_improvement: Multiplicateur du rythme annuel de variation des taux de mortalité par âge retenu dans EUROPOP2023 (1 = amélioration d'EUROPOP2023, 0 = taux de mortalité gelés, 2 = deux fois plus rapide)
  demo.sex_ratio_at_birth: Nombre de garçons par fille à la naissance
  demo.infant_death_share_birth_year: Part des décès à l'âge de 0 an qui surviennent durant l'année civile de naissance
  dist.min_wage_monthly: Revenu minimum mensuel moyen garanti (RMMMG) d'un travailleur à temps plein de 18 ans et plus, moyenne 2024. LEVIER.
  dist.min_wage_months: Nombre de mois de rémunération par an du travailleur au salaire minimum (le minimum garanti inclut déjà la prime de fin d'année ; le double pécule de vacances s'y ajoute)
  dist.student_job_earnings: Rémunération brute annuelle de l'étudiant jobiste type
  dist.student_solidarity_rate: Cotisation de solidarité sur les jobs étudiants dans les limites du contingent annuel d'heures, en lieu et place des cotisations sociales ordinaires. LEVIER.
  dist.benefit_reference_wage: Niveau de salaire (min_wage, p25, median, p75, p90) retenu comme salaire antérieur des ménages types au chômage et en maladie de longue durée, et comme emploi qu'ils pourraient accepter (taux de taxation à la participation)
  dist.assist_category_ratio: Revenu d'intégration d'une personne isolée et d'une personne avec famille à charge, par rapport à l'allocation moyenne par bénéficiaire (assist.amount)
  dist.cohabitant_benefit_ratio: "Allocation d'un bénéficiaire vivant avec un partenaire qui travaille, second adulte d'un couple sans emploi ou troisième adulte (taux cohabitant), par rapport à l'allocation des autres bénéficiaires, pour les allocations de chômage et pour les indemnités d'invalidité. La moyenne sur l'ensemble des bénéficiaires reste la dépense par bénéficiaire du budget. LEVIER."
  dist.one_earner_partner_benefit_share: "Part maximale des partenaires sans emploi des couples à un seul revenu du travail qui perçoivent une allocation de chômage ou une indemnité d'invalidité (les autres n'ont pas de revenu propre). Les bénéficiaires qui ne trouvent pas place dans les ménages sans emploi y sont affectés en premier lieu, à concurrence de cette part ; les autres sont le troisième adulte d'un ménage de trois adultes."
  dist.pension_household_rate_ratio: Pension minimum au taux ménage (une seule pension pour un couple) par rapport au taux isolé
  dist.wage_level_shares: Classes de revenu des salariés dans l'ensemble des ménages - part des salariés dans chaque classe, du bas de la distribution des rémunérations de l'ensemble des salariés (secteurs privé et public, temps partiel compris) jusqu'au sommet (20 % inférieurs, 20-37,5 %, 37,5-62,5 %, 62,5-85 %, 85-97 %, 3 % supérieurs). Le revenu d'une classe est sa moyenne dans la population des unités fiscales qui sous-tend l'impôt des personnes physiques agrégé.
  dist.self_employed_level_shares: Classes de revenu des indépendants dans l'ensemble des ménages - part des indépendants dans chaque classe de leur distribution des revenus (25 % inférieurs, 25-75 %, 75-97 %, 3 % supérieurs)
  dist.pensioner_high_share: Part des ménages de pensionnés au-dessus de la pension minimum (hors fonctionnaires) affectée au sommet de la distribution des pensions (leur pension est la moyenne de la même part de pensionnés au sommet de la distribution des unités fiscales)
  dist.pensioner_low_share: Part des ménages de pensionnés (hors fonctionnaires) affectée à la pension minimum, isolés et couples
  dist.consumption_propensity_wave: Vague d'enquête de la propension à consommer par quintile de revenu (data/base/distribution_propensity.csv, Eurostat icw_sr_10 - 1,25 / 1,12 / 0,91 / 0,81 / 0,63 du revenu disponible en 2015) utilisée pour dériver la consommation de chaque ménage
  dist.consumption_propensity_scale: Facteur multiplicatif appliqué à la propension à consommer de chaque quintile. LEVIER pour l'analyse de sensibilité.
  dist.propensity_includes_imputed_rent: Indique si la propension à consommer de l'enquête compte les loyers imputés des propriétaires occupants comme de la consommation (1) ou non (0). Si 1, la part des loyers imputés dans le panier du quintile (enquête sur le budget des ménages) est retirée pour obtenir la consommation monétaire.
  dist.equivalence_scale: "Échelle d'équivalence selon la taille du ménage (échelle OCDE modifiée utilisée par Eurostat - premier adulte 1, autres personnes de 14 ans et plus 0,5, enfants de moins de 14 ans 0,3). Les enfants d'un ménage de l'ensemble sont des enfants moyens - la part des moins de 18 ans âgés de 14 à 17 ans dans la population de l'année compte pour 0,5."
  dist.poverty_line_share: Seuil de risque de pauvreté en part du revenu disponible équivalent médian
  dist.marginal_step: Hausse du revenu brut utilisée pour mesurer les taux marginaux effectifs d'imposition
  dyn.marginal_productivity: 'Production par travailleur, par rapport à la moyenne du type d''emploi, des emplois qu''un scénario ajoute au scénario de référence ou en retire, selon l''origine de la variation. unemp_exclusion = personnes qui travaillent en raison de la limitation dans le temps des allocations de chômage ; pension_age = âge légal / anticipé de la pension, extinction du RCC et réaction comportementale de départ à la pension ; structural_unemployment = variation des taux de chômage structurel régionaux ; labour_supply = réaction comportementale de participation ; labour_demand = réaction de l''emploi privé au coût du travail ; cyclical = réaction d''Okun à l''écart de production (0, car l''effet de l''écart sur la production est déjà appliqué directement au PIB : les emplois suivent la production, ils ne s''y ajoutent pas). Toute autre origine (population, effectifs publics, invalidité, scolarité) est assimilée à un travailleur moyen.'
  dyn.marginal_wage: Salaire brut (ou revenu d'indépendant), par rapport à la moyenne du type d'emploi, des emplois qu'un scénario ajoute au scénario de référence ou en retire, selon l'origine (mêmes clés que dyn.marginal_productivity). Détermine la masse salariale, le salaire moyen et les déciles de salaire taxés par le module des recettes.
  dyn.marginal_wage_decile_profile: "Position, dans la distribution des salaires, des personnes qui accèdent à l'emploi depuis le non-emploi : nombre relatif d'entrants dans chacun des dix déciles de salaire de leur type d'emploi (1 = le plus bas), avant l'inclinaison qui amène leur salaire moyen au salaire relatif de leur origine (dyn.marginal_wage). Utilisé pour les origines reprises dans dyn.marginal_job_entrant_origins ; les emplois des autres origines partent d'un profil uniforme. Les emplois qu'un scénario ajoute à chaque décile des salariés du secteur privé ou en retire sont publiés sous labour.scenario_jobs_private_by_decile ; les déciles de salaire, le salaire moyen et la masse salariale en découlent."
  dyn.wage_cost.labour_demand_weight: Poids de l'écart de coût salarial unitaire réel (indice des salaires rapporté aux prix sous-jacents et à la productivité justifiée, scénario par rapport à la référence) dans la réaction de la demande de travail. L'écart est multiplié par la moyenne de beh.ld.elasticity_by_decile et introduit progressivement selon beh.lambda.labour_demand. 1 = une variation du niveau des salaires agit comme une variation équivalente du coût pour l'employeur, l'une et l'autre étant mesurées par rapport aux prix ; 0 désactive le canal.
  dyn.wage_cost.net_export_output_elasticity: "Effet de court terme sur la production d'une variation du coût du travail par unité produite par rapport à la référence (salaires et cotisations patronales, rapportés aux prix et à la productivité) par le canal de la compétitivité (exportations nettes), net de la perte de pouvoir d'achat des ménages : écart de production = - élasticité x écart en log. Il s'estompe selon beh.demand.persistence ; l'effet durable provient de la demande de travail. LEVIER et principale incertitude du modèle pour les mesures relatives aux coûts salariaux : 0.05 correspond à la lecture du Bureau fédéral du Plan (HERMES), 0.30 à celle de la Banque nationale (fixer cette valeur pour simuler la variante « Banque nationale » : le saut d'index de 2015 relève alors le PIB de 0,5 % après cinq ans et une réduction des cotisations patronales de 0,22 % du PIB le relève de 0,2 % après quatre ans, comme dans les évaluations de la Banque, mais les variantes HERMES relatives aux cotisations sont alors dépassées d'un facteur trois à quatre)."
  dyn.indirect_tax_price_passthrough: Multiplicateur global de la répercussion des modifications de la fiscalité indirecte (TVA, accises) sur l'indice des prix à la consommation. La variation de prix d'une catégorie vaut beh.cons.pass_through x la variation de (1 + taux de taxe) ; les catégories sont pondérées par leur part de 2024 dans la consommation des ménages. 0 = les prix et l'indexation ne réagissent pas (comportement du modèle avant l'introduction de ce canal). Non appliqué en chiffrage statique (beh.enabled = 0).
  dyn.health_index_excluded_categories: Catégories de consommation qui ne font pas partie de l'indice santé (les modifications de leur taxation font varier l'IPC mais pas l'indexation automatique)
  dyn.public_employment.function_weights: 'Part de l''emploi des administrations publiques par fonction, utilisée pour traduire pubwage.staffing_factor (un facteur par fonction) en effectifs publics : facteur d''effectifs = 1 + somme des poids x (facteur - 1). Le personnel de la défense (4,6 %) n''est couvert par aucun facteur d''effectifs.'
  dyn.public_employment.education_level_weights: Part du personnel de l'enseignement par niveau. Une variation d'un taux de scolarisation (educ.enrolment) par rapport à la référence modifie proportionnellement le personnel enseignant de ce niveau (taux d'encadrement inchangé) ; "other" ne réagit pas.
  dyn.public_employment.reabsorption_speed: Part des personnes déplacées par une réduction de l'emploi public par rapport à la référence (ou des postes qu'une vague de recrutements publics laisse vacants dans le secteur privé) que le secteur privé absorbe chaque année ; les autres sont entre-temps au chômage ou inactives (labour.demand_shock_to_unemployment). 1 = compensation immédiate et intégrale (comportement du modèle avant l'introduction de ce canal).
  dyn.wage_cost.price_passthrough: Variation de long terme des prix à la consommation, par rapport à la référence, pour un écart de 1 % des coûts salariaux unitaires par rapport à la référence (la modération salariale fait baisser les prix ; une hausse des salaires due à l'indexation les fait monter). La variation des prix se répercute à son tour sur les salaires par l'indexation automatique. LEVIER (0 = les prix ne réagissent pas aux coûts salariaux).
  dyn.wage_cost.price_adjustment_speed: Part de l'écart restant entre les prix à la consommation et leur cible liée aux coûts salariaux résorbée chaque année. La cible inclut les variations salariales de l'année connues à l'avance (déplacement négocié, indexation d'un déplacement des prix d'origine fiscale, indexation non accordée)
  dyn.wage_cost.deflator_ratio: Réaction du prix de la production marchande (déflateur du PIB avant la réévaluation de la production des administrations publiques à son coût salarial) aux coûts salariaux, par rapport à celle des prix à la consommation une fois ceux-ci ajustés. Les prix de la production intérieure incorporent davantage de coût du travail intérieur que le panier de consommation, en partie importé, mais les prix à l'exportation sont fixés sur les marchés mondiaux. La production des administrations publiques étant réévaluée à son coût, le déflateur du PIB dans son ensemble varie de 1,1 à 1,3 fois les prix à la consommation après un choc salarial ; la première année, les prix de la production prennent de l'avance (dyn.wage_cost.deflator_lead).
  pension.scheme_spending_share_2024: Répartition entre régimes des pensions de retraite et de survie en espèces de 2024 (hors GRAPA). Utilisée par le script de collecte pour ventiler le total COFOG (relancer fetch_expenditure après modification).
  pension.scheme_mix_2024: Part des pensionnés par régime en 2024, en équivalents-pensions (dépenses du régime / pension moyenne des pensionnés d'un seul régime ; les personnes à carrière mixte comptent dans chaque régime au prorata). Stock initial ; évolue ensuite avec la répartition par type d'emploi des travailleurs de 55 à 64 ans
  pension.new_pension_mix_2024: Part de chaque régime dans les pensions prenant cours en 2024, en équivalents-pension (montant mensuel des nouveaux droits du régime / nouvelle pension moyenne du modèle). Répartition initiale des nouveaux pensionnés ; elle suit ensuite la répartition par type d'emploi des travailleurs de 55 à 64 ans, avec le retard pension.scheme_mix_lag_years
  pension.new_pension_mix_drift: Dérive relative annuelle du poids de chaque régime dans la répartition des nouvelles pensions (équivalents-pension), en plus de la répartition par type d'emploi des travailleurs âgés. Indépendants - le régime arrive à maturité (davantage de personnes partent à la pension avec une carrière d'indépendant, et avec davantage d'années dans ce régime)
  pension.scheme_mix_lag_years: Retard moyen (en années) avec lequel la répartition par régime des nouvelles pensions suit la répartition par type d'emploi des travailleurs de 55 à 64 ans (part des indépendants, part des agents statutaires parmi les travailleurs du secteur public) - les droits à la pension se constituent sur l'ensemble de la carrière et de nombreuses carrières sont mixtes
  pension.career_years_per_delay_year: Années de carrière créditées par année de report de la prise de cours de la pension par rapport au schéma de départ de 2024 (âge légal plus élevé, pension anticipée plus stricte, sorties plus tardives). Chaque année créditée ajoute 1/45 d'une carrière complète aux nouvelles pensions, à concurrence d'une carrière complète. LEVIER (0 = un départ plus tardif n'augmente pas les nouvelles pensions).
  pension.career_income_factor: Part du revenu de carrière prise en compte dans la formule de pension, par régime, pour les personnes qui partent à la pension dans l'année. Indépendants - le coefficient de correction qui réduisait leurs revenus a été supprimé pour les années de carrière à partir de 2021 ; le facteur augmente donc avec la part des années postérieures à 2020 dans la carrière des nouveaux pensionnés, jusqu'à ce que l'ensemble de la carrière de 45 ans soit à 1 (les nouvelles pensions du régime montent en charge pendant quatre décennies). LEVIER.
  pension.avg_pension_2024: Pension annuelle brute moyenne par pensionné, par régime, en 2024 (unité du modèle ; le niveau est calibré sur les dépenses effectives)
  pension.new_to_stock_ratio: Pension moyenne des nouveaux pensionnés par rapport à la pension moyenne du stock, 2024 (carrières plus longues des cohortes récentes)
  pension.replacement_rate: Taux d'acquisition / de remplacement de la pension, appliqué au salaire moyen (plafonné) de la carrière, pour une carrière complète. LEVIER.
  pension.wage_ceiling: Plafond salarial annuel pour le calcul de la pension (fonctionnaires - équivalent salarial de la pension maximale absolue). LEVIER.
  pension.career_fraction: Fraction de carrière moyenne (années prises en compte / 45) des nouveaux pensionnés. LEVIER (p. ex. durcissement des périodes assimilées).
  pension.min_pension: Pension minimum garantie pour une carrière complète, taux isolé (appliquée au prorata de la fraction de carrière). LEVIER.
  pension.new_pension_factor: Facteur multiplicatif appliqué aux NOUVELLES pensions par régime (par rapport aux règles de 2024) pour les modifications de règles qui ne sont portées par aucun autre paramètre - période du traitement de référence et tantièmes des fonctionnaires, plafonnement des périodes assimilées et salaire fictif limité pour les salariés. LEVIER.
  pension.bonus_malus: Ajustement net moyen des NOUVELLES pensions résultant d'un bonus (+) / malus (-) non exprimé par année, en fraction. LEVIER. Le malus/bonus prévu par la loi figure dans pension.bonus_malus_per_year
  pension.bonus_malus_per_year: Bonus/malus de pension par année de départ plus tardif/anticipé, en fraction de la pension (p. ex. 0.05 = 5 % par an). LEVIER - modifie l'incitation au départ à la pension perçue par le module comportemental et, via pension.bonus_malus_exposure_years, la nouvelle pension moyenne.
  pension.bonus_malus_exposure_years: Nombre moyen d'années pendant lesquelles les nouveaux pensionnés d'un régime sont exposés au bonus/malus par année (négatif = les départs anticipés dominent), moyenne sur l'ensemble des nouveaux pensionnés du régime (un scalaire est accepté et s'applique aux trois régimes)
  pension.welfare_adjustment: Revalorisation réelle annuelle des pensions en cours en plus de l'indexation sur l'indice santé (enveloppe bien-être), par régime - salariés et indépendants (les pensions des fonctionnaires suivent les paramètres de péréquation ; un scalaire est accepté et s'applique aux deux régimes). LEVIER.
  pension.perequation_share: Part de la croissance réelle des salaires du secteur public répercutée sur les pensions en cours des fonctionnaires (péréquation), avant le plafond pension.perequation_cap. LEVIER (0 = pas de revalorisation réelle des pensions des fonctionnaires).
  pension.perequation_cap: Plafond de la revalorisation réelle annuelle des pensions en cours des fonctionnaires par la péréquation (null = pas de plafond). LEVIER.
  pension.exit_rate: Taux de sortie annuel du stock de pensions par régime, en équivalents-pension (décès pondérés par la pension perdue ; un scalaire est accepté et s'applique aux trois régimes). Utilisé pour dériver le flux de nouveaux pensionnés à partir de la variation du stock
  pension.career_wage_lag_years: Retard moyen (en années) avec lequel les nouvelles pensions suivent les salaires réels (moyenne de carrière pour les salariés et les indépendants, dix dernières années pour les fonctionnaires)
  pension.past_real_wage_growth: Croissance annuelle moyenne des salaires réels au cours des décennies précédant 2024 (initialise l'indice retardé des salaires de carrière)
  pension.level_factor: Facteur multiplicatif appliqué aux dépenses de pensions par régime (toutes les pensions en cours). LEVIER pour des modifications linéaires.
  pension.grapa_takeup: Bénéficiaires de la garantie de revenus aux personnes âgées (GRAPA) en part de la population ayant atteint ou dépassé l'âge légal de la pension (65 ans et plus en 2024 ; la garantie s'ouvre à l'âge légal, de sorte que le relèvement à 66 puis à 67 ans retire chaque fois une cohorte). LEVIER.
  pension.grapa_amount: Montant annuel moyen de la GRAPA par bénéficiaire. LEVIER.
  unemp.replacement_rate: Taux de remplacement moyen de l'allocation de chômage sur la durée de l'épisode (65 % les 3 premiers mois, 60 % ensuite, puis dégressif). LEVIER.
  unemp.wage_ceiling: Plafond salarial annuel pour l'allocation de chômage (moyenne sur la durée de l'épisode). LEVIER.
  unemp.min_benefit: Allocation de chômage annuelle minimale (moyenne sur les types de ménages). LEVIER.
  unemp.generosity_factor: Facteur multiplicatif appliqué aux allocations de chômage. LEVIER.
  unemp.wage_position: Salaire antérieur des chômeurs par rapport à la distribution des salaires du secteur privé
  unemp.coverage_rate: Part des chômeurs du modèle (concept de l'enquête sur les forces de travail) qui perçoivent une allocation, par rapport à 2024. LEVIER (admissibilité plus stricte sans changement de statut ; une mesure fixe le niveau, il faut donc comparer avec la trajectoire de référence). La limitation à 12-24 mois adoptée en 2025 est modélisée par le module marché du travail (labour.unemp_benefit_max_years), qui fait sortir les exclus du statut de chômeur - elle n'est PAS répétée ici ; la trajectoire de référence ci-dessous couvre les chômeurs qui cherchent un emploi sans allocation.
  unemp.temporary_rate: Allocations de chômage temporaire en part de la masse salariale privée (unité du modèle)
  unemp.temporary_gap_sensitivity: Semi-élasticité du chômage temporaire à l'écart de demande (un écart de -1 % l'augmente de ce pourcentage)
  unemp.rcc_beneficiaries: Bénéficiaires du régime de chômage avec complément d'entreprise (RCC). VALEUR DE REPLI uniquement - utilisée lorsque le module marché du travail ne fournit pas labour["rcc_beneficiaries"] (le levier s'y trouve - labour.rcc_stock_factor).
  unemp.rcc_avg_benefit: Allocation de chômage annuelle moyenne en RCC (part publique)
  disab.replacement_rate: Taux de remplacement moyen de l'indemnité d'invalidité (65 % avec charge de famille, 55 % isolé, 40 % cohabitant). LEVIER.
  disab.wage_ceiling: Plafond salarial annuel pour l'indemnité de maladie / d'invalidité. LEVIER.
  disab.min_benefit: Indemnité d'invalidité annuelle minimale (travailleur régulier, taux isolé). LEVIER.
  disab.generosity_factor: Facteur multiplicatif appliqué aux indemnités d'invalidité. LEVIER.
  disab.wage_position: Salaire antérieur des bénéficiaires d'indemnités d'invalidité par rapport à la distribution des salaires du secteur privé
  disab.sickness_factor: Facteur multiplicatif appliqué aux indemnités d'incapacité primaire, d'accidents du travail et de maladies professionnelles (elles suivent la masse salariale). LEVIER (p. ex. transfert du salaire garanti vers les employeurs).
  disab.allowance_recipients_share: Bénéficiaires d'allocations aux personnes handicapées sous condition de ressources (ARR/AI, allocations de soins régionales) en part de la population de 18 ans et plus. LEVIER.
  disab.allowance_amount: Allocation annuelle moyenne aux personnes handicapées par bénéficiaire. LEVIER.
  family.allowance_per_child: Allocation familiale annuelle moyenne par enfant bénéficiaire, par région (montant de base + suppléments ; compétence régionale). LEVIER par région.
  family.student_share: Part de la population de 18 à 24 ans ouvrant encore le droit aux allocations familiales
  assist.takeup_rate: Bénéficiaires de l'aide sociale (revenu d'intégration et aide équivalente) en part de la population inactive de 18 à 64 ans. LEVIER.
  assist.amount: Montant annuel moyen de l'aide sociale par bénéficiaire. LEVIER.
  assist.generosity_factor: Facteur multiplicatif appliqué aux prestations d'aide sociale. LEVIER.
  assist.unemp_spillover: Part des personnes exclues des allocations de chômage et sans emploi (labour["unemp_excluded_to_inactive"], ou unemp.coverage_rate < 1) qui demandent l'aide sociale. LEVIER.
  health.profile_ages: Bornes inférieures des classes d'âge du profil de coût des soins de santé
  health.profile_cost: Coût public relatif des soins de santé par habitant pour les hommes, par classe d'âge (forme uniquement ; le niveau est calibré)
  health.profile_female_ratio: Coût des soins de santé par habitant des femmes par rapport aux hommes, par classe d'âge
  health.growth_norm: Norme de croissance réelle légale du budget fédéral des soins de santé (hors indexation sur l'indice santé). LEVIER.
  health.norm_enforcement: Degré auquel la norme de croissance plafonne la croissance dictée par les besoins (1 = la croissance des dépenses ne dépasse jamais la norme, 0 = norme ignorée). LEVIER.
  health.income_elasticity: Élasticité des dépenses réelles de santé par habitant, corrigées de l'âge, au PIB réel par habitant
  health.excess_cost_growth: Croissance réelle annuelle des dépenses de santé par habitant, corrigées de l'âge, en sus de celle du PIB par habitant (technologie, effet Baumol). LEVIER.
  health.healthy_ageing_share: Part des années d'espérance de vie gagnées depuis 2024 qui sont vécues en bonne santé, pour les soins aigus - le profil par âge des coûts des soins de santé se déplace d'autant d'années vers les âges plus élevés (0 = les coûts à un âge donné ne changent jamais, 1 = toutes les années gagnées sont des années en bonne santé). LEVIER.
  health.ltc_healthy_ageing_share: Idem pour les soins de longue durée - part des années d'espérance de vie gagnées depuis 2024 qui sont vécues sans dépendance (le profil par âge des besoins de soins se déplace d'autant d'années vers les âges plus élevés). LEVIER.
  health.copayment_share: Part du coût des soins de santé couverts à charge des patients (tickets modérateurs). LEVIER (les dépenses publiques sont proportionnelles à 1 - part).
  health.ltc_from_health_2024: Soins de longue durée enregistrés en santé (COFOG 07) en 2024 et transférés vers la ligne des soins de longue durée, par entité payeuse - soins résidentiels aux personnes âgées payés par les Communautés et Régions depuis la sixième réforme de l'État (maisons de repos, maisons de repos et de soins, maisons de soins psychiatriques) et soins infirmiers à domicile remboursés par l'assurance soins de santé fédérale. Avec les prestations en nature pour personnes handicapées et personnes âgées des COFOG 10.1-10.2 (5 026 Mio), la ligne s'élève à 11 728 Mio, soit 1,89 % du PIB - le périmètre du Comité d'étude sur le vieillissement (1,9 % du PIB en 2025, dont 1,5 % payé par les Communautés et Régions et 0,4 % par le niveau fédéral et la sécurité sociale). Utilisé par le script de collecte (relancer fetch_expenditure après modification).
  health.ltc_profile_ages: Bornes inférieures des classes d'âge du profil de coût des soins de longue durée
  health.ltc_profile_cost: Coût relatif des soins de longue durée par habitant, par classe d'âge (moins de 65 ans - aide aux personnes handicapées et maisons de soins psychiatriques)
  health.ltc_real_cost_growth: Croissance réelle annuelle du coût des soins de longue durée par personne dépendante, en plus de son indice salaires/prix. LEVIER.
  health.ltc_wage_share: Poids de l'indice des salaires (par rapport à l'IPC) dans l'indice de prix des soins de longue durée
  educ.enrolment: Taux de scolarisation par niveau (primaire = 3-11 ans, secondaire = 12-17 ans, supérieur = 18-24 ans). LEVIER.
  educ.cost_per_pupil: Coût public par élève par niveau, prix de 2024 (other = par habitant de 3 à 24 ans). Évolue avec les salaires publics et les prix dans le modèle. LEVIER.
  educ.real_cost_growth: Croissance réelle annuelle du coût par élève en plus des salaires/prix (taille des classes, normes d'encadrement). LEVIER.
  pubwage.staffing_factor: Facteur multiplicatif appliqué à la masse salariale (effectifs) par fonction. LEVIER. S'applique en plus de la masse salariale publique du module marché du travail ; enseignement = facteur sur le coût par élève.
  pubwage.employer_contribution_rate: Cotisations sociales patronales (effectives + imputées, y compris les charges de pension) par euro de salaires publics. LEVIER.
  exp.function_factor: Facteur multiplicatif appliqué au total des dépenses de fonctionnement par fonction (salaires, achats, transferts courants). LEVIER pour des économies ou des augmentations linéaires.
  exp.intermediate_gdp_elasticity: Élasticité du volume de la consommation intermédiaire (achats de biens et de services) au PIB réel
  exp.intermediate_volume_growth_extra: Croissance annuelle additionnelle en volume de la consommation intermédiaire (norme de croissance ; négatif = gains d'efficience). LEVIER.
  exp.other_gdp_elasticity: Élasticité au PIB nominal des autres transferts courants et des dépenses sans déterminant propre au sein des lignes fonctionnelles
  defence.target_pct_gdp: Dépenses de défense telles qu'enregistrées dans les comptes des administrations publiques (COFOG GF02, SEC - le matériel militaire est compté à sa livraison, les pensions des militaires figurent dans les lignes de pensions) en % du PIB. LEVIER.
  invest.public_pct_gdp: Investissements publics hors défense (formation brute de capital, tous niveaux de pouvoir) en % du PIB. LEVIER.
  invest.capital_transfers_pct_gdp: Aides à l'investissement et autres transferts en capital (hors défense) en % du PIB. LEVIER.
  subsidy.service_vouchers_2024: Coût public des titres-services en 2024 (isolé des subsides COFOG GF0401 par le script de collecte ; relancer fetch_expenditure après modification)
  subsidy.factor: Facteur multiplicatif appliqué aux subsides par type (wage = réductions ciblées de cotisations et dispenses de versement du précompte professionnel enregistrées comme subsides). LEVIER.
  subsidy.gdp_elasticity: Élasticité au PIB nominal des subsides aux transports, à l'énergie/l'environnement et des autres subsides
  debt.avg_maturity_years: Durée moyenne de la dette à long terme - chaque année, une fraction 1/durée en est refinancée au taux à 10 ans du moment
  debt.short_term_share: Part de la dette à court terme (refinancée chaque année au taux à court terme)
  debt.stock_flow_adjustment_pct_gdp: Ajustement stock-flux ajouté chaque année à la dette (opérations financières, préfinancement, privatisations < 0), en % du PIB. LEVIER.
  transfer.default_revenue_split: Attribution par défaut d'une ligne de recettes aux entités lorsque le module des recettes ne fournit pas d'entity_shares
  transfer.ss_altfin_vat_share: Part du transfert de 2024 du pouvoir fédéral vers la sécurité sociale qui relève du financement alternatif par la TVA (croît avec les recettes de TVA)
  transfer.ss_altfin_pit_share: Part du transfert de 2024 du pouvoir fédéral vers la sécurité sociale qui relève du financement alternatif par les précomptes (croît avec les recettes d'IPP)
  transfer.ss_grant_real_growth: Croissance réelle annuelle (au-delà de l'indice santé) des autres dotations de l'État à la sécurité sociale. LEVIER.
  transfer.ss_balancing_share: Part de toute variation du solde de la sécurité sociale (par rapport à son niveau de 2024 en % du PIB) couverte par la dotation d'équilibre fédérale. LEVIER (0 = la sécurité sociale conserve son propre déficit).
  transfer.sfa_real_growth_link: Part de la croissance réelle du PIB répercutée sur les dotations fédérales aux communautés et régions en vertu de la loi spéciale de financement (les dotations sont intégralement indexées sur l'IPC). LEVIER.
  transfer.sfa_demography_weight: Poids de la croissance de la population de moins de 18 ans dans les dotations fédérales aux communautés (clé de la dotation TVA)
  transfer.fed_local_assistance_reimbursement: Part des prestations d'aide sociale locales remboursée par le pouvoir fédéral. LEVIER.
  transfer.gdp_elasticity: Élasticité au PIB nominal des autres transferts entre entités (fonds des communes, sécurité sociale -> régions, ...)
  transfer.adjustment: Modification discrétionnaire d'un transfert entre entités (Mio EUR de l'année, positif = davantage payé par la première entité). LEVIER.
  exp.welfare_adjustment: Revalorisation réelle annuelle des plafonds et des minima des revenus de remplacement et des allocations d'assistance (enveloppe bien-être). LEVIER.
  exp.benefit_indexation_factor: Part de la hausse annuelle de l'indice santé répercutée sur les prestations sociales en cours (1 = indexation intégrale, 0 pendant un an = saut d'index). LEVIER.
  exp.eu_contribution_pct_gni: Contribution au budget de l'UE fondée sur la TVA et le RNB, en % du RNB. LEVIER.
  exp.eu_funded_pct_gdp: Dépenses financées par des transferts de l'UE (exclues de l'indicateur européen des dépenses nettes), en % du PIB
  exp.cyclical_unemployment_semi_elasticity: Semi-élasticité des allocations de chômage à l'écart de production, utilisée pour retirer les dépenses de chômage conjoncturelles de l'indicateur des dépenses nettes
  exp.budget_semi_elasticity: Semi-élasticité du solde budgétaire à l'écart de production (solde structurel = solde - élasticité x écart)
  labour.legal_pension_age: Âge légal de la pension. Le profil des statuts par âge à partir de l'âge de calibrage (65 ans) est décalé de la variation x labour.pension_age_passthrough.
  labour.pension_age_first_year_share: Part d'une modification de l'âge légal de la pension qui est effective la première année, en moyenne annuelle (le nouvel âge s'applique aux personnes atteignant l'ancien âge à partir du 1er février, de sorte que les personnes retenues s'accumulent au fil de l'année)
  labour.pension_age_passthrough: Années de décalage du profil des statuts aux âges >= 65 ans par année de relèvement de l'âge légal de la pension (1 = lorsque l'âge augmente d'un an, les personnes de 65 ans se comportent comme le faisaient celles de 64 ans, pour ce qui est du travail)
  labour.pension_age_benefit_passthrough: Années de décalage de la part des personnes percevant une pension aux âges compris entre 65 ans et l'âge légal, par année de relèvement de l'âge légal de la pension - première et deuxième année de relèvement (un scalaire s'applique à chaque année). Supérieur à labour.pension_age_passthrough - les personnes qui ne travaillent pas plus longtemps et ne peuvent pas encore partir à la pension attendent au chômage, en invalidité ou sans allocation (même répartition que les personnes d'un an plus jeunes). Un âge n'est retardé que des années dont l'âge légal l'a dépassé - le passage de 66 à 67 ans ne change rien pour les personnes de 65 ans.
  labour.early_retirement_age: Âge minimal de la pension anticipée avec la condition de carrière standard
  labour.early_retirement_career_years: Années de carrière requises pour la pension anticipée à l'âge minimal (approximation de la condition de carrière)
  labour.early_retirement_passthrough: Années de décalage du profil des statuts à 63-64 ans (décroissant jusqu'à zéro à 58 ans) par année de relèvement de l'âge de la pension anticipée
  labour.early_retirement_career_effect: Années de décalage du profil des statuts à 63-64 ans par année de carrière supplémentaire requise pour la pension anticipée
  labour.exit_age_trend_per_year: Hausse annuelle de l'âge effectif de sortie à 63-64 ans (décroissant jusqu'à zéro à 58 ans) due à la montée en charge des réformes passées et à des effets de cohorte - l'entrée plus tardive sur le marché du travail rend la condition de carrière de 42 ans contraignante pour les cohortes plus jeunes, et chaque cohorte de femmes a des carrières plus longues. Les valeurs annuelles se cumulent (une modification à partir de l'année t laisse inchangé le niveau atteint avant t).
  labour.exit_age_trend_end_year: Dernière année au cours de laquelle labour.exit_age_trend_per_year s'accumule encore
  labour.exit_age_trend_pension_share: Part de la tendance de l'âge de sortie (labour.exit_age_trend_per_year) qui retarde aussi la prise de cours de la pension ; le reste est de l'emploi gagné sur le chômage, l'invalidité et l'inactivité avant la pension
  labour.exit_age_trend_late_share: Part de la tendance cumulée de l'âge de sortie qui s'applique aussi entre 65 ans et l'âge légal de la pension (ces âges constituent une fenêtre de pension anticipée dès lors que l'âge légal est de 66 ou 67 ans)
  labour.rcc_beneficiaries_2024: Bénéficiaires du régime de chômage avec complément d'entreprise (RCC) en 2024, comptés comme pensionnés entre 60 et 64 ans
  labour.rcc_stock_factor: Stock de RCC par rapport à 2024 (0 = régime éteint) ; les sortants vont vers l'emploi ou le chômage
  labour.rcc_exit_to_employment: Part des personnes n'entrant plus en RCC qui restent dans l'emploi privé (les autres sont au chômage)
  labour.nairu: Taux de chômage structurel (BIT, part de la population active) par région, vers lequel le chômage converge. LEVIER RÉGIONAL - une seule région avec Change(..., key="WAL").
  labour.nairu_cyclical_factor: Multiplicateur temporaire des taux de chômage structurel de toutes les régions, utilisé pour suivre les perspectives officielles à court terme. Distinct de labour.nairu, afin qu'une mesure fixant le taux structurel d'une région ne soit pas confondue avec le cycle à court terme.
  labour.nairu_convergence_speed: Part de l'écart entre le chômage régional et son taux structurel résorbée chaque année
  labour.unemp_benefit_max_years: Durée maximale des allocations de chômage en années (0 = illimitée)
  labour.unemp_time_limit_enforcement: Part des allocataires au-delà de la limite de durée qui sont effectivement exclus (entrée en vigueur progressive par vagues)
  labour.unemp_time_limit_max_age: Âge à partir duquel les chômeurs sont dispensés de la limitation dans le temps
  labour.unemp_duration_survival: Part des allocataires dont l'épisode de chômage dépasse x années - liste de [années, part]
  labour.unemp_exclusion_to_employment: Part des personnes exclues par la limitation dans le temps qui trouvent un emploi (salariés du privé)
  labour.unemp_exclusion_to_disability: Part des personnes exclues par la limitation dans le temps qui passent en maladie / invalidité
  labour.okun_coefficient: Réaction en pourcentage de l'emploi salarié privé à un écart de demande de 1 %
  labour.demand_shock_to_unemployment: Part d'une variation de l'emploi privé due à la demande de travail qui se traduit par du chômage (le reste par de l'inactivité)
  labour.public_employment_growth: Norme de croissance des effectifs des administrations publiques, en plus du lien avec la population et de la trajectoire de référence labour.public_employment_outlook_growth, par région de résidence des agents publics (tous niveaux de pouvoir ; un scalaire est accepté et s'applique aux trois régions). LEVIER RÉGIONAL - une seule région avec Change(..., key="BRU").
  labour.public_employment_pop_elasticity: Élasticité de l'emploi des administrations publiques à la population totale (1 = emploi public par habitant constant ; à mettre à 0 avec labour.public_employment_growth pour une pure norme d'effectifs)
  labour.disability_rate_factor: Multiplicateur de la part, par âge, des personnes en invalidité par rapport à 2024, par région de résidence (la politique de retour au travail est une compétence régionale ; un scalaire est accepté et s'applique aux trois régions). LEVIER RÉGIONAL - une seule région avec Change(..., key="WAL").
  labour.disability_trend_factor: Tendance de référence de la part, par âge, des personnes en invalidité par rapport à 2024, toutes régions confondues (multiplie labour.disability_rate_factor, le levier régional, qui reste exprimé par rapport à cette trajectoire)
  labour.disability_offset_employment: 'Part d''une variation de l''invalidité qui provient de l''emploi / y retourne (le reste : inactivité)'
  labour.student_rate_factor: Multiplicateur de la part des étudiants sans emploi à 18 ans et plus par rapport à 2024
  labour.school_leaving_age: Âge de fin de l'obligation scolaire ; en dessous, toute personne non invalide est étudiante
  labour.cohort_effect_strength: Intensité des effets de cohorte sur les taux d'activité (0 = taux par âge constants, 1 = les gains de 2018/19-2023/24 de chaque cohorte sont intégralement reportés aux âges plus élevés)
  labour.indexation_factor: Part de l'inflation de l'indice santé répercutée sur les salaires par l'indexation automatique (1 = intégrale, 0 = saut d'index)
  labour.indexation_lag_weight: Poids de la croissance de l'indice santé de l'année précédente dans l'indexation des salaires de l'année
  labour.wage_norm_real_cap: Croissance réelle maximale des salaires au-delà de l'indexation (norme salariale, loi du 26 juillet 1996) ; null = pas de plafond
  labour.wage_drift: Écart annuel de croissance des salaires par type d'emploi, en plus de l'indice des salaires (pour les agents publics - en plus de la combinaison d'indice des salaires et d'indice santé fixée par labour.public_wage_link). Les valeurs annuelles se cumulent (une modification à partir de l'année t laisse inchangé le niveau atteint avant t).
  labour.wage_dispersion_factor: Exposant appliqué au profil relatif des rémunérations par dixième des salariés du privé (SES 2022) pour obtenir le profil de chaque type d'emploi
  labour.sector_share_drift: Dérive annuelle initiale de la part de chaque branche dans l'emploi privé et indépendant (décroît selon labour.sector_drift_half_life)
  labour.sector_drift_half_life: Demi-vie de la dérive des parts sectorielles
  labour.care_demand_age_weights: Demande relative de soins de santé et de soins de longue durée par personne selon l'âge - liste de [âge, poids], interpolation linéaire entre les points
  labour.care_employment_elasticity: Élasticité de l'emploi dans la santé et l'action sociale à la population pondérée par les besoins de soins
  labour.care_employment_max_share: Plafond de la part des salariés du privé occupés dans la santé et l'action sociale
  labour.education_employment_elasticity: Élasticité de la part de l'enseignement dans l'emploi public à la part de la population de 3 à 22 ans
  labour.hours_growth: Croissance annuelle des heures travaillées par travailleur
  labour.part_time_share: Part des travailleurs à temps partiel dans l'emploi, 20-64 ans
  labour.blue_collar_share: Part des ouvriers parmi les salariés du secteur privé
  labour.blue_collar_share_trend: Variation annuelle de la part des ouvriers
  labour.statutory_share: Part des agents statutaires (nommés) parmi les salariés des administrations publiques
  labour.statutory_share_trend: Variation annuelle de la part des agents statutaires (les valeurs annuelles se cumulent)
  labour.flexi_jobs: Personnes exerçant un flexi-job, au niveau d'emploi privé de 2024
  labour.student_jobs: Étudiants ayant exercé un job étudiant dans l'année, au nombre d'étudiants de 2024
  labour.service_voucher_workers: Travailleurs titres-services, au niveau d'emploi privé de 2024
  labour.cross_border_out: Résidents travaillant à l'étranger, au niveau d'emploi de 2024
  labour.cross_border_in: Non-résidents travaillant en Belgique, au niveau d'emploi de 2024
  labour.public_share_by_sector: Part des salariés de chaque branche occupés par les administrations publiques (S13) ; branche manquante = 0
  labour.disabled_2024: Personnes en invalidité (incapacité de travail de plus d'un an) en 2024
  labour.disability_age_profile: Taux d'invalidité relatif des hommes selon l'âge - liste de [âge, taux relatif] ; mis à l'échelle de labour.disabled_2024
  labour.disability_female_ratio: Taux d'invalidité des femmes par rapport aux hommes du même âge
  labour.early_retired_age_profile: Part relative des pensionnés selon l'âge en dessous de l'âge légal de la pension - liste de [âge, part relative] ; mise à l'échelle de la part de pensionnés parmi les 18-64 ans selon EU-SILC (ilc_lvhl02 2024, hommes 4,1 %, femmes 3,0 %)
  labour.calibration_legal_pension_age: Âge légal de la pension incorporé dans les profils de statuts observés en 2024 (référence pour labour.legal_pension_age ; ce n'est pas un levier)
  labour.calibration_early_retirement_age: Âge de la pension anticipée incorporé dans les profils de statuts observés en 2024 (référence ; ce n'est pas un levier)
  labour.calibration_early_retirement_career_years: Condition de carrière incorporée dans les profils de statuts observés en 2024 (référence ; ce n'est pas un levier)
  labour.cohort_start_age: Classe d'âge quinquennale la plus jeune dont le taux d'activité reçoit des effets de cohorte
  labour.cohort_last_age: Classe d'âge quinquennale la plus âgée (borne inférieure) dont le taux d'activité reçoit des effets de cohorte
  labour.cohort_ratio_bounds: Bornes de la variation sur 5 ans du taux d'activité d'un groupe reportée comme effet de cohorte [min, max]
  macro.inflation: Inflation des prix à la consommation (IPC national, moyenne annuelle)
  macro.health_index_wedge: Croissance de l'indice santé moins inflation de l'IPC (l'indice santé exclut le tabac, l'alcool et les carburants)
  macro.gdp_deflator_wedge: Croissance du déflateur du PIB moins inflation de l'IPC. Négatif en 2026-2028 - les prix à l'importation (énergie) relèvent davantage les prix à la consommation que le prix de la production intérieure (perte de termes de l'échange), de sorte que le PIB nominal croît moins que ne le donnerait une projection fondée sur l'IPC
  macro.interest_rate_10y: Rendement des obligations d'État belges à 10 ans
  macro.interest_rate_short: Taux du marché monétaire à 3 mois (zone euro)
  macro.productivity_growth: Croissance tendancielle de la productivité du travail par travailleur (toutes branches). Jusqu'en 2031, il s'agit de la croissance qui, avec la trajectoire d'emploi propre au modèle, reproduit la croissance officielle du PIB réel
  macro.cyclical_output_gap: Position conjoncturelle exogène de la production par rapport à la trajectoire d'offre (s'ajoute à l'écart de demande comportemental ; l'emploi privé réagit via labour.okun_coefficient)
  macro.productivity_growth_sector_wedge: Croissance de la productivité d'une branche moins la tendance commune (branche manquante = 0)
  macro.hours_output_elasticity: Élasticité de la production par travailleur aux heures travaillées par travailleur
  macro.real_wage_productivity_share: Part de la croissance tendancielle de la productivité répercutée sur les salaires réels (1 = part salariale constante à long terme)
  macro.real_wage_productivity_lag_weight: Poids de la croissance tendancielle de la productivité de l'année précédente dans la croissance des salaires réels de l'année
  macro.household_savings_rate: Épargne brute des ménages en part du revenu disponible brut
  macro.fuel_share_of_cp072: Part des carburants dans le poste COICOP 07.2 (utilisation de véhicules personnels), qu'Eurostat ne publie que globalement (19,7 milliards EUR en 2024)
  macro.investment_share_factor: Multiplicateur du ratio de 2024 de la formation brute de capital (logements compris) au PIB
  macro.gov_consumption_wage_weight: Poids de la masse salariale publique dans la croissance de la consommation publique (le reste suit le PIB nominal)
  macro.interest_income_rate_elasticity: Élasticité des revenus d'intérêts des ménages au taux à 10 ans
  macro.property_transactions_2024: Valeur des transactions immobilières soumises aux droits d'enregistrement en 2024 (croît avec le PIB nominal)
  macro.inheritance_flow_2024: Valeur des successions et donations en 2024 (croît avec les décès x le patrimoine financier par habitant)
  pit.bracket_thresholds: Limites supérieures des trois premières tranches de l'impôt des personnes physiques (revenu imposable net)
  pit.bracket_rates: Taux marginaux de l'impôt des personnes physiques pour les quatre tranches
  pit.basic_allowance: Quotité exemptée d'impôt, dont l'avantage est calculé aux taux des tranches inférieures. Pour les pensions et les revenus de remplacement, voir pit.allowance_neutralised_replacement.
  pit.allowance_special_scale: Interrupteur (1 ou 0) - l'impôt sur la quotité exemptée d'impôt (montant de base et majorations) est calculé selon le barème spécial de pit.allowance_scale_thresholds et pit.allowance_second_band_rate (1) ou selon les tranches ordinaires (0).
  pit.allowance_scale_thresholds: Barème spécial pour l'impôt sur la quotité exemptée d'impôt - limites supérieures de ses trois premières tranches (la quotité et ses majorations pour enfants sont valorisées au taux le plus bas, 25 %, jusqu'à la première limite, à pit.allowance_second_band_rate, 30 %, jusqu'à la deuxième, puis au taux de la deuxième tranche ordinaire, 40 %, jusqu'à la troisième, et à 45 % au-delà).
  pit.allowance_second_band_rate: Barème spécial pour l'impôt sur la quotité exemptée d'impôt - taux de sa deuxième tranche (entre les deux premières limites de pit.allowance_scale_thresholds). Les autres tranches utilisent les taux des tranches ordinaires (25 %, puis 40 % et 45 %).
  pit.allowance_neutralised_replacement: Partie de la quotité exemptée d'impôt qui ne bénéficie pas aux pensions ni aux allocations de chômage et de maladie. Les relèvements de la quotité de 2026 à 2030 sont neutralisés pour ces revenus par une diminution de leurs réductions d'impôt à hauteur du même avantage, ce qui est modélisé comme une quotité exemptée plus faible pour eux.
  pit.expense_deduction_rate: Frais professionnels forfaitaires des salariés, en part du salaire brut diminué des cotisations sociales
  pit.expense_deduction_max: Plafond des frais professionnels forfaitaires des salariés
  pit.workbonus_tax_reduction_rate: Bonus à l'emploi fiscal - réduction d'impôt en part du bonus à l'emploi social effectivement accordé, pour le volet A (bas salaires) et le volet B (très bas salaires). Le plafond annuel de la réduction (1 380 EUR pour les revenus 2024) n'est pas modélisé.
  pit.reduction_replacement: Réduction d'impôt pour revenus de remplacement (montant de base + montant complémentaire), par nature (pensions, allocations de chômage, indemnités de maladie et d'invalidité). La dégressivité distincte du montant complémentaire n'est pas modélisée.
  pit.reduction_unemployment_factor: Multiplicateur de la réduction d'impôt pour allocations de chômage (trajectoire de réforme)
  pit.reduction_unemployment_phaseout: Revenus imposables entre lesquels la réduction d'impôt pour allocations de chômage est progressivement ramenée à zéro [début, fin]
  pit.reduction_phaseout_start: Revenu imposable au-delà duquel la réduction d'impôt pour pensions et indemnités de maladie est progressivement supprimée
  pit.reduction_phaseout_end: Revenu imposable auquel prend fin la suppression progressive de la réduction d'impôt pour pensions et indemnités de maladie
  pit.reduction_floor_share: Part de la réduction d'impôt pour revenus de remplacement conservée au-delà de la fin de la zone de dégressivité, par nature
  pit.reduction_pension_top_limits: Revenus imposables entre lesquels le tiers restant de la réduction d'impôt pour pensions est retiré [début, fin] (s'applique lorsque pit.reduction_pension_top_phaseout vaut 1)
  pit.reduction_pension_top_phaseout: Interrupteur (0 ou 1) du retrait de la réduction d'impôt pour pensions aux hauts revenus
  pit.autonomy_factor: Part de l'impôt État fédéral cédée aux régions (facteur d'autonomie)
  pit.regional_surcharge: Centimes additionnels régionaux sur l'impôt État réduit, par région de résidence. LEVIER - une seule région avec Change(key="WAL").
  pit.municipal_surcharge: Taux moyen des additionnels communaux sur l'impôt des personnes physiques total (fédéral + régional), par région. LEVIER - une seule région avec Change(key="BRU").
  pit.company_car_benefit: Avantage de toute nature imposable moyen pour une voiture de société
  pit.company_car_share_by_decile: Part des salariés du secteur privé disposant d'une voiture de société, par décile de salaire (du plus bas au plus élevé)
  pit.pension_decile_profile: Pension brute de chaque dixième de pensionnés par rapport à la pension moyenne (utilisée pour taxer progressivement les dépenses de pensions)
  pit.benefit_decile_profile: Allocation de chômage ou indemnité d'invalidité de chaque dixième de bénéficiaires par rapport à l'allocation moyenne
  pit.tax_expenditure_pension_savings: Coût budgétaire de la réduction d'impôt fédérale pour l'épargne-pension et l'épargne à long terme, à l'échelle de 2024 (croît avec le PIB nominal)
  pit.tax_expenditure_service_vouchers: Coût budgétaire des réductions d'impôt régionales pour les titres-services, par région, à l'échelle de 2024 (croît avec le PIB nominal). LEVIER - mettre une région à 0 pour supprimer l'avantage.
  pit.tax_expenditure_mortgage: Coût budgétaire des avantages fiscaux régionaux pour les emprunts relatifs à l'habitation propre (woonbonus, chèque habitat, bonus logement), par région, à l'échelle de 2024 (croît avec le PIB nominal). LEVIER - mettre une région à 0 pour supprimer l'avantage.
  ssc.employee_rate: Taux des cotisations personnelles de sécurité sociale sur les salaires bruts (secteur privé et personnel contractuel du secteur public)
  ssc.employee_rate_statutory: Taux des cotisations personnelles des agents statutaires (7,5 % Fonds des pensions de survie + 3,55 % soins de santé)
  ssc.public_statutory_share: Part des agents statutaires parmi les salariés du secteur public utilisée dans la fiche de paie de type emp_public
  ssc.pay_months: Nombre de salaires mensuels dans la rémunération brute annuelle (12 + treizième mois + double pécule de vacances), utilisé pour dériver le salaire mensuel de référence du bonus à l'emploi
  ssc.workbonus_a_max_monthly: Bonus à l'emploi social, volet A (bas salaires) - réduction mensuelle maximale des cotisations personnelles, employés
  ssc.workbonus_b_max_monthly: Bonus à l'emploi social, volet B (très bas salaires) - réduction mensuelle maximale des cotisations personnelles, employés
  ssc.workbonus_b_full_wage_monthly: Salaire mensuel de référence jusqu'auquel le volet B du bonus à l'emploi social est accordé intégralement
  ssc.workbonus_a_full_wage_monthly: Salaire mensuel de référence jusqu'auquel le volet A du bonus à l'emploi social est accordé intégralement et auquel le volet B s'annule
  ssc.workbonus_zero_wage_monthly: Salaire mensuel de référence auquel le bonus à l'emploi social (volet A) s'annule
  ssc.special_thresholds: Cotisation spéciale de sécurité sociale - limites de revenu du barème annuel (revenu imposable d'une personne imposée isolément) ; la dernière limite est celle où le maximum est atteint
  ssc.special_rates: Cotisation spéciale de sécurité sociale - taux dans chaque tranche du barème annuel
  ssc.special_max: Cotisation spéciale de sécurité sociale annuelle maximale (par ménage jusqu'aux revenus 2027, par personne à partir de 2028)
  ssc.employer_rate: Taux de base des cotisations patronales, secteur privé (modération salariale comprise), après le tax shift
  ssc.employer_other_rate: Autres cotisations patronales sur les salaires bruts (cotisation de 1,60-1,69 % des employeurs occupant 10 travailleurs ou plus, Fonds de fermeture d'entreprises, chômage temporaire, Fonds amiante, cotisation sur le deuxième pilier, pécule de vacances des ouvriers, etc.), moyenne
  ssc.structural_reduction_slope: Réduction structurelle des cotisations patronales (catégorie 1), composante bas salaires - réduction par euro de salaire en dessous du seuil S0
  ssc.structural_reduction_threshold: Salaire brut annuel (4 x le S0 trimestriel) en dessous duquel s'applique la composante bas salaires de la réduction structurelle des cotisations patronales
  ssc.structural_reduction_low_slope: Réduction structurelle des cotisations patronales (catégorie 1), composante très bas salaires - réduction par euro de salaire en dessous du seuil S2
  ssc.structural_reduction_low_threshold: Salaire brut annuel (4 x le S2 trimestriel) en dessous duquel s'applique la composante très bas salaires de la réduction structurelle
  ssc.employer_cap_wage: Salaire brut annuel (4 x le plafond trimestriel) au-delà duquel les cotisations patronales de base ne sont plus dues (exonération partielle pour les très hauts salaires)
  ssc.employer_cap_exempt_share: Part de la cotisation patronale de base exonérée sur la partie du salaire dépassant ssc.employer_cap_wage (0 = pas de plafond)
  ssc.employer_rate_public: Taux moyen des cotisations patronales effectives sur les salaires des administrations publiques (personnel contractuel à des taux proches du privé, agents statutaires à taux réduits, cotisations au fonds de pension des pouvoirs locaux)
  ssc.self_employed_rate: Taux des cotisations sociales des indépendants (à titre principal) jusqu'au premier plafond
  ssc.self_employed_rate_upper: Taux des cotisations sociales des indépendants entre le premier et le second plafond (nul au-delà)
  ssc.self_employed_ceiling_1: Premier plafond de revenus des cotisations des indépendants
  ssc.self_employed_ceiling_2: Second plafond de revenus des cotisations des indépendants (aucune cotisation au-delà)
  ssc.self_employed_min_income: Revenu minimal sur lequel un indépendant à titre principal paie des cotisations
  ssc.pension_health_rate: Cotisation d'assurance soins de santé retenue sur les pensions
  ssc.pension_health_threshold: Pension brute annuelle en dessous de laquelle aucune cotisation soins de santé n'est retenue (la cotisation ne peut pas faire descendre la pension sous ce montant), personne isolée
  cit.rate: Taux normal de l'impôt des sociétés
  cit.sme_rate: Taux réduit de l'impôt des sociétés sur la première tranche de 100 000 EUR de bénéfice des petites sociétés
  cit.sme_base_share: Part de la base imposable taxée au taux réduit PME
  cit.innovation_deduction_rate: Déduction pour revenus d'innovation - part des revenus d'innovation nets éligibles exonérée d'impôt des sociétés
  cit.innovation_income_share: Revenus d'innovation éligibles en part des bénéfices avant déductions
  cit.investment_deduction_base_share: Part des bénéfices avant déductions absorbée par la déduction pour investissement
  cit.minimum_tax_rate: Taux d'imposition effectif minimum des grands groupes multinationaux (Pilier 2 de l'OCDE, en vigueur depuis 2024)
  cit.minimum_tax_base_share: Part des bénéfices imposables réalisés par les groupes concernés et taxés en dessous du taux minimum
  cit.minimum_tax_low_etr: Taux effectif moyen des bénéfices faiblement taxés soumis à l'impôt complémentaire au titre de l'impôt minimum
  vat.rate_standard: Taux normal de TVA
  vat.rate_intermediate: Taux intermédiaire de TVA (repas au restaurant, logement social, margarine, charbon ; hôtels et campings à partir de mars 2026)
  vat.rate_reduced: Taux réduit de TVA (alimentation, médicaments, livres, rénovation de logements anciens, gaz et électricité des ménages, transport de personnes ; hôtels jusqu'en février 2026)
  vat.mix: Part de chaque base imposable taxée au taux [normal, intermédiaire, réduit, zéro ou exempté] (parts de la valeur hors TVA). Les clés sont les catégories de consommation, plus trois bases hors ménages (investissement en logements neufs, achats des administrations publiques, intrants des secteurs exemptés de TVA). Pour faire passer une catégorie à un autre taux, modifier sa ligne.
  vat.gov_purchases_share: Achats des administrations publiques grevés de TVA non déductible (consommation intermédiaire + investissements) en part de la consommation finale des administrations publiques. Solution de repli uniquement - utilisée lorsque les lignes de dépenses ne sont pas disponibles ; sinon, la base est construite à partir de celles-ci (vat.gov_intermediate_share).
  vat.gov_intermediate_share: Part de la consommation intermédiaire (et des investissements de défense) dans les lignes de dépenses qui mêlent salaires et achats (administration, enseignement, défense, police, transports ...). Avec les investissements publics, elle constitue la base de la TVA non déductible payée par les administrations publiques elles-mêmes.
  vat.gov_marginal_purchases_share: Part d'une VARIATION de ces lignes de dépenses par rapport au scénario de référence qui correspond à des achats de biens et services (le reste étant des salaires). 1 = une réduction de la consommation porte sur les achats, comme dans les variantes du Bureau fédéral du Plan ; vat.gov_intermediate_share = au prorata des salaires et des achats. LEVIER.
  vat.exempt_sector_input_share_gdp: Achats grevés de TVA non déductible en dehors des ménages, des investissements en logements et des administrations publiques - intrants et investissements des activités exemptées de TVA (finance, santé, enseignement, location, institutions sans but lucratif) et coûts non déductibles des autres entreprises - en part du PIB
  vat.compliance_gap: Écart de conformité en matière de TVA sur les livraisons au taux normal - part de la TVA due à 21 % qui n'est pas perçue (fraude, insolvabilité, erreurs). LEVIER pour les mesures de lutte contre la fraude.
  vat.compliance_gap_reduced: Écart de conformité en matière de TVA sur les livraisons aux taux réduit et intermédiaire (6 % et 12 %) - part de la TVA due à ces taux qui n'est pas perçue.
  excise.fuel_duty: Accises sur les carburants, moyenne de l'essence et du diesel
  excise.fuel_pretax_price: Prix moyen à la pompe des carburants hors accises et TVA
  excise.tobacco_duty: Accises sur le tabac (spécifiques + ad valorem), par paquet de 20 cigarettes
  excise.tobacco_pretax_price: Prix d'un paquet de 20 cigarettes hors accises et TVA
  excise.alcohol_duty: Accises sur les boissons alcoolisées, moyenne par litre d'alcool pur pour la bière, le vin et les spiritueux
  excise.alcohol_pretax_price: Prix moyen des boissons alcoolisées hors accises et TVA, par litre d'alcool pur
  excise.energy_duty: Accises fédérales sur le gaz et l'électricité des ménages, moyenne par MWh d'énergie du logement
  excise.energy_shift_factor: Multiplicateur d'excise.energy_duty pour le glissement, prévu par la loi, des accises de l'électricité vers le gaz (taux pondéré des ménages par rapport aux taux inchangés de 2024)
  excise.energy_green_levy: Certificats verts régionaux et prélèvements des fonds énergie répercutés sur les factures d'énergie, moyenne par MWh
  excise.energy_pretax_price: Prix moyen de l'électricité, du gaz et du gasoil de chauffage pour les ménages, hors prélèvements et TVA
  excise.beverage_packaging_rate: Accises sur les boissons non alcoolisées et le café, plus la cotisation d'emballage, en équivalent ad valorem sur la consommation d'aliments et de boissons
  cap.withholding_rate: Taux du précompte mobilier sur les intérêts et dividendes
  cap.withholding_reduced_rate: Taux réduit du précompte mobilier (dividendes VVPRbis des petites sociétés, réserves de liquidation, dépôts d'épargne réglementés au-delà de l'exonération)
  cap.income_share_reduced: Part des revenus d'intérêts et de dividendes des ménages taxée au taux réduit
  cap.income_share_exempt: Part des revenus d'intérêts et de dividendes des ménages exonérée de précompte mobilier (intérêts des dépôts d'épargne en deçà de 1 020 EUR, première tranche de 833 EUR de dividendes, produits de pension et d'assurance)
  cap.securities_account_tax_rate: Taxe annuelle sur les comptes-titres de plus de 1 million EUR
  cap.tob_rate: Taxe sur les opérations de bourse (TOB), taux moyen sur les transactions taxées
  cap.gains_tax_rate: Taxe sur les plus-values sur actifs financiers réalisées par les ménages (cotisation de solidarité), sur les plus-values constituées à partir du 1er janvier 2026
  cap.gains_taxable_gains: Plus-values imposables réalisées sur actifs financiers au-delà de l'exonération, à l'échelle de 2024 (croît avec le patrimoine financier des ménages). Les plus-values constituées avant 2026 sont exonérées, de sorte que la base se constitue progressivement.
  prop.region_base_share: Parts régionales des bases du précompte immobilier et des droits de succession et d'enregistrement (valeur des transactions, successions, valeurs locatives)
  prop.registration_rate: Taux normal des droits d'enregistrement sur les achats immobiliers, par région
  prop.registration_rate_sole_home: Droits d'enregistrement sur l'achat d'une habitation propre et unique, par région (les régimes d'abattement sont exprimés sous la forme d'un taux effectif)
  prop.sole_home_share: Part de la valeur des transactions immobilières portant sur une habitation propre et unique
  prop.inheritance_rate: Taux effectif moyen des droits de succession et de donation sur le flux des successions et donations, par région
  prop.property_tax_rate: Taux de base régional du précompte immobilier sur le revenu cadastral indexé
  prop.property_tax_local_multiplier: Centimes additionnels provinciaux + communaux au précompte immobilier, en multiple du prélèvement régional (centimes additionnels / 100)
  rev.insurance_premium_tax_rate: Taxe annuelle sur les contrats d'assurance (taux normal), à laquelle s'ajoutent, par calibrage, les suppléments au profit de la sécurité sociale sur les assurances auto, incendie et hospitalisation
  rev.dividends: Dividendes reçus par les administrations publiques, par participation, à l'échelle de 2024 (croissent avec le PIB nominal). Mettre une participation à 0 pour simuler sa vente.
  rev.line_factor: "Multiplicateur discrétionnaire d'une ligne de recettes (1.0 = politique actuelle), pour les lignes sans taux légal explicite (taxes sur les véhicules, taxes environnementales, taxes bancaires, ventes, ...) et pour les modifications datées du scénario de référence. Une ligne se cible avec Change(key=\"<line>\")."
  educ.community_cost_factor: Multiplicateur du coût public par élève (tous niveaux) par communauté. Le chiffre de la Communauté française couvre la Wallonie (y compris la Communauté germanophone, non modélisée séparément) et les écoles francophones de Bruxelles ; la Communauté flamande couvre la Flandre et les écoles néerlandophones de Bruxelles (clé de répartition regional.brussels_dutch_share). LEVIER COMMUNAUTAIRE - Change(..., key="french_community").
  educ.community_enrolment_factor: Multiplicateur des taux de scolarisation (tous niveaux) par communauté ; les élèves et, à taux d'encadrement inchangé, le personnel enseignant varient dans la même proportion. LEVIER COMMUNAUTAIRE - Change(..., key="flemish_community").
  family.childcare_factor: Multiplicateur des dépenses des communautés pour l'accueil de l'enfance et les services aux familles (Opgroeien / Kind en Gezin, ONE) par communauté ; s'applique à la part des communautés et régions dans la ligne. LEVIER COMMUNAUTAIRE - Change(..., key="french_community").
  health.ltc_regional_factor: Multiplicateur des dépenses régionales de soins de longue durée (soins résidentiels aux personnes âgées, soins à domicile, budgets de soins ; compétence régionale depuis la sixième réforme de l'État) pour les résidents de chaque région. LEVIER RÉGIONAL - Change(..., key="FLA").
  subsidy.service_voucher_factor: Multiplicateur du subside régional par titre-service (régionalisé depuis 2015) par région ; multiplie subsidy.factor[service_vouchers]. Parts budgétaires des régions - regional.service_voucher_shares. LEVIER RÉGIONAL - Change(..., key="BRU").
  subsidy.target_group_factor: Multiplicateur des réductions groupes cibles régionales de cotisations patronales et des autres subsides salariaux régionaux (part des communautés et régions dans la ligne des subsides salariaux, répartie entre les régions selon les salariés du privé qui y résident) ; multiplie subsidy.factor[wage]. Effet budgétaire uniquement (aucune réaction de la demande de travail n'est modélisée pour ce levier). LEVIER RÉGIONAL - Change(..., key="WAL").
  invest.regional_extra_pct_gdp: Investissements publics supplémentaires des pouvoirs publics d'une région, en % du PIB de cette région, en plus de invest.public_pct_gdp (tous niveaux de pouvoir, % du PIB national). LEVIER RÉGIONAL - Change(..., key="FLA").
  labour.activation_factor: Effort d'activation du service régional de l'emploi (VDAB, Forem, Actiris) par rapport à son propre niveau de 2024, par région. Une valeur supérieure à 1 abaisse le taux de chômage structurel de la région (élasticité labour.activation_nairu_elasticity) et augmente dans la même proportion la part des personnes exclues par la limitation fédérale dans le temps qui trouvent un emploi. LEVIER RÉGIONAL - une seule région avec Change(..., key="BRU").
  labour.activation_nairu_elasticity: Élasticité du taux de chômage structurel d'une région à son effort d'activation (taux structurel x facteur ^ -élasticité)
  regional.productivity_growth_wedge: Écart entre la croissance de la productivité d'une région (lieu de travail) et la tendance nationale macro.productivity_growth. Relève le PIB régional et, à concurrence du poids de la région, le PIB national. Les salaires continuent de suivre la tendance nationale (voir belsim.regional). LEVIER RÉGIONAL - Change(..., key="FLA").
  regional.commuting_matrix: Part des résidents occupés d'une région (clé extérieure) travaillant dans chaque région (clé intérieure) ; le solde travaille à l'étranger. L'emploi au lieu de travail est ensuite calibré sur les comptes régionaux.
  regional.brussels_dutch_share: Part de la population bruxelloise desservie par la Communauté flamande (le reste par la Communauté française) ; ventile les dépenses et les comptes des communautés entre les régions.
  regional.service_voucher_shares: Parts des régions dans le budget des subsides aux titres-services (pondérations de subsidy.service_voucher_factor)
  regional.entity_accounts_2024: 'Comptes SEC 2010 de 2024 des entités fédérées - recettes totales, dépenses totales, solde (capacité de financement) et dette brute consolidée. walloon_region = Région wallonne + Communauté germanophone (579,5 / 695,5 / -116,0 / 1 224,0) ; brussels_region = Région + COCOM + COCOF + VGC (somme non consolidée). Les entités ne sont pas consolidées entre elles ; la différence avec le sous-secteur S1312 (unités interrégionales : solde de +771,1, transferts entre entités de -6 745,5 des deux côtés, dette 3 532,6 - 5 120,4) constitue la pseudo-entité interregional_consolidation.'
  regional.sfa_grants_2024: Transferts de la loi spéciale de financement du pouvoir fédéral vers chaque entité en 2024, par mécanisme - vat_pupils (dotation TVA aux communautés, suit le nombre d'élèves), pit_key (dotations IPP qui suivent le rendement de l'impôt des personnes physiques sur le territoire - dotation IPP des communautés, dotations emploi / dépenses fiscales / résiduelle des régions), needs_population (allocations familiales, soins aux personnes âgées, soins de santé et hôpitaux - suivent la population de moins de 18 ans et de plus de 80 ans), solidarity (mécanisme de solidarité nationale pour les régions dont la part dans l'IPP est inférieure à leur part dans la population), transition (mécanisme de transition, nominalement constant jusqu'en 2024, puis supprimé progressivement), other (financement de Bruxelles, compensation navetteurs et fonctionnaires internationaux, divers). Les centimes additionnels régionaux à l'IPP et les impôts régionaux sont des recettes propres et ne
    sont pas inclus. Le modèle met à l'échelle les composantes hors transition de sorte que leur somme corresponde au transfert fédéral agrégé du module des soldes (SEC, 57 018 en 2024 contre 56 222 ici).
  regional.sfa_transition_phase_out: Mécanisme de transition de la loi spéciale de financement - dernière année au montant nominal intégral et nombre d'années de la suppression linéaire jusqu'à zéro
  regional.own_taxes_2024: Recettes fiscales propres des régions en 2024 (SEC) - impôt des personnes physiques régional et autres impôts régionaux (impôts indirects + impôts en capital). Utilisées pour la ventilation régionale des lignes d'impôts lorsque le module des recettes ne publie pas les recettes par région.
  regional.local_government_2024: Comptes de 2024 des pouvoirs locaux (S1313) par région (WAL y compris les communes germanophones). La partie non attribuée à une région (zones de police et de secours, etc. - recettes 8 843,2, dette 1 443,8) est répartie proportionnellement par le modèle, qui applique ces parts aux agrégats nationaux des pouvoirs locaux.
  regional.consolidation_shares: Attribution régionale des transferts entre entités fédérées qui sont consolidés dans le sous-secteur S1312 (principalement le transfert de la Sainte-Émilie de la Communauté française vers la Région wallonne et la COCOF, 4 611 Mio EUR pour la Wallonie dans le budget 2024, et le financement des commissions communautaires bruxelloises par la Région) ; utilisée uniquement pour regional.gov_revenue / gov_expenditure.
  regional.fiscal_incidence_keys: Clé de répartition par région des lignes de dépenses du pouvoir fédéral et de la sécurité sociale pour regional.net_fiscal_transfer (lignes non reprises - population). Clés - retired, elderly (65 ans et plus), unemployed, disabled, health_need (profil de coût par âge), children, inactive (18-64 ans), private_employees, population.
  pit.region_tax_share: Parts des régions de résidence dans l'impôt État (impôt des personnes physiques fédéral + régional), utilisées comme pondérations des additionnels moyens nationaux d'une fiche de paie sans région. Les lignes de recettes agrégées ne les utilisent pas (elles calculent chaque région à partir de sa propre population).
  pit.single_parent_eligible_share: Part des personnes imposées isolément avec enfants à charge qui bénéficient de la majoration de la quotité exemptée pour parent isolé (population des unités fiscales uniquement ; une fiche de paie de parent isolé l'obtient toujours). Inférieure à 1 à partir des revenus 2029, lorsque la majoration est refusée si un autre adulte qui n'est pas un proche parent vit dans le ménage.
  pit.sole_income_pension_share: Part des déclarations communes à revenu unique (les couples pour lesquels le quotient conjugal importe le plus) qui concernent des couples de pensionnés ; les autres sont des couples d'âge actif. Détermine la population des unités fiscales qui sous-tend l'impôt des personnes physiques agrégé.
  pit.two_income_lower_share: Part du revenu imposable commun d'un couple à deux revenus détenue par le partenaire ayant le revenu le plus faible - cinq valeurs équiprobables. Utilisée une seule fois, l'année de base, pour transformer la distribution des déclarations fiscales en une distribution de personnes (les tranches s'appliquent à chaque partenaire) ; elle détermine surtout quelle part du revenu des couples atteint la tranche supérieure.
  dyn.wage_cost.employer_contribution_weight: Poids d'une modification des cotisations patronales (coût du travail par euro de salaire brut) dans l'écart de coût salarial qui alimente les prix à la consommation. Inférieur à 1, car une partie de la modification des cotisations est absorbée par les marges et par les négociations salariales ultérieures plutôt que répercutée sur les prix.
  dyn.wage_bargaining.worker_share_employer_contributions: 'Part d''une modification des cotisations patronales (coût du travail par euro de salaire brut) que les travailleurs finissent par supporter une fois les salaires renégociés : après une hausse, les salaires bruts baissent à concurrence de cette part de la hausse du coût du travail. Le déplacement de l''indice des salaires agit sur la demande de travail, les prix et la compétitivité par le canal du coût salarial unitaire réel. LEVIER (0 = les salaires bruts ne réagissent pas aux cotisations patronales).'
  dyn.wage_bargaining.compensation_employee_taxes: Part d'une perte de salaire net due aux cotisations sociales personnelles ou à l'impôt des personnes physiques (à salaire brut inchangé) que les travailleurs récupèrent dans leur salaire brut une fois les salaires renégociés ; elle augmente le coût du travail, de sorte que les emplois sont perdus par la demande de travail plutôt que par l'offre de travail. LEVIER (0 = les prélèvements sur les travailleurs ne se répercutent jamais sur le coût du travail).
  dyn.wage_bargaining.worker_share_indirect_taxes: Part d'une hausse des prix à la consommation due aux impôts indirects que les salaires reperdent par la négociation, après que l'indexation automatique l'a d'abord intégralement compensée (les salaires ne peuvent pas durablement devancer les prix perçus par les entreprises, qui ne comprennent pas la taxe).
  dyn.wage_bargaining.speed: Part de l'écart restant entre le déplacement négocié des salaires et sa cible résorbée chaque année. La cible correspond au coin fiscal et à l'écart de demande de l'année précédente, de sorte que les salaires ne réagissent pas l'année de la mesure (accords en cours).
  dyn.wage_bargaining.activity_weight: 'Réaction de long terme des salaires négociés à l''écart de demande de l''année précédente (pour cent de salaire par pour cent d''écart de production) : les salaires suivent la perte ou le gain conjoncturel de productivité et la situation du marché du travail. Introduite progressivement selon dyn.wage_bargaining.speed et annulée lorsque l''écart se referme.'
  dyn.indexation.tax_shift_lag_weight: "Poids de l'année précédente dans l'indexation des salaires sur un déplacement des prix à la consommation dû à une modification des impôts indirects (le reste est indexé l'année de la modification). Inférieur à labour.indexation_lag_weight, qui s'applique à une inflation qui se constitue en cours d'année : une modification fiscale en vigueur au 1er janvier relève l'indice de toute l'année et les mécanismes d'indexation (indice-pivot, indice santé lissé) rattrapent le retard en quelques mois. 0 = indexation complète l'année de la modification."
  dyn.cpi.imputed_rent_share_of_housing: Part des loyers imputés des propriétaires occupants dans la catégorie de consommation « logement » (loyers réels et imputés). Les loyers imputés font partie de la consommation des ménages dans les comptes nationaux mais pas de l'indice des prix à la consommation ; ils sont donc exclus des pondérations avec lesquelles les modifications des impôts indirects agissent sur l'IPC et l'indice santé.
  rev.regional_factor: Multiplicateur discrétionnaire, par région, de la partie régionale et locale d'une ligne de recettes sans taux régional explicite (taxes sur les véhicules, prélèvements régionaux sur l'énergie, taxes sur les jeux et paris, taxes environnementales, taxes locales). 1.0 = politique actuelle. Une mesure pour une seule région s'écrit Change(key="<line>.<REGION>"), p. ex. key="vehicle_taxes.WAL". La partie fédérale et de sécurité sociale d'une ligne mixte n'est pas affectée (utiliser rev.line_factor pour l'ensemble de la ligne).
  rev.regional_allocation: Clé utilisée pour attribuer une ligne de recettes nationale aux régions lorsque le modèle ne dispose pas d'une base régionale pour celle-ci - consumption (revenu disponible des résidents, issu de la population des unités fiscales), population, ou vehicles (adultes x rev.vehicle_tax_relative). L'impôt sur le revenu et les cotisations sociales sont attribués selon la résidence du contribuable, et les impôts immobiliers selon les bases et les taux régionaux ; ils ne sont pas repris ici.
  rev.vehicle_tax_relative: Taxes sur les véhicules (taxe de circulation annuelle, taxe de mise en circulation, prélèvement kilométrique) par résident adulte, par région, par rapport à la Flandre. Détermine la ventilation régionale de la ligne ; son niveau est calibré.
  pit.child_allowance_supplement: Majoration de la quotité exemptée d'impôt pour 1, 2, 3 et 4 enfants à charge (montants cumulés, par année de revenus), accordée au partenaire dont le revenu imposable est le plus élevé. LEVIER.
  pit.child_allowance_extra_per_child: Majoration de la quotité exemptée d'impôt pour chaque enfant à charge au-delà du quatrième (par année de revenus). LEVIER.
  pit.single_parent_allowance: Majoration de la quotité exemptée d'impôt pour une personne isolée avec enfants à charge (par année de revenus). LEVIER.
  pit.child_credit_max_per_child: Crédit d'impôt remboursable maximal par enfant à charge pour la partie des majorations pour enfants qui ne peut pas être imputée sur l'impôt (majoration non utilisée x taux de la première tranche). LEVIER.
  pit.marital_quotient_rate: Quotient conjugal - part des revenus professionnels nets communs du couple à concurrence de laquelle un revenu est attribué au partenaire qui n'a pas ou peu de revenus propres. LEVIER.
  pit.marital_quotient_max: Montant maximal attribué au partenaire au titre du quotient conjugal, par année de revenus - 'work' pour les couples en général, 'pension' pour les couples dont les deux partenaires ont atteint 66 ans (67 ans à partir de l'exercice d'imposition 2031). LEVIER.
  beh.ret.accrual_max_years: 'Borne des années de report du départ à la pension que l''incitant lié à l''acquisition de droits dans son ensemble (acquisition de droits de carrière plus bonus/malus, a en % de la pension par année de travail supplémentaire) peut expliquer : années = max x tanh(beh.ret.years_per_pp_accrual x a / max) ; une réforme déplace le départ à la pension de la différence de cette expression entre le scénario et la référence. Une pénalité agit donc surtout au moment de son introduction : ceux qui réagissent le font déjà lorsqu''elle est faible, seule une partie de chaque cohorte est concernée et personne ne peut reporter son départ au-delà de l''âge légal. Une valeur élevée (100) rend la réaction linéaire.'
  demo.mortality_improvement_by_sex: Multiplicateur par sexe (M, F) du rythme annuel de variation des taux de mortalité par âge d'EUROPOP2023, en plus de demo.mortality_improvement - dans la projection nationale, l'espérance de vie des hommes rattrape celle des femmes plus rapidement que dans EUROPOP2023
  dist.three_adults_pensioner_share: "Part des ménages de trois adultes (deux revenus du travail et un troisième adulte) dont le troisième adulte est un pensionné. Dans les autres, le troisième adulte travaille (autant que les revenus principaux et leurs partenaires en laissent dans l'emploi du modèle, dans le groupe de revenus le plus bas des salariés), est chômeur ou malade de longue durée (ceux qui ne trouvent pas place dans les ménages sans emploi ni comme partenaire d'un couple à un seul revenu) ou n'a pas de revenu propre. Le type de ménage porte la moyenne de ces cas et compte pour cette part d'un pensionné lorsque l'ensemble est mis à l'échelle du nombre de pensionnés."
  dist.fiscal_dispersion: Mesure dans laquelle les rémunérations des classes de revenu suivent la dispersion des déclarations fiscales (0 = les déciles de rémunération du modèle tels quels, 1 = les revenus relatifs des classes sont ceux des déclarations fiscales). Le revenu imposable de chaque classe provient déjà des statistiques fiscales, qui comptent davantage de bas revenus et de hauts revenus que les déciles de rémunération du modèle ; avec 1, les rémunérations brutes d'une classe sont mises à l'échelle par son revenu imposable dans les déclarations rapporté à celui de la classe moyenne, de sorte que le total des rémunérations est inchangé, que l'impôt est inchangé et que les ménages sont aussi inégaux que les déclarations.
  dist.grapa_amounts: Garantie de revenus aux personnes âgées (GRAPA), montants annuels garantis - montant de base (par personne partageant sa résidence) et montant majoré (personne vivant seule). Un ménage de pensionnés reçoit le montant garanti diminué de la part de ses pensions prise en compte, au taux de recours qui reproduit la ligne budgétaire.
  dist.grapa_pension_counted: Part d'une pension prise en compte comme ressource dans la garantie de revenus aux personnes âgées (le reste est exonéré). Les autres ressources (épargne, revenu cadastral, revenus professionnels du partenaire) ne sont pas modélisées - le taux de recours ajusté sur le budget en tient lieu.
  dist.family_social_supplement: Supplément social aux allocations familiales, lié au revenu - montant annuel par enfant et plafond de revenu brut du ménage en dessous duquel il est versé. Les familles sous le plafond le reçoivent en plus du montant de base ; le montant de base est la moyenne budgétaire par enfant (family.allowance_per_child) diminuée du coût moyen du supplément.
  dist.family_supplement_child_share: Part des enfants bénéficiant du supplément social (détermine de combien le montant de base est inférieur à la moyenne budgétaire par enfant).
  dist.capital_income_share: Revenus du capital et de la propriété des ménages (intérêts, dividendes, loyers perçus) avant précompte mobilier, en part du revenu disponible de l'ensemble des ménages - le montant que relève une enquête sur les revenus, et non le total des comptes nationaux.
  dist.capital_income_by_decile: Répartition des revenus du capital et de la propriété entre les dixièmes de revenu disponible équivalent (du bas vers le haut ; ramenée à une somme de 1).
  dist.property_tax_household_share: Part du précompte immobilier payée par les ménages sur leur habitation propre et déduite du revenu disponible dans le concept de l'enquête (le reste est payé par les sociétés et les bailleurs).
  dist.property_tax_by_decile: Répartition du précompte immobilier des ménages entre les dixièmes de revenu disponible équivalent (du bas vers le haut ; ramenée à une somme de 1).
  dyn.wage_cost.deflator_lead: "Avance des prix de la production sur les prix à la consommation après une variation des coûts salariaux : part de la distance entre l'effet sur les prix à la consommation atteint jusque-là et sa cible (dyn.wage_cost.price_passthrough x l'écart de coût salarial) que le prix de la production intérieure a déjà parcourue. 1 = les producteurs adaptent leurs prix immédiatement et les prix à la consommation suivent au rythme de dyn.wage_cost.price_adjustment_speed ; 0 = les deux évoluent ensemble. Ce paramètre détermine quelle part d'un choc de coût salarial les bénéfices (et l'impôt des sociétés) supportent la première année."
  dyn.prices.demand_gap_sensitivity: 'Variation du niveau des prix à la consommation (et du prix de la production intérieure), par rapport à la référence, par point d''écart de demande de l''année précédente : le sous-emploi des capacités comprime les marges et la dérive salariale, de sorte que les prix dérivent à la baisse aussi longtemps que la production reste sous son niveau déterminé par l''offre (et à la hausse en période de haute conjoncture). La variation des prix atteint les salaires et les prestations par l''indexation automatique. LEVIER (0 = les prix ne réagissent pas au sous-emploi des capacités).'
  pension.postponement_pension_ratio: Pension des personnes qui reportent (ou avancent) leur départ à la pension en réaction à un incitant financier (réaction comportementale du départ à la pension dans un scénario), par rapport à la nouvelle pension moyenne. La dépense de pension économisée par personne-année de report est ce ratio x la nouvelle pension moyenne. Sans effet dans le scénario de référence.
  pension.capital_bonus: Bonus de pension de la loi du 25 avril 2024, versé sous forme de capital lors du départ à la pension - montant moyen par NOUVEAU pensionné (tous les nouveaux pensionnés, avec ou sans bonus), en EUR de 2024, indexé sur l'indice santé par le modèle. Le droit se constituait par jour presté après la première date possible de prise de cours de la pension, pendant trois ans au maximum (3 775, 7 550 et 11 325 EUR pour la première, la deuxième et la troisième année, ou 11 325 EUR par an avec une carrière de 43 ans ou plus, à l'indice de juillet 2023). La constitution de droits a pris fin le 31 décembre 2025 - le scénario de référence verse les droits constitués entre le 1er juillet 2024 et cette date. LEVIER - 4 600 à partir de 2029 (3 000 en 2027, 4 000 en 2028) rétablit le bonus tel qu'il serait arrivé à maturité.
  health.indexation_lag_share: Part d'un écart de l'indice santé par rapport à la référence (un scénario qui modifie les prix à la consommation, p. ex. une modification de la TVA) qui n'atteint les dépenses de soins de santé qu'un an plus tard - le budget de l'assurance soins de santé et ses honoraires sont fixés avant le début de l'année. Sans effet dans le scénario de référence.
  transfer.level_factor: Niveau d'un transfert entre entités par rapport à sa règle (1 = la règle - mécanismes de la loi spéciale de financement, remboursement de l'aide sociale, dépenses d'enseignement et PIB nominal pour les dotations des régions et communautés aux pouvoirs locaux). Le scénario de référence intègre la trajectoire des dotations des régions et communautés aux pouvoirs locaux retenue dans les perspectives officielles. LEVIER.
  entity.staff_cost_factor: Facteur de niveau appliqué à la rémunération des salariés (D1) d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - en plus de la trajectoire générale de l'emploi public et des rémunérations publiques (labour.public_employment_growth, labour.wage_drift, labour.public_wage_link), le remplacement sélectif
    des départs et les économies linéaires du pouvoir fédéral (1,8 % par an sur le personnel en 2025-2029 donne 0.913 en 2029), le gel des recrutements à Bruxelles, le remplacement partiel dans l'administration wallonne. LEVIER - une seule entité avec Change(..., key="walloon_region").
  entity.purchases_factor: Facteur de niveau appliqué aux achats de biens et services (P2) et aux impôts payés d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - indexation limitée ou nulle des budgets de fonctionnement (budget flamand 2025-2026, plans wallon et bruxellois, économies linéaires fédérales). LEVIER - une seule entité
    avec Change(..., key="walloon_region").
  entity.subsidies_factor: Facteur de niveau appliqué aux subventions (D3 - subsides salariaux, titres-services, transports, énergie et autres) d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - suppression progressive des réductions groupes cibles flamandes et réductions de subsides du budget 2026, réduction des aides wallonnes
    à la promotion de l'emploi (APE), fin de la déductibilité fiscale des titres-services à Bruxelles ; les nouvelles mesures fédérales relatives au coût du travail augmentent les subventions fédérales. LEVIER - une seule entité avec Change(..., key="walloon_region").
  entity.current_transfers_factor: Facteur de niveau appliqué aux autres transferts courants (D7 - aux ménages, aux institutions sans but lucratif, aux entreprises et au reste du monde, hors contribution à l'UE) d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - réductions des subsides aux organismes sans but lucratif et de la coopération
    au développement. LEVIER - une seule entité avec Change(..., key="walloon_region").
  entity.capital_transfers_factor: Facteur de niveau appliqué aux transferts en capital (D9 - aides à l'investissement et autres) d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - répartition entre entités de la trajectoire générale invest.capital_transfers_pct_gdp (fin des plans de relance wallon et flamand, passage à Bruxelles
    des aides à l'investissement à des prêts, aides fédérales ponctuelles aux chemins de fer et au démantèlement nucléaire). LEVIER - une seule entité avec Change(..., key="walloon_region").
  entity.investment_factor: Facteur de niveau appliqué aux investissements (formation brute de capital et autres acquisitions d'actifs non financiers, hors matériel de défense) d'une entité par rapport à une politique inchangée (1 = les déterminants des lignes de dépenses), par entité - federal, social_security, flemish_community, walloon_region (y compris la Communauté germanophone), french_community, brussels_region (y compris les commissions communautaires), local. S'applique à la part de l'entité dans chaque ligne (comptes 2024 ; entités fédérées - leur poids dans la partie communautés et régions de la ligne) x la part de cette catégorie dans la ligne ; ne s'applique pas aux intérêts, à la défense, à la contribution à l'UE ni aux prestations sociales. Le scénario de référence intègre les budgets adoptés et les plans pluriannuels tels que les retiennent les perspectives officielles - fin des plans de relance des Régions, cycle électoral local (pic en 2024 et en 2030). LEVIER - une seule
    entité avec Change(..., key="walloon_region").
  labour.hidden_unemployment_ratio: Demandeurs d'emploi inscrits qui ne sont pas chômeurs au sens du BIT (inactifs dans le modèle), par chômeur en 2024. Lorsque le taux de chômage structurel d'une région descend sous son niveau de 2024, la même proportion d'entre eux que des chômeurs passe de l'inactivité à l'emploi (rien ne se passe tant que le chômage est égal ou supérieur à son niveau de 2024).
  labour.target_group_employment_elasticity: Réaction de long terme de l'emploi privé d'une région à une modification de ses réductions groupes cibles (subsidy.target_group_factor par rapport à la référence) - % de l'emploi privé par % du coût du travail privé pris en charge par le subside
  labour.target_group_adjustment_speed: Part de l'écart restant par rapport à la réaction de long terme de labour.target_group_employment_elasticity résorbée chaque année
  labour.public_employment_outlook_growth: Croissance de l'emploi des administrations publiques dans le scénario de référence, en plus du lien avec la population, toutes régions confondues - les décisions des gouvernements en matière de personnel pour 2025-2031 telles que les retiennent les perspectives officielles (remplacement sélectif dans les administrations fédérale et wallonne, gel des recrutements à Bruxelles, économies de personnel flamandes). Le levier labour.public_employment_growth s'y ajoute.
  labour.public_wage_link: Part de la croissance de l'indice des salaires (formation des salaires dans le secteur privé - indexation plus hausses réelles) répercutée sur la rémunération publique par tête ; le reste suit uniquement l'indice santé (indexation automatique des barèmes). 1 = les rémunérations publiques suivent les salaires privés. Un écart entre l'indice des salaires d'un scénario et celui de la référence est toujours répercuté intégralement.
  pit.indexation_lag_base: Indexation légale des montants de l'impôt des personnes physiques - indice des prix à la consommation de l'année précédant l'année de base par rapport à l'année de base. La loi indexe les montants de l'année de revenus t sur la moyenne des prix à la consommation de l'année t-1 (art. 178 du Code des impôts sur les revenus), alors que les paramètres sont revalorisés avec l'indice santé de l'année t ; le module des recettes applique le ratio (0 = désactive la correction).
  ssc.fte_floor_wage: "Salaire minimum annuel à temps plein utilisé pour interpréter les faibles rémunérations annuelles comme du travail à temps partiel - la réduction structurelle des cotisations patronales est calculée par la loi sur le salaire de référence en équivalent temps plein et proratisée selon la fraction de prestation, de sorte que les rémunérations inférieures à ce montant obtiennent cette fraction de la réduction d'un salaire minimum à temps plein (12 x le revenu minimum mensuel, indexé). 0 = réduction calculée sur les rémunérations annuelles telles quelles (les deux déciles inférieurs de rémunération ne paient alors presque pas de cotisations patronales). La réaction de la demande de travail aux réductions de cotisations est calibrée avec cette règle activée."
  cit.base_share_path: Bénéfices imposables des sociétés dans le scénario de référence, en part du PIB par rapport à 2024 (indice par année). L'approximation des bénéfices dans le modèle n'a pas de dynamique des amortissements ; sur les années de cette trajectoire, la base imposable de référence la suit, ensuite le ratio à l'approximation est maintenu. Un scénario modifie la base par le biais de l'approximation.
  excise.volume_growth: Croissance annuelle des volumes taxés de carburants, de tabac et d'alcool dans le scénario de référence (la consommation réelle de la catégorie dans le modèle est remplacée par cette tendance ; un scénario modifie toujours les volumes par son effet sur la consommation). LEVIER pour le rythme de l'électrification ou du recul du tabagisme.
  rev.ets2_price: Prix d'un quota d'émission du second système d'échange de quotas d'émission de l'UE (ETS2 - carburants routiers et combustibles de chauffage), dont les recettes de mise aux enchères constituent des recettes publiques à partir de 2028 (ajoutées à la ligne des quotas d'émission et taxes environnementales). 0 = pas d'ETS2.
  rev.ets2_emissions: Émissions couvertes par l'ETS2 à leur niveau de 2024 (transport routier et chauffage des bâtiments). En projection, elles suivent le volume taxé de carburants (excise.volume_growth).
  rev.outturn_persistence: "Part de l'écart entre les réalisations 2025 observées d'une ligne et le modèle qui persiste les années suivantes dans la projection propre du modèle (lignes non reprises - 1, le niveau de 2025 devient la nouvelle base ; 0 = l'écart était ponctuel ou une question de calendrier). Tant que rev.fpb_alignment est actif, les catégories qu'il couvre suivent en 2026-2031 la variation du Bureau du Plan à partir du niveau observé de 2025, quelle que soit la valeur introduite ici."
  beh.ld.composition_net_share: "La demande de travail réagit à une variation du coût pour l'employeur en deux parties. (1) Le coût du travail dans son ensemble : la réaction de chaque décile de salaire (beh.ld.elasticity_by_decile x la variation de son coût pour l'employeur), pondérée par la part du décile dans le coût du travail - ce que donnerait une réduction générale de même budget. (2) La composition de l'emploi : une réduction concentrée sur les bas salaires crée plus d'emplois par euro, parce que ces emplois sont bon marché ; cette prime en nombre d'emplois est la réaction pondérée par les effectifs moins celle pondérée par les coûts. Ce paramètre est la part de la prime qui constitue un ajout net à l'emploi : le reste, ce sont des emplois à bas salaire qui remplacent des travailleurs mieux payés (substitution entre classes de salaire). 1 = chaque emploi compte (pondération par les effectifs), 0 = seul le coût du travail dans son ensemble compte. La prime se constitue à son propre rythme (beh.lambda, labour_composition). Nulle pour une mesure qui modifie le coût de chaque décile dans la même proportion."
  beh.demand.lagged_price_lines: "Lignes de dépenses classées comme achats dont le prix suit l'indice santé de l'année précédente pour la part health.indexation_lag_share (le budget de l'assurance maladie et ses honoraires sont fixés avant le début de l'année). Elles sont déflatées par cet indice, et non par la combinaison de salaires et de prix des autres achats, et leur indexation est un revenu des prestataires de soins"
  dyn.wage_cost.deflator_lead_indexation: "La même avance que dyn.wage_cost.deflator_lead pour la partie d'une variation du coût salarial qui provient d'une indexation supprimée ou ajoutée par rapport à la référence (saut d'index) : 0 = les producteurs ne répercutent pas la modération salariale dans leurs prix plus vite que les prix à la consommation ne baissent, de sorte que les marges (et l'impôt des sociétés) supportent la différence les premières années ; 1 = comme pour les impôts."
  dist.jobless_couple_second_benefit_share: "Part des ménages de deux ou trois adultes sans emploi (non pensionnés) dans lesquels un second adulte perçoit une allocation de chômage ou une indemnité d'invalidité ; dans les autres, le second adulte n'a pas de revenu propre."
  dist.sole_earner_low_income_ratio: "Fréquence à laquelle un travailleur du groupe de revenus le plus bas (cinquième inférieur des salariés, quart inférieur des indépendants) est le seul revenu du travail du ménage - isolé, parent seul, partenaire sans emploi - par rapport au travailleur moyen (1 = aussi souvent ; les travailleurs déplacés sont les revenus principaux de ménages à deux revenus, de sorte que le nombre de travailleurs de chaque groupe de revenus reste inchangé). Les groupes les plus bas contiennent des rémunérations d'une partie de l'année et de petits temps partiels, typiques des seconds revenus et des jeunes adultes vivant chez leurs parents (les troisièmes adultes au travail de l'ensemble sont tous dans le groupe le plus bas des salariés)."
  dist.within_group_dispersion: "Dispersion des revenus des personnes d'un ménage synthétique autour de son revenu (écart type du logarithme du revenu ; 0 = toutes les personnes d'un type de ménage et d'un groupe de revenus ont exactement son revenu, de sorte qu'un groupe est entièrement sous ou entièrement au-dessus du seuil de pauvreté). Une valeur pour les revenus du travail et du capital (marché), une pour les allocations ; un ménage reçoit la moyenne pondérée par la part des revenus de marché dans son revenu brut. Elle entre dans les taux de pauvreté, le coefficient de Gini et le rapport S80/S20, pas dans les parts de revenu des dixièmes ni dans les montants affichés par ménage."
  dist.children_number_spread: "Nombre d'enfants que représentent les types de ménages lorsque l'ensemble ne contient pas chaque nombre. large_family_children est le nombre moyen d'enfants des familles de 3 enfants ou plus - une famille des types à trois enfants compte pour ce nombre sur l'échelle d'équivalence, diminué de la part allowance_offset de l'effet d'un enfant supplémentaire que compensent les allocations familiales. Pour les ménages de trois adultes avec enfants (un seul type, un enfant), les deux mêmes valeurs donnent la dispersion du revenu par équivalent adulte qui provient du nombre d'enfants (1, 2, 3 ou plus dans les statistiques des ménages)."
  dist.other_benefit_recipients: "Prestations en espèces du budget que les règles des ménages ne produisent pas et que l'enquête sur les revenus compte - pour chaque ligne de dépenses, les catégories d'adultes de l'ensemble de ménages qui se la partagent à parts égales (work = personnes au travail, unemployment, disability = bénéficiaires d'une indemnité d'invalidité, none = adultes sans revenu propre) et si elle est soumise à l'impôt des personnes physiques (au taux moyen du ménage). Les montants sont les lignes budgétaires de l'année (pour l'aide sociale - la ligne moins le revenu d'intégration que les règles versent déjà aux ménages de l'ensemble)."
  pit.allowance_neutralised_population_share: "Part de la neutralisation du relèvement de la quotité exemptée (pit.allowance_neutralised_replacement) qui s'applique effectivement dans la population des unités fiscales percevant des pensions ou des allocations. Inférieure à 1 parce que beaucoup d'entre elles ont aussi des revenus du travail dans l'année (chômage ou maladie une partie de l'année, pensionnés qui travaillent) et que la baisse de leur réduction d'impôt est proportionnelle au revenu de remplacement - elles conservent une partie de la hausse. Recettes agrégées uniquement ; le calculateur d'une fiche de paie neutralise entièrement."
  pit.reform_other_measures_cost: "Coût net des mesures de la réforme de l'impôt des personnes physiques de 2026 que le calculateur d'impôt ne contient pas (régime des droits d'auteur, heures supplémentaires, déduction pour entrepreneurs, impôt allégé sur les pensions, majoration pour absence de versements anticipés, rémunération des dirigeants et règle des 20 %, moins le facteur de correction pour les communes), tous niveaux de pouvoir, en millions d'euros au niveau du PIB de 2024 (il croît avec le PIB). 0 = sans ces mesures. LEVIER."
  rev.fpb_alignment_enabled: "Interrupteur (1 ou 0) de rev.fpb_alignment - 0 supprime tout alignement des recettes du scénario de référence sur les perspectives du Bureau du Plan et laisse la projection propre du modèle (législation, bases imposables et comptes 2025 observés reportés). LEVIER."
  rev.fpb_alignment: "Alignement sur les perspectives à politique inchangée du Bureau du Plan de juin 2026, cause non identifiée - multiplicateur des lignes de recettes d'une catégorie des comptes du Bureau, par année. Les comptes 2025 observés sont le point de départ et ne sont pas écrasés - à partir de 2026, seule la variation de chaque catégorie depuis 2025, en points de PIB, est celle du Bureau. Catégories - impôts directs des ménages et impôts indirects, chacun pour le pouvoir fédéral avec la sécurité sociale (_federal), les régions et communautés (_regions) et les pouvoirs locaux (_local) ; impôt des sociétés ; capital_taxes (droits de succession et de donation) ; contributions (cotisations sociales effectives). 1 = pas d'alignement. Les valeurs de 2031 valent ensuite. Se désactive avec rev.fpb_alignment_enabled."

  ar2024_pensions: Ageing Report 2024 - dépenses publiques brutes de pensions
  ar2024_health: 'Ageing Report 2024 - dépenses publiques de soins de santé (niveau de 2022 : 6,14)'
  ar2024_health_change: Ageing Report 2024 - variation des dépenses publiques de soins de santé (la variation publiée pour 2022-2070 est de +0,63 pt de %)
  ar2024_long_term_care: 'Ageing Report 2024 - dépenses publiques de soins de longue durée (niveau de 2022 : 2,31)'
  ar2024_education: 'Ageing Report 2024 - dépenses publiques d''enseignement (niveau de 2022 : 5,63)'

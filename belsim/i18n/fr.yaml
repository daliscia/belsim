  revenue.eu_transfers_current:
    label: Transferts courants en provenance de l'UE
    description: Transferts courants des institutions de l'UE (y compris les subventions de la Facilité pour la reprise et la résilience jusqu'en 2026).
  revenue.other_current_transfers:

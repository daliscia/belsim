    description: Taxes locales à charge des ménages, taxe sur les ASBL, taxe sur l'épargne à long terme, régularisation fiscale.
  revenue.sales:
    label: Ventes de biens et de services
    description: Production marchande, production pour usage final propre et paiements au titre de la production non marchande (redevances, droits d'inscription, tickets d'hôpital et de soins).
  revenue.interest_received:
    label: Intérêts reçus
    description: Intérêts reçus de l'extérieur des administrations publiques.
  revenue.dividends_received:
    label: Dividendes reçus
    description: Dividendes des participations publiques (Belfius, BNP Paribas, Proximus, bpost, Banque nationale, participations régionales et communales).
  revenue.rent_other_property_income:
    label: Loyers et autres revenus de la propriété

text:
  "Incomes vary between income groups; inside a group they are spread around the group's income by an assumed dispersion (in the poverty rates, the Gini coefficient and S80/S20 only) and partners' incomes are combined independently; capital and property income and the recurrent property tax are spread by tenth of income on assumed shares (the amount an income survey records, not the national-accounts total): inequality and poverty indicators are indicative; read their change between baseline and scenario rather than their level. By household type the poverty rates are within about 2 points of the observed ones: somewhat too high for people living alone and single parents, too low for families with children and households of three or more adults.": "Les revenus varient entre les classes de revenus ; à l'intérieur d'une classe, ils sont répartis autour du revenu de la classe selon une dispersion posée par hypothèse (uniquement pour les taux de pauvreté, le coefficient de Gini et le rapport S80/S20) et les revenus des partenaires sont combinés indépendamment ; les revenus mobiliers et immobiliers et le précompte immobilier sont répartis par dixième de revenu selon des parts posées par hypothèse (le montant que relève une enquête sur les revenus, non le total des comptes nationaux) : les indicateurs d'inégalité et de pauvreté sont indicatifs ; lisez leur variation entre le scénario de référence et le scénario plutôt que leur niveau. Par type de ménage, les taux de pauvreté sont à environ 2 points des taux observés : un peu trop élevés pour les personnes vivant seules et les parents isolés, trop bas pour les familles avec enfants et les ménages de trois adultes ou plus."
  "Weights are the 2024 household structure rescaled to the baseline head counts of the year (workers, pensioners, unemployed, long-term sick), the same in both runs: people who find or lose a job because of the scenario are not shown (see the employment results for that). In the baseline the unemployed who no longer receive a benefit and the people excluded by the time limit who claim it live on the integration income.": "Les pondérations sont la structure des ménages de 2024 recalée sur les effectifs du scénario de référence de l'année (travailleurs, pensionnés, chômeurs, malades de longue durée), identiques dans les deux simulations : les personnes qui trouvent ou perdent un emploi à cause du scénario ne sont pas montrées (voir les résultats d'emploi à ce sujet). Dans le scénario de référence, les chômeurs qui ne perçoivent plus d'allocation et les personnes exclues par la limitation dans le temps qui le demandent vivent du revenu d'intégration."
  ? 'Baseline values are levels in the stated unit for a year, or for a period "y0-y1" an average annual growth / a change in points (see each entry''s transform). Measure targets are scenario-minus-baseline effects. Sign convention for budget effects: positive = improves the general-government balance.'
  : 'Les valeurs de référence sont des niveaux dans l''unité indiquée pour une année ou, pour une période « y0-y1 », une croissance annuelle moyenne / une variation en points (voir la transformation de chaque entrée). Les cibles des mesures sont des effets en écart entre le scénario et la référence. Convention de signe pour les effets budgétaires : positif = amélioration du solde des administrations publiques.'
  ? 'Synthetic-household approximation: the tax-benefit rules of the model are applied to household types (2024 household statistics) repeated over the income groups of the tax returns, so the households add up to the income tax of the budget. It is not a microsimulation on survey or administrative data.'
  : 'Approximation par ménages synthétiques : les règles socio-fiscales du modèle sont appliquées à des types de ménages (statistiques des ménages de 2024) répétés sur les classes de revenu des déclarations fiscales, de sorte que la somme des ménages correspond à l''impôt des personnes physiques du budget. Il ne s''agit pas d''une microsimulation sur données d''enquête ou administratives.'
  ? The change in income is net of the scenario's effect on consumer prices, valued on the household's baseline basket; it is expressed in euros of the year at baseline prices.
  : La variation du revenu est nette de l'effet du scénario sur les prix à la consommation, évalué sur le panier de référence du ménage ; elle est exprimée en euros de l'année aux prix de référence.
  ? Earnings are those of all employees (part-time included) from the simulated earnings distribution; the income taxed is that of the same income group in the tax returns (untaxed pay components, part-year work).
  : Les rémunérations sont celles de l'ensemble des salariés (temps partiel compris), issues de la distribution simulée des rémunérations ; le revenu imposé est celui de la même classe de revenu dans les déclarations fiscales (éléments de rémunération non imposés, travail une partie de l'année).
  wage levels and indexation from the macro simulation, net of tax under baseline rules: niveaux de salaire et indexation issus de la simulation macroéconomique, nets d'impôt selon les règles de référence
  replacement incomes, assistance and family allowances (rules and indexation): revenus de remplacement, aide sociale et allocations familiales (règles et indexation)
  employee social contributions: cotisations sociales personnelles
  VAT, excise and the resulting consumer prices on the baseline basket: TVA, accises et prix à la consommation qui en résultent, sur le panier de référence
  ? Pensioner households receive the model's average pension income per pensioner (pensions in payment, all pensions of a person together), which reacts slowly to rules that only apply to new pensioners.
  : Les ménages de pensionnés reçoivent le revenu de pension moyen par pensionné du modèle (pensions en cours de paiement, toutes les pensions d'une personne confondues), qui ne réagit que lentement aux règles applicables aux seuls nouveaux pensionnés.
  personal income tax incl. local surcharges and child credit, withholding tax on capital income, recurrent property tax: impôt des personnes physiques, y compris les additionnels locaux et le crédit d'impôt pour enfants, précompte mobilier, précompte immobilier
  "Disposable income per household, EUR per year, in the concept of the income survey (EU-SILC): gross incomes incl. capital and property income and the other cash benefits of the budget + family allowances - employee social contributions - personal income tax, withholding tax on capital income and recurrent property tax. 'delta' is the change in disposable income less the extra cost of the baseline basket at scenario prices.": "Revenu disponible par ménage, en euros par an, dans le concept de l'enquête sur les revenus (EU-SILC) : revenus bruts, y compris les revenus du capital et de la propriété et les autres prestations en espèces du budget + allocations familiales - cotisations sociales personnelles - impôt des personnes physiques, précompte mobilier et précompte immobilier. « delta » est la variation du revenu disponible moins le surcoût du panier de référence aux prix du scénario."
  "Benefits use average rules (one cohabitant rate, no head-of-household rate); the income guarantee for the elderly and the social supplement to family allowances follow simplified rules; the cash benefits of the budget that the rules do not produce (sickness and career-break benefits, allowances for persons with disabilities, family allowances of students, integration income of people living with others) are shared between the adults or children concerned on assumed keys; social tariffs, housing costs, regional tax differences, company cars and wealth are not modelled.": "Les allocations suivent des règles moyennes (un seul taux cohabitant, pas de taux chef de ménage) ; la garantie de revenus aux personnes âgées et le supplément social aux allocations familiales suivent des règles simplifiées ; les prestations en espèces du budget que les règles ne produisent pas (indemnités de maladie et d'interruption de carrière, allocations aux personnes handicapées, allocations familiales des étudiants, revenu d'intégration des personnes vivant avec d'autres) sont réparties entre les adultes ou enfants concernés selon des clés supposées ; les tarifs sociaux, les coûts du logement, les différences fiscales régionales, les voitures de société et le patrimoine ne sont pas modélisés."

# ============================================================================ MEASURES
# Budget effects: positive = improves the balance, unless the label says "spending".
# HERMES variants: year t of the publication is mapped to 2027, t+2 to 2029, t+4 to 2031.
measures:

  # ---- FPB HERMES standard variants: 0.5% of GDP ex ante, sustained (ex-post results) ----
  # The parameter changes are sized so that the model's static impulse is close to 0.5% of GDP
  # (first target of each entry checks the sizing; rescale the other gaps by it if it drifts).
  - id: hermes_public_investment_cut
    description: HERMES variant - public investment cut by 0.5% of GDP ex ante
    source: &hermes24 {institution: Federal Planning Bureau, title: "Beschrijving en gebruik van het HERMES-model (Working Paper 4 DC2024), tables 2-17", date: 2024-02}
    url: &hermes24_url https://www.plan.be/sites/default/files/documents/wp_dc202404_12943_nl.pdf
    confidence: high
    measure:
      changes:
        - {param: invest.public_pct_gdp, value: -0.5, op: add, start: 2027}
    targets:
      - &size {label: "sizing: ex-ante impulse", variant: static, ref_value: 0.5, ref_unit: "% of GDP", ref_year: 2024, model_year: 2027, model: {num: [fiscal.primary_balance], den: [macro.gdp_nominal], scale: 100}}
      - {label: "real GDP, year t", variant: behavioural, ref_value: -0.25, ref_unit: "%", ref_year: 2024, model_year: 2027, model: &gdp {num: [macro.gdp_real], mode: pct}}
      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.34, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -5.35, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: &emp {num: [labour.employment], scale: 0.001}}
      - {label: "employment, t+4", variant: behavioural, ref_value: -7.15, ref_unit: thousand persons, ref_year: 2028, model_year: 2031, model: *emp}
      - {label: "balance, year t", variant: behavioural, ref_value: 0.28, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: &bal {num: [fiscal.balance], den: [macro.gdp_nominal], scale: 100}}
      - {label: "balance, t+2", variant: behavioural, ref_value: 0.29, ref_unit: "pp of GDP", ref_year: 2026, model_year: 2029, model: *bal}
      - {label: "balance, t+4", variant: behavioural, ref_value: 0.32, ref_unit: "pp of GDP", ref_year: 2028, model_year: 2031, model: *bal}

  - id: hermes_public_consumption_cut
    description: HERMES variant - public consumption (purchases of goods and services) cut by 0.5% of GDP ex ante. Model equivalent - across-the-board factor on operating spending
    source: *hermes24
    url: *hermes24_url
    confidence: high
    measure:
      changes:
        - {param: exp.function_factor, value: 0.958, op: mul, start: 2027}
    targets:
      - *size
      - {label: "real GDP, year t", variant: behavioural, ref_value: -0.28, ref_unit: "%", ref_year: 2024, model_year: 2027, model: *gdp}
      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.25, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -3.82, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: *emp}
      - {label: "employment, t+4", variant: behavioural, ref_value: -3.09, ref_unit: thousand persons, ref_year: 2028, model_year: 2031, model: *emp}
      - {label: "balance, year t", variant: behavioural, ref_value: 0.31, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: *bal}
      - {label: "balance, t+2", variant: behavioural, ref_value: 0.33, ref_unit: "pp of GDP", ref_year: 2026, model_year: 2029, model: *bal}
      - {label: "balance, t+4", variant: behavioural, ref_value: 0.36, ref_unit: "pp of GDP", ref_year: 2028, model_year: 2031, model: *bal}

  - id: hermes_social_benefits_cut
    description: HERMES variant - social benefits cut by 0.5% of GDP ex ante (half pensions, half family allowances)
    source: *hermes24
    url: *hermes24_url
    confidence: high
    measure:
      changes:
        - {param: pension.level_factor, value: 0.9726, op: mul, start: 2027}
        - {param: family.allowance_per_child, value: 0.7885, op: mul, start: 2027}
    targets:
      - *size
      - {label: "real GDP, year t", variant: behavioural, ref_value: -0.08, ref_unit: "%", ref_year: 2024, model_year: 2027, model: *gdp}
      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.13, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -1.99, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: *emp}
      - {label: "employment, t+4", variant: behavioural, ref_value: -3.59, ref_unit: thousand persons, ref_year: 2028, model_year: 2031, model: *emp}
      - {label: "balance, year t", variant: behavioural, ref_value: 0.35, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: *bal}
      - {label: "balance, t+2", variant: behavioural, ref_value: 0.34, ref_unit: "pp of GDP", ref_year: 2026, model_year: 2029, model: *bal}
      - {label: "balance, t+4", variant: behavioural, ref_value: 0.35, ref_unit: "pp of GDP", ref_year: 2028, model_year: 2031, model: *bal}

  - id: hermes_vat_increase
    description: HERMES variant - VAT on private consumption raised by 0.5% of GDP ex ante (all rates proportionally). Closest official figure to "+1 point of standard VAT", for which no official costing was found
    source: *hermes24
    url: *hermes24_url
    confidence: high
    measure:
      changes:
        # the whole 0.5% of GDP is VAT on private consumption, as in HERMES: rates scaled, the
        # non-household VAT bases kept at their baseline average rate
        - {op: mul, param: vat.rate_standard, start: 2027, value: 1.1420173645019531}
        - {op: mul, param: vat.rate_intermediate, start: 2027, value: 1.1420173645019531}
        - {op: mul, param: vat.rate_reduced, start: 2027, value: 1.1420173645019531}
        - {key: housing_investment, param: vat.mix, start: 2027, value: [0.31961, 0.013135, 0.437822, 0.229433]}
        - {key: government, param: vat.mix, start: 2027, value: [0.656733, 0.0, 0.131347, 0.21192]}
        - {key: exempt_sectors, param: vat.mix, start: 2027, value: [0.788079, 0.0, 0.070051, 0.14187]}
    targets:
      - *size
      - {label: "real GDP, year t", variant: behavioural, ref_value: -0.14, ref_unit: "%", ref_year: 2024, model_year: 2027, model: *gdp}
      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.15, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -14.88, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: *emp}
      - {label: "employment, t+4", variant: behavioural, ref_value: -16.92, ref_unit: thousand persons, ref_year: 2028, model_year: 2031, model: *emp}
      - {label: "consumer prices, year t", variant: behavioural, ref_value: 1.23, ref_unit: "%", ref_year: 2024, model_year: 2027, model: {num: [macro.cpi], mode: pct}}
      - {label: "balance, year t", variant: behavioural, ref_value: 0.31, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: *bal}
      - {label: "balance, t+2", variant: behavioural, ref_value: 0.15, ref_unit: "pp of GDP", ref_year: 2026, model_year: 2029, model: *bal}
      - {label: "balance, t+4", variant: behavioural, ref_value: 0.15, ref_unit: "pp of GDP", ref_year: 2028, model_year: 2031, model: *bal}
    note: In HERMES the balance gain halves after the first year because the price rise feeds wage and benefit indexation (hourly wage cost +1.33% in year t).

  - id: hermes_employer_ssc_increase
    description: HERMES variant - employer social contributions raised by 0.5% of GDP ex ante (hourly labour cost +1.62% in year t, +1.38% at t+4)
    source: *hermes24

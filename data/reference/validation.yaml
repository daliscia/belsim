      - {label: "balance, year t", variant: behavioural, ref_value: 0.32, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: *bal}
      - {label: "balance, t+2", variant: behavioural, ref_value: 0.26, ref_unit: "pp of GDP", ref_year: 2026, model_year: 2029, model: *bal}

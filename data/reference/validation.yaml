        - {param: ssc.employee_rate, value: 0.0172, op: add, start: 2027}
    targets:
      - *size
      - {label: "real GDP, year t", variant: behavioural, ref_value: -0.06, ref_unit: "%", ref_year: 2024, model_year: 2027, model: *gdp}
      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.19, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -1.52, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: *emp}
      - {label: "employment, t+4", variant: behavioural, ref_value: -21.14, ref_unit: thousand persons, ref_year: 2028, model_year: 2031, model: *emp}
      - {label: "balance, year t", variant: behavioural, ref_value: 0.29, ref_unit: "pp of GDP", ref_year: 2024, model_year: 2027, model: *bal}
      - {label: "balance, t+4", variant: behavioural, ref_value: 0.37, ref_unit: "pp of GDP", ref_year: 2028, model_year: 2031, model: *bal}
    note: In HERMES the employment loss comes from wage bargaining passing the contribution on to labour costs (hourly wage cost up over time), not from labour supply.

  - id: hermes_pit_increase
    description: HERMES variant - personal income tax raised by 0.5% of GDP ex ante
    source: *hermes24
    url: *hermes24_url
    confidence: high
    measure:
      changes:
        - {param: pit.bracket_rates, value: 1.0419, op: mul, start: 2027}

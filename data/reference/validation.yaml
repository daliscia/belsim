# Official reference figures used to validate belsim. Format: see belsim/validation.py.
# Every number below was read in a document fetched on 2026-11-25 (nothing from memory).
# confidence: high = read directly in the official document; medium = reliable secondary
# source or derived by simple arithmetic from an official table; low = weaker.
meta:
  retrieved: 2026-11-25
  conventions: >
    Baseline values are levels in the stated unit for a year, or for a period "y0-y1" an
    average annual growth / a change in points (see each entry's transform). Measure targets
    are scenario-minus-baseline effects. Sign convention for budget effects: positive =
    improves the general-government balance.

# ============================================================================ BASELINE
baseline:

  # ---- Study Committee on Ageing, Annual Report 2026 (reference scenario) ----
  # The scenario includes the Arizona reforms decided by 29 May 2026 (pension malus from 2027,
  # 2-year unemployment limit, no welfare adjustments 2025-2029). Its health projection ignores
  # the legal growth norm. Benchmark years of Tableau 3 are 2025/2031/2050/2070; 2030 and 2040
  # come from the statistical annex (sheet "cout budgetaire vieillissement").
  - id: sca2026_pensions
    description: SCA - pensions, all schemes incl. GRAPA and public enterprises
    unit: "% of GDP"
    values: {2025: 11.3, 2030: 11.5, 2031: 11.5, 2040: 12.1, 2050: 12.0, 2070: 12.0}
    model: {num: ["expenditure.pension_*"], den: [macro.gdp_nominal], scale: 100}
    source: &sca {institution: High Council of Finance - Study Committee on Ageing / Federal Planning Bureau, title: "Comite d'etude sur le vieillissement - Rapport annuel 2026, Tableau 3 and statistical annex", date: 2026-07}
    url: &sca_url https://www.plan.be/sites/default/files/documents/FOR_VERG2026_13333_FR.pdf
    confidence: high
  - id: sca2026_pensions_change

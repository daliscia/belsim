not_found:
  - id: vat_standard_plus_1_point
    description: Official (FPS Finance, FPB, NBB, Court of Audit or High Council of Finance) costing of +1 point of the standard VAT rate (21% to 22%), static or after indexation effects
    searched: FPB, Court of Audit commentaries 2025 and 2026, general budget statement 2026, Chamber finance-committee reports of 2022-2023 (CRIV 55 COM 661, 701, 720, 1022, 1068), hearing on the High Council of Finance opinion of 2020 (DOC 55 1523/001), DC2024, European Commission VAT gap page. Only press and political figures without author or method were found and are recorded as medium-confidence entries (vat_standard_22_press_2026 - 1.5 bn; vat_standard_22_leak_2022 - 1.9 bn). The HERMES VAT variants remain the only official benchmark
  - id: vat_reduced_rate_official_costing
    description: Official costing of raising the 6% rate to 9% and of lowering or raising the 12% rate, by product group, and the text of the High Council of Finance report of May 2020 (financing scenarios with VAT) and of the 2022 blueprint for the tax reform
    searched: the 2020 report and the 2022 blueprint could not be retrieved (only press summaries and the Chamber hearing, which give no VAT yields); the Central Economic Council opinion CCE 2023-1412 on the 2023 reform returned HTTP 403. Recorded instead - the 1,777 mn of the 2023 proposal (Belga), the 1.5-3 bn range of October 2025 (VRT) and the FPS Finance yields of the 2026 rate changes
  - id: vat_pass_through_studies
    description: Official estimates of the pass-through of VAT changes to consumer prices - restaurant VAT cut of 2010 (21% to 12%), energy VAT cut of 2022 (21% to 6% on electricity and gas), reversal of the electricity cut in September 2015; and the FPB estimate of the payback effect of the 2014 electricity VAT cut
    searched: NBB, FPB and Price Observatory studies through web search - none surfaced for 2010 or 2022; the government press releases quoting the FPB payback estimates (news.belgium.be nodes 16961 and 17944) returned HTTP 403. Found - NBB evaluation report of September 2015 for the 2014 cut (vat_electricity_2014_nbb) and the HERMES variants (prices +1.23% for a VAT increase of 0.5% of GDP)
  - id: nbb_noname_wage_price_elasticities
    description: NBB NONAME technical variants (effect of a 1% change in wage costs on the consumption deflator after 1, 2 and 4 years) and an NBB study of the tax shift's effect on prices
    searched: NBB Economic Review 2015 (autumn projections) mentions the tax shift without a variant table; no NONAME variant paper surfaced. Used instead - the NBB quarterly-model tables annexed to DOC 54 0913/001 (index jump and employer-contribution cut) and the HERMES variants of 2018 and 2024
  - id: arizona_agreement_full_costing
    description: FPB costing of the whole Arizona coalition agreement (balance and jobs in 2029)
    searched: none published; only the government's own table (payback effects of 7.9 bn and 287,300 jobs by 2029, which the Court of Audit corrects to 257,700 jobs and 7.1 bn)
  - id: unemployment_limit_employment_effect
    description: Isolated official employment effect of the 2-year unemployment limit
    searched: the FPB states it cannot isolate the measure; only outflow shares (33% to work) and a labour-force effect of the whole labour-market package
  - id: legal_pension_age_67_isolated
    description: Effect of raising the legal age from 66 to 67 alone on employment and pension spending
    searched: SCA 2015 and FPB reports only give the whole 2015 package
  - id: nbb_tax_shift_study
    description: NBB's own evaluation of the tax shift (jobs, GDP, balance by year) and NBB study of December 2017 on the corporate tax reform
    searched: only quoted second-hand in parliament and press
  - id: defence_2_5_and_3_5_costing
    description: Official costing of defence at 2.5% (2034) or 3.5% (2035) of GDP
    searched: a 2026 committee report states that no detailed estimate exists
  - id: tobacco_fuel_excise_per_rate_change
    description: Yield of a given tobacco or fuel excise rate increase (rate change and yield together), cliquet-system yield
    searched: Court of Audit budget commentaries 2024-2026 give yields (tobacco +329 mn incl. VAT in 2024, with a price elasticity of 0.67) without the size of the rate change; the FPB tax-shift report gives the 2015-2020 yields of the fuel, tobacco and alcohol excise increases, again without the rates (tax_shift_indirect_tax_measures); the 2026 budget documents contain no new tobacco or alcohol measure with a yield, only the energy excise reform (excise_reform_2026_2029)
  - id: cit_per_point_macro
    description: Ex-post (macro) evaluation of the corporate tax rate cut
    searched: the FPS Finance costing explicitly excludes macro effects
  - id: ec_forecast_2025_values
    description: European Commission Autumn 2026 values for 2025 and Spring 2026 forecast table
    searched: country page has no 2025 column (deficit stated as stable at 5.2% of GDP)
  - id: hermes_public_employment_variant
    description: HERMES variant for public employment, 1%-of-GDP shocks or horizons beyond five years
    searched: not in the 2018 or 2024 HERMES working papers

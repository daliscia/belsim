  - id: hermes_employee_ssc_increase
    description: HERMES variant - employee social contributions raised by 0.5% of GDP ex ante
    source: *hermes24
    url: *hermes24_url
    confidence: high
    measure:
      changes:
        # sized on the contribution itself (HERMES table 15: +2,971 mn, with household income tax

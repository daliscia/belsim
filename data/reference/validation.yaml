      - {label: "real GDP, t+4", variant: behavioural, ref_value: -0.11, ref_unit: "%", ref_year: 2028, model_year: 2031, model: *gdp}
      - {label: "employment, year t", variant: behavioural, ref_value: -17.17, ref_unit: thousand persons, ref_year: 2024, model_year: 2027, model: *emp}
      - {label: "employment, t+2", variant: behavioural, ref_value: -24.33, ref_unit: thousand persons, ref_year: 2026, model_year: 2029, model: *emp}

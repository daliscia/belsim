# How each measure of the DC2024 costing (Federal Planning Bureau, 2024) is translated into
# belsim parameters. Read by `uv run python -m belsim.api.party_build`, which sizes the
# parameters and writes scenarios/parties/<party>.yaml. One entry per fiche:
#   en / fr / nl   neutral descriptive name (the fiche's own title is kept in the output)
#   r              recipe: pin (with ch: changes in model years) | allow:... | assets:... |
#                  sz:<lever>[+<lever>] (sized on the Bureau's ex-ante impulse) |
#                  base:<code> (enacted since 2024, in the model baseline) | zero | none
#   st             m | p  overrides the status the recipe implies (modelled / partly modelled)
#   lever          missing lever (code of LEVERS in party_build.py) for partly / not modelled
#   inc            true: partly enacted since 2024, the scenario adds the increment only
#   temp / natural see party_build.py
# Timing: programme year T (2025-2029) is model year T+2 (2027-2031).
